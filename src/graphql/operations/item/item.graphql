# ============================================
# QUERIES
# ============================================

query GetItems(
  $filters: ItemFilters
  $sort: ItemSortInput
  $first: Int
  $after: String
) {
  items(filters: $filters, sort: $sort, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        description
        type
        storageState
        imageUrl
        shelfLifeDays
        tags
        status
        visibility
        showInOnboarding
        popularity
        units {
          id
          isDefault
        }
        brands {
          id
        }
        categories {
          id
        }
        nutritions
        healthBenefits
        metadata
        createdAt
        updatedAt
        deletedAt
        version
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

query SearchItems($input: SearchItemsInput!) {
  searchItems(input: $input) {
    edges {
      cursor
      node {
        id
        name
        imageUrl
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

query ItemByUpcFilter($upc: String!, $upcFormat: UpcFormat) {
  items(filters: { upc: $upc, upcFormat: $upcFormat }, first: 1) {
    edges {
      cursor
      node {
        id
        imageUrl
        name
        netWeight
        primaryUpc
        alternateUpcs
        units {
          isDefault
          unitId
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query ItemBySkuFilter($sku: String!, $skuStoreId: String) {
  items(filters: { sku: $sku, skuStoreId: $skuStoreId }, first: 1) {
    edges {
      cursor
      node {
        id
        imageUrl
        name
        netWeight
        description
        primaryUpc
        units {
          isDefault
          unitId
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetOnboardingItems($filters: ItemFilters, $sort: ItemSortInput, $first: Int, $after: String) {
  items(filters: $filters, sort: $sort, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        imageUrl
        storageState
        displayUnit {
          id
          name
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query AutocompleteItems($input: AutocompleteInput!) {
  autocompleteItems(input: $input) {
    suggestions {
      id
      name
      type
      imageUrl
      images
      netWeight
      displayUnit
      defaultUnit {
        id
        name
        symbol
        type
        isDefault
        isPreferred
      }
      brands {
        id
        name
      }
      category {
        id
        name
        type
        isPrimary
        color
        icon
        slug
      }
    }
    totalCount
  }
}

query SearchBrands($search: String!, $limit: Int) {
  brands(search: $search, take: $limit) {
    id
    name
  }
}

query AutocompleteCategories($input: AutocompleteCategoryInput!) {
  autocompleteCategories(input: $input) {
    suggestions {
      id
      name
      type
      icon
    }
    totalCount
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateItem($input: CreateItemInput!) {
  createItem(input: $input) {
    id
    name
    description
    netWeight
    displayUnit {
      id
      name
      symbol
    }
    convertedNetWeight {
      value
      unit {
        id
        name
        symbol
      }
    }
    type
    storageState
    shelfLifeDays
    imageUrl
    tags
    brands {
      brand {
        id
        name
      }
    }
    categories {
      category {
        id
        name
      }
    }
    units {
      isDefault
      unitId
    }
  }
}
