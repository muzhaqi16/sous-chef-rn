# ============================================
# QUERIES
# ============================================

query ItemByUpcFilter($upc: String!, $upcFormat: UpcFormat) {
  items(filters: { lookup: { upc: $upc, upcFormat: $upcFormat } }, first: 1) {
    edges {
      cursor
      node {
        id
        imageUrl
        name
        netWeight
        primaryUpc
        displayUnit {
          id
          name
          symbol
        }
        brands {
          brand {
            id
            name
          }
        }
        units {
          isDefault
          unitId
        }
        variationBrand {
          id
          name
        }
        matchedVariation {
          netWeight
          netWeightUnit
          packageSize
          confidence
          brandInfo {
            id
            name
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query ItemBySkuFilter($sku: String!, $skuStoreId: String) {
  items(filters: { lookup: { sku: $sku, skuStoreId: $skuStoreId } }, first: 1) {
    edges {
      cursor
      node {
        id
        imageUrl
        name
        netWeight
        displayUnit {
          id
          name
          symbol
        }
        brands {
          brand {
            id
            name
          }
        }
        units {
          isDefault
          unitId
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetOnboardingItems($filters: ItemFilters, $sort: ItemSortInput, $first: Int, $after: String) {
  items(filters: $filters, sort: $sort, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        imageUrl
        storageState
        displayUnit {
          id
          name
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query AutocompleteItems($input: AutocompleteInput!) {
  autocompleteItems(input: $input) {
    suggestions {
      id
      name
      type
      imageUrl
      netWeight
      displayUnit
      defaultUnit {
        id
        name
        symbol
        type
        isDefault
        isPreferred
      }
      brands {
        id
        name
      }
      category {
        id
        name
        type
        isPrimary
      }
    }
    totalCount
  }
}

query SearchBrands($search: String!, $limit: Int) {
  brands(filters: { search: $search }, first: $limit) {
    edges {
      node {
        id
        name
      }
    }
    totalCount
  }
}

query AutocompleteCategories($input: AutocompleteCategoryInput!) {
  autocompleteCategories(input: $input) {
    suggestions {
      id
      name
      type
      icon
    }
    totalCount
  }
}

query GetPopularItems($first: Int = 10) {
  items(sort: { field: POPULARITY, order: DESC }, first: $first) {
    edges {
      node {
        id
        name
        imageUrl
        popularity
        displayUnit {
          id
          name
          symbol
          type
        }
        brands {
          brand {
            id
            name
          }
        }
        categories {
          isPrimary
          category {
            id
            name
            type
          }
        }
      }
    }
    totalCount
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateItem($input: CreateItemInput!) {
  createItem(input: $input) {
    success
    message
    code
    item {
      id
      name
      description
      netWeight
      displayUnit {
        id
        name
        symbol
      }
      convertedNetWeight {
        value
        unit {
          id
          name
          symbol
        }
      }
      type
      storageState
      shelfLifeDays
      imageUrl
      tags
      brands {
        brand {
          id
          name
        }
      }
      categories {
        category {
          id
          name
        }
      }
      units {
        id
        unitId
        isDefault
        packageSize
        retailUnit
        contentUnitId
        unit {
          id
          name
          symbol
        }
        contentUnit {
          id
          name
          symbol
        }
      }
    }
  }
}
