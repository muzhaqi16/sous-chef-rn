# ============================================
# QUERIES
# ============================================

query ItemByUpcFilter($upc: String!, $upcFormat: UpcFormat) {
  items(filters: { lookup: { upc: $upc, upcFormat: $upcFormat } }, first: 1) {
    edges {
      cursor
      node {
        id
        imageUrl
        name
        description
        netWeight
        primaryUpc
        type
        # Labels the edit action. Viewer-scoped: true only for the item's
        # creator and admins, which visibility cannot tell us.
        canEdit
        storageState
        shelfLifeDays
        shelfLifeOpenedDays
        tags
        displayUnit {
          id
          name
          symbol
        }
        brands {
          brand {
            id
            name
          }
        }
        categories {
          isPrimary
          category {
            id
            name
            type
          }
        }
        units {
          isDefault
          unitId
        }
        variationBrand {
          id
          name
        }
        matchedVariation {
          netWeight
          netWeightUnit
          packageSize
          confidence
          brandInfo {
            id
            name
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

