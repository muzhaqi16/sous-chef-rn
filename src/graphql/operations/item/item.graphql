query GetOnboardingItems($filters: ItemFilters, $orderBy: ItemOrderBy, $first: Int, $after: String) {
  items(filters: $filters, orderBy: $orderBy, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        imageUrl
        storageState
        displayUnit {
          id
          name
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query AutocompleteItems($input: AutocompleteInput!) {
  autocompleteItems(input: $input) {
    suggestions {
      id
      name
      type
      imageUrl
      netWeight
      displayUnit
      defaultUnit {
        id
        name
        symbol
        type
        isDefault
        isPreferred
      }
      brands {
        id
        name
      }
      category {
        id
        name
        type
        isPrimary
      }
    }
    totalCount
  }
}

query SearchItemsSemantic(
  $prompt: String!
  $first: Int
  $maxDistance: Float
  $filters: ItemFilters
) {
  searchItemsSemantic(
    prompt: $prompt
    first: $first
    maxDistance: $maxDistance
    filters: $filters
  ) {
    edges {
      node {
        id
        name
        type
        imageUrl
        netWeight
        defaultConsumeUnit {
          id
          name
          symbol
          type
        }
        brands {
          brand {
            id
            name
          }
        }
        categories {
          isPrimary
          category {
            id
            name
            type
          }
        }
      }
    }
  }
}

query SearchBrands($search: String!, $limit: Int) {
  brands(filters: { search: $search }, first: $limit) {
    edges {
      node {
        id
        name
      }
    }
    totalCount
  }
}

query AutocompleteCategories($input: AutocompleteCategoryInput!) {
  autocompleteCategories(input: $input) {
    suggestions {
      id
      name
      type
      icon
    }
    totalCount
  }
}

query GetPopularItems($first: Int = 10) {
  items(orderBy: { popularity: DESC }, first: $first) {
    edges {
      node {
        id
        name
        imageUrl
        popularity
        displayUnit {
          id
          name
          symbol
          type
        }
        brands {
          brand {
            id
            name
          }
        }
        categories {
          isPrimary
          category {
            id
            name
            type
          }
        }
      }
    }
    totalCount
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateItem($input: CreateItemInput!) {
  createItem(input: $input) {
    __typename
    ... on CreateItemPayload {
      item {
        id
        name
        description
        # Labels the follow-up edit action correctly — a freshly created item is
        # the creator's own, so canEdit comes back true and the card offers a
        # direct "Edit" rather than a suggestion.
        canEdit
        netWeight
        displayUnit {
          id
          name
          symbol
        }
        convertedNetWeight {
          value
          unit {
            id
            name
            symbol
          }
        }
        type
        storageState
        shelfLifeDays
        shelfLifeOpenedDays
        imageUrl
        tags
        brands {
          brand {
            id
            name
          }
        }
        categories {
          category {
            id
            name
          }
        }
        units {
          id
          unitId
          isDefault
          packageSize
          retailUnit
          contentUnitId
          unit {
            id
            name
            symbol
          }
          contentUnit {
            id
            name
            symbol
          }
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

# Hide a catalog item from a surface's suggestions (Add Again / Favorites /
# Popular). Per-user and per-surface; reversible via UndismissSuggestion. Lives
# here (shared item operations) so both the pantry and shopping sheets can use it
# without reaching across feature boundaries.
mutation MarkSuggestionDismissed($input: MarkSuggestionDismissedInput!) {
  markSuggestionDismissed(input: $input) {
    __typename
    ... on MarkSuggestionDismissedPayload {
      itemId
      surface
      dismissed
    }
    ... on Error {
      code
      message
    }
  }
}

mutation MarkSuggestionActive($input: MarkSuggestionActiveInput!) {
  markSuggestionActive(input: $input) {
    __typename
    ... on MarkSuggestionActivePayload {
      itemId
      surface
      dismissed
    }
    ... on Error {
      code
      message
    }
  }
}

# Flags a whole item for admin moderation with a free-text reason. This is a
# REPORT, not an edit proposal: it sets needsApproval and carries no structured
# changes. Used by the autocomplete "Wrong details on one of these?" affordance,
# where the user has only seen a name, brand and thumbnail and so can't
# meaningfully fill in an edit form.
#
# Not to be confused with createItemSuggestion (src/hooks/items/useSuggestItemEdit.graphql),
# which proposes a structured diff and is reachable only from the barcode scan
# flow, where the user is looking at the item's full details.
mutation MarkItemForReview($input: MarkItemForReviewInput!) {
  markItemForReview(input: $input) {
    __typename
    ... on MarkItemForReviewPayload {
      item {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

# Warm the category autocomplete cache so it works offline. Fetches a bounded
# slice of all categories (with `type`, so the hook can filter by category type
# locally). The API caps `first` at 100 per page. Reference data preloaded by
# useDataPreloading while online.
query GetCategories($first: Int = 100) {
  categories(first: $first) {
    edges {
      node {
        id
        name
        type
        icon
        color
        slug
      }
    }
  }
}

# Warm the brand autocomplete cache for offline use. No popularity ordering is
# exposed by the API, so this fetches the first page of brands (API caps `first`
# at 100 per page). Reference data preloaded by useDataPreloading while online.
query GetBrands($first: Int = 100) {
  brands(first: $first) {
    edges {
      node {
        id
        name
      }
    }
  }
}
