# ============================================
# QUERIES
# ============================================

query GetItems(
  $filters: ItemFilters
  $sort: ItemSortInput
  $pagination: PaginationInput
) {
  items(filters: $filters, sort: $sort, pagination: $pagination) {
    items {
      id
      name
      description
      type
      storageState
      imageUrl
      shelfLifeDays
      tags
      status
      visibility
      showInOnboarding
      popularity
      units {
        id
        isDefault
      }
      brands {
        id
      }
      categories {
        id
      }
      nutritions
      healthBenefits
      metadata
      createdAt
      updatedAt
      deletedAt
      version
    }
    totalCount
    hasMore
  }
}

query SearchItems($input: SearchItemsInput!) {
  searchItems(input: $input) {
    items {
      id
      name
      imageUrl
    }
    totalCount
    hasMore
  }
}

query ItemByUpc($upc: String!) {
  itemByUpc(upc: $upc) {
    id
    imageUrl
    name
    netWeight
    units {
      isDefault
      unitId
    }
  }
}

query ItemBySku($sku: String!, $storeId: String) {
  itemBySku(sku: $sku, storeId: $storeId) {
    id
    imageUrl
    name
    netWeight
    description
    units {
      isDefault
      unitId
    }
  }
}

query GetOnboardingItems($filters: ItemFilters, $sort: ItemSortInput, $pagination: PaginationInput) {
  items(filters: $filters, sort: $sort, pagination: $pagination) {
    items {
      id
      name
      imageUrl
      storageState
      displayUnit {
        id
        name
      }
    }
    totalCount
  }
}

query AutocompleteItems($input: AutocompleteInput!) {
  autocompleteItems(input: $input) {
    suggestions {
      id
      name
      imageUrl
      images
      netWeight
      displayUnit
      defaultUnit {
        id
        name
        symbol
        type
        isDefault
        isPreferred
      }
      brand {
        id
        name
      }
      category {
        id
        name
        type
        isPrimary
        color
        icon
        slug
      }
    }
    totalCount
  }
}

query SearchBrands($search: String!, $limit: Int) {
  brands(search: $search, take: $limit) {
    id
    name
  }
}

query AutocompleteCategories($input: AutocompleteCategoryInput!) {
  autocompleteCategories(input: $input) {
    suggestions {
      id
      name
      type
      icon
    }
    totalCount
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateItem($input: CreateItemInput!) {
  createItem(input: $input) {
    id
    name
    description
    netWeight
    displayUnit {
      id
      name
      symbol
    }
    convertedNetWeight {
      value
      unit {
        id
        name
        symbol
      }
    }
    type
    storageState
    shelfLifeDays
    imageUrl
    tags
    brands {
      brand {
        id
        name
      }
    }
    categories {
      category {
        id
        name
      }
    }
    units {
      isDefault
      unitId
    }
  }
}
