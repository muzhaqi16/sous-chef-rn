# ============================================
# QUERIES
# ============================================

query GetItems(
  $filters: ItemFilters
  $sort: ItemSortInput
  $pagination: PaginationInput
) {
  items(filters: $filters, sort: $sort, pagination: $pagination) {
    items {
      id
      name
      description
      type
      upc
      storageState
      imageUrl
      shelfLifeDays
      tags
      status
      visibility
      showInOnboarding
      units {
        id
        isDefault
      }
      brands {
        id
      }
      categories {
        id
      }
      nutritions
      healthBenefits
      metadata
      createdAt
      updatedAt
      deletedAt
      version
    }
    totalCount
  }
}

query SearchItems($input: SearchItemsInput!) {
  searchItems(input: $input) {
    items {
      id
      name
    }
    totalCount
    hasMore
  }
}

query SearchItemsByUpc($upc: String!) {
  searchItemsByUpc(upc: $upc) {
    id
    name
    description
    imageUrl
    upc
  }
}

query GetOnboardingItems {
  onboardingItems {
    units {
      unit {
        id
        name
        isCommon
      }
    }
    imageUrl
    id
    name
    storageState
  }
}

query AutocompleteItems($input: AutocompleteInput!) {
  autocompleteItems(input: $input) {
    suggestions {
      id
      name
      imageUrl
      defaultUnit {
        id
        name
        symbol
        type
        isDefault
        isPreferred
      }
      brand {
        id
        name
      }
      category {
        id
        name
        type
        isPrimary
      }
    }
    totalCount
  }
}

query SearchBrands($search: String!, $limit: Int) {
  brands(search: $search, take: $limit, isActive: true) {
    id
    name
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateItem($input: CreateItemInput!) {
  createItem(input: $input) {
    id
    name
    description
    upc
    sku
    netWeight
    displayUnit {
      id
      name
      symbol
    }
    convertedNetWeight {
      value
      unit {
        name
        symbol
      }
    }
    type
    storageState
    shelfLifeDays
    imageUrl
    tags
    brands {
      brand {
        id
        name
      }
      sku
    }
    categories {
      category {
        id
        name
      }
    }
    units {
      unit {
        name
        symbol
      }
      isDefault
      packageSize
    }
  }
}
