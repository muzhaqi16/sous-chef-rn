# ============================================
# UNIT CONVERSION QUERIES
# ============================================

query ConvertQuantity(
  $pantryItemId: ID
  $quantity: Float!
  $fromUnitId: ID!
  $toUnitId: ID!
) {
  convertQuantity(
    pantryItemId: $pantryItemId
    quantity: $quantity
    fromUnitId: $fromUnitId
    toUnitId: $toUnitId
  ) {
    value
    displayText
    unit {
      id
      name
      symbol
      type
      displayAsFraction
      minPrecision
      autoConvertThreshold
    }
  }
}
