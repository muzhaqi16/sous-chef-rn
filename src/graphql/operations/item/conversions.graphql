# ============================================
# UNIT CONVERSION QUERIES
# ============================================

query ConvertQuantity(
  $itemId: ID
  $quantity: Float!
  $fromUnitId: ID!
  $toUnitId: ID!
) {
  convertQuantity(
    itemId: $itemId
    quantity: $quantity
    fromUnitId: $fromUnitId
    toUnitId: $toUnitId
  ) {
    value
    displayText
    unit {
      id
      name
      symbol
      type
      displayAsFraction
      minPrecision
      autoConvertThreshold
    }
  }
}

query SuggestDisplayFormat(
  $quantity: Float!
  $unitId: ID!
  $userId: ID
) {
  suggestDisplayFormat(
    quantity: $quantity
    unitId: $unitId
    userId: $userId
  ) {
    decimal
    fraction
    mixed
    display
    unit {
      id
      name
      symbol
      displayAsFraction
      minPrecision
      autoConvertThreshold
    }
  }
}

query ParseQuantityInput(
  $input: String!
  $unitId: ID!
) {
  parseQuantityInput(
    input: $input
    unitId: $unitId
  ) {
    decimal
    fraction
    mixed
    display
    unit {
      id
      name
      symbol
    }
  }
}

query CanConvert(
  $itemId: ID
  $fromUnitId: ID!
  $toUnitId: ID!
) {
  canConvert(
    itemId: $itemId
    fromUnitId: $fromUnitId
    toUnitId: $toUnitId
  ) {
    available
    confidence
    requiresItemContext
    conversionType
    notes
  }
}

query GetItemConversions(
  $itemId: ID!
  $includeStandard: Boolean
) {
  itemConversions(
    itemId: $itemId
    includeStandard: $includeStandard
  ) {
    id
    fromUnit {
      id
      name
      symbol
      type
    }
    toUnit {
      id
      name
      symbol
      type
    }
    conversionRatio
    source
    confidence
    isVerified
    notes
    createdAt
  }
}

query GetBestDisplayUnit(
  $quantity: Float!
  $currentUnitId: ID!
  $itemId: ID
) {
  bestDisplayUnit(
    quantity: $quantity
    currentUnitId: $currentUnitId
    itemId: $itemId
  ) {
    id
    name
    symbol
    type
    displayAsFraction
    minPrecision
    autoConvertThreshold
  }
}

query AggregateQuantities(
  $itemId: ID!
  $quantities: [QuantityInput!]!
) {
  aggregateQuantities(
    itemId: $itemId
    quantities: $quantities
  ) {
    quantity
    displayText
    unit {
      id
      name
      symbol
    }
  }
}

query CalculateRecipePantryDeficit(
  $recipeId: ID!
  $servings: Float
  $householdId: ID!
) {
  calculateRecipePantryDeficit(
    recipeId: $recipeId
    servings: $servings
    householdId: $householdId
  ) {
    ingredient {
      id
      name
      quantity
      item {
        id
        name
        imageUrl
      }
      unit {
        id
        name
        symbol
      }
    }
    needed
    available
    deficit
    unit {
      id
      name
      symbol
    }
    needsToBuy
    availableItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      expiresAt
    }
  }
}

# ============================================
# UNIT CONVERSION MUTATIONS
# ============================================

mutation UpsertItemUnitConversion(
  $itemId: ID!
  $fromUnitId: ID!
  $toUnitId: ID!
  $conversionRatio: Float!
  $notes: String
) {
  upsertItemUnitConversion(
    itemId: $itemId
    fromUnitId: $fromUnitId
    toUnitId: $toUnitId
    conversionRatio: $conversionRatio
    notes: $notes
  ) {
    success
    message
    code
    unitConversion {
      id
      fromUnit {
        id
        name
        symbol
      }
      toUnit {
        id
        name
        symbol
      }
      conversionRatio
      source
      confidence
      notes
      createdAt
    }
  }
}
