# ============================================
# QUERIES
# ============================================

query GetUnits {
  units {
    id
    name
    symbol
    type
    conversionFactor
    notes
  }
}

query GetUnit($id: ID!) {
  unit(id: $id) {
    id
    name
    symbol
    type
    conversionFactor
    notes
  }
}

query GetUnitBySymbol($symbol: String!) {
  unitBySymbol(symbol: $symbol) {
    id
    name
    symbol
    type
    isMetric
    baseUnitId
    conversionFactor
    notes
    isCommon
    sortOrder
    createdAt
    updatedAt
    baseUnit {
      id
      name
      conversionFactor
      baseUnitId
    }
  }
}

query SearchUnits($query: String!, $type: UnitType) {
  searchUnits(query: $query, type: $type) {
    id
    name
    symbol
    type
    isCommon
    sortOrder
  }
}

query GetCommonUnits($type: UnitType) {
  units(isCommon: true, type: $type) {
    id
    name
    symbol
    type
    isCommon
    sortOrder
  }
}
