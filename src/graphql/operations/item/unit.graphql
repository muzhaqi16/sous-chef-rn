# ============================================
# QUERIES
# ============================================

query GetUnits {
  units {
    id
    name
    symbol
    type
    conversionFactor
    notes
  }
}

query GetUnit($id: ID!) {
  unit(id: $id) {
    id
    name
    symbol
    type
    conversionFactor
    notes
  }
}

query GetUnitBySymbol($symbol: String!) {
  unitBySymbol(symbol: $symbol) {
    id
    name
    symbol
    type
    isMetric
    baseUnitId
    conversionFactor
    notes
    isCommon
    sortOrder
    createdAt
    updatedAt
    baseUnit {
      id
      name
      conversionFactor
      baseUnitId
    }
  }
}

query SearchUnits($query: String!, $type: UnitType, $limit: Int) {
  searchUnits(query: $query, type: $type, limit: $limit) {
    id
    name
    symbol
    type
    isMetric
    isCommon
    sortOrder
    displayAsFraction
    minPrecision
    conversionFactor
    baseUnitId
  }
}

query GetCommonUnits($type: UnitType, $limit: Int) {
  units(isCommon: true, type: $type, limit: $limit) {
    id
    name
    symbol
    type
    isMetric
    isCommon
    sortOrder
    displayAsFraction
    minPrecision
    conversionFactor
    baseUnitId
  }
}

query GetConvertibleUnits($unitId: ID!) {
  getConvertibleUnits(unitId: $unitId) {
    id
    name
    symbol
    type
    isMetric
    isCommon
    displayAsFraction
    minPrecision
    conversionFactor
  }
}
