# ============================================
# SUBSCRIPTIONS
# ============================================

subscription StoreUpdated($storeId: ID) {
  storeUpdated(storeId: $storeId) {
    id
    name
    address
    priceAccuracy
    lastPriceUpdate
    qualityRating
    storeInfo {
      id
      phone
    }
  }
}

subscription StoreRatingChanged($storeId: ID) {
  storeRatingChanged(storeId: $storeId) {
    id
    name
    qualityRating
    priceAccuracy
    updatedAt
  }
}
