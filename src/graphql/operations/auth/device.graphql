# ============================================
# MUTATIONS
# ============================================

mutation RegisterDevice($input: DeviceRegistrationInput!) {
  registerDevice(input: $input) {
    __typename
    ... on RegisterDeviceSuccess {
      device {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

