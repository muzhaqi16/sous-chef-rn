# ============================================
# QUERIES
# ============================================

query GetMyDevices($filters: DeviceFilters, $first: Int, $after: String) {
  devices(filters: $filters, first: $first, after: $after) {
    edges {
      node {
        id
        deviceId
        deviceName
        deviceType
        platform
        isActive
        isTrusted
        lastSeenAt
        createdAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetDeviceByDeviceId($deviceId: String!) {
  deviceByDeviceId(deviceId: $deviceId) {
    id
    deviceId
    deviceName
    deviceType
    platform
    isActive
    isTrusted
    isVerified
    lastSeenAt
    createdAt
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation RegisterDevice($input: DeviceRegistrationInput!) {
  registerDevice(input: $input) {
    success
    message
    code
  }
}

mutation UpdateDeviceLastSeen($id: ID!) {
  updateDevice(id: $id, input: { touchLastSeen: true }) {
    success
    message
    code
    device {
      id
      deviceId
      lastSeenAt
      updatedAt
    }
  }
}

mutation TrustDevice($id: ID!) {
  updateDevice(id: $id, input: { isTrusted: true }) {
    success
    message
    code
    device {
      id
      deviceId
      deviceName
      isTrusted
      updatedAt
    }
  }
}

mutation UntrustDevice($id: ID!) {
  updateDevice(id: $id, input: { isTrusted: false }) {
    success
    message
    code
    device {
      id
      deviceId
      deviceName
      isTrusted
      updatedAt
    }
  }
}

mutation VerifyDevice($id: ID!) {
  updateDevice(id: $id, input: { isVerified: true }) {
    success
    message
    code
    device {
      id
      deviceId
      deviceName
      isVerified
      verifiedAt
    }
  }
}

mutation DeactivateDevice($id: ID!) {
  updateDevice(id: $id, input: { isActive: false }) {
    success
    message
    code
    device {
      id
      deviceId
      deviceName
      isActive
      updatedAt
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription DeviceChanges($userId: ID!) {
  deviceChanged(userId: $userId) {
    changeType
    device {
      id
      deviceId
      deviceName
      deviceType
      platform
      isActive
      isTrusted
      isVerified
      lastSeenAt
      createdAt
      updatedAt
    }
    timestamp
    userId
  }
}
