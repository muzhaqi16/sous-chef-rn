# ============================================
# SUBSCRIPTIONS
# ============================================

subscription DeviceActivity($userId: ID!) {
  deviceActivity(userId: $userId) {
    id
    userId
    deviceId
    deviceName
    deviceType
    platform
    lastSeenAt
    lastIpAddress
    lastCountry
    lastCity
    isActive
    isTrusted
    loginCount
    user {
      id
      email
    }
  }
}

subscription DeviceRegistered($userId: ID!) {
  deviceRegistered(userId: $userId) {
    id
    userId
    deviceId
    deviceName
    deviceType
    platform
    userAgent
    browserName
    browserVersion
    osName
    osVersion
    isActive
    isTrusted
    isVerified
    createdAt
  }
}

subscription DeviceStatusChanged($userId: ID!) {
  deviceStatusChanged(userId: $userId) {
    id
    userId
    deviceId
    deviceName
    isActive
    lastSeenAt
    updatedAt
  }
}

subscription DeviceTrustChanged($userId: ID!) {
  deviceTrustChanged(userId: $userId) {
    id
    userId
    deviceId
    deviceName
    isTrusted
    updatedAt
  }
}

subscription DeviceVerified($userId: ID!) {
  deviceVerified(userId: $userId) {
    id
    userId
    deviceId
    deviceName
    isVerified
    verifiedAt
  }
}
