# ============================================
# MUTATIONS
# ============================================

mutation Login($input: LoginInput!) {
  login(input: $input) {
    accessToken
    refreshToken
    user {
      id
      ...LoginUser
    }
  }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    accessToken
    refreshToken
    user {
      id
      ...LoginUser
    }
  }
}

mutation RefreshToken($input: RefreshTokenInput!) {
  refresh(input: $input) {
    accessToken
    refreshToken
  }
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input) {
    __typename
    ... on VerifyEmailPayload {
      user {
        ...LoginUser
      }
    }
    ... on AuthError {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation ForgotPassword($input: ForgotPasswordInput!) {
  forgotPassword(input: $input) {
    __typename
    ... on ForgotPasswordPayload {
      status {
        success
        code
        message
      }
    }
    ... on RateLimitError {
      code
      message
      retryAfter
    }
  }
}

mutation ResetPassword($input: ResetPasswordWithTokenInput!) {
  resetPassword(input: $input) {
    success
    message
    code
  }
}

mutation ResendVerificationEmail($input: ResendVerificationEmailInput!) {
  resendVerificationEmail(input: $input) {
    __typename
    ... on ResendVerificationEmailPayload {
      user {
        id
      }
    }
    ... on AuthError {
      code
      message
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    success
    message
    code
  }
}
