# ============================================
# MUTATIONS
# ============================================

mutation Login($input: LoginInput!) {
  login(input: $input) {
    __typename
    ... on AuthPayload {
      accessToken
      refreshToken
      user {
        id
        ...LoginUser
      }
    }
    ... on ValidationError {
      field
    }
    ... on Error {
      code
      message
    }
  }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    __typename
    ... on RegisterPayload {
      status
      message
    }
    ... on ValidationError {
      field
    }
    ... on Error {
      code
      message
    }
  }
}

mutation RefreshToken($input: RefreshInput!) {
  refresh(input: $input) {
    __typename
    ... on RefreshTokenPayload {
      accessToken
      refreshToken
    }
    ... on ValidationError {
      field
    }
    ... on Error {
      code
      message
    }
  }
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input) {
    __typename
    ... on VerifyEmailPayload {
      user {
        id
        ...LoginUser
      }
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation RequestPasswordReset($input: RequestPasswordResetInput!) {
  requestPasswordReset(input: $input) {
    __typename
    ... on RequestPasswordResetPayload {
      status
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

# Checks a reset link's token WITHOUT consuming it, so the app can decide
# whether the link is genuine before taking any session-affecting action.
# Opening a link must never end a session on its own — see
# `openspec/.../credential-protection`.
mutation ValidatePasswordResetToken($input: ValidatePasswordResetTokenInput!) {
  validatePasswordResetToken(input: $input) {
    __typename
    ... on ValidatePasswordResetTokenPayload {
      status
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation ResetPassword($input: ResetPasswordInput!) {
  resetPassword(input: $input) {
    __typename
    ... on ResetPasswordPayload {
      status
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation ResendVerificationEmail($input: ResendVerificationEmailInput!) {
  resendVerificationEmail(input: $input) {
    __typename
    ... on ResendVerificationEmailPayload {
      user {
        id
      }
    }
    ... on Error {
