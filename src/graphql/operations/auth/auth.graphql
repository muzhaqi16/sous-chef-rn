# ============================================
# MUTATIONS
# ============================================

mutation Login($input: LoginInput!) {
  login(input: $input) {
    accessToken
    refreshToken
    user {
      id
      ...LoginUser
    }
  }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    __typename
    ... on RegisterPayload {
      status
      message
    }
    ... on ValidationError {
      field
    }
    ... on Error {
      code
      message
    }
  }
}

mutation RefreshToken($input: RefreshTokenInput!) {
  refresh(input: $input) {
    accessToken
    refreshToken
  }
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input) {
    __typename
    ... on VerifyEmailPayload {
      user {
        id
        ...LoginUser
      }
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

