# Bootstrap fragment for login/register responses.
# Spread by: auth.graphql (Login, Register, RefreshToken — 3 operations)
# Read via cache.readFragment by: authService.ts
# Kept shared — all consumers need the identical bootstrap shape.
fragment LoginUser on User {
  id
  email
  emailVerified
  role
  canAccessDevTools
  onBoarded
  createdAt
  updatedAt
  timezone
  defaultHomeId
  defaultShoppingListId
  defaultHome {
    id
    name
    isDefault
    pantriesConnection {
      edges {
        node {
          id
          isDefault
        }
      }
    }
  }
  # The CURRENT user's profile is written here with the SAME shape
  # `GetUserProfile` reads. `returnPartialData` is false, so one missing field
  # makes that whole read incomplete and the Profile screen falls back to its
  # skeleton until the network answers — the shipped bug this shape fixes.
  # `authSlice.setAuth` also reads firstName/lastName off this payload, which
  # the three-field version never carried. Kept inline rather than behind a
  # shared fragment because `dataMasking` is on and these consumers read the
  # fields directly; `__tests__/apollo/userProfileCompleteness.test.ts` is what
  # holds the four copies together.
  profile {
    id
    firstName
    lastName
    displayName
    bio
    avatar
    phone
    dateOfBirth
    gender
    profileVisibility
    showEmail
    showPhone
  }
  settings {
    id
    theme
    showTutorials
  }
}

# Returned by the GetMe query. Single-operation fragment kept here so the
# auth-related shape lives alongside LoginUser.
fragment PartialUser on User {
  id
  email
  emailVerified
  role
  canAccessDevTools
  onBoarded
  timezone
  defaultShoppingListId
  defaultHomeId
  createdAt
  updatedAt
  # Same shape as `GetUserProfile` reads — see the note on LoginUser above.
  profile {
    id
    firstName
    lastName
    displayName
    bio
    avatar
    phone
    dateOfBirth
    gender
    profileVisibility
    showEmail
    showPhone
  }
  settings {
    id
    theme
    showTutorials
  }
}
