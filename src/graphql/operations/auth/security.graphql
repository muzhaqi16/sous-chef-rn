# ============================================
# SUBSCRIPTIONS
# ============================================

subscription LoginAttempts($userId: ID!) {
  loginAttempted(userId: $userId) {
    id
    userId
    success
    method
    provider
    isVpn
    isTor
    isProxy
    userAgent
    browserName
    browserVersion
    osName
    osVersion
    deviceType
    isMobileApp
    isRisky
    failureReason
    failureDetails
    isNewLocation
    isNewDevice
    isNewBrowser
    loggedInAt
    user {
      id
      email
    }
  }
}
