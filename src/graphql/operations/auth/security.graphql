# ============================================
# SUBSCRIPTIONS
# ============================================

subscription LoginAttempts($userId: ID!) {
  loginAttempted(userId: $userId) {
    id
    userId
    success
    method
    provider
    isVpn
    isTor
    isProxy
    userAgent
    browserName
    browserVersion
    osName
    osVersion
    deviceType
    isMobileApp
    isRisky
    failureReason
    failureDetails
    isNewLocation
    isNewDevice
    isNewBrowser
    loggedInAt
    user {
      id
      email
    }
  }
}

subscription SuspiciousActivity($userId: ID!) {
  suspiciousActivityDetected(userId: $userId) {
    rapidAttempts {
      hour
      count
    }
    riskyLogins {
      id
      isRisky
      loggedInAt
    }
    newLocationLogins {
      id
      loggedInAt
    }
    newDeviceLogins {
      id
      deviceType
      browserName
      osName
      loggedInAt
    }
    suspiciousActivity
    unusualTimeLogins {
      id
      loggedInAt
      timezoneDiff
    }
  }
}

subscription FailedLoginAttempts($userId: ID!) {
  loginFailed(userId: $userId) {
    id
    userId
    method
    userAgent
    failureReason
    failureDetails
    loggedInAt
  }
}

subscription RiskyLoginAlerts($userId: ID!) {
  riskyLoginDetected(userId: $userId) {
    id
    userId
    isVpn
    isTor
    isProxy
    requiresMfa
    mfaCompleted
    loggedInAt
    flaggedBy {
      id
      email
    }
    flaggedReason
  }
}
