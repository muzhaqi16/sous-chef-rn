# ============================================
# SUBSCRIPTIONS
# ============================================

subscription LoginActivityChanges($userId: ID!) {
  loginActivityChanged(userId: $userId) {
    activityType
    loginHistory {
      id
      userId
      success
      method
      provider
      isRisky
      failureReason
      loggedInAt
    }
    suspiciousActivity {
      suspiciousActivity
      failedFromSameIP {
        ipAddress
        count
      }
      riskyLogins {
        id
        userId
        success
        isRisky
        loggedInAt
      }
    }
    timestamp
    userId
  }
}
