# QUERIES
# ============================================

query GetMe {
  me {
    id
    ...PartialUser
  }
}

query GetUserSettings {
  me {
    id
    settings {
      id
      theme
      compactMode
      showTutorials
      autoSync
      offlineMode
      shareUsageData
      shareWithPartners
      personalizedAds
      preferredUnitSystem
      language
      timezone
      preferredCurrency
      enabledFeatures
      betaFeatures
      createdAt
      updatedAt
    }
  }
}

# Every field here must be in the cache or the WHOLE read yields nothing
# (`returnPartialData: false`), so the selection is kept to exactly what the
# screens render: ProfileScreen (avatar, displayName, firstName, lastName),
# PersonalInformationScreen (the rest), DataProvider (the first four). Five
# fields no screen read — userId, coverImage, website, createdAt, updatedAt —
# used to sit here, and each one was another way for the read to come back
# incomplete. Every writer of the current user's profile matches this shape;
# `__tests__/apollo/userProfileCompleteness.test.ts` fails if one drifts.
query GetUserProfile {
  me {
    id
    profile {
      id
      firstName
      lastName
      displayName
      bio
      avatar
      phone
      dateOfBirth
      gender
      profileVisibility
      showEmail
      showPhone
    }
  }
}

query CanDeleteAccount {
  canDeleteAccount {
    canDelete
    blockers {
      type
      resourceId
      resourceName
      message
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation UpdateAccount($input: UpdateAccountInput!) {
  updateAccount(input: $input) {
    __typename
    ... on UpdateAccountPayload {
      user {
        id
        email
        emailVerified
        role
        onBoarded
        timezone
        preferredCurrency
        language
        defaultShoppingListId
        defaultHomeId
        createdAt
        updatedAt
        lastActiveAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateUserProfile($input: UpdateProfileInput!) {
