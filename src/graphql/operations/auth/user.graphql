# QUERIES
# ============================================

query GetMe {
  me {
    ...PartialUser
  }
}

query GetUserSettings {
  me {
    id
    settings {
      id
      theme
      compactMode
      showTutorials
      autoSync
      offlineMode
      shareUsageData
      shareWithPartners
      personalizedAds
      preferredUnitSystem
      language
      timezone
      preferredCurrency
      enabledFeatures
      betaFeatures
      createdAt
      updatedAt
    }
  }
}

query GetUserProfile {
  me {
    id
    profile {
      id
      userId
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      dateOfBirth
      gender
      profileVisibility
      showEmail
      showPhone
      createdAt
      updatedAt
    }
  }
}

query CanDeleteAccount {
  canDeleteAccount {
    canDelete
    blockers {
      type
      resourceId
      resourceName
      message
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation UpdateUser($id: ID!, $input: UpdateUserInput!) {
  updateUser(id: $id, input: $input) {
    success
    message
    code
    user {
      id
      email
      emailVerified
      role
      onBoarded
      timezone
      preferredCurrency
      language
      defaultShoppingListId
      defaultHomeId
      createdAt
      updatedAt
      lastActiveAt
    }
  }
}

mutation UpdateUserProfile($input: UpdateUserProfileInput!) {
  updateProfile(input: $input) {
    success
    message
    code
    userProfile {
      id
      userId
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      dateOfBirth
      gender
      profileVisibility
      showEmail
      showPhone
      createdAt
      updatedAt
    }
  }
}

mutation UpdateUserPreferences($input: UpdateUserSettingsInput!) {
  updateSettings(input: $input) {
    success
    message
    code
    userSettings {
      id
      user {
        id
        email
      }
      theme
      compactMode
      showTutorials
      autoSync
      offlineMode
      shareUsageData
      shareWithPartners
      personalizedAds
      preferredUnitSystem
      language
      timezone
      preferredCurrency
      enabledFeatures
      betaFeatures
      createdAt
      updatedAt
    }
  }
}

mutation DeleteAccount {
  deleteAccount {
    success
    message
    code
  }
}

mutation CompleteOnboarding {
  completeOnboarding {
    success
    message
    code
    user {
      id
      email
      emailVerified
      role
      canAccessDevTools
      onBoarded
      createdAt
      updatedAt
      timezone
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription UserChanges($userId: ID) {
  userChanged(userId: $userId) {
    changeType
    user {
      id
      email
      emailVerified
      role
      onBoarded
      timezone
      preferredCurrency
      language
      lastActiveAt
    }
    profile {
      id
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      profileVisibility
    }
    updatedFields
    timestamp
    userId
  }
}
