# QUERIES
# ============================================

query GetMe {
  me {
    id
    ...PartialUser
  }
}

query GetUserSettings {
  me {
    id
    settings {
      id
      theme
      compactMode
      showTutorials
      autoSync
      offlineMode
      shareUsageData
      shareWithPartners
      personalizedAds
      preferredUnitSystem
      language
      timezone
      preferredCurrency
      enabledFeatures
      betaFeatures
      createdAt
      updatedAt
    }
  }
}

query GetUserProfile {
  me {
    id
    profile {
      id
      userId
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      dateOfBirth
      gender
      profileVisibility
      showEmail
      showPhone
      createdAt
      updatedAt
    }
  }
}

query CanDeleteAccount {
  canDeleteAccount {
    canDelete
    blockers {
      type
      resourceId
      resourceName
      message
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation UpdateAccount($input: UpdateAccountInput!) {
  updateAccount(input: $input) {
    __typename
    ... on UpdateAccountPayload {
      user {
        id
        email
        emailVerified
        role
        onBoarded
        timezone
        preferredCurrency
        language
        defaultShoppingListId
        defaultHomeId
        createdAt
        updatedAt
        lastActiveAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateUserProfile($input: UpdateProfileInput!) {
