# ============================================
# SUBSCRIPTIONS
# ============================================

# Consolidated user-domain stream. One subscription carries account updates
# (ACCOUNT_UPDATED → User node), profile changes (PROFILE_CHANGED → UserProfile
# node), and lifecycle events (membership/moderation subtypes, context on the
# envelope), discriminated by `subtype` — replacing the former userUpdated +
# userProfileChanged + userLifecycleEvents subscriptions. Keeps the per-user
# concurrent-subscription count low (the server caps it cluster-wide).
subscription UserEvents($userId: ID!) {
  userEvents(userId: $userId) {
    subtype
    mutation
    actorUserId
    updatedFields
    timestamp
    userId
    reason
    warningCount
    parents {
      homeId
      shoppingListId
    }
    node {
      ... on User {
        id
        email
        emailVerified
        role
        onBoarded
        timezone
        preferredCurrency
        language
        lastActiveAt
      }
      # PROFILE_CHANGED normalizes this node straight into the cache (see
      # useUserSubscriptions), so it writes the SAME shape `GetUserProfile`
      # reads. Short of that it can seed a partial UserProfile record, and the
      # profile screens then read nothing at all.
      ... on UserProfile {
        id
        firstName
        lastName
        displayName
        bio
        avatar
        phone
        dateOfBirth
        gender
        profileVisibility
        showEmail
        showPhone
      }
    }
  }
}
