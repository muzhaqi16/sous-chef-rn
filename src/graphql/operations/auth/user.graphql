# QUERIES
# ============================================

query GetMe {
  me {
    ...PartialUser
  }
}

query GetUserSettings {
  userSettings {
    id
    user {
      id
      email
    }
    theme
    compactMode
    showTutorials
    autoSync
    offlineMode
    shareUsageData
    shareWithPartners
    personalizedAds
    preferredUnitSystem
    language
    timezone
    preferredCurrency
    enabledFeatures
    betaFeatures
    createdAt
    updatedAt
  }
}

query GetUserProfile {
  userProfile {
    id
    userId
    firstName
    lastName
    displayName
    bio
    avatar
    coverImage
    phone
    website
    dateOfBirth
    gender
    profileVisibility
    showEmail
    showPhone
    createdAt
    updatedAt
  }
}

query CanDeleteAccount {
  canDeleteAccount {
    canDelete
    blockers {
      type
      resourceId
      resourceName
      message
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation UpdateUser($id: ID!, $input: UpdateUserInput!) {
  updateUser(id: $id, input: $input) {
    success
    message
    code
    user {
      id
      email
      emailVerified
      role
      onBoarded
      timezone
      preferredCurrency
      language
      defaultShoppingListId
      defaultHomeId
      createdAt
      updatedAt
      lastActiveAt
    }
  }
}

mutation UpdateUserProfile($input: UpdateUserProfileInput!) {
  updateProfile(input: $input) {
    success
    message
    code
    userProfile {
      id
      userId
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      dateOfBirth
      gender
      profileVisibility
      showEmail
      showPhone
      createdAt
      updatedAt
    }
  }
}

mutation UpdateUserPreferences($input: UpdateUserSettingsInput!) {
  updateSettings(input: $input) {
    success
    message
    code
    userSettings {
      id
      user {
        id
        email
      }
      theme
      compactMode
      showTutorials
      autoSync
      offlineMode
      shareUsageData
      shareWithPartners
      personalizedAds
      preferredUnitSystem
      language
      timezone
      preferredCurrency
      enabledFeatures
      betaFeatures
      createdAt
      updatedAt
    }
  }
}

mutation DeleteAccount {
  deleteAccount {
    success
    message
    code
  }
}

mutation CompleteOnboarding {
  completeOnboarding {
    success
    message
    code
    user {
      ...AuthUser
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription UserUpdated($userId: ID) {
  userUpdated(userId: $userId) {
    mutation
    node {
      id
      email
      emailVerified
      role
      onBoarded
      timezone
      preferredCurrency
      language
      lastActiveAt
      profile {
        id
        firstName
        lastName
        displayName
        avatar
        bio
      }
    }
    updatedFields
    userId
    timestamp
  }
}

subscription UserStatusChanged($userId: ID) {
  userStatusChanged(userId: $userId) {
    userId
    newStatus
    previousStatus
    isOnline
    lastActiveAt
    timestamp
  }
}

subscription UserActivity($userId: ID) {
  userActivity(userId: $userId) {
    userId
    activityType
    description
    metadata
    timestamp
  }
}

subscription UserModerationChanged($userId: ID) {
  userModerationChanged(userId: $userId) {
    userId
    moderationType
    moderationStatus
    reason
    moderatedBy
    timestamp
  }
}

subscription UserProfileChanged($userId: ID) {
  userProfileChanged(userId: $userId) {
    userId
    mutation
    profile {
      id
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      profileVisibility
    }
    updatedFields
    timestamp
  }
}
