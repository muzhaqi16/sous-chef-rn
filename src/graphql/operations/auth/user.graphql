# QUERIES
# ============================================

query GetMe {
  me {
    ...PartialUser
  }
}

query GetUserSettings {
  me {
    id
    settings {
      id
      theme
      compactMode
      showTutorials
      autoSync
      offlineMode
      shareUsageData
      shareWithPartners
      personalizedAds
      preferredUnitSystem
      language
      timezone
      preferredCurrency
      enabledFeatures
      betaFeatures
      createdAt
      updatedAt
    }
  }
}

query GetUserProfile {
  me {
    id
    profile {
      id
      userId
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      dateOfBirth
      gender
      profileVisibility
      showEmail
      showPhone
      createdAt
      updatedAt
    }
  }
}

query CanDeleteAccount {
  canDeleteAccount {
    canDelete
    blockers {
      type
      resourceId
      resourceName
      message
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation UpdateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    __typename
    ... on UpdateUserSuccess {
      user {
        id
        email
        emailVerified
        role
        onBoarded
        timezone
        preferredCurrency
        language
        defaultShoppingListId
        defaultHomeId
        createdAt
        updatedAt
        lastActiveAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateUserProfile($input: UpdateUserProfileInput!) {
  updateProfile(input: $input) {
    __typename
    ... on UpdateProfileSuccess {
      userProfile {
        id
        userId
        firstName
        lastName
        displayName
        bio
        avatar
        coverImage
        phone
        website
        dateOfBirth
        gender
        profileVisibility
        showEmail
        showPhone
        createdAt
        updatedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateUserPreferences($input: UpdateUserSettingsInput!) {
  updateSettings(input: $input) {
    __typename
    ... on UpdateSettingsSuccess {
      userSettings {
        id
        user {
          id
          email
        }
        theme
        compactMode
        showTutorials
        autoSync
        offlineMode
        shareUsageData
        shareWithPartners
        personalizedAds
        preferredUnitSystem
        language
        timezone
        preferredCurrency
        enabledFeatures
        betaFeatures
        createdAt
        updatedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteAccount {
  deleteAccount {
    __typename
    ... on DeleteAccountSuccess {
      user {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation CompleteOnboarding {
  completeOnboarding {
    __typename
    ... on CompleteOnboardingSuccess {
      user {
        id
        email
        emailVerified
        role
        canAccessDevTools
        onBoarded
        createdAt
        updatedAt
        timezone
      }
    }
    ... on Error {
      code
      message
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription UserUpdated($userId: ID) {
  userUpdated(userId: $userId) {
    mutation
    node {
      id
      email
      emailVerified
      role
      onBoarded
      timezone
      preferredCurrency
      language
      lastActiveAt
    }
    updatedFields
    timestamp
    userId
  }
}

subscription UserProfileChanged($userId: ID) {
  userProfileChanged(userId: $userId) {
    mutation
    profile {
      id
      firstName
      lastName
      displayName
      bio
      avatar
      coverImage
      phone
      website
      profileVisibility
    }
    updatedFields
    timestamp
    userId
  }
}
