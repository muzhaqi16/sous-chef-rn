# ============================================
# QUERIES
# ============================================

query GetMyNotifications(
  $filter: NotificationFilterInput
  $first: Int
  $after: String
  $last: Int
  $before: String
  $orderBy: NotificationOrderBy
) {
  myNotifications(
    filter: $filter
    first: $first
    after: $after
    last: $last
    before: $before
    orderBy: $orderBy
  ) {
    edges {
      node {
        id
        userId
        type
        payload
        status
        sentAt
        readAt
        createdAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
    unreadCount
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation MarkNotificationAsRead($id: ID!) {
  markNotificationAsRead(id: $id) {
    id
    userId
    type
    payload
    status
    sentAt
    readAt
    createdAt
  }
}

mutation DeleteNotification($id: ID!) {
  deleteNotification(id: $id)
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription NotificationReceived {
  notificationReceived {
    ...NotificationSubscription
  }
}

subscription NotificationByType($type: NotificationType!) {
  notificationByType(type: $type) {
    ...NotificationSubscription
  }
}

subscription UrgentNotificationReceived {
  urgentNotificationReceived {
    ...NotificationSubscription
  }
}

subscription NotificationUpdated {
  notificationUpdated {
    ...NotificationSubscription
  }
}



