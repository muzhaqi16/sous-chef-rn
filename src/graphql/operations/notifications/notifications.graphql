# ============================================
# QUERIES
# ============================================

query GetMyNotifications(
  $filter: NotificationFilters
  $first: Int
  $after: String
  $last: Int
  $before: String
  $orderBy: NotificationOrderBy
) {
  me {
    notificationsConnection(
      filter: $filter
      first: $first
      after: $after
      last: $last
      before: $before
      orderBy: $orderBy
    ) {
      edges {
        node {
          ...NotificationFragment
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
      unreadCount
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation MarkNotificationAsRead($id: ID!) {
  markNotificationAsRead(id: $id) {
    success
    message
    code
    notification {
      ...NotificationFragment
    }
  }
}

mutation DeleteNotification($id: ID!) {
  deleteNotification(id: $id) {
    success
    message
    code
    notification {
      id
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription NotificationReceived {
  notificationReceived {
    ...NotificationSubscription
  }
}

subscription NotificationUpdated {
  notificationUpdated {
    ...NotificationSubscription
  }
}



