# ============================================
# QUERIES
# ============================================

query GetMyNotifications(
  $filter: NotificationFilters
  $first: Int
  $after: String
  $last: Int
  $before: String
  $orderBy: NotificationOrderBy
) {
  me {
    id
    notificationsConnection(
      filter: $filter
      first: $first
      after: $after
      last: $last
      before: $before
      orderBy: $orderBy
    ) {
      edges {
        node {
          ...NotificationFragment
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
      unreadCount
    }
  }
}

query GetNotificationStats($filters: NotificationFilters) {
  notificationStats(filters: $filters) {
    total
    unread
    read
    clicked
    dismissed
    expired
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation MarkNotificationAsRead($id: ID!) {
  markNotificationAsRead(id: $id) {
    success
    message
    code
    notification {
      ...NotificationFragment
    }
  }
}

mutation MarkAllNotificationsAsRead {
  markAllNotificationsAsRead {
    success
    message
    code
    count
  }
}

mutation DeleteNotification($id: ID!) {
  deleteNotification(id: $id) {
    success
    message
    code
    notification {
      id
    }
  }
}

mutation DeleteAllReadNotifications {
  deleteAllReadNotifications {
    success
    message
    code
    count
  }
}

mutation DeleteMultipleNotifications($ids: [ID!]!) {
  deleteMultipleNotifications(ids: $ids) {
    success
    message
    code
    count
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription NotificationChanged {
  notificationChanged {
    changeType
    notification {
      ...NotificationFragment
    }
    timestamp
  }
}



