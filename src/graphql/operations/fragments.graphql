# ============================================
# FRAGMENTS
# ============================================

# Core fragment for optimistic updates and list views
# Contains only essential fields needed for basic operations
fragment ShoppingListItemCore on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
}

# Lightweight fragment for shopping list display (GetShoppingLists)
# Contains Core fields + display-critical fields for rendering shopping list items
# For full item details, use ShoppingListItemFragment in GetShoppingListItem
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  ...ShoppingListItemCore
  sortOrder
  # NEW: Brand and netWeight fields for custom shopping list items
  brand {
    id
    name
  }
  brandId
  netWeight
  netWeightUnit {
    id
    name
    symbol
  }
  netWeightUnitId
  item {
    id
    imageUrl
    categories {
      id
      isPrimary
      category {
        id
        name
      }
    }
    # NOTE: Full `units` array omitted from Display tier — list views don't need all unit details.
    # Use ShoppingListItemFragment (FULL tier) for detail views that need units.
  }
}

# Full fragment for detail views and complete data
# Spreads Display (which includes Core) and adds all extended fields
fragment ShoppingListItemFragment on ShoppingListItem {
  ...ShoppingListItemDisplayFragment
  # Extended fields not in Display
  shoppingList {
    id
    totalItems
    completedItems
    estimatedTotal
  }
  item {
    id
    name
    description
    imageUrl
    netWeight
    nutritions
    images {
      id
      url
      kind
    }
    displayUnit {
      id
      name
      symbol
    }
    categories {
      id
      isPrimary
      confidence
      source
      assignedAt
      category {
        id
        name
      }
    }
  }
  # Extended unit fields (Core has id, name, symbol, displayAsFraction, minPrecision, autoConvertThreshold)
  unit {
    type
    isMetric
    baseUnitId
    conversionFactor
    notes
    isCommon
    sortOrder
    createdAt
    updatedAt
  }
  # NEW: Price fields in nested object
  priceEstimate {
    estimated
    budget
    lastKnown
    lowest
    highest
    lastUpdated
  }
  # NEW: Purchase fields in nested object
  purchaseInfo {
    isPurchased # Already in Core
    purchasedQuantity
    purchasedPrice
    purchaseDate
    purchasedBy {
      ...UserSummary
    }
  }
  # NEW: Source fields in nested object
  source {
    isAutoAdded
    autoAddReason
    isFromMealPlan
    mealPlan {
      id
      name
    }
  }
  # NEW: Store/location fields in nested object
  storeInfo {
    aisle
    storeSection
    preferredStore {
      id
      name
    }
  }
  # NEW: Purchase history fields in nested object
  purchaseHistory {
    previouslyPurchased
    lastPurchaseDate
    purchaseCount
  }
  # Metadata fields (unchanged)
  priority
  sortOrder
  createdAt
  # User reference
  addedBy {
    ...UserSummary
  }
  # Purchase history (paginated connection for performance)
  purchasesConnection(first: 10) {
    edges {
      cursor
      node {
        ...PurchaseFragment
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Shopping List Owner/Collaborator Fragments
fragment ShoppingListOwnershipFragment on ShoppingListOwnership {
  id
  userId
  shoppingListId
  createdAt
  transferredAt
  transferredFrom
  user {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}

fragment ShoppingListCollaboratorFragment on ShoppingListCollaborator {
  id
  email
  role
  status
  collaboratorId
  canAddItems
  canRemoveItems
  canEditItems
  canMarkPurchased
  collaborator {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
  invitedBy {
    id
    email
    profile {
      id
      displayName
    }
  }
}

fragment BasicUser on User {
  id
  email
}

# Lightweight user reference for nested display (addedBy, purchasedBy)
# Only includes fields actually rendered in list item UIs
fragment UserSummary on User {
  id
  email
  profile {
    id
    displayName
    avatar
  }
}

fragment AuthUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  createdAt
  updatedAt
  timezone
}

# Bootstrap fragment for login/register responses
# Extends AuthUser with IDs needed to skip the GetHomes waterfall
# and fire all post-login queries in parallel
fragment LoginUser on User {
  ...AuthUser
  defaultHomeId
  defaultShoppingListId
  preferredCurrency
  language
  defaultHome {
    id
    name
    isDefault
    pantriesConnection {
      edges {
        node {
          id
          homeId
          isDefault
        }
      }
    }
  }
  profile {
    id
    firstName
    lastName
    displayName
    avatar
  }
  settings {
    id
    theme
  }
}

fragment PartialUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  timezone
  preferredCurrency
  language
  defaultShoppingListId
  defaultHomeId
  createdAt
  updatedAt
  lastActiveAt
  profile {
    id
    firstName
    lastName
    displayName
    bio
    avatar
    phone
  }
  settings {
    id
    theme
  }
}


fragment UnitFragment on ItemUnit {
  id
  itemId
  unitId
  isDefault
  isPreferred
  isCommon
  packageSize
  packageDescription
  retailUnit
  usageContext
  recommendedFor
  minQuantity
  maxQuantity
  quantityStep
  averagePricePerUnit
  createdAt
  updatedAt
  version
  # Item-specific unit display names for better UX
  # e.g., "pineapple" / "pineapples" instead of generic "count"
  displayNameSingular
  displayNamePlural
  contentUnitId
  contentUnit {
    id
    name
    symbol
  }
}
fragment BrandFragment on ItemBrand {
  id
  brand {
    id
    name
  }
}
# ============================================
# ITEM FRAGMENTS (3-tier pattern)
# ============================================

# CORE: Minimal for cache normalization (5 fields)
fragment ItemCore on Item {
  id
  name
  version
  updatedAt
}

# DISPLAY: Nested in lists (ShoppingListItem, PantryItem) (12 fields)
# Contains only fields needed for list view rendering
# Used in: GetShoppingLists, GetPantry, AutocompleteItems
fragment ItemDisplay on Item {
  id
  name
  imageUrl
  netWeight
  displayUnit {
    id
    symbol
  }
  categories {
    id
    isPrimary
    category {
      id
      name
      color
      icon
    }
  }
}

# FULL: Detail views and item management (45+ fields)
# Contains all item fields except audit trails (creations, edits)
# Used in: GetItem, CreateItem, item detail screens
fragment ItemFragment on Item {
  ...ItemDisplay
  # Extended fields not in Display - only for detail views and item management
  description
  dataSource
  type
  storageState
  showInOnboarding
  shelfLifeDays
  popularity
  status
  visibility
  tags
  healthBenefits {
    benefit
    category
    description
  }
  allergens {
    name
    contains
    severity
  }
  nutritions
  images {
    id
    url
    kind
  }
  metadata
  ingredients
  createdAt
  density
  preferredTrackingUnitId
  preferredTrackingUnit {
    id
    name
    symbol
  }
  baseDimension
  defaultConsumeUnit {
    id
    name
    symbol
  }
  defaultConsumeUnitId
  defaultConsumeIncrement
  displayUnit {
    id
    name
    symbol
  }
  units {
    ...UnitFragment
  }
  brands {
    ...BrandFragment
  }
  # categories already included in ItemDisplay spread above
  # REMOVED: creations and edits (audit trails) - not used in UI
}

# ============================================
# PANTRY ITEM FRAGMENTS (3-tier pattern)
# ============================================

# CORE: Essential fields for mutations and cache normalization (15 fields)
# Contains only the minimum fields needed for optimistic updates and version control
fragment PantryItemCore on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  version
  updatedAt
  storageState
  expiresAt
  lowStockAlert
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
}

# DISPLAY: List views - Pantry screen cards
# Contains Core fields + display-critical fields for rendering pantry item cards
# Used in: GetPantry query (main pantry screen)
fragment PantryItemDisplay on PantryItem {
  ...PantryItemCore
  item {
    id
    imageUrl
    # NOTE: `images` array omitted — list views only need `imageUrl` for thumbnails.
    # Use PantryItemFragment (FULL tier) for detail views that need full images.
    name
    netWeight
    displayUnit {
      id
      symbol
    }
  }
  unit {
    id
    name
    symbol
  }
  # NEW: netWeightUnit for pantry item tracking
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
  brand {
    id
    name
  }
  tags
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
    }
  }
}

# FULL: Detail views and analytics
# Contains all fields including usage records, analytics, and extended metadata
# Used in: GetPantryItem query (detail screen), analytics queries
fragment PantryItemFragment on PantryItem {
  ...PantryItemDisplay
  # Extended item fields for detail view (images, nutrition, categories)
  # NOTE: id, name, imageUrl, displayUnit already provided by PantryItemDisplay
  # Intentionally avoids ...ItemFragment to stay under 175-field complexity limit
  item {
    images {
      id
      url
      kind
    }
    nutritions
    defaultConsumeIncrement
    defaultConsumeUnitId
    categories {
      isPrimary
      category {
        id
        name
      }
    }
  }
  unit {
    type
    isMetric
    baseUnitId
    conversionFactor
    isCommon
    displayAsFraction
    minPrecision
    autoConvertThreshold
  }
  storageNotes
  createdAt
  restockQuantity
  store {
    id
    name
  }
  # Additional detail fields
  condition
  acquisitionMethod
  costPerUnit
  totalCost
  purchase {
    id
    purchaseDate
    unitPrice
    totalPrice
    quantity
  }
  usageRecords(first: 20) {
    edges {
      node {
        id
        quantityUsed
        usageUnit {
          id
          name
          symbol
        }
        usedAt
        purpose
        notes
        wasteReason
        adjustmentReason
        isComposted
        isRecycled
        pantryItem {
          id
        }
        usedBy {
          id
        }
        cookingLog {
          id
        }
        mealPlanItem {
          id
        }
        recipe {
          id
        }
      }
    }
  }
}

