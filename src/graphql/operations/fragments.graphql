# ============================================
# FRAGMENTS
# ============================================

# Core fragment for optimistic updates and list views
# Contains only essential fields needed for basic operations
fragment ShoppingListItemCore on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
    displayAsFraction
    minPrecision
    autoConvertThreshold
  }
}

# Lightweight fragment for shopping list display (GetShoppingLists)
# Contains ONLY fields needed for SortableShoppingList rendering
# For full item details, use ShoppingListItemFragment in GetShoppingListItem
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  purchaseInfo {
    isPurchased
  }
  sortOrder
  unitName
  category
  version # Required for optimistic concurrency control in mutations
  unit {
    id
    name
    symbol
  }
  # NEW: Brand and netWeight fields for custom shopping list items
  brand {
    id
    name
  }
  brandId
  netWeight
  netWeightUnit {
    id
    name
    symbol
  }
  netWeightUnitId
  item {
    id
    imageUrl
    categories {
      id
      isPrimary
      category {
        id
        name
      }
    }
    units {
      id
      isDefault
      isPreferred
      # Item-specific unit display names for better UX
      displayNameSingular
      displayNamePlural
      unit {
        id
        name
        symbol
      }
    }
  }
}

# Full fragment for detail views and complete data
# Spreads Core and adds all extended fields
fragment ShoppingListItemFragment on ShoppingListItem {
  ...ShoppingListItemCore
  # NEW: Brand and netWeight fields for custom shopping list items
  brand {
    id
    name
  }
  brandId
  netWeight
  netWeightUnit {
    id
    name
    symbol
  }
  netWeightUnitId
  # Extended fields not in Core
  shoppingList {
    id
    totalItems
    completedItems
    estimatedTotal
  }
  item {
    id
    name
    description
    imageUrl
    netWeight
    nutritions
    images
    displayUnit {
      id
      name
      symbol
    }
    categories {
      id
      isPrimary
      confidence
      source
      assignedAt
      category {
        id
        name
      }
    }
  }
  # Extended unit fields (Core has id, name, symbol, displayAsFraction, minPrecision, autoConvertThreshold)
  unit {
    type
    isMetric
    baseUnitId
    conversionFactor
    notes
    isCommon
    sortOrder
    createdAt
    updatedAt
  }
  # NEW: Price fields in nested object
  priceEstimate {
    estimated
    budget
    lastKnown
    lowest
    highest
    lastUpdated
  }
  # NEW: Purchase fields in nested object
  purchaseInfo {
    isPurchased # Already in Core
    purchasedQuantity
    purchasedPrice
    purchaseDate
    purchasedBy {
      ...PartialUser
    }
  }
  # NEW: Source fields in nested object
  source {
    isAutoAdded
    autoAddReason
    isFromMealPlan
    mealPlan {
      id
      name
    }
  }
  # NEW: Store/location fields in nested object
  storeInfo {
    aisle
    storeSection
    preferredStore {
      id
      name
    }
  }
  # NEW: Purchase history fields in nested object
  purchaseHistory {
    previouslyPurchased
    lastPurchaseDate
    purchaseCount
  }
  # Metadata fields (unchanged)
  priority
  sortOrder
  createdAt
  deletedAt
  # User reference
  addedBy {
    ...PartialUser
  }
  # Purchase history (paginated connection for performance)
  purchasesConnection(first: 10) {
    edges {
      cursor
      node {
        ...PurchaseFragment
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

