        ...BasicPantryFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# ============================================
# HOME FRAGMENTS
# ============================================

# DISPLAY: Home selector, list views (lightweight)
# Contains only basic home info with member count and pantry list
# Used in: GetHomes query (home selector dropdown)
fragment HomeDisplay on Home {
  id
  name
  type
  currency
  timezone
  version
  updatedAt
  isDefault
  __typename
  membersConnection(first: 10) {
    edges {
      node {
        id
        role
        status
        userId
        displayName
        user {
          id
          email
          profile {
            firstName
            lastName
            displayName
          }
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  invitesConnection(first: 10) {
    edges {
      node {
        ...HomeInviteFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  pantriesConnection(first: 50) {
    edges {
      node {
        ...BasicPantryFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  myMembership {
    id
    role
    status
    displayName
    canManageHome
    canAddItems
    canRemoveItems
    canEditPantry
  }
}

# FULL: Home detail views and management
# Contains full home data with all connections (invites, members, pantries with items)
# Used in: GetHome query (home detail screen)
fragment HomeFragment on Home {
  id
  name
  type
  description
  timezone
  currency
  isPublic
  joinCode
  allowJoinCode
  maxMembers
  tags
  metadata
  version
  createdAt
  updatedAt

  invitesConnection(first: 50) {
    edges {
      node {
        ...HomeInviteFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }

  membersConnection(first: 100) {
    edges {
      node {
        ...MemberShipFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }

  pantriesConnection(first: 50) {
    edges {
      node {
        ...PantryFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

fragment NotificationFragment on Notification {
  id
  userId
  type
  payload
  status
  sentAt
  readAt
  createdAt
}

fragment PurchaseFragment on Purchase {
  id
  purchaseDate
  quantity
  unitPrice
  totalPrice
  itemName
  unitSymbol
  # Removed user.profile to prevent subscription normalization crash
  # The server sends incomplete user data in subscriptions, causing
  # "Cannot read properties of undefined (reading 'shoppingLists')" error
}

