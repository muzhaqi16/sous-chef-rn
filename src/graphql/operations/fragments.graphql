# ============================================
# FRAGMENTS
# ============================================

# Core fragment for optimistic updates and list views
# Contains only essential fields needed for basic operations
fragment ShoppingListItemCore on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  isPurchased
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
    displayAsFraction
    minPrecision
    autoConvertThreshold
  }
}

# Lightweight fragment for shopping list display (GetShoppingLists)
# Contains ONLY fields needed for SortableShoppingList rendering
# For full item details, use ShoppingListItemFragment in GetShoppingListItem
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  id
  itemName
  quantity
  isPurchased
  sortOrder
  unitName
  category
  version # Required for optimistic concurrency control in mutations
  unit {
    id
    name
    symbol
  }
  item {
    id
    imageUrl
    categories {
      id
      isPrimary
      category {
        id
        name
      }
    }
  }
}

# Full fragment for detail views and complete data
# Spreads Core and adds all extended fields
fragment ShoppingListItemFragment on ShoppingListItem {
  ...ShoppingListItemCore
  # Extended fields not in Core
  shoppingList {
    id
    totalItems
    completedItems
    estimatedTotal
  }
  item {
    id
    name
    description
    imageUrl
    netWeight
    displayUnit {
      id
      name
      symbol
    }
    categories {
      id
      isPrimary
      confidence
      source
      assignedAt
      category {
        id
        name
      }
    }
  }
  # Extended unit fields (Core has id, name, symbol, displayAsFraction, minPrecision, autoConvertThreshold)
  unit {
    type
    isMetric
    baseUnitId
    conversionFactor
    notes
    isCommon
    sortOrder
    createdAt
    updatedAt
  }
  # Price fields
  estimatedPrice
  budgetPrice
  lastKnownPrice
  lowestPrice
  highestPrice
  priceLastUpdated
  # Purchase fields
  purchasedQuantity
  purchasedPrice
  purchaseDate
  # Location fields
  aisle
  storeSection
  # History fields
  previouslyPurchased
  lastPurchaseDate
  purchaseCount
  # Metadata fields
  priority
  sortOrder
  isAutoAdded
  autoAddReason
  isFromMealPlan
  mealPlanReference
  createdAt
  deletedAt
  # User references
  addedBy {
    ...PartialUser
  }
  purchasedBy {
    ...PartialUser
  }
  # Purchase history (paginated connection for performance)
  purchasesConnection(first: 10) {
    edges {
      cursor
      node {
        ...PurchaseFragment
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Shopping List Owner/Collaborator Fragments
fragment ShoppingListOwnershipFragment on ShoppingListOwnership {
