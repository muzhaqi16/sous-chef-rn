fragment BasicUser on User {
  id
  email
}

fragment AuthUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  createdAt
  updatedAt
  timezone
}

fragment PartialUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  timezone
  preferredCurrency
  language
  defaultShoppingListId
  defaultHomeId
  createdAt
  updatedAt
  lastActiveAt
  profile {
    id
    firstName
    lastName
    displayName
    bio
    avatar
    phone
  }
  settings {
    id
    theme
  }
}

fragment CompleteUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  createdAt
  updatedAt
  timezone
  addresses {
    id
    label
    street
    city
    state
    postalCode
    country
    lat
    lng
    isDefault
  }
  devices {
    id
    userId
    deviceId
    deviceName
    deviceType
    userAgent
    browserName
    browserVersion
    osName
    osVersion
    screenResolution
    timezone
    language
    appVersion
    platform
    pushToken
    isActive
    isTrusted
    lastSeenAt
    isVerified
    verifiedAt
    loginCount
    lastLoginAt
    createdAt
    updatedAt
    deletedAt
  }
  homeOwnerships {
    id
    createdAt
    homeId
    userId
    user {
      id
    }
    home {
      id
      name
      createdAt
    }
  }
  shoppingListOwnerships {
    createdAt
    id
    shoppingList {
      id
    }
    transferredAt
    transferredFrom
  }
}

# DISPLAY: Lightweight unit info for nested display (4 fields)
# Contains only essential unit fields for rendering in lists
# Used in: Nested in ShoppingListItemDisplay, PantryItemDisplay
fragment UnitDisplay on Unit {
  id
  name
  symbol
  displayAsFraction
  __typename
}

fragment UnitFragment on ItemUnit {
  id
  itemId
  unitId
  isDefault
  isPreferred
  isCommon
  packageSize
  packageDescription
  retailUnit
  usageContext
  recommendedFor
  minQuantity
  maxQuantity
  quantityStep
  averagePricePerUnit
  createdAt
  updatedAt
  version
  # Item-specific unit display names for better UX
  # e.g., "pineapple" / "pineapples" instead of generic "count"
  displayNameSingular
  displayNamePlural
  contentUnitId
  contentUnit {
    id
    name
    symbol
    __typename
  }
}
fragment BrandFragment on ItemBrand {
  id
  brand {
    id
    name
    description
    createdAt
    updatedAt
    version
  }
}
fragment CategoryFragment on Category {
  id
  name
  slug
  description
  icon
  color
  sortOrder
  type
  isActive
  isSystem
  visibility
  itemCount
  usageCount
  createdAt
  updatedAt
  deletedAt
  version
}

# ============================================
# ITEM FRAGMENTS (3-tier pattern)
# ============================================

# CORE: Minimal for cache normalization (5 fields)
fragment ItemCore on Item {
  id
  name
  __typename
  version
  updatedAt
}

# DISPLAY: Nested in lists (ShoppingListItem, PantryItem) (12 fields)
# Contains only fields needed for list view rendering
# Used in: GetShoppingLists, GetPantry, AutocompleteItems
fragment ItemDisplay on Item {
  id
  name
  imageUrl
  netWeight
  __typename
  displayUnit {
    id
    symbol
    __typename
  }
  categories {
    id
    isPrimary
    category {
      id
      name
      color
      icon
      __typename
    }
  }
}

# FULL: Detail views and item management (45+ fields)
# Contains all item fields except audit trails (creations, edits)
# Used in: GetItem, CreateItem, item detail screens
fragment ItemFragment on Item {
  ...ItemDisplay
  # Extended fields not in Display - only for detail views and item management
  description
  dataSource
  type
  storageState
  showInOnboarding
  shelfLifeDays
  popularity
  status
  visibility
  tags
  healthBenefits
  allergens
  nutritions
  images
  metadata
  ingredients
  createdAt
  deletedAt
  density
  preferredTrackingUnitId
  preferredTrackingUnit {
    id
    name
    symbol
  }
  displayUnit {
    id
    name
    symbol
  }
  units {
    ...UnitFragment
  }
  brands {
    ...BrandFragment
  }
  # categories already included in ItemDisplay spread above
  # REMOVED: creations and edits (audit trails) - not used in UI
}

fragment NotificationSubscription on NotificationPayload {
  mutation
  notification {
    id
    type
    payload
    status
    sentAt
    readAt
    createdAt
  }
  userId
  timestamp
}

# ============================================
# PANTRY ITEM FRAGMENTS (3-tier pattern)
# ============================================

# CORE: Essential fields for mutations and cache normalization (15 fields)
# Contains only the minimum fields needed for optimistic updates and version control
fragment PantryItemCore on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  version
  updatedAt
  storageState
  expiresAt
  lowStockAlert
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  __typename
}

# DISPLAY: List views - Pantry screen cards
# Contains Core fields + display-critical fields for rendering pantry item cards
# Used in: GetPantry query (main pantry screen)
fragment PantryItemDisplay on PantryItem {
  ...PantryItemCore
  item {
    id
    imageUrl
    images
    name
    netWeight
    displayUnit {
      id
      symbol
      __typename
    }
    __typename
  }
  unit {
    id
    name
    symbol
    __typename
  }
  # NEW: netWeightUnit for pantry item tracking
  netWeightUnit {
    id
    name
    symbol
    __typename
  }
  storageLocation {
    id
    name
    type
    __typename
  }
  brand {
    id
    name
    __typename
  }
  tags
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
      __typename
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
      __typename
    }
    totalNetWeight
    __typename
  }
  __typename
}

# FULL: Detail views and analytics
# Contains all fields including usage records, analytics, and extended metadata
# Used in: GetPantryItem query (detail screen), analytics queries
fragment PantryItemFragment on PantryItem {
  ...PantryItemDisplay
  # Extended fields not in Display - only for detail views
  item {
    ...ItemFragment
  }
  unit {
    type
    isMetric
    baseUnitId
    conversionFactor
    isCommon
    displayAsFraction
    minPrecision
    autoConvertThreshold
  }
  storageNotes
  createdAt
  restockQuantity
  store {
    id
    name
  }
  # Additional detail fields
  condition
  acquisitionMethod
  costPerUnit
  totalCost
  purchase {
    id
    purchaseDate
    unitPrice
    totalPrice
    quantity
  }
  usageRecords {
    id
    quantityUsed
    usageUnit {
      id
      name
      symbol
    }
    usedAt
    purpose
    notes
    wasteReason
    isComposted
    isRecycled
    pantryItem {
      id
    }
    usedBy {
      id
    }
    cookingLog {
      id
    }
    mealPlanItem {
      id
    }
    recipe {
      id
    }
  }
}

