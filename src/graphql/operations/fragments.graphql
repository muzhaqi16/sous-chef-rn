# ============================================
# FRAGMENTS
# ============================================

fragment ShoppingListItemFragment on ShoppingListItem {
  id
  shoppingList {
    id
    totalItems
    completedItems
    estimatedTotal
  }
  item {
    id
    name
    description
    imageUrl
    images
    netWeight
    displayUnit {
      id
      name
      symbol
    }
    categories {
      id
      isPrimary
      confidence
      source
      assignedAt
      category {
        id
        name
      }
    }
  }
  unit {
    id
    name
    symbol
    type
    isMetric
    baseUnitId
    conversionFactor
    notes
    isCommon
    sortOrder
    createdAt
    updatedAt
  }
  quantity
  estimatedPrice
  budgetPrice
  lastKnownPrice
  lowestPrice
  highestPrice
  priceLastUpdated
  isPurchased
  purchasedQuantity
  purchasedPrice
  purchaseDate
  aisle
  storeSection
  previouslyPurchased
  lastPurchaseDate
  purchaseCount
  itemName
  unitName
  notes
  priority
  category
  sortOrder
  isAutoAdded
  autoAddReason
  isFromMealPlan
  mealPlanReference
  createdAt
  updatedAt
  deletedAt
  version
  # Add these fields if they're missing and causing the TypeScript errors
  addedBy {
    ...PartialUser
  }
  purchasedBy {
    ...PartialUser
  }
  purchases {
    ...PurchaseFragment
  }
}
fragment BasicUser on User {
  id
  email
}

fragment AuthUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  createdAt
  updatedAt
  timezone
}

fragment PartialUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  timezone
  preferredCurrency
  language
  defaultShoppingListId
  defaultHomeId
  createdAt
  updatedAt
  lastActiveAt
  profile {
    id
    firstName
    lastName
    displayName
    bio
    avatar
    phone
  }
  settings {
    id
    theme
  }
}

fragment CompleteUser on User {
  id
  email
  emailVerified
  role
  onBoarded
  createdAt
  updatedAt
  timezone
  addresses {
    id
    label
    street
    city
    state
    postalCode
    country
    lat
    lng
    isDefault
  }
  devices {
    id
    userId
    deviceId
    deviceName
    deviceType
    userAgent
    browserName
    browserVersion
    osName
    osVersion
    screenResolution
    timezone
    language
    appVersion
    platform
    pushToken
    isActive
    isTrusted
    lastSeenAt
    lastIpAddress
    lastCountry
    lastCity
    isVerified
    verifiedAt
    loginCount
    lastLoginAt
    createdAt
    updatedAt
    deletedAt
  }
  homeOwnerships {
    id
    createdAt
    homeId
    userId
    user {
      id
    }
    home {
      id
      name
      createdAt
    }
  }
  purchases {
    id
  }
  shoppingListOwnerships {
    createdAt
    id
    shoppingList {
      id
    }
    transferredAt
    transferredFrom
  }
}

fragment UnitFragment on ItemUnit {
  id
  itemId
  unitId
  isDefault
  isPreferred
  isCommon
  conversionRatio
  conversionNote
  packageSize
  packageDescription
  retailUnit
  usageContext
  recommendedFor
  minQuantity
  maxQuantity
  quantityStep
  averagePricePerUnit
  lastPriceUpdate
  priceSource
  usageCount
  lastUsedAt
  popularityScore
  source
  confidence
  isVerified
  verifiedAt
  createdAt
  updatedAt
  version
}
fragment BrandFragment on ItemBrand {
  id
  brand {
    id
    name
    description
    createdAt
    updatedAt
    version
  }
}
fragment CategoryFragment on Category {
  id
  name
  slug
  description
  icon
  color
  sortOrder
  type
  isActive
  isSystem
  visibility
  itemCount
  usageCount
  createdAt
  updatedAt
  deletedAt
  version
}

fragment ItemFragment on Item {
  id
  name
  description
  dataSource
  type
  storageState
  showInOnboarding
  shelfLifeDays
  popularity
  status
  visibility
  imageUrl
  images
  tags
  healthBenefits
  allergens
  nutritions
  metadata
  ingredients
  createdAt
  updatedAt
  deletedAt
  version
  netWeight
  displayUnit {
    id
    name
    symbol
  }
  units {
    ...UnitFragment
  }
  brands {
    ...BrandFragment
  }
  categories {
    id
    isPrimary
    assignedAt
    assignedBy {
      id
    }
    category {
      ...CategoryFragment
    }
  }
  creations {
    id
    source
    reason
    metadata
    createdAt
  }
  edits {
    id
    fieldsChanged
    oldValues
    newValues
    editReason
    createdAt
  }
}

fragment NotificationSubscription on NotificationPayload {
  mutation
  notification {
    id
    type
    payload
    status
    sentAt
    readAt
    createdAt
  }
  userId
  timestamp
}

fragment PantryItemFragment on PantryItem {
  id
  pantryId
  itemId
  itemName
  item {
    ...ItemFragment
  }
  unitName
  unitId
  unit {
    id
    name
    symbol
    type
    isMetric
    baseUnitId
    conversionFactor
    isCommon
  }
  expiresAt
  storageLocation {
    id
    name
    type
  }
  storageState
  storageNotes
  initialQuantity
  currentQuantity
  consumedQuantity
  reservedQuantity
  autoReorderPoint
  isAutoReorder
  customCategory
  createdAt
  updatedAt
  version
  tags

  usageRecords {
    id
    quantityUsed
    usedAt
    purpose
    notes
    pantryItem {
      id
    }
    usedBy {
      id
    }
    cookingLog {
      id
    }
    mealPlanItem {
      id
    }
    recipe {
      id
    }
  }
}

fragment HomeInviteFragment on HomeInvite {
  id
  email
  token
  homeId
  invitedUserId
  recipientName
  role
  customPermissions
  status
  expiresAt
  sentAt
  lastReminderAt
  reminderCount
  acceptedAt
  declinedAt
  revokedAt
  message
  createdAt
  home {
    id
    name
  }
  inviter {
    ...BasicUser
    profile {
      displayName
    }
  }
}

fragment MemberShipFragment on Membership {
  id
  homeId
  userId
  user {
    ...PartialUser
  }
  role
  status
  displayName
  canViewPantry
  canEditPantry
  canAddItems
  canRemoveItems
  canInviteOthers
  canManageHome
  lastActiveAt
  joinedAt
  leftAt
  createdAt
  updatedAt
}

fragment PantryFragment on Pantry {
  id
  homeId
  name
  description
  isDefault
  location
  temperature
  tags
  metadata
  version
  createdAt
  updatedAt
  items {
    ...PantryItemFragment
  }
}

fragment BasicPantryFragment on Pantry {
  id
  homeId
  name
  description
  isDefault
  location
  temperature
  tags
  metadata
  version
  createdAt
  updatedAt
}

fragment HomeWithPantriesFragment on Home {
  id
  name
  type
  description
  timezone
  currency
  isPublic
  joinCode
  allowJoinCode
  maxMembers
  tags
  metadata
  version
  createdAt
  updatedAt

  invites {
    ...HomeInviteFragment
  }

  members {
    ...MemberShipFragment
  }

  pantries {
    ...BasicPantryFragment
  }
}

fragment HomeFragment on Home {
  id
  name
  type
  description
  timezone
  currency
  isPublic
  joinCode
  allowJoinCode
  maxMembers
  tags
  metadata
  version
  createdAt
  updatedAt

  invites {
    ...HomeInviteFragment
  }

  members {
    ...MemberShipFragment
  }

  pantries {
    ...PantryFragment
  }
}

fragment NotificationFragment on Notification {
  id
  userId
  type
  payload
  status
  sentAt
  readAt
  createdAt
}

fragment PurchaseFragment on Purchase {
  id
  purchaseDate
  quantity
  unitPrice
  totalPrice
  itemName
  unitSymbol
  user {
    id
    email
    profile {
      id
      displayName
    }
  }
}

fragment RecipeIngredientFragment on RecipeIngredient {
  id
  name
  quantity
  item {
    id
    name
    imageUrl
  }
  unit {
    id
    name
    symbol
  }
  image
  isOptional
  notes
  preparation
  sortOrder
  section
}

fragment BasicRecipeFragment on Recipe {
  id
  name
  description
  imageUrl
  servings
  prepTimeMinutes
  cookTimeMinutes
  totalTimeMinutes
  difficulty
  category
  status
  isExternal
  externalSource
  externalId
  primarySource
  caloriesPerServing
  createdAt
  updatedAt
}

fragment RecipeFragment on Recipe {
  id
  name
  description
  imageUrl
  servings
  prepTimeMinutes
  cookTimeMinutes
  totalTimeMinutes
  difficulty
  category
  status
  cuisine
  instructions
  notes
  tips
  videoUrl
  sourceUrl
  source
  originalAuthor

  # External source tracking
  isExternal
  externalSource
  externalId
  externalUrl
  externalData
  primarySource

  # Nutrition
  caloriesPerServing
  nutritionData

  # Tags and metadata
  dietaryTags
  tags
  visibility
  isPublished
  publishedAt
  averageRating
  matchPercentage

  # Relations
  createdBy {
    ...BasicUser
  }

  ingredients {
    ...RecipeIngredientFragment
  }

  createdAt
  updatedAt
  deletedAt
}
