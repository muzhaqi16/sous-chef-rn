  mealType
  isCompleted
  completedAt
  customMealName
  servings
  notes
  calories
  protein
  carbs
  fat
  estimatedCost
  actualCost
  nutritionSource
  usedPantryItems
  recipe {
    ...BasicRecipeFragment
  }
}

fragment MealPlanDisplay on MealPlan {
  id
  name
  description
  planType
  startDate
  endDate
  servings
  totalCalories
  totalProtein
  totalCarbs
  totalFat
  actualCost
  budgetAmount
  homeId
  home {
    id
    name
    myMembership {
      id
      role
    }
  }
  createdBy {
    id
    profile {
      id
      displayName
    }
  }
