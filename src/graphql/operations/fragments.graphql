fragment MealPlanFull on MealPlan {
  ...MealPlanDisplay
  dietaryProfile {
    id
    calorieTarget
    proteinTarget
    carbsTarget
    fatTarget
  }
  mealPlanItems {
    ...MealPlanItemFragment
  }
  generatedShoppingLists {
    id
    name
  }
  nutritionSummary {
    totalCalories
    totalProtein
    totalCarbs
    totalFat
    avgDailyCalories
    avgDailyProtein
    avgDailyCarbs
    avgDailyFat
    totalMeals
    mealsWithNutrition
    coveragePercentage
    mealTypeBreakdown {
      mealType
      totalCalories
      totalProtein
      totalCarbs
      totalFat
      mealCount
    }
  }
  nutritionGoalProgress {
    overallScore
    caloriesProgress {
      target
      current
      percentage
      status
    }
    proteinProgress {
      target
      current
      percentage
      status
    }
    carbsProgress {
      target
      current
      percentage
      status
    }
    fatProgress {
      target
      current
      percentage
      status
    }
  }
}

