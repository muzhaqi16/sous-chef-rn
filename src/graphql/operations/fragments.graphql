  quantity
  item {
    id
    name
    imageUrl
  }
  unit {
    id
    name
    symbol
  }
  image
  isOptional
  notes
  preparation
  sortOrder
  section
}

fragment BasicRecipeFragment on Recipe {
  id
  name
  description
  imageUrl
  servings
  prepTimeMinutes
  cookTimeMinutes
  totalTimeMinutes
  difficulty
  category
  status
  isExternal
  externalSource
  externalId
  primarySource
  caloriesPerServing
  createdAt
  updatedAt
  savedDetails {
    id
    folder
    tags
    notes
    personalRating
    cookedCount
  }
}

fragment RecipeFragment on Recipe {
  id
  name
  description
  imageUrl
  servings
  prepTimeMinutes
  cookTimeMinutes
  totalTimeMinutes
  difficulty
  category
  status
  cuisine
  instructions
  notes
  tips
  videoUrl
  sourceUrl
  source
  originalAuthor

  # External source tracking
  isExternal
  externalSource
  externalId
  externalUrl
  externalData
  primarySource

  # Nutrition
  caloriesPerServing
  nutritionData

  # Tags and metadata
  tags
  visibility
  isPublished
  publishedAt
  averageRating
  matchPercentage

  # Relations
  createdBy {
    ...BasicUser
  }

  ingredients {
    ...RecipeIngredientFragment
  }

  savedDetails {
    id
    folder
    tags
    notes
    personalRating
    cookedCount
  }

  createdAt
  updatedAt
  deletedAt
}
