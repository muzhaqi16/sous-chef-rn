  ...BasicRecipeFragment

  # Extended fields not in BasicRecipeFragment
  instructions
  notes
  tips
  videoUrl
  sourceUrl
  source
  originalAuthor

  # Extended external source fields
  externalUrl
  externalData

  # Nutrition
  nutritionData

  # Tags and metadata
  tags
  visibility
  isPublished
  publishedAt
  averageRating
  totalReviews
  rating1Count
  rating2Count
  rating3Count
  rating4Count
  rating5Count
