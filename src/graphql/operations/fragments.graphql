  updatedAt
}

fragment HomeWithPantriesFragment on Home {
  id
  name
  type
  description
  timezone
  currency
  isPublic
  joinCode
  allowJoinCode
  maxMembers
  tags
  metadata
  version
  createdAt
  updatedAt

  invitesConnection(first: 50) {
