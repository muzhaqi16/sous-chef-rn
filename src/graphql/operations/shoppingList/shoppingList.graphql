# ============================================
# QUERIES
# ============================================

query GetShoppingList($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    isDefault
    totalItems
    completedItems
    homeId
    home {
      id
      name
      myMembership {
        id
        role
        canAddItems
        canRemoveItems
        canEditPantry
      }
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    # Items connection for single source of truth
    # Uses lightweight DisplayFragment for performance
    # orderBy sortOrder ASC ensures items are returned in correct drag-reorder position
    itemsConnection(first: 100, orderBy: { sortOrder: ASC }) {
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          ...ShoppingListCollaboratorFragment
          invitedAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

# Lightweight query for list selector - metadata only, no items/collaborators
# Use this for dashboard/list views. Use GetShoppingList for full details.
# Lightweight query for shopping list details WITHOUT items
# Use this for ShoppingListMain where items come from GetShoppingListItemsPaginated
# Use GetShoppingList when you need the full itemsConnection (ListSettings, ShareList, resortEdges)
query GetShoppingListDetails($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    isDefault
    totalItems
    completedItems
    homeId
    home {
      id
      name
      myMembership {
        id
        role
        canAddItems
        canRemoveItems
        canEditPantry
      }
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          ...ShoppingListCollaboratorFragment
          invitedAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

# Lightweight query for list selector - metadata only, no items/collaborators
# Use this for dashboard/list views. Use GetShoppingList for full details.
query GetShoppingListsLite($homeId: ID, $first: Int, $after: String) {
  shoppingLists(filters: { homeId: $homeId }, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        description
        isDefault
        totalItems
        completedItems
        status
        isCompleted
        createdAt
        updatedAt
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile {
              id
              displayName
              avatar
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetDefaultShoppingList {
  shoppingLists(filters: { isDefault: true }, first: 1) {
    edges {
      node {
        id
        name
        description
        isDefault
        totalItems
        completedItems
        itemsConnection(first: 50, orderBy: { sortOrder: ASC }) {
          edges {
            node {
              ...ShoppingListItemCore
              item {
                id
                name
                imageUrl
              }
            }
            cursor
          }
          pageInfo {
            hasNextPage
            endCursor
          }
          totalCount
        }
        ownerships {
          ...ShoppingListOwnershipFragment
        }
        collaboratorsConnection(first: 20) {
          edges {
            cursor
            node {
              ...ShoppingListCollaboratorFragment
            }
          }
          pageInfo {
            hasNextPage
            endCursor
          }
          totalCount
        }
      }
    }
  }
}

# Combined paginated items query for Shopping/Purchased tabs
# Uses GraphQL aliases to fetch BOTH lists in ONE request
# Each tab has independent pagination cursors
query GetShoppingListItemsPaginated(
  $id: ID!
  $first: Int!
  $unpurchasedAfter: String
  $purchasedAfter: String
) {
  shoppingList(id: $id) {
    id
    unpurchasedItems: itemsConnection(
      first: $first
      after: $unpurchasedAfter
      filters: { isPurchased: false }
      orderBy: { sortOrder: ASC }
    ) {
      totalCount
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    purchasedItems: itemsConnection(
      first: $first
      after: $purchasedAfter
      filters: { isPurchased: true }
      orderBy: { sortOrder: ASC }
    ) {
      totalCount
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query GetShoppingListItem($id: ID!) {
  shoppingListItem(id: $id) {
    ...ShoppingListItemFragment
  }
}

# Suggestions are now a field on ShoppingList type
query GetShoppingListSuggestions($id: ID!, $limit: Int = 15) {
  shoppingList(id: $id) {
    id
    suggestions(limit: $limit) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      shoppingListItemId
    }
  }
}

