}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncShoppingListItem(
  $clientId: ID!
  $input: SyncShoppingListItemInput!
) {
  syncShoppingListItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...ShoppingListItemFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

mutation SyncDeleteShoppingListItem($clientId: ID!, $version: Int) {
  syncDeleteShoppingListItem(clientId: $clientId, version: $version) {
    clientId
