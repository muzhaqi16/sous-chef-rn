}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncShoppingListItem(
  $clientId: ID!
  $input: SyncShoppingListItemInput!
) {
  syncShoppingListItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...ShoppingListItemFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

mutation SyncDeleteShoppingListItem($clientId: ID!, $version: Int) {
  syncDeleteShoppingListItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

mutation SyncMoveShoppingListItem(
  $clientId: ID!
  $afterId: ID
  $beforeId: ID
  $version: Int
) {
  syncMoveShoppingListItem(
    clientId: $clientId
    afterId: $afterId
    beforeId: $beforeId
    version: $version
  ) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...ShoppingListItemFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription ShoppingListUpdated($listId: ID!) {
  shoppingListUpdated(listId: $listId) {
    mutation
    node {
      id
      name
      totalItems
      completedItems
      estimatedTotal
      status
      isCompleted
      completedAt
      budgetAmount
      totalCost
      itemsConnection(first: 25) {
        edges {
          node {
            id
            itemName
            quantity
            isPurchased
            estimatedPrice
          }
          cursor
        }
        pageInfo {
          hasNextPage
          endCursor
        }
        totalCount
      }
    }
    updatedFields
    previousValues {
      name
      status
      isCompleted
      budgetAmount
      totalCost
      estimatedTotal
    }
    userId
    timestamp
  }
}

subscription MyShoppingListsUpdated {
  myShoppingListsUpdated {
    mutation
    node {
      id
      name
      totalItems
      completedItems
      estimatedTotal
      status
      isCompleted
    }
    previousValues {
      name
      status
      isCompleted
    }
    updatedFields
    userId
    timestamp
  }
}

subscription ShoppingListItemsChanged($listId: ID!) {
  shoppingListItemsChanged(listId: $listId) {
    mutation
    listId
    item {
      ...ShoppingListItemFragment
    }
    previousValues {
      name
      quantity
      isCompleted
      price
      notes
    }
    updatedFields
    userId
    timestamp
  }
}

subscription ShoppingListCollaboratorsChanged($listId: ID!) {
  shoppingListCollaboratorsChanged(listId: $listId) {
    mutation
    listId
    collaborator {
      id
      token
      collaboratorId
      email
      role
      status
      canEdit
      canAddItems
      canRemoveItems
      canMarkPurchased
      invitedAt
      collaborator {
        id
        email
        profile {
          displayName
          avatar
        }
      }
    }
    userId
    timestamp
  }
}

subscription ShoppingListStatusChanged($listId: ID!) {
  shoppingListStatusChanged(listId: $listId) {
    mutation
    listId
    newStatus
    previousStatus
    completedBy {
      id
      email
      profile {
        displayName
        avatar
      }
    }
    userId
    timestamp
  }
}

subscription ShoppingListItemAdded($shoppingListId: ID!) {
