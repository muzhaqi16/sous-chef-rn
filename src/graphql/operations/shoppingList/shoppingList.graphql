mutation CreateShoppingList($input: CreateShoppingListInput!) {
  createShoppingList(input: $input) {
    success
    message
    code
    shoppingList {
      id
      name
      description
      isDefault
      isPublic
      tags
      totalItems
      completedItems
      estimatedTotal
      currency
      status
      isCompleted
      priority
      metadata
      createdAt
      updatedAt
      homeId
      home {
        id
        name
      }
      ownerships {
        ...ShoppingListOwnershipFragment
      }
    }
  }
}

