    summary {
      total
      successful
      failed
      skipped
      executionTime
    }
    clearedItemIds
  }
}

mutation AddItemsToShoppingList(
  $shoppingListId: ID!
  $items: [BatchAddShoppingListItemInput!]!
) {
  addItemsToShoppingList(shoppingListId: $shoppingListId, items: $items) {
    results {
      index
      clientId
      success
      item {
        ...ShoppingListItemDisplayFragment
      }
      quantityIncremented
      error
    }
    successCount
    failedCount
    incrementedCount
  }
}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncShoppingListItem(
  $clientId: ID!
  $input: SyncShoppingListItemInput!
) {
  syncShoppingListItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...ShoppingListItemDisplayFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

mutation SyncDeleteShoppingListItem($clientId: ID!, $version: Int) {
  syncDeleteShoppingListItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

mutation SyncMoveShoppingListItem(
  $clientId: ID!
  $afterId: ID
  $beforeId: ID
  $version: Int
) {
  syncMoveShoppingListItem(
    clientId: $clientId
    afterId: $afterId
    beforeId: $beforeId
    version: $version
  ) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...ShoppingListItemDisplayFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription ShoppingListChanges($listId: ID!) {
  shoppingListChanged(listId: $listId) {
    changeType
    item {
      ...ShoppingListItemDisplayFragment
    }
    shoppingList {
      id
      name
      totalItems
      completedItems
      estimatedTotal
      status
      isCompleted
      completedAt
      budgetAmount
      totalCost
    }
    collaborator {
      ...ShoppingListCollaboratorFragment
      canEdit
      invitedAt
      lastViewedAt
    }
    clearedItemIds
    clearedCount
    mutation
    updatedFields
    listId
    timestamp
    userId
  }
}

subscription MyShoppingListsChanges {
  myShoppingListsChanged {
    changeType
    shoppingList {
      id
      name
      totalItems
      completedItems
      estimatedTotal
      status
      isCompleted
    }
    mutation
    updatedFields
    listId
    timestamp
    userId
  }
}
