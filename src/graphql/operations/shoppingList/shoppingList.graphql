# ============================================
# QUERIES
# ============================================

query GetShoppingList(
  $id: ID!
) {
  shoppingList(id: $id) {
    id
    name
    description
    isDefault
    isPublic
    shareCode
    tags
    budgetAmount
    totalCost
    estimatedTotal
    currency
    category
    priority
    status
    isCompleted
    completedAt
    totalItems
    completedItems
    createdAt
    updatedAt
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    # Items connection for single source of truth
    # Uses lightweight DisplayFragment for performance
    # orderBy sortOrder ASC ensures items are returned in correct drag-reorder position
    itemsConnection(first: 100, orderBy: { sortOrder: ASC }) {
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          ...ShoppingListCollaboratorFragment
          canEdit
          canAddItems
          canRemoveItems
          canEditItems
          canMarkPurchased
          canInviteOthers
          invitedAt
          lastViewedAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    targetStore {
      id
      name
      address
    }
  }
}

query GetShoppingLists($homeId: String) {
  shoppingLists(filters: { homeId: $homeId }) {
    id
    name
    description
    isDefault
    isPublic
    tags
    totalItems
    completedItems
    estimatedTotal
    currency
    status
    isCompleted
    priority
    createdAt
    updatedAt
    homeId
    home {
      id
      name
    }
    ownerships {
      id
      userId
      user {
        id
        email
        profile {
          displayName
          avatar
        }
      }
    }
    # PERFORMANCE: Include items in initial query to eliminate second GetShoppingListItems call
    # Uses lightweight ShoppingListItemDisplayFragment (11 fields vs 60+) for ~80% payload reduction
    # orderBy sortOrder ASC ensures items are returned in correct drag-reorder position
    itemsConnection(first: 100, orderBy: { sortOrder: ASC }) {
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query GetDefaultShoppingList {
  defaultShoppingList {
    id
    name
    description
    isDefault
    totalItems
    completedItems
    itemsConnection(first: 50, orderBy: { sortOrder: ASC }) {
      edges {
        node {
          id
          itemName
          quantity
          isPurchased
          item {
            id
            name
            imageUrl
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          ...ShoppingListCollaboratorFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query GetShoppingListItem($id: ID!) {
  shoppingListItem(id: $id) {
    ...ShoppingListItemFragment
  }
}

query GetRecentlyDeletedShoppingListItems($shoppingListId: ID!, $limit: Int) {
  recentlyDeletedShoppingListItems(shoppingListId: $shoppingListId, limit: $limit) {
    id
    itemName
    item {
      id
      name
      imageUrl
    }
    createdAt
  }
}

