# ============================================
# QUERIES
# ============================================

query GetShoppingList($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    description
    isDefault
    isPublic
    shareCode
    tags
    budgetAmount
    totalCost
    estimatedTotal
    currency
    category
    priority
    status
    isCompleted
    completedAt
    totalItems
    completedItems
    createdAt
    updatedAt
    items {
      id
      quantity
      estimatedPrice
      budgetPrice
      isPurchased
      purchasedQuantity
      purchasedPrice
      purchaseDate
      itemName
      itemBarcode
      unitName
      notes
      priority
      category
      sortOrder
      isAutoAdded
      autoAddReason
      isFromMealPlan
      item {
        id
        name
        description
        imageUrl
        type
        storageState
      }
      unit {
        id
        name
        symbol
      }
      preferredStore {
        id
        name
        address
      }
      purchasedBy {
        id
        email
      }
      addedBy {
        id
        email
      }
      createdAt
      updatedAt
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    collaborators {
      ...ShoppingListCollaboratorFragment
      canEdit
      canAddItems
      canRemoveItems
      canEditItems
      canMarkPurchased
      canInviteOthers
      invitedAt
      lastViewedAt
    }
    targetStore {
      id
      name
      address
    }
  }
}

query GetShoppingLists {
  shoppingLists {
    id
    name
    description
    isDefault
    isPublic
    tags
    totalItems
    completedItems
    estimatedTotal
    currency
    status
    isCompleted
    priority
    createdAt
    updatedAt
    items {
      id
      isPurchased
    }
    ownerships {
      id
      userId
      user {
        id
        email
        profile {
          displayName
          avatar
        }
      }
      createdAt
    }
    collaborators {
      id
      email
      role
      status
      collaboratorId
      collaborator {
        id
        email
        profile {
          displayName
          avatar
        }
      }
    }
  }
}

query GetDefaultShoppingList {
  defaultShoppingList {
    id
    name
    description
    isDefault
    totalItems
    completedItems
    items {
      id
      itemName
      quantity
      isPurchased
      item {
        id
        name
        imageUrl
      }
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    collaborators {
      ...ShoppingListCollaboratorFragment
    }
  }
}

query GetShoppingListItems($shoppingListId: ID!) {
  shoppingListItems(shoppingListId: $shoppingListId) {
    ...ShoppingListItemFragment
  }
}

query GetShoppingListItem($id: ID!) {
  shoppingListItem(id: $id) {
    ...ShoppingListItemFragment
  }
}

query GetShoppingListCollaborators($shoppingListId: ID!) {
  shoppingListCollaborators(shoppingListId: $shoppingListId) {
    ...ShoppingListCollaboratorFragment
    statusChangedAt
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateShoppingList($input: CreateShoppingListInput!) {
  createShoppingList(input: $input) {
    id
    name
    description
    isDefault
    isPublic
    tags
    totalItems
    completedItems
    estimatedTotal
    currency
    status
    isCompleted
    priority
    metadata
    createdAt
    updatedAt
    items {
      id
      isPurchased
    }
    collaborators {
      ...ShoppingListCollaboratorFragment
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
  }
}

mutation UpdateShoppingList($id: ID!, $input: UpdateShoppingListInput!) {
  updateShoppingList(id: $id, input: $input) {
    id
    name
    description
    isDefault
    isPublic
    tags
    totalItems
    completedItems
    estimatedTotal
    currency
    status
    isCompleted
    priority
    createdAt
    updatedAt
    items {
      id
      isPurchased
    }
    collaborators {
      ...ShoppingListCollaboratorFragment
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
  }
}

mutation DeleteShoppingList($id: ID!) {
  deleteShoppingList(id: $id)
}

mutation SetDefaultShoppingList($id: ID!) {
  setDefaultShoppingList(id: $id) {
    id
    name
    isDefault
  }
}

mutation ShareShoppingList($id: ID!, $input: ShareShoppingListInput!) {
  shareShoppingList(id: $id, input: $input) {
    name
    id
    isPublic
    isDefault
  }
}

mutation AddCollaborator($data: AddCollaboratorInput!) {
  addCollaborator(data: $data) {
    id
    shoppingListId
    collaboratorId
    email
    role
    status
    canEdit
    canAddItems
    canRemoveItems
    canEditItems
    canMarkPurchased
    canInviteOthers
    canViewHistory
    canExport
    inviteToken
    invitedAt
    statusChangedAt
    expiresAt
    lastViewedAt
    lastEditedAt
    itemsAdded
    itemsPurchased
    notifyOnChanges
    notifyOnComplete
  }
}

mutation RemoveCollaborator($data: RemoveCollaboratorInput!) {
  removeCollaborator(data: $data)
}

mutation AddItemToShoppingList($input: CreateShoppingListItemInput!) {
  addItemToShoppingList(input: $input) {
    ...ShoppingListItemFragment
  }
}

mutation UpdateShoppingListItem(
  $id: ID!
  $input: UpdateShoppingListItemInput!
) {
  updateShoppingListItem(id: $id, input: $input) {
    ...ShoppingListItemFragment
  }
}

mutation RemoveItemFromShoppingList($id: ID!) {
  removeItemFromShoppingList(id: $id) {
    ...ShoppingListItemFragment
  }
}

mutation markItemPurchased($id: ID!, $status: Boolean!) {
  markItemPurchased(id: $id, status: $status) {
    ...ShoppingListItemFragment
  }
}

mutation MoveShoppingListItem($input: MoveShoppingListItemInput!) {
  moveShoppingListItem(input: $input) {
    ...ShoppingListItemFragment
  }
}

# ============================================
# SPECIALIZED PERFORMANCE MUTATIONS
# ============================================

mutation ToggleShoppingListItemPurchased(
  $id: ID!
  $purchased: Boolean!
  $version: Int
) {
  toggleShoppingListItemPurchased(
    id: $id
    purchased: $purchased
    version: $version
  ) {
    ...ShoppingListItemFragment
  }
}

mutation UpdateShoppingListItemQuantity(
  $itemId: ID!
  $quantity: String!
  $version: Int
) {
  updateShoppingListItemQuantity(
    itemId: $itemId
    quantity: $quantity
    version: $version
  ) {
    ...ShoppingListItemFragment
  }
}

mutation UpdateShoppingListItemNotes($id: ID!, $notes: String, $version: Int) {
  updateShoppingListItemNotes(id: $id, notes: $notes, version: $version) {
    ...ShoppingListItemFragment
  }
}

mutation UpdateShoppingListItemPriority(
  $id: ID!
  $priority: Int!
  $version: Int
) {
  updateShoppingListItemPriority(
    id: $id
    priority: $priority
    version: $version
  ) {
    ...ShoppingListItemFragment
  }
}

mutation UpdateCollaboratorRole(
  $shoppingListId: ID!
  $collaboratorId: ID!
  $role: CollaboratorRole!
) {
  updateCollaboratorRole(
    shoppingListId: $shoppingListId
    collaboratorId: $collaboratorId
    role: $role
  )
}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncShoppingListItem(
  $clientId: ID!
  $input: SyncShoppingListItemInput!
) {
  syncShoppingListItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...ShoppingListItemFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

mutation SyncDeleteShoppingListItem($clientId: ID!, $version: Int) {
  syncDeleteShoppingListItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

mutation SyncMoveShoppingListItem(
  $clientId: ID!
  $afterId: ID
  $beforeId: ID
  $version: Int
) {
  syncMoveShoppingListItem(
    clientId: $clientId
    afterId: $afterId
    beforeId: $beforeId
    version: $version
  ) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...ShoppingListItemFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription ShoppingListUpdated($listId: ID!) {
  shoppingListUpdated(listId: $listId) {
    mutation
    node {
      id
      name
      totalItems
      completedItems
      estimatedTotal
      status
      isCompleted
      completedAt
      budgetAmount
      totalCost
      items {
        id
        itemName
        quantity
        isPurchased
        estimatedPrice
      }
    }
    updatedFields
    previousValues {
      name
      status
      isCompleted
      budgetAmount
      totalCost
      estimatedTotal
    }
    userId
    timestamp
  }
}

subscription MyShoppingListsUpdated {
  myShoppingListsUpdated {
    mutation
    node {
      id
      name
      totalItems
      completedItems
      estimatedTotal
      status
      isCompleted
    }
    previousValues {
      name
      status
      isCompleted
    }
    updatedFields
    userId
    timestamp
  }
}

subscription ShoppingListItemsChanged($listId: ID!) {
  shoppingListItemsChanged(listId: $listId) {
    mutation
    listId
    item {
      ...ShoppingListItemFragment
    }
    previousValues {
      name
      quantity
      isCompleted
      price
      notes
    }
    updatedFields
    userId
    timestamp
  }
}

subscription ShoppingListCollaboratorsChanged($listId: ID!) {
  shoppingListCollaboratorsChanged(listId: $listId) {
    mutation
    listId
    collaborator {
      id
      collaboratorId
      email
      role
      status
      canEdit
      canAddItems
      canRemoveItems
      canMarkPurchased
      invitedAt
      collaborator {
        id
        email
        profile {
          displayName
          avatar
        }
      }
    }
    userId
    timestamp
  }
}

subscription ShoppingListStatusChanged($listId: ID!) {
  shoppingListStatusChanged(listId: $listId) {
    mutation
    listId
    newStatus
    previousStatus
    completedBy {
      id
      email
      profile {
        displayName
        avatar
      }
    }
    userId
    timestamp
  }
}

subscription ShoppingListItemAdded($shoppingListId: ID!) {
  shoppingListItemAdded(shoppingListId: $shoppingListId) {
    ...ShoppingListItemFragment
  }
}

subscription ShoppingListItemUpdated($shoppingListId: ID!) {
  shoppingListItemUpdated(shoppingListId: $shoppingListId) {
    ...ShoppingListItemFragment
  }
}

subscription ShoppingListItemRemoved($shoppingListId: ID!) {
  shoppingListItemRemoved(shoppingListId: $shoppingListId) {
    id
    itemName
  }
}
