# ============================================
# SPECIALIZED PERFORMANCE MUTATIONS
# ============================================

mutation ToggleShoppingListItemPurchased(
  $id: ID!
  $purchased: Boolean!
  $version: Int
) {
  toggleShoppingListItemPurchased(
    id: $id
    purchased: $purchased
    version: $version
  ) {
    success
    message
    code
    shoppingListItem {
      # Request all quantity-related fields to ensure cache is updated correctly
      # when unmarking items as purchased (server resets purchasedQuantity, etc.)
      id
      itemName
      quantity
      quantityInput
      normalizedQuantity
      purchaseInfo {
        isPurchased
        purchasedQuantity
        purchasedPrice
        purchaseDate
      }
      updatedAt
      version
      category
      unitName
      unit {
        id
        name
        symbol
      }
    }
  }
}

