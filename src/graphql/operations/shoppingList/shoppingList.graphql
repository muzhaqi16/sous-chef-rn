# ============================================
# QUERIES
# ============================================

query GetShoppingList($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    description
    isDefault
    isPublic
    shareCode
    tags
    budgetAmount
    totalCost
    estimatedTotal
    currency
    category
    priority
    status
    isCompleted
    completedAt
    totalItems
    completedItems
    createdAt
    updatedAt
    homeId
    home {
      id
      name
      myMembership {
        id
        role
        canAddItems
        canRemoveItems
        canEditPantry
      }
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    # Items connection for single source of truth
    # Uses lightweight DisplayFragment for performance
    # orderBy sortOrder ASC ensures items are returned in correct drag-reorder position
    itemsConnection(first: 100, orderBy: { sortOrder: ASC }) {
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          ...ShoppingListCollaboratorFragment
          canEdit
          canAddItems
          canRemoveItems
          canEditItems
          canMarkPurchased
          canInviteOthers
          invitedAt
          lastViewedAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    targetStore {
      id
      name
      address
    }
  }
}

# Lightweight query for list selector - metadata only, no items/collaborators
# Use this for dashboard/list views. Use GetShoppingList for full details.
query GetShoppingListsLite($homeId: String) {
  shoppingLists(filters: { homeId: $homeId }) {
    edges {
      node {
        id
        name
        description
        isDefault
        totalItems
        completedItems
        status
        isCompleted
        createdAt
        updatedAt
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile {
              displayName
              avatar
            }
          }
        }
      }
    }
  }
}

query GetDefaultShoppingList {
  defaultShoppingList {
    id
    name
    description
    isDefault
    totalItems
    completedItems
    itemsConnection(first: 50, orderBy: { sortOrder: ASC }) {
      edges {
        node {
          id
          itemName
          quantity
          purchaseInfo {
            isPurchased
          }
          item {
            id
            name
            imageUrl
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    ownerships {
      ...ShoppingListOwnershipFragment
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          ...ShoppingListCollaboratorFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

# Combined paginated items query for Shopping/Purchased tabs
# Uses GraphQL aliases to fetch BOTH lists in ONE request
# Each tab has independent pagination cursors
query GetShoppingListItemsPaginated(
  $id: ID!
  $first: Int!
  $unpurchasedAfter: String
  $purchasedAfter: String
) {
  shoppingList(id: $id) {
    id
    unpurchasedItems: itemsConnection(
      first: $first
      after: $unpurchasedAfter
      filters: { isPurchased: false }
      orderBy: { sortOrder: ASC }
    ) {
      totalCount
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    purchasedItems: itemsConnection(
      first: $first
      after: $purchasedAfter
      filters: { isPurchased: true }
      orderBy: { sortOrder: ASC }
    ) {
      totalCount
      edges {
        cursor
        node {
          ...ShoppingListItemDisplayFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query GetShoppingListItem($id: ID!) {
  shoppingListItem(id: $id) {
    ...ShoppingListItemFragment
  }
}

query GetRecentlyDeletedShoppingListItems($shoppingListId: ID!, $limit: Int) {
  recentlyDeletedShoppingListItems(
    shoppingListId: $shoppingListId
    limit: $limit
  ) {
    id
    itemName
    item {
      id
      name
      imageUrl
    }
    createdAt
  }
}

query GetShoppingListSuggestions($shoppingListId: ID!, $limit: Int) {
  shoppingListSuggestions(shoppingListId: $shoppingListId, limit: $limit) {
    id
    itemId
    shoppingListItemId
    name
    imageUrl
    category
    source
    defaultUnitId
    defaultUnit {
      id
      name
      symbol
    }
    lastQuantity
    lastUnitId
    frequencyCount
    popularityRank
  }
}

