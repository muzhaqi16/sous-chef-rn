}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription ShoppingListUpdated($listId: ID!) {
  shoppingListUpdated(listId: $listId) {
    mutation
    node {
      id
      name
      totalItems
      completedItems
      estimatedTotal
      status
      isCompleted
      completedAt
      budgetAmount
      totalCost
      itemsConnection(first: 25) {
        edges {
          node {
            id
            itemName
            quantity
            purchaseInfo {
              isPurchased
            }
            priceEstimate {
              estimated
            }
          }
          cursor
        }
        pageInfo {
          hasNextPage
          endCursor
        }
        totalCount
      }
    }
    updatedFields
    userId
    timestamp
  }
}

