# ============================================
# SPECIALIZED PERFORMANCE MUTATIONS
# ============================================

mutation ToggleShoppingListItemPurchased(
  $id: ID!
  $purchased: Boolean!
  $version: Int
) {
  toggleShoppingListItemPurchased(
    id: $id
    purchased: $purchased
    version: $version
  ) {
    # Use minimal fields matching server response to avoid cache warnings
    id
    itemName
    quantity
    isPurchased
    updatedAt
    category
    unitName
    unit {
      id
      name
      symbol
    }
  }
}

mutation UpdateShoppingListItemQuantity(
