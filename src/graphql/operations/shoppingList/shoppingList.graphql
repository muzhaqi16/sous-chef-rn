      description
      isDefault
      isPublic
      tags
      totalItems
      completedItems
      estimatedTotal
      currency
      status
      isCompleted
      priority
      metadata
      createdAt
      updatedAt
      homeId
      home {
        id
        name
      }
      itemsConnection(first: 25) {
        edges {
          node {
            id
            purchaseInfo {
              isPurchased
            }
          }
          cursor
        }
        pageInfo {
          hasNextPage
          endCursor
        }
        totalCount
      }
      collaboratorsConnection(first: 20) {
        edges {
          cursor
          node {
            ...ShoppingListCollaboratorFragment
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
        totalCount
      }
      ownerships {
        ...ShoppingListOwnershipFragment
      }
    }
  }
}

