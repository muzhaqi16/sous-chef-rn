# ============================================
# QUERIES
# ============================================

query SearchRecipes($query: String!, $first: Int, $after: String) {
  searchRecipes(query: $query, first: $first, after: $after) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query SuggestedRecipes($first: Int, $after: String) {
  recipeSuggestions(first: $first, after: $after) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query MyRecipes(
  $cursor: String
  $first: Int = 25
  $category: RecipeCategory
  $difficulty: Difficulty
) {
  recipes(
    after: $cursor
    first: $first
    category: $category
    difficulty: $difficulty
  ) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    ...RecipeFragment
  }
}

query MySavedRecipes($folder: String) {
  me {
    savedRecipesConnection(folder: $folder) {
      edges {
        node {
          id
          folder
          tags
          notes
          personalRating
          cookedCount
          lastCookedAt
          createdAt
          updatedAt
          recipe {
            ...BasicRecipeFragment
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query SavedRecipeFolders {
  savedRecipeFolders
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    success
    message
    code
    recipe {
      ...RecipeFragment
    }
  }
}

mutation UpsertExternalRecipe($input: CreateRecipeInput!) {
  upsertExternalRecipe(input: $input) {
    recipe {
      id
      name
      imageUrl
      externalSource
      externalId
      servings
      prepTimeMinutes
      cookTimeMinutes
      totalTimeMinutes
    }
    created
  }
}

mutation UpdateRecipe($id: ID!, $input: UpdateRecipeInput!) {
  updateRecipe(id: $id, input: $input) {
    success
    message
    code
    recipe {
      ...RecipeFragment
    }
  }
}

mutation DeleteRecipe($id: ID!) {
  deleteRecipe(id: $id) {
    success
    message
    code
    recipe {
      id
    }
  }
}

mutation FavoriteRecipe($input: FavoriteRecipeInput!) {
  favoriteRecipe(input: $input) {
    success
    message
    code
    savedRecipe {
      id
      recipeId
      userId
      folder
      tags
      notes
      personalRating
      cookedCount
      lastCookedAt
      createdAt
      updatedAt
      recipe {
        ...BasicRecipeFragment
      }
    }
  }
}

mutation UnfavoriteRecipe($recipeId: ID!) {
  unfavoriteRecipe(recipeId: $recipeId) {
    success
    message
    code
    savedRecipe {
      id
    }
  }
}

mutation DeleteRecipeFolder($input: DeleteRecipeFolderInput!) {
  deleteRecipeFolder(input: $input) {
    success
    message
    code
  }
}

mutation UpdateFavoriteRecipe($recipeId: ID!, $input: UpdateFavoriteRecipeInput!) {
  updateFavoriteRecipe(recipeId: $recipeId, input: $input) {
    success
    message
    code
    savedRecipe {
      id
      recipeId
      userId
      folder
      tags
      notes
      personalRating
      cookedCount
      createdAt
      updatedAt
    }
  }
}

mutation CreateShoppingListItemsFromRecipe(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Int
) {
  createShoppingListItemsFromRecipe(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
  ) {
    addedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      storeInfo {
        aisle
      }
      purchaseInfo {
        isPurchased
      }
    }
    updatedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      purchaseInfo {
        isPurchased
      }
    }
    skippedItems {
      id
      name
      quantity
    }
    totalAdded
    totalUpdated
    totalSkipped
  }
}

mutation CreateShoppingListItemFromRecipeIngredient(
  $recipeIngredientId: ID!
  $shoppingListId: ID!
  $quantityOverride: Float
) {
  createShoppingListItemFromRecipeIngredient(
    recipeIngredientId: $recipeIngredientId
    shoppingListId: $shoppingListId
    quantityOverride: $quantityOverride
  ) {
    shoppingListItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
    previousQuantity
    quantityAdded
    wasUpdated
    unitConversionApplied
  }
}

mutation AddRecipeToShoppingList(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Float
  $checkPantry: Boolean
) {
  addRecipeToShoppingList(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
    checkPantry: $checkPantry
  ) {
    success
    message
    code
    shoppingList {
      id
      totalItems
      completedItems
    }
  }
}

query MatchRecipeIngredientsToPantry(
  $pantryId: ID!
  $recipeId: ID!
  $servings: Int
) {
  matchRecipeIngredientsToPantry(
    pantryId: $pantryId
    recipeId: $recipeId
    servings: $servings
  ) {
    ingredient {
      ...RecipeIngredientFragment
    }
    isAvailable
    matchConfidence
    availableQuantity
    suggestedQuantity
    shortfall
    suggestedUnit {
      id
      name
      symbol
    }
    matchedPantryItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
  }
}

query CompatibleUnitsForItem($itemId: ID!, $currentUnitId: ID) {
  compatibleUnitsForItem(itemId: $itemId, currentUnitId: $currentUnitId) {
    unit {
      id
      name
      symbol
      type
    }
    isDefault
    isConfigured
    conversionRatio
    conversionConfidence
    source
    usageContexts
  }
}

query GetRecipeCookingLogs($recipeId: ID!, $first: Int, $after: String) {
  recipeCookingLogs(recipeId: $recipeId, first: $first, after: $after) {
    edges {
      node {
        id
        servingsMade
        notes
        cookedAt
        recipe {
          id
          name
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

mutation ConfirmRecipeConsumption(
  $recipeId: ID!
  $pantryId: ID!
  $consumptions: [ConfirmedIngredientConsumptionInput!]!
) {
  confirmRecipeConsumption(
    recipeId: $recipeId
    pantryId: $pantryId
    consumptions: $consumptions
  ) {
    success
    totalConsumed
    totalFailed
    cookingLog {
      id
      servingsMade
      notes
      cookedAt
    }
  }
}

mutation MarkRecipeAsCooked(
  $recipeId: ID!
  $servings: Float
  $deductFromPantry: Boolean!
  $ingredientsUsed: [IngredientUsageInput!]
  $notes: String
) {
  markRecipeAsCooked(
    recipeId: $recipeId
    servings: $servings
    deductFromPantry: $deductFromPantry
    ingredientsUsed: $ingredientsUsed
    notes: $notes
  ) {
    success
    message
    code
    cookingLog {
      id
      servingsMade
      notes
      cookedAt
      recipe {
        id
        name
      }
    }
  }
}

