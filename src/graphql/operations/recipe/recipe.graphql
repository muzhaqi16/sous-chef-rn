# ============================================
# QUERIES
# ============================================

query SearchRecipes($query: String!) {
  searchRecipes(query: $query) {
    ...BasicRecipeFragment
  }
}

query SuggestedRecipes {
  recipeSuggestions {
    ...BasicRecipeFragment
  }
}

query MyRecipes(
  $skip: Int
  $take: Int
  $category: RecipeCategory
  $difficulty: Difficulty
) {
  recipes(
    skip: $skip
    take: $take
    category: $category
    difficulty: $difficulty
  ) {
    recipes {
      ...BasicRecipeFragment
      cuisine
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    ...RecipeFragment
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    ...RecipeFragment
  }
}

mutation UpdateRecipe($id: ID!, $input: UpdateRecipeInput!) {
  updateRecipe(id: $id, input: $input) {
    ...RecipeFragment
  }
}

mutation DeleteRecipe($id: ID!) {
  deleteRecipe(id: $id)
}

mutation FavoriteRecipe($input: FavoriteRecipeInput!) {
  favoriteRecipe(input: $input) {
    id
    recipeId
    userId
    folder
    tags
    notes
    createdAt
    updatedAt
  }
}

mutation CreateShoppingListItemsFromRecipe(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Int
) {
  createShoppingListItemsFromRecipe(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
  ) {
    addedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      aisle
      isPurchased
    }
    updatedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      isPurchased
    }
    skippedItems {
      id
      name
      quantity
    }
    totalAdded
    totalUpdated
    totalSkipped
  }
}

mutation CreateShoppingListItemFromRecipeIngredient(
  $recipeIngredientId: ID!
  $shoppingListId: ID!
  $quantityOverride: Float
) {
  createShoppingListItemFromRecipeIngredient(
    recipeIngredientId: $recipeIngredientId
    shoppingListId: $shoppingListId
    quantityOverride: $quantityOverride
  ) {
    shoppingListItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
    previousQuantity
    quantityAdded
    wasUpdated
    unitConversionApplied
  }
}

mutation AddRecipeToShoppingList(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Float
  $checkPantry: Boolean
) {
  addRecipeToShoppingList(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
    checkPantry: $checkPantry
  ) {
    id
    items {
      ...ShoppingListItemCore
    }
  }
}

mutation MarkRecipeAsCooked(
  $recipeId: ID!
  $servings: Float
  $deductFromPantry: Boolean!
  $ingredientsUsed: [IngredientUsageInput!]
  $notes: String
) {
  markRecipeAsCooked(
    recipeId: $recipeId
    servings: $servings
    deductFromPantry: $deductFromPantry
    ingredientsUsed: $ingredientsUsed
    notes: $notes
  ) {
    id
    servingsMade
    notes
    cookedAt
    recipe {
      id
      name
    }
  }
}

mutation RecordPantryUsage(
  $pantryItemId: ID!
  $quantity: Float!
  $unitId: ID!
  $purpose: String
  $notes: String
) {
  recordPantryUsage(
    pantryItemId: $pantryItemId
    quantity: $quantity
    unitId: $unitId
    purpose: $purpose
    notes: $notes
  ) {
    id
    quantityUsed
    usedAt
    purpose
    notes
    pantryItem {
      id
      itemName
      currentQuantity
    }
  }
}
