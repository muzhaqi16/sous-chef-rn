# ============================================
# QUERIES
# ============================================

query SearchRecipes($query: String!) {
  searchRecipes(query: $query) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query SuggestedRecipes {
  recipeSuggestions {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query MyRecipes(
  $cursor: String
  $first: Int = 25
  $category: RecipeCategory
  $difficulty: Difficulty
) {
  recipes(
    after: $cursor
    first: $first
    category: $category
    difficulty: $difficulty
  ) {
    edges {
      node {
        ...BasicRecipeFragment
        cuisine
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    ...RecipeFragment
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    ...RecipeFragment
  }
}

mutation UpsertExternalRecipe($input: CreateRecipeInput!) {
  upsertExternalRecipe(input: $input) {
    recipe {
      id
      name
      imageUrl
      externalSource
      externalId
      servings
      prepTimeMinutes
      cookTimeMinutes
      totalTimeMinutes
    }
    created
  }
}

mutation UpdateRecipe($id: ID!, $input: UpdateRecipeInput!) {
  updateRecipe(id: $id, input: $input) {
    ...RecipeFragment
  }
}

mutation DeleteRecipe($id: ID!) {
  deleteRecipe(id: $id)
}

mutation FavoriteRecipe($input: FavoriteRecipeInput!) {
  favoriteRecipe(input: $input) {
    id
    recipeId
    userId
    folder
    tags
    notes
    createdAt
    updatedAt
  }
}

mutation CreateShoppingListItemsFromRecipe(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Int
) {
  createShoppingListItemsFromRecipe(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
  ) {
    addedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      storeInfo {
        aisle
      }
      purchaseInfo {
        isPurchased
      }
    }
    updatedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      purchaseInfo {
        isPurchased
      }
    }
    skippedItems {
      id
      name
      quantity
    }
    totalAdded
    totalUpdated
    totalSkipped
  }
}

mutation CreateShoppingListItemFromRecipeIngredient(
  $recipeIngredientId: ID!
  $shoppingListId: ID!
  $quantityOverride: Float
) {
  createShoppingListItemFromRecipeIngredient(
    recipeIngredientId: $recipeIngredientId
    shoppingListId: $shoppingListId
    quantityOverride: $quantityOverride
  ) {
    shoppingListItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
    previousQuantity
    quantityAdded
    wasUpdated
    unitConversionApplied
  }
}

mutation AddRecipeToShoppingList(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Float
  $checkPantry: Boolean
) {
  addRecipeToShoppingList(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
    checkPantry: $checkPantry
  ) {
    id
    itemsConnection(first: 100) {
      edges {
        node {
          ...ShoppingListItemCore
        }
      }
    }
  }
}

mutation MarkRecipeAsCooked(
  $recipeId: ID!
  $servings: Float
  $deductFromPantry: Boolean!
  $ingredientsUsed: [IngredientUsageInput!]
  $notes: String
) {
  markRecipeAsCooked(
    recipeId: $recipeId
    servings: $servings
    deductFromPantry: $deductFromPantry
    ingredientsUsed: $ingredientsUsed
    notes: $notes
  ) {
    id
    servingsMade
    notes
    cookedAt
    recipe {
      id
      name
    }
  }
}

mutation RecordPantryUsage(
  $pantryItemId: ID!
  $quantity: Float!
  $unitId: ID!
  $purpose: String
  $notes: String
) {
  recordPantryUsage(
    pantryItemId: $pantryItemId
    quantity: $quantity
    unitId: $unitId
    purpose: $purpose
    notes: $notes
  ) {
    id
    quantityUsed
    usedAt
    purpose
    notes
    pantryItem {
      id
      itemName
      currentQuantity
    }
  }
}
