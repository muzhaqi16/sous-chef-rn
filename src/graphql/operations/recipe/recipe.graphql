# ============================================
# QUERIES
# ============================================

query SearchRecipes($query: String!) {
  searchRecipes(query: $query) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query SuggestedRecipes {
  recipeSuggestions {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query MyRecipes(
  $cursor: String
  $first: Int = 25
  $category: RecipeCategory
  $difficulty: Difficulty
) {
  recipes(
    after: $cursor
    first: $first
    category: $category
    difficulty: $difficulty
  ) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    ...RecipeFragment
  }
}

query MySavedRecipes($folder: String) {
  mySavedRecipes(folder: $folder) {
    edges {
      node {
        id
        folder
        tags
        notes
        personalRating
        cookedCount
        lastCookedAt
        createdAt
        updatedAt
        recipe {
          ...BasicRecipeFragment
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query SavedRecipeFolders {
  savedRecipeFolders
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    success
    message
    code
    recipe {
      ...RecipeFragment
    }
  }
}

mutation UpsertExternalRecipe($input: CreateRecipeInput!) {
  upsertExternalRecipe(input: $input) {
    recipe {
      id
      name
      imageUrl
      externalSource
      externalId
      servings
      prepTimeMinutes
      cookTimeMinutes
      totalTimeMinutes
    }
    created
  }
}

mutation UpdateRecipe($id: ID!, $input: UpdateRecipeInput!) {
  updateRecipe(id: $id, input: $input) {
    success
    message
    code
    recipe {
      ...RecipeFragment
    }
  }
}

mutation DeleteRecipe($id: ID!) {
  deleteRecipe(id: $id) {
    success
    message
    code
    recipe {
      id
    }
  }
}

mutation FavoriteRecipe($input: FavoriteRecipeInput!) {
  favoriteRecipe(input: $input) {
    success
    message
    code
    savedRecipe {
      id
      recipeId
      userId
      folder
      tags
      notes
      personalRating
      cookedCount
      lastCookedAt
      createdAt
      updatedAt
      recipe {
        ...BasicRecipeFragment
      }
    }
  }
}

mutation UnfavoriteRecipe($recipeId: ID!) {
  unfavoriteRecipe(recipeId: $recipeId) {
    success
    message
    code
    savedRecipe {
      id
    }
  }
}

mutation DeleteRecipeFolder($folder: String!, $moveTo: String) {
  deleteRecipeFolder(folder: $folder, moveTo: $moveTo)
}

mutation UpdateFavoriteRecipe($recipeId: ID!, $input: UpdateFavoriteRecipeInput!) {
  updateFavoriteRecipe(recipeId: $recipeId, input: $input) {
    success
    message
    code
    savedRecipe {
      id
      recipeId
      userId
      folder
      tags
      notes
      personalRating
      cookedCount
      createdAt
      updatedAt
    }
  }
}

mutation CreateShoppingListItemsFromRecipe(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Int
) {
  createShoppingListItemsFromRecipe(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
  ) {
    addedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      storeInfo {
        aisle
      }
      purchaseInfo {
        isPurchased
      }
    }
    updatedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      purchaseInfo {
        isPurchased
      }
    }
    skippedItems {
      id
      name
      quantity
    }
    totalAdded
    totalUpdated
    totalSkipped
  }
}

mutation CreateShoppingListItemFromRecipeIngredient(
  $recipeIngredientId: ID!
  $shoppingListId: ID!
  $quantityOverride: Float
) {
  createShoppingListItemFromRecipeIngredient(
    recipeIngredientId: $recipeIngredientId
    shoppingListId: $shoppingListId
    quantityOverride: $quantityOverride
  ) {
    shoppingListItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
    previousQuantity
    quantityAdded
    wasUpdated
    unitConversionApplied
  }
}

mutation AddRecipeToShoppingList(
  $recipeId: ID!
  $shoppingListId: ID!
  $servings: Float
  $checkPantry: Boolean
) {
  addRecipeToShoppingList(
    recipeId: $recipeId
    shoppingListId: $shoppingListId
    servings: $servings
    checkPantry: $checkPantry
  ) {
    success
    message
    code
    shoppingList {
      id
      totalItems
      completedItems
    }
  }
}

mutation MarkRecipeAsCooked(
  $recipeId: ID!
  $servings: Float
  $deductFromPantry: Boolean!
  $ingredientsUsed: [IngredientUsageInput!]
  $notes: String
) {
  markRecipeAsCooked(
    recipeId: $recipeId
    servings: $servings
    deductFromPantry: $deductFromPantry
    ingredientsUsed: $ingredientsUsed
    notes: $notes
  ) {
    success
    message
    code
    cookingLog {
      id
      servingsMade
      notes
      cookedAt
      recipe {
        id
        name
      }
    }
  }
}

mutation RecordPantryUsage(
  $pantryItemId: ID!
  $quantity: Float!
  $unitId: ID!
  $purpose: String
  $notes: String
) {
  recordPantryUsage(
    pantryItemId: $pantryItemId
    quantity: $quantity
    unitId: $unitId
    purpose: $purpose
    notes: $notes
  ) {
    success
    message
    code
    pantryItemUsage {
      id
      quantityUsed
      usedAt
      purpose
      notes
      pantryItem {
        id
        itemName
        quantity
      }
    }
  }
}
