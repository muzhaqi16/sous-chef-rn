# ============================================
# QUERIES
# ============================================

query GetPantries($homeId: ID!, $first: Int, $after: String) {
  pantries(homeId: $homeId, first: $first, after: $after) {
    edges {
      node {
        id
        homeId
        name
        isDefault
        createdAt
        updatedAt
        version
        tags
      }
    }
  }
}

query GetPantry(
  $id: ID!
  $itemsCursor: String
  $itemsFirst: Int = 25
  $storageLocationsCursor: String
  $storageLocationsFirst: Int = 20
) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    version
    createdAt
    updatedAt
    stats {
      totalItems
      expiringCount
      lowStockCount
    }
    itemsConnection(first: $itemsFirst, after: $itemsCursor) {
      edges {
        node {
          ...PantryItemDisplay
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    storageLocationsConnection(
      first: $storageLocationsFirst
      after: $storageLocationsCursor
    ) {
      edges {
        node {
          id
          name
          type
          icon
          isDefault
          parentLocation {
            id
            name
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    ...PantryItemFragment
  }
}

query GetDefaultPantry($homeId: ID!) {
  pantries(homeId: $homeId, filters: { isDefault: true }, first: 1) {
    edges {
      node {
        id
        name
        isDefault
      }
    }
  }
}

# Suggestions are now a field on Pantry type
query GetPantryItemSuggestions($pantryId: ID!, $limit: Int = 10) {
  pantry(id: $pantryId) {
    id
    suggestions(limit: $limit) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      currentQuantity
      minQuantity
      restockQuantity
      daysUntilExpiry
      expiresAt
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      pantryItemId
    }
  }
}

# Analytics are now fields on Pantry type
query GetPantryUsageAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    usageAnalytics(filter: $filter) {
      totalUsageCount
      totalQuantityUsed
      averageUsagePerDay
      periodStart
      periodEnd
      usageByPurpose {
        purpose
        count
        totalQuantity
        percentage
      }
      usageBySource {
        source
        count
        totalQuantity
        percentage
      }
      topUsedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
      }
      usageTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryWasteAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    wasteAnalytics(filter: $filter) {
      totalWasteCount
      totalWasteQuantity
      totalWasteValue
      averageWastePerDay
      wasteRate
      composted
      recycled
      periodStart
      periodEnd
      wasteByReason {
        reason
        count
        totalQuantity
        percentage
        estimatedValue
      }
      topWastedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
        estimatedValue
      }
      wasteTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryLedgerAnalytics(
  $pantryId: ID!
  $filter: AnalyticsFilters
  $granularity: PeriodGranularity
) {
  pantry(id: $pantryId) {
    id
    ledgerAnalytics(filter: $filter, granularity: $granularity) {
      granularity
      periodStart
      periodEnd
      summary {
        totalAdded
        totalConsumed
        totalWasted
        netQuantity
        additionCount
        consumptionCount
        wasteCount
        additionsByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
        consumptionByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
      }
      periodData {
        periodStart
        periodEnd
        periodLabel
        added
        consumed
        wasted
        net
        additionCost
      }
      costAnalytics {
        totalSpent
        averageCostPerUnit
        costByStore {
          storeId
          storeName
          totalSpent
          itemCount
        }
      }
      topRestockedItems {
        itemId
        itemName
        totalQuantity
        count
      }
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreatePantry($input: CreatePantryInput!) {
  createPantry(input: $input) {
    success
    message
    code
    pantry {
      id
      homeId
      name
      description
      isDefault
      location
      temperature
      tags
      metadata
      version
      createdAt
      updatedAt
    }
  }
}

mutation UpdatePantry($id: ID!, $input: UpdatePantryInput!) {
  updatePantry(id: $id, input: $input) {
    success
    message
    code
    pantry {
      id
      homeId
      name
      description
      isDefault
      location
      temperature
      tags
      metadata
      version
      createdAt
      updatedAt
    }
  }
}

mutation DeletePantry($id: ID!) {
