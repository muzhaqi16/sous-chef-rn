}

subscription PantryWasteAlert($pantryId: ID!) {
  pantryWasteAlert(pantryId: $pantryId) {
    pantryId
    item {
      id
      itemId
      itemName
      pantryId
      quantity
      unit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
    }
    wasteAmount
    wasteReason
    wasteValue
    userId
    timestamp
  }
}
