# ============================================
# QUERIES
# ============================================

query GetPantries($homeId: ID!) {
  pantries(homeId: $homeId) {
    id
    homeId
    name
    isDefault
    createdAt
    updatedAt
    version
    tags
  }
}

query GetPantry(
  $id: ID!
  $itemsCursor: String
  $itemsFirst: Int = 25
  $storageLocationsCursor: String
  $storageLocationsFirst: Int = 50
) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
    itemsConnection(first: $itemsFirst, after: $itemsCursor) {
      edges {
        node {
          ...PantryItemFragment
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
    storageLocationsConnection(
      first: $storageLocationsFirst
      after: $storageLocationsCursor
    ) {
      edges {
        node {
          id
          name
          type
          icon
          color
          temperature
          isDefault
          sortOrder
          parentLocation {
            id
            name
          }
          childLocations {
            id
            name
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    ...PantryItemFragment
  }
}

query GetDefaultPantry($homeId: ID!) {
  defaultPantry(homeId: $homeId) {
    id
    name
    isDefault
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreatePantry($input: CreatePantryInput!) {
  createPantry(input: $input) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
  }
}

mutation UpdatePantry($id: ID!, $input: UpdatePantryInput!) {
  updatePantry(id: $id, input: $input) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
  }
}

mutation DeletePantry($id: ID!) {
  deletePantry(id: $id)
}

mutation SetDefaultPantry($pantryId: ID!) {
  setDefaultPantry(id: $pantryId) {
    id
    name
    isDefault
    homeId
  }
}

mutation CreatePantryItem($input: CreatePantryItemInput!) {
  createPantryItem(input: $input) {
    ...PantryItemFragment
  }
}

mutation UpdatePantryItem($id: ID!, $input: UpdatePantryItemInput!) {
  updatePantryItem(id: $id, input: $input) {
    ...PantryItemFragment
  }
}

mutation DeletePantryItem($id: ID!) {
  deletePantryItem(id: $id) {
    ...PantryItemFragment
  }
}

mutation CreatePantryItemUsage($input: RecordPantryItemUsageInput!) {
  createPantryItemUsage(input: $input) {
    id
    quantityUsed
    usedAt
    purpose
    notes
    pantryItem {
      id
      currentQuantity
      consumedQuantity
      ...PantryItemFragment
    }
    usedBy {
      id
      email
    }
  }
}

mutation RecordPantryItemWaste(
  $id: ID!
  $wasteAmount: Float!
  $wasteReason: WasteReason!
  $isComposted: Boolean
  $isRecycled: Boolean
) {
  recordPantryItemWaste(
    id: $id
    wasteAmount: $wasteAmount
    wasteReason: $wasteReason
    isComposted: $isComposted
    isRecycled: $isRecycled
  ) {
    ...PantryItemFragment
  }
}

mutation UpdatePantryItemQuantity(
  $pantryItemId: ID!
  $quantity: String!
  $unitId: ID
  $version: Int
) {
  updatePantryItemQuantity(
    pantryItemId: $pantryItemId
    quantity: $quantity
    unitId: $unitId
    version: $version
  ) {
    ...PantryItemFragment
  }
}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncPantryItem($clientId: ID!, $input: SyncPantryItemInput!) {
  syncPantryItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...PantryItemFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
      }
    }
  }
}

mutation SyncDeletePantryItem($clientId: ID!, $version: Int) {
  syncDeletePantryItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription PantryUpdated($pantryId: ID!) {
  pantryUpdated(pantryId: $pantryId) {
    mutation
    node {
      id
      homeId
      name
      description
      location
      temperature
      tags
      metadata
      version
      updatedAt
    }
    previousValues {
      name
      description
      location
      temperature
      tags
      metadata
    }
    updatedFields
    userId
    timestamp
  }
}

subscription PantryActivityAdded($pantryId: ID!) {
  pantryActivityAdded(pantryId: $pantryId) {
    id
    pantryId
    userId
    action
    description
    itemName
    quantity
    oldValue
    newValue
    metadata
    createdAt
    user {
      id
      email
      profile {
        displayName
      }
    }
  }
}

subscription PantryLowStockAlert($pantryId: ID!) {
  pantryLowStockAlert(pantryId: $pantryId) {
    pantryId
    currentQuantity
    minimumQuantity
    userId
    timestamp
    item {
      id
      itemId
      itemName
      unitName
      item {
        id
        name
        imageUrl
      }
    }
  }
}

subscription PantryExpiringItemsAlert($pantryId: ID!) {
  pantryExpiringItemsAlert(pantryId: $pantryId) {
    pantryId
    expiresAt
    daysUntilExpiration
    userId
    timestamp
    item {
      id
      itemId
      itemName
      unitName
      item {
        id
        name
        imageUrl
      }
    }
  }
}

subscription PantryItemsChanged($pantryId: ID!) {
  pantryItemsChanged(pantryId: $pantryId) {
    pantryId
    item {
      ...PantryItemFragment
    }
    updatedFields
    mutation
    timestamp
    userId
  }
}

subscription PantryItemUsageChanged($pantryId: ID!) {
  pantryItemUsageChanged(pantryId: $pantryId) {
    mutation
    pantryId
    usage {
      id
      quantityUsed
      usedAt
      purpose
      notes
      pantryItem {
        id
      }
      usedBy {
        id
      }
    }
    previousValues {
      quantityUsed
      purpose
    }
    userId
    timestamp
  }
}

subscription PantryWasteAlert($pantryId: ID!) {
  pantryWasteAlert(pantryId: $pantryId) {
    pantryId
    item {
      id
      itemId
      itemName
      pantryId
      currentQuantity
      unit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
    }
    wasteAmount
    wasteReason
    wasteValue
    userId
    timestamp
  }
}
