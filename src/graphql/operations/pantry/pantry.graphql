# ============================================
# QUERIES
# ============================================

query GetPantries($homeId: ID!) {
  pantries(homeId: $homeId) {
    edges {
      node {
        id
        homeId
        name
        isDefault
        createdAt
        updatedAt
        version
        tags
      }
    }
  }
}

query GetPantry(
  $id: ID!
  $itemsCursor: String
  $itemsFirst: Int = 25
  $storageLocationsCursor: String
  $storageLocationsFirst: Int = 50
) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
    itemsConnection(first: $itemsFirst, after: $itemsCursor) {
      edges {
        node {
          ...PantryItemDisplay
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
    storageLocationsConnection(
      first: $storageLocationsFirst
      after: $storageLocationsCursor
    ) {
      edges {
        node {
          id
          name
          type
          icon
          color
          temperature
          isDefault
          sortOrder
          parentLocation {
            id
            name
          }
          childLocations {
            id
            name
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    ...PantryItemFragment
  }
}

query GetDefaultPantry($homeId: ID!) {
  defaultPantry(homeId: $homeId) {
    id
    name
    isDefault
  }
}

query GetRecentlyDeletedPantryItems($pantryId: ID!, $limit: Int) {
  recentlyDeletedPantryItems(pantryId: $pantryId, limit: $limit) {
    id
    itemName
    itemId
    item {
      id
      name
      imageUrl
    }
    createdAt
  }
}

query GetPantryItemSuggestions(
  $pantryId: ID!
  $limit: Int = 10
  $sources: [PantrySuggestionSource!]
  $expirationDays: Int = 7
) {
  pantryItemSuggestions(
    pantryId: $pantryId
    limit: $limit
    sources: $sources
    expirationDays: $expirationDays
  ) {
    id
    itemId
    name
    imageUrl
    category
    source
    defaultUnitId
    defaultUnit {
      id
      name
      symbol
    }
    item {
      id
      imageUrl
      images
    }
    currentQuantity
    minQuantity
    restockQuantity
    daysUntilExpiry
    expiresAt
    lastQuantity
    lastUnitId
    frequencyCount
    popularityRank
    pantryItemId
  }
}

# ============================================
# ANALYTICS QUERIES
# ============================================

query GetPantryLedgerAnalytics(
  $pantryId: ID!
  $itemId: String
  $filter: AnalyticsFilters
  $granularity: PeriodGranularity
) {
  pantryLedgerAnalytics(
    pantryId: $pantryId
    itemId: $itemId
    filter: $filter
    granularity: $granularity
  ) {
    summary {
      totalAdded
      totalConsumed
      totalWasted
      netQuantity
      additionCount
      consumptionCount
      wasteCount
      unitName
      additionsByUnit {
        unitId
        unitName
        unitSymbol
        totalQuantity
        count
      }
      consumptionByUnit {
        unitId
        unitName
        unitSymbol
        totalQuantity
        count
      }
    }
    periodData {
      periodStart
      periodEnd
      periodLabel
      added
      consumed
      wasted
      net
      additionCost
    }
    costAnalytics {
      totalSpent
      averageCostPerUnit
      costByStore {
        storeId
        storeName
        totalSpent
        itemCount
        averageCostPerUnit
      }
    }
    topRestockedItems {
      itemId
      itemName
      totalQuantity
      count
      unitName
      imageUrl
    }
    periodStart
    periodEnd
    granularity
  }
}

query GetPantryItemLedger($pantryItemId: ID!, $filter: AnalyticsFilters) {
  pantryItemLedger(pantryItemId: $pantryItemId, filter: $filter) {
    totalAdded
    totalConsumed
    totalWasted
    netQuantity
    additionCount
    consumptionCount
    wasteCount
    unitName
    additionsByUnit {
      unitId
      unitName
      totalQuantity
    }
    consumptionByUnit {
      unitId
      unitName
      totalQuantity
    }
  }
}

query GetPantryUsageAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantryUsageAnalytics(pantryId: $pantryId, filter: $filter) {
    totalUsageCount
    totalQuantityUsed
    averageUsagePerDay
    periodStart
    periodEnd
    usageTrend {
      date
      value
      count
    }
    usageByPurpose {
      purpose
      totalQuantity
      count
      percentage
    }
    usageBySource {
      source
      totalQuantity
      count
      percentage
    }
    topUsedItems {
      itemId
      itemName
      totalQuantity
      count
      unitName
      imageUrl
    }
  }
}

query GetPantryWasteAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantryWasteAnalytics(pantryId: $pantryId, filter: $filter) {
    totalWasteCount
    totalWasteQuantity
    totalWasteValue
    wasteRate
    averageWastePerDay
    composted
    recycled
    periodStart
    periodEnd
    wasteTrend {
      date
      value
      count
    }
    wasteByReason {
      reason
      totalQuantity
      count
      percentage
      estimatedValue
    }
    topWastedItems {
      itemId
      itemName
      totalQuantity
      count
      estimatedValue
      unitName
      imageUrl
    }
  }
}

query GetPantryConsumptionRate(
  $pantryId: ID!
  $itemId: String
  $filter: AnalyticsFilters
) {
  pantryConsumptionRate(
    pantryId: $pantryId
    itemId: $itemId
    filter: $filter
  ) {
    itemId
    itemName
    averageDailyConsumption
    daysUntilEmpty
    dataPoints
    unitName
    periodStart
    periodEnd
  }
}

query GetPantryRestockingFrequency(
  $pantryId: ID!
  $itemId: String
  $filter: AnalyticsFilters
) {
  pantryRestockingFrequency(
    pantryId: $pantryId
    itemId: $itemId
    filter: $filter
  ) {
    itemId
    itemName
    averageDaysBetweenRestocks
    totalRestocks
    lastRestockedAt
    periodStart
    periodEnd
  }
}

query GetPantryExpirationRisk($pantryId: ID!, $daysThreshold: Int = 7) {
  pantryExpirationRisk(pantryId: $pantryId, daysThreshold: $daysThreshold) {
    totalAtRisk
    daysThreshold
    items {
      pantryItemId
      itemName
      quantity
      unitName
      expiresAt
      daysUntilExpiry
      condition
    }
  }
}

query GetPantryEffectiveUsageRate(
  $pantryId: ID!
  $itemId: String
  $filter: AnalyticsFilters
) {
  pantryEffectiveUsageRate(
    pantryId: $pantryId
    itemId: $itemId
    filter: $filter
  ) {
    itemId
    itemName
    effectiveRate
    totalConsumed
    totalWasted
    unitName
    periodStart
    periodEnd
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreatePantry($input: CreatePantryInput!) {
  createPantry(input: $input) {
    success
    message
    code
    pantry {
      id
      homeId
      name
      description
      isDefault
      location
      temperature
      tags
      metadata
      version
      createdAt
      updatedAt
    }
  }
}

mutation UpdatePantry($id: ID!, $input: UpdatePantryInput!) {
  updatePantry(id: $id, input: $input) {
    success
    message
    code
    pantry {
      id
      homeId
      name
      description
      isDefault
      location
      temperature
      tags
      metadata
      version
      createdAt
      updatedAt
    }
  }
}

mutation DeletePantry($id: ID!) {
  deletePantry(id: $id) {
    success
    message
    code
    pantry {
      id
      name
    }
  }
}

mutation SetDefaultPantry($id: ID!) {
  setDefaultPantry(id: $id) {
    success
    message
    code
    pantry {
      id
      name
      isDefault
      homeId
    }
  }
}

mutation CreatePantryItem($input: CreatePantryItemInput!) {
  createPantryItem(input: $input) {
    success
    message
    code
    pantryItem {
      ...PantryItemDisplay
    }
  }
}

mutation UpdatePantryItem($id: ID!, $input: UpdatePantryItemInput!) {
  updatePantryItem(id: $id, input: $input) {
    success
    message
    code
    pantryItem {
      ...PantryItemDisplay
    }
  }
}

mutation DeletePantryItem($id: ID!) {
  deletePantryItem(id: $id) {
    success
    message
    code
    pantryItem {
      id
    }
  }
}

mutation CreatePantryItemUsage($input: RecordPantryItemUsageInput!) {
  createPantryItemUsage(input: $input) {
    success
    message
    code
    pantryItemUsage {
      id
      quantityUsed
      usageUnitId
      usageUnit {
        id
        name
        symbol
      }
      usedAt
      purpose
      notes
      wasteReason
      isComposted
      isRecycled
