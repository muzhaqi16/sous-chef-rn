# ============================================
# QUERIES
# ============================================

query GetPantries($homeId: ID!) {
  pantries(homeId: $homeId) {
    id
    homeId
    name
    isDefault
    items {
      id
      itemName
      item {
        name
      }
    }
    createdAt
    updatedAt
    version
    tags
  }
}

query GetPantry($id: ID!) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
    items {
      id
      itemName
      item {
        name
      }
    }
  }
}

query GetPantryItems($pantryId: ID!) {
  pantryItems(pantryId: $pantryId) {
    ...PantryItemFragment
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    ...PantryItemFragment
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreatePantry($input: CreatePantryInput!) {
  createPantry(input: $input) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
  }
}

mutation UpdatePantry($id: ID!, $input: UpdatePantryInput!) {
  updatePantry(id: $id, input: $input) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
  }
}

mutation DeletePantry($id: ID!) {
  deletePantry(id: $id)
}

mutation CreatePantryItem($input: CreatePantryItemInput!) {
  createPantryItem(input: $input) {
    ...PantryItemFragment
  }
}

mutation UpdatePantryItem($id: ID!, $input: UpdatePantryItemInput!) {
  updatePantryItem(id: $id, input: $input) {
    ...PantryItemFragment
  }
}

mutation DeletePantryItem($id: ID!) {
  deletePantryItem(id: $id) {
    ...PantryItemFragment
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription PantryUpdated($id: ID!) {
  pantryUpdated(id: $id) {
    id
    homeId
    name
    description
    location
    temperature
    tags
    metadata
    version
    updatedAt
    home {
      id
      name
    }
  }
}

subscription PantryActivityAdded($pantryId: ID!) {
  pantryActivityAdded(pantryId: $pantryId) {
    id
    pantryId
    userId
    action
    description
    itemName
    quantity
    oldValue
    newValue
    metadata
    createdAt
    user {
      id
      email
      profile {
        displayName
      }
    }
  }
}

subscription PantryLowStockAlert($pantryId: ID!) {
  pantryLowStockAlert(pantryId: $pantryId) {
    id
    itemId
    itemName
    currentQuantity
    autoReorderPoint
    unitName
    item {
      id
      name
      imageUrl
    }
  }
}

subscription PantryExpiringItemsAlert($pantryId: ID!) {
  pantryExpiringItemsAlert(pantryId: $pantryId) {
    id
    itemId
    itemName
    expiresAt
    bestByDate
    currentQuantity
    unitName
    item {
      id
      name
      imageUrl
    }
  }
}

subscription PantryItemsChanged($pantryId: ID!) {
  pantryItemsChanged(pantryId: $pantryId) {
    pantryId
    item {
      id
      unit {
        id
        name
      }
      itemName
    }
    updatedFields
    mutation
    timestamp
    userId
  }
}

subscription PantryItemUsageChanged($pantryId: ID!) {
  pantryItemUsageChanged(pantryId: $pantryId) {
    mutation
    pantryId
    usage {
      id
      pantryItemId
      quantityUsed
      usedById
      usedAt
      purpose
      notes
    }
    previousValues {
      quantityUsed
      purpose
    }
    userId
    timestamp
  }
}

subscription PantryWasteAlert($pantryId: ID!) {
  pantryWasteAlert(pantryId: $pantryId) {
    pantryId
    item {
      id
      itemId
      itemName
      pantryId
      currentQuantity
      unit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
    }
    wasteAmount
    wasteReason
    wasteValue
    userId
    timestamp
  }
}
