}

mutation AdjustPantryItemQuantity($id: ID!, $input: AdjustPantryItemQuantityInput!) {
  adjustPantryItemQuantity(id: $id, input: $input) {
    success
    message
    code
    pantryItem {
      ...PantryItemDisplay
    }
  }
}

mutation CorrectPantryItemWeight($id: ID!, $input: CorrectPantryItemWeightInput!) {
  correctPantryItemWeight(id: $id, input: $input) {
    success
    message
    code
    pantryItem {
      ...PantryItemDisplay
    }
  }
}

mutation ConvertExpiredToWaste($pantryItemId: ID!) {
  convertExpiredToWaste(pantryItemId: $pantryItemId) {
    success
