# ============================================
# QUERIES
# ============================================

query GetPantries($homeId: ID!) {
  pantries(homeId: $homeId) {
    id
    homeId
    name
    isDefault
    createdAt
    updatedAt
    version
    tags
  }
}

query GetPantry(
  $id: ID!
  $itemsCursor: String
  $itemsFirst: Int = 25
  $storageLocationsCursor: String
  $storageLocationsFirst: Int = 50
) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
    itemsConnection(first: $itemsFirst, after: $itemsCursor) {
      edges {
        node {
          ...PantryItemDisplay
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
    storageLocationsConnection(
      first: $storageLocationsFirst
      after: $storageLocationsCursor
    ) {
      edges {
        node {
          id
          name
          type
          icon
          color
          temperature
          isDefault
          sortOrder
          parentLocation {
            id
            name
          }
          childLocations {
            id
            name
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    ...PantryItemFragment
  }
}

query GetDefaultPantry($homeId: ID!) {
  defaultPantry(homeId: $homeId) {
    id
    name
    isDefault
  }
}

query GetRecentlyDeletedPantryItems($pantryId: ID!, $limit: Int) {
  recentlyDeletedPantryItems(pantryId: $pantryId, limit: $limit) {
    id
    itemName
    itemId
    item {
      id
      name
      imageUrl
    }
    createdAt
  }
}

# ============================================
# ANALYTICS QUERIES
# ============================================

query GetPantryLedgerAnalytics(
  $pantryId: ID!
  $itemId: String
  $filter: AnalyticsFilterInput
  $granularity: PeriodGranularity
) {
  pantryLedgerAnalytics(
    pantryId: $pantryId
    itemId: $itemId
    filter: $filter
    granularity: $granularity
  ) {
    summary {
      totalAdded
      totalConsumed
      totalWasted
      netQuantity
      additionCount
      consumptionCount
      wasteCount
      unitName
      additionsByUnit {
        unitId
        unitName
        unitSymbol
        totalQuantity
        count
      }
      consumptionByUnit {
        unitId
        unitName
        unitSymbol
        totalQuantity
        count
      }
    }
    periodData {
      periodStart
      periodEnd
      periodLabel
      added
      consumed
      wasted
      net
      additionCost
    }
    costAnalytics {
      totalSpent
      averageCostPerUnit
      costByStore {
        storeId
        storeName
        totalSpent
        itemCount
        averageCostPerUnit
      }
    }
    topRestockedItems {
      itemId
      itemName
      totalQuantity
      count
      unitName
      imageUrl
    }
    periodStart
    periodEnd
    granularity
  }
}

query GetPantryItemLedger($pantryItemId: ID!, $filter: AnalyticsFilterInput) {
  pantryItemLedger(pantryItemId: $pantryItemId, filter: $filter) {
    totalAdded
    totalConsumed
    totalWasted
    netQuantity
    additionCount
    consumptionCount
    wasteCount
    unitName
    additionsByUnit {
      unitId
      unitName
      totalQuantity
    }
    consumptionByUnit {
      unitId
      unitName
      totalQuantity
    }
  }
}

query GetPantryUsageAnalytics($pantryId: ID!, $filter: AnalyticsFilterInput) {
  pantryUsageAnalytics(pantryId: $pantryId, filter: $filter) {
    totalUsageCount
    totalQuantityUsed
    averageUsagePerDay
    periodStart
    periodEnd
    usageTrend {
      date
      value
      count
    }
    usageByPurpose {
      purpose
      totalQuantity
      count
      percentage
    }
    usageBySource {
      source
      totalQuantity
      count
      percentage
    }
    topUsedItems {
      itemId
      itemName
      totalQuantity
      count
      unitName
      imageUrl
    }
  }
}

query GetPantryWasteAnalytics($pantryId: ID!, $filter: AnalyticsFilterInput) {
  pantryWasteAnalytics(pantryId: $pantryId, filter: $filter) {
    totalWasteCount
    totalWasteQuantity
    totalWasteValue
    wasteRate
    averageWastePerDay
    composted
    recycled
    periodStart
    periodEnd
    wasteTrend {
      date
      value
      count
    }
    wasteByReason {
      reason
      totalQuantity
      count
      percentage
      estimatedValue
    }
    topWastedItems {
      itemId
      itemName
      totalQuantity
      count
      estimatedValue
      unitName
      imageUrl
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreatePantry($input: CreatePantryInput!) {
  createPantry(input: $input) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
  }
}

mutation UpdatePantry($id: ID!, $input: UpdatePantryInput!) {
  updatePantry(id: $id, input: $input) {
    id
    homeId
    name
    description
    isDefault
    location
    temperature
    tags
    metadata
    version
    createdAt
    updatedAt
  }
}

mutation DeletePantry($id: ID!) {
  deletePantry(id: $id) {
    id
    name
  }
}

mutation SetDefaultPantry($pantryId: ID!) {
  setDefaultPantry(id: $pantryId) {
    id
    name
    isDefault
    homeId
  }
}

mutation CreatePantryItem($input: CreatePantryItemInput!) {
  createPantryItem(input: $input) {
    ...PantryItemDisplay
  }
}

mutation UpdatePantryItem($id: ID!, $input: UpdatePantryItemInput!) {
  updatePantryItem(id: $id, input: $input) {
    ...PantryItemCore
  }
}

mutation DeletePantryItem($id: ID!) {
  deletePantryItem(id: $id) {
    ...PantryItemFragment
  }
}

mutation CreatePantryItemUsage($input: RecordPantryItemUsageInput!) {
  createPantryItemUsage(input: $input) {
    id
    quantityUsed
    usageUnitId
    usageUnit {
      id
      name
      symbol
    }
    weightUsed
    weightUsedUnitId
    weightUsedUnit {
      id
      name
      symbol
    }
    usedAt
    purpose
    notes
    pantryItem {
      id
      currentQuantity
      packageWeight
      consumedQuantity
      ...PantryItemFragment
    }
    usedBy {
      id
      email
    }
  }
}

mutation RecordPantryItemWaste(
  $id: ID!
  $wasteAmount: Float!
  $wasteReason: WasteReason!
  $wasteUnitId: String
  $wasteWeight: Float
  $wasteWeightUnitId: String
  $isComposted: Boolean
  $isRecycled: Boolean
) {
  recordPantryItemWaste(
    id: $id
    wasteAmount: $wasteAmount
    wasteReason: $wasteReason
    wasteUnitId: $wasteUnitId
    wasteWeight: $wasteWeight
    wasteWeightUnitId: $wasteWeightUnitId
    isComposted: $isComposted
    isRecycled: $isRecycled
  ) {
    ...PantryItemFragment
  }
}

mutation RestockPantryItem($id: ID!, $input: RestockPantryItemInput!) {
  restockPantryItem(id: $id, input: $input) {
    id
    quantityUsed
    purpose
    costPerUnit
    totalCost
    pantryItem {
      ...PantryItemFragment
    }
  }
}

mutation UpdatePantryItemQuantity(
  $pantryItemId: ID!
  $quantity: String!
  $unitId: ID
  $version: Int
) {
  updatePantryItemQuantity(
    pantryItemId: $pantryItemId
    quantity: $quantity
    unitId: $unitId
    version: $version
  ) {
    ...PantryItemCore
  }
}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncPantryItem($clientId: ID!, $input: SyncPantryItemInput!) {
  syncPantryItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...PantryItemFragment
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
      }
    }
  }
}

mutation SyncDeletePantryItem($clientId: ID!, $version: Int) {
  syncDeletePantryItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription PantryUpdated($pantryId: ID!) {
  pantryUpdated(pantryId: $pantryId) {
    mutation
    node {
      id
      homeId
      name
      description
      location
      temperature
      tags
      metadata
      version
      updatedAt
    }
    updatedFields
    userId
    timestamp
  }
}

subscription PantryActivityAdded($pantryId: ID!) {
  pantryActivityAdded(pantryId: $pantryId) {
    id
    pantryId
    userId
    action
    description
    itemName
    quantity
    oldValue
    newValue
    metadata
    createdAt
    user {
      id
      email
      profile {
        displayName
      }
    }
  }
}

subscription PantryLowStockAlert($pantryId: ID!) {
  pantryLowStockAlert(pantryId: $pantryId) {
    pantryId
    currentQuantity
    minimumQuantity
    userId
    timestamp
    item {
      id
      itemId
      itemName
      unitName
      item {
        id
        name
        imageUrl
      }
    }
  }
}

subscription PantryExpiringItemsAlert($pantryId: ID!) {
  pantryExpiringItemsAlert(pantryId: $pantryId) {
    pantryId
    expiresAt
    daysUntilExpiration
    userId
    timestamp
    item {
      id
      itemId
      itemName
      unitName
      item {
        id
        name
        imageUrl
      }
    }
  }
}

subscription PantryItemsChanged($pantryId: ID!) {
  pantryItemsChanged(pantryId: $pantryId) {
    pantryId
    item {
      ...PantryItemDisplay
    }
    updatedFields
    mutation
    timestamp
    userId
  }
}

subscription PantryItemUsageChanged($pantryId: ID!) {
  pantryItemUsageChanged(pantryId: $pantryId) {
    mutation
    pantryId
    usage {
      id
      quantityUsed
      usedAt
      purpose
      notes
      pantryItem {
        id
      }
      usedBy {
        id
      }
    }
    userId
    timestamp
  }
}

subscription PantryWasteAlert($pantryId: ID!) {
  pantryWasteAlert(pantryId: $pantryId) {
    pantryId
    item {
      id
      itemId
      itemName
      pantryId
      currentQuantity
      unit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
    }
    wasteAmount
    wasteReason
    wasteValue
    userId
    timestamp
  }
}
