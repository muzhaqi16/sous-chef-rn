# ============================================
# QUERIES
# ============================================

query GetStorageLocations($homeId: ID!) {
  storageLocations(homeId: $homeId) {
    edges {
      node {
        id
        name
        type
        icon
        color
        temperature
        description
        isClimateControlled
        capacity
        capacityUnit
        sortOrder
        isDefault
        currentItemCount
        parentLocation {
          id
          name
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetStorageLocationTree($homeId: ID!) {
  storageLocationTree(homeId: $homeId) {
    id
    name
    type
    icon
    color
    sortOrder
    currentItemCount
    isDefault
    childLocations {
      id
      name
      type
      icon
      color
      sortOrder
      currentItemCount
      childLocations {
        id
        name
        type
        currentItemCount
      }
    }
  }
}

query GetStorageLocation($id: ID!) {
  storageLocation(id: $id) {
    id
    name
    type
    icon
    color
    temperature
    description
    isClimateControlled
    capacity
    capacityUnit
    sortOrder
    isDefault
    currentItemCount
    parentLocation {
      id
      name
    }
    childLocations {
      id
      name
      type
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateStorageLocation($input: CreateStorageLocationInput!) {
  createStorageLocation(input: $input) {
    success
    message
    code
    storageLocation {
      id
      name
      type
      icon
      color
      temperature
      description
      isClimateControlled
      capacity
      capacityUnit
      sortOrder
      isDefault
      currentItemCount
      homeId
      parentLocation {
        id
        name
      }
    }
  }
}

mutation UpdateStorageLocation($id: ID!, $input: UpdateStorageLocationInput!) {
  updateStorageLocation(id: $id, input: $input) {
    success
    message
    code
    storageLocation {
      id
      name
      type
      icon
      color
      temperature
      description
      isClimateControlled
      capacity
      capacityUnit
      sortOrder
      isDefault
      currentItemCount
      parentLocationId
    }
  }
}

mutation DeleteStorageLocation($id: ID!) {
  deleteStorageLocation(id: $id) {
    success
    message
    code
    storageLocation {
      id
    }
  }
}

mutation SetDefaultStorageLocation($id: ID!) {
  setDefaultStorageLocation(id: $id) {
    success
    message
    code
    storageLocation {
      id
      name
      isDefault
    }
  }
}
