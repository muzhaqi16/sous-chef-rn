# ============================================
# QUERIES
# ============================================

query GetStorageLocations($homeId: ID!) {
  storageLocations(homeId: $homeId) {
    edges {
      node {
        id
        name
        type
        icon
        color
        temperature
        description
        isClimateControlled
        capacity
        capacityUnit
        sortOrder
        isDefault
        currentItemCount
        parentLocation {
          id
          name
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetStorageLocationTree($homeId: ID!) {
  storageLocationTree(homeId: $homeId) {
    id
    name
    type
    icon
    color
    sortOrder
    currentItemCount
    isDefault
    childLocations {
      id
      name
      type
      icon
      color
      sortOrder
      currentItemCount
      childLocations {
        id
        name
        type
        currentItemCount
      }
    }
  }
}

query GetStorageLocation($id: ID!) {
  storageLocation(id: $id) {
    id
    name
    type
    icon
    color
    temperature
    description
    isClimateControlled
    capacity
    capacityUnit
    sortOrder
    isDefault
    currentItemCount
    parentLocation {
      id
      name
    }
    childLocations {
      id
      name
      type
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateStorageLocation($input: CreateStorageLocationInput!) {
  createStorageLocation(input: $input) {
    __typename
    ... on CreateStorageLocationPayload {
      storageLocation {
        id
        name
        type
        icon
        color
        temperature
        description
        isClimateControlled
        capacity
        capacityUnit
        sortOrder
        isDefault
        currentItemCount
        homeId
        parentLocation {
          id
          name
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateStorageLocation($input: UpdateStorageLocationInput!) {
  updateStorageLocation(input: $input) {
    __typename
    ... on UpdateStorageLocationPayload {
      storageLocation {
        id
        name
        type
        icon
        color
        temperature
        description
        isClimateControlled
        capacity
        capacityUnit
        sortOrder
        isDefault
        currentItemCount
        parentLocationId
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteStorageLocation($input: DeleteStorageLocationInput!) {
  deleteStorageLocation(input: $input) {
    __typename
    ... on DeleteStorageLocationPayload {
      storageLocation {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation MarkStorageLocationAsDefault($input: MarkStorageLocationAsDefaultInput!) {
  markStorageLocationAsDefault(input: $input) {
    __typename
    ... on MarkStorageLocationAsDefaultPayload {
      storageLocation {
        id
        name
        isDefault
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}
