# Stores by name or address: useStoreSearch, for every store field and the
# store picker. The chain offers "any" of its stores.
query SearchStores($search: String!, $limit: Int) {
  stores(filters: { search: $search }, first: $limit) {
    edges {
      node {
        id
        name
        address
        # Read with the address where a picked store's branch is shown.
        storeNumber
        chain {
          id
          name
        }
      }
    }
    totalCount
  }
}

# Warm the store autocomplete cache for offline use (API caps `first` at 100 per
# page). Reference data preloaded by useDataPreloading while online.
query GetStores($first: Int = 100) {
  stores(first: $first) {
    edges {
      node {
        id
        name
        address
        storeNumber
      }
    }
  }
}
