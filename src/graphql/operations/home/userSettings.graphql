mutation MarkHomeAsDefault($input: SetDefaultHomeInput!) {
  markHomeAsDefault(input: $input) {
    __typename
    ... on SetDefaultHomePayload {
      settings {
        id
      }
      defaultPantry {
        id
        name
        isDefault
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
