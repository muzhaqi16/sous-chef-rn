mutation SetDefaultHome($homeId: ID!) {
  setDefaultHome(homeId: $homeId) {
    __typename
    ... on SetDefaultHomeSuccess {
      settings {
        id
      }
      defaultPantry {
        id
        name
        isDefault
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
