mutation MarkHomeAsDefault(
  $input: MarkHomeAsDefaultInput!
  $today: LocalDate!
) {
  markHomeAsDefault(input: $input) {
    __typename
    ... on MarkHomeAsDefaultPayload {
      settings {
        id
        ...UserSettingsReaders
      }
      defaultPantry {
        id
        ...PantryReaders
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
