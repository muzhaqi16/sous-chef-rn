# ============================================
# SUBSCRIPTIONS
# ============================================

subscription MembershipUpdated($homeId: ID) {
  membershipUpdated(homeId: $homeId) {
    mutation
    node {
      id
      homeId
      userId
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
      lastActiveAt
      joinedAt
      home {
        id
        name
        type
      }
      user {
        id
        email
        profile {
          displayName
          avatar
        }
      }
    }
    updatedFields
    userId
  }
}

subscription MemberJoined($homeId: ID!) {
  memberJoined(homeId: $homeId) {
    mutation
    node {
      id
      homeId
      userId
      user {
        id
        profile {
          displayName
        }
      }
    }
    updatedFields
    userId
  }
}

subscription MemberLeft($homeId: ID!) {
  memberLeft(homeId: $homeId) {
    mutation
    node {
      id
      homeId
      userId
      role
      status
      displayName
      user {
        id
        profile {
          displayName
          avatar
        }
      }
    }
