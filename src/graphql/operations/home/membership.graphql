# ============================================
# SUBSCRIPTIONS
# ============================================

subscription MembershipChanges($homeId: ID!) {
  membershipChanged(homeId: $homeId) {
    changeType
    homeId
    membership {
      id
      homeId
      userId
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
      lastActiveAt
      joinedAt
      home {
        id
        name
        type
      }
      user {
        id
        email
        profile {
          displayName
          avatar
        }
      }
    }
    previousRole
    newRole
    userId
    timestamp
  }
}
