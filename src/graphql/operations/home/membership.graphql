}

subscription MembershipRoleChanged($homeId: ID!) {
  membershipRoleChanged(homeId: $homeId) {
    membership {
      id
      homeId
      userId
      role
      user {
        id
        email
        profile {
          displayName
        }
      }
    }
    homeId
    userId
    previousRole
    newRole
    changedBy
  }
}
