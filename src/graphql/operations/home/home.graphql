# ============================================
# QUERIES
# ============================================

query GetHome($homeId: ID!) {
  home(id: $homeId) {
    ...HomeFragment
  }
}

query GetHomeBasic($homeId: ID!) {
  home(id: $homeId) {
    ...HomeWithPantriesFragment
  }
}

query GetHomes {
  homes {
    id
    name
    createdAt
    updatedAt
    pantries {
      id
      name
      isDefault
    }
    members {
      id
      homeId
      userId
      role
      status
      displayName
      user {
        ...PartialUser
      }
    }
    myMembership {
      id
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
    }
  }
}

query GetHomeInvites($homeId: ID!) {
  homeInvites(homeId: $homeId) {
    ...HomeInviteFragment
  }
}

query GetMyPendingInvites {
  myPendingInvites {
    ...HomeInviteFragment
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateHome($input: CreateHomeInput!) {
  createHome(input: $input) {
    id
    name
    type
    description
    timezone
    currency
    isPublic
    joinCode
    allowJoinCode
    maxMembers
    tags
    metadata
    version
    createdAt
    updatedAt

    invites {
      ...HomeInviteFragment
    }

    members {
      ...MemberShipFragment
    }

    myMembership {
      ...MemberShipFragment
    }

    membershipStats {
      total
      active
      byRole {
        OWNER
        ADMIN
        MEMBER
        GUEST
      }
      byStatus {
        ACTIVE
        SUSPENDED
        LEFT
        REMOVED
      }
      recentlyActive
    }

    # Use simplified pantry structure without items
    pantries {
      id
      homeId
      name
      description
      isDefault
      location
      temperature
      tags
      metadata
      version
      createdAt
      updatedAt
    }
  }
}

mutation UpdateHome($id: ID!, $input: UpdateHomeInput!) {
  updateHome(id: $id, input: $input) {
    ...HomeFragment
  }
}

mutation DeleteHome($id: ID!) {
  deleteHome(id: $id) {
    ...HomeFragment
  }
}

mutation InviteToHome($input: InviteToHomeInput!) {
  inviteToHome(input: $input) {
    ...HomeInviteFragment
  }
}

mutation AcceptHomeInvite($token: String!) {
  acceptHomeInvite(token: $token) {
    id
    homeId
    userId
    role
    status
    displayName
    canViewPantry
    canEditPantry
    canAddItems
    canRemoveItems
    canInviteOthers
    canManageHome
    lastActiveAt
    joinedAt
    leftAt
    createdAt
    updatedAt
  }
}

mutation DeclineHomeInvite($token: String!) {
  declineHomeInvite(token: $token)
}
