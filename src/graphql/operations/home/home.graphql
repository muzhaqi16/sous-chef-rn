# ============================================
# QUERIES
# ============================================

query GetHome($homeId: ID!) {
  home(id: $homeId) {
    ...HomeFragment
  }
}

query GetHomeBasic($homeId: ID!) {
  home(id: $homeId) {
    ...HomeWithPantriesFragment
  }
}

query GetHomes {
  homes {
    id
    name
    createdAt
    updatedAt
    pantries {
      id
      name
      isDefault
    }
    members {
      id
      homeId
      userId
      role
      status
      displayName
      user {
        ...PartialUser
      }
    }
    myMembership {
      id
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
    }
  }
}

query GetHomeInvites($homeId: ID!) {
  homeInvites(homeId: $homeId) {
    ...HomeInviteFragment
  }
}

query GetMyPendingInvites {
  myPendingInvites {
    ...HomeInviteFragment
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateHome($input: CreateHomeInput!) {
  createHome(input: $input) {
    id
    name
    createdAt
    updatedAt
    pantries {
      id
      name
      isDefault
    }
    members {
      id
      homeId
      userId
      role
      status
      displayName
      user {
        ...PartialUser
      }
    }
    myMembership {
      id
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
    }
  }
}

mutation UpdateHome($id: ID!, $input: UpdateHomeInput!) {
  updateHome(id: $id, input: $input) {
    ...HomeFragment
  }
}

mutation DeleteHome($id: ID!) {
  deleteHome(id: $id) {
    ...HomeFragment
  }
}

mutation InviteToHome($input: InviteToHomeInput!) {
  inviteToHome(input: $input) {
    ...HomeInviteFragment
  }
}

mutation AcceptHomeInvite($token: String!) {
  acceptHomeInvite(token: $token) {
    id
    homeId
    userId
    role
    status
    displayName
    canViewPantry
    canEditPantry
    canAddItems
    canRemoveItems
    canInviteOthers
    canManageHome
    lastActiveAt
    joinedAt
    leftAt
    createdAt
    updatedAt
  }
}

mutation DeclineHomeInvite($token: String!) {
  declineHomeInvite(token: $token)
}

mutation UpdateMembership($id: ID!, $input: UpdateMembershipInput!) {
  updateMembership(id: $id, input: $input) {
    id
    homeId
    userId
    role
    status
    displayName
    canViewPantry
    canEditPantry
    canAddItems
    canRemoveItems
    canInviteOthers
    canManageHome
    lastActiveAt
    joinedAt
    leftAt
    createdAt
    updatedAt
  }
}

mutation RemoveMember($membershipId: ID!) {
  removeMember(membershipId: $membershipId)
}

mutation RevokeHomeInvite($id: ID!) {
  revokeHomeInvite(id: $id)
}
