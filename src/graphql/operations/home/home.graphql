# ============================================
# QUERIES
# ============================================

query GetHome($homeId: ID!) {
  home(id: $homeId) {
    # Direct selection for the default-pantry lookup (getDefaultPantry); the
    # rest of the detail fields live in the masked HomeDetailScreen_home spread.
    id
    pantriesConnection(first: 20) {
      edges {
        node {
          id
          isDefault
        }
      }
    }
    ...HomeDetailScreen_home
  }
}

query GetHomes($first: Int, $after: String) {
  homes(first: $first, after: $after) {
    edges {
      cursor
      node {
        # Direct selections cover what `HomeManagement` + hooks read off each
        # node (id, default flag, default-pantry lookup, membership perms).
        # Leaf rendering lives in the masked `HomeCard_home` spread.
        id
        name
        isDefault
        version
        myMembership {
          id
          role
          canManageHome
          canViewPantry
          canEditPantry
          canAddItems
          canRemoveItems
          canInviteOthers
        }
        pantriesConnection(first: 10) {
          edges {
            node {
              id
              name
              isDefault
            }
          }
          totalCount
        }
        membersConnection(first: 5) {
          totalCount
        }
        ...HomeCard_home
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMyPendingInvites {
  me {
    id
    pendingHomeInvitesConnection {
      edges {
        node {
          id
          role
          ...InviteCard_invite
        }
      }
    }
  }
}

query GetHomeByJoinCode($joinCode: String!) {
  homeByJoinCode(joinCode: $joinCode) {
    id
    name
    isDefault
    membersConnection(first: 10) {
      totalCount
    }
    pantriesConnection(first: 20) {
      edges {
        node {
          id
          name
          isDefault
        }
      }
      totalCount
    }
  }
}

