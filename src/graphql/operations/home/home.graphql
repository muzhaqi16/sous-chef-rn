# ============================================
# QUERIES
# ============================================

query GetHome($homeId: ID!) {
  home(id: $homeId) {
    ...HomeDetailScreen_home
  }
}

query GetHomes($first: Int, $after: String) {
  homes(first: $first, after: $after) {
    edges {
      cursor
      node {
        # Direct selections cover what `HomeManagement` + hooks read off each
        # node (id, default flag, default-pantry lookup, membership perms).
        # Leaf rendering lives in the masked `HomeCard_home` spread.
        id
        name
        isDefault
        version
        myMembership {
          id
          role
          canManageHome
          canViewPantry
          canEditPantry
          canAddItems
          canRemoveItems
          canInviteOthers
        }
        pantriesConnection(first: 10) {
          edges {
            node {
              id
              name
              isDefault
            }
          }
          totalCount
        }
        membersConnection(first: 5) {
          totalCount
        }
        ...HomeCard_home
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMyPendingInvites {
  me {
    id
    pendingHomeInvites {
      id
      role
      ...InviteCard_invite
    }
  }
}

query GetHomeByJoinCode($joinCode: String!) {
  homeByJoinCode(joinCode: $joinCode) {
    id
    name
    isDefault
    membersConnection(first: 10) {
      totalCount
    }
    pantriesConnection(first: 20) {
      edges {
        node {
          id
          name
          isDefault
        }
      }
      totalCount
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateHome($input: CreateHomeInput!) {
  createHome(input: $input) {
    __typename
    ... on CreateHomeSuccess {
      home {
        id
        name
        isDefault
        version
        myMembership {
          id
          role
          canManageHome
          canViewPantry
          canEditPantry
          canAddItems
          canRemoveItems
          canInviteOthers
        }
        pantriesConnection(first: 10) {
          edges {
            node {
              id
              name
              isDefault
            }
          }
          totalCount
        }
        ...HomeCard_home
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateHome($input: UpdateHomeInput!) {
  updateHome(input: $input) {
    __typename
    ... on UpdateHomeSuccess {
      home {
        id
        name
        allowJoinCode
        joinCode
        version
        updatedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteHome($id: ID!) {
  deleteHome(id: $id) {
    __typename
    ... on DeleteHomeSuccess {
      home {
        id
        name
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation InviteToHome($input: InviteToHomeInput!) {
  inviteToHome(input: $input) {
    __typename
    ... on InviteToHomeSuccess {
      homeInvite {
        ...InviteCard_invite
        ...HomeInviteCard_invite
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation AcceptHomeInvite($token: String!) {
  acceptHomeInvite(token: $token) {
    __typename
    ... on AcceptHomeInviteSuccess {
      membership {
        id
        homeId
        home {
          id
          name
          isDefault
          version
          myMembership {
            id
            role
            canManageHome
            canViewPantry
            canEditPantry
            canAddItems
            canRemoveItems
            canInviteOthers
          }
          pantriesConnection(first: 10) {
            edges {
              node {
                id
                name
                isDefault
              }
            }
            totalCount
          }
          membersConnection(first: 5) {
            totalCount
          }
          ...HomeCard_home
        }
        ...HomeMemberCard_member
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeclineHomeInvite($token: String!) {
  declineHomeInvite(token: $token) {
    __typename
    ... on DeclineHomeInviteSuccess {
      homeInvite {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation UpdateMembership($input: UpdateMembershipInput!) {
  updateMembership(input: $input) {
    __typename
    ... on UpdateMembershipSuccess {
      membership {
        id
        ...HomeMemberCard_member
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation RemoveMember($id: ID!) {
  removeMember(membershipId: $id) {
    __typename
    ... on RemoveMemberSuccess {
      membership {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation RevokeHomeInvite($id: ID!) {
  revokeHomeInvite(id: $id) {
    __typename
    ... on RevokeHomeInviteSuccess {
      homeInvite {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation JoinHomeByCode($joinCode: String!) {
  joinHomeByCode(joinCode: $joinCode) {
    __typename
    ... on JoinHomeByCodeSuccess {
      membership {
        id
        homeId
        ...HomeMemberCard_member
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation LeaveHome($homeId: ID!) {
  leaveHome(homeId: $homeId) {
    __typename
    ... on LeaveHomeSuccess {
      membership {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription HomeInviteChanged($homeId: ID!) {
  homeInviteChanged(homeId: $homeId) {
    mutation
    homeId
    homeInvite {
      id
      ...InviteCard_invite
      ...HomeInviteCard_invite
    }
    userId
    timestamp
  }
}
