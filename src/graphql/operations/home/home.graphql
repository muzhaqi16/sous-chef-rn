# ============================================
# SUBSCRIPTIONS
# ============================================

# Consolidated home-domain stream. One subscription carries both membership
# changes (MEMBERSHIP_*) and invite lifecycle (INVITE_*), discriminated by
# `subtype`, replacing the former membershipChanged + homeInviteChanged
# subscriptions. Keeps the per-user concurrent-subscription count low (the
# server caps it cluster-wide).
#
# Thin event: the envelope plus the identity of what changed. Subscription
# documents are validated against depth 5 / cost 500 rather than the HTTP
# limits, because the server re-executes the document on every published event
# for the life of the connection. An inline fragment counts as a depth level
# (graphql-armor counts unflattened), so `node { ... on X { id } }` is already
# depth 4 and a fragment spread inside a branch cannot fit.
#
# A membership or invite change is a connection change, which no single entity
# read can express — so the handler removes by id where the id is enough and
# otherwise refetches `GetHome` / `GetMyPendingInvites` over HTTP.
# See `__tests__/graphql/documentLimits.test.ts` for the enforced bound.
subscription HomeEvents($homeId: ID!) {
  homeEvents(homeId: $homeId) {
    subtype
    mutation
    homeId
    # The device that made the change — the server echoes back the
    # `x-device-id` the mutation carried. Suppressing on this rather than on
    # `actorUserId` is what lets the same user's second device keep updating.
    originatorClientId
    actorUserId
    previousRole
    newRole
    updatedFields
    timestamp
    node {
      __typename
      ... on Membership {
        version
        id
      }
      ... on HomeInvite {
        version
        id
      }
    }
  }
}
