# The response exists to normalize the role flip, not to repaint the screen —
# the caller reads nothing off it, and the detail screen reads Home through its
# own query. Spreading `HomeDetailScreen_home` here cost 4885 against the HTTP
# budget of 3000: its three `first: 20` connections multiply their subtrees, and
# a mutation payload adds two more levels on top, each worth another 1.5×. So
# the server refused every transfer. Select the memberships whose role actually
# moved and let the rest stay as the query left it.
mutation TransferHomeOwnership($input: TransferHomeOwnershipInput!) {
  transferHomeOwnership(input: $input) {
    __typename
    ... on TransferHomeOwnershipPayload {
      home {
        id
        ...HomeReaders
        membersConnection(first: 20) {
          edges {
            node {
              id
              ...MembershipReaders
            }
          }
          totalCount
          pageInfo {
            hasNextPage
            endCursor
          }
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

