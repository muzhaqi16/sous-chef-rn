# ============================================
# QUERIES
# ============================================

query GetHome($homeId: ID!) {
  home(id: $homeId) {
    ...HomeDetailScreen_home
  }
}

query GetHomes($first: Int, $after: String) {
  homes(first: $first, after: $after) {
    edges {
      cursor
      node {
        # Direct selections cover what `HomeManagement` + hooks read off each
        # node (id, default flag, default-pantry lookup, membership perms).
        # Leaf rendering lives in the masked `HomeCard_home` spread.
        id
        name
        isDefault
        version
        myMembership {
          id
          role
          canManageHome
          canViewPantry
          canEditPantry
          canAddItems
          canRemoveItems
          canInviteOthers
        }
        pantriesConnection(first: 10) {
          edges {
            node {
              id
              name
              isDefault
            }
          }
          totalCount
        }
        membersConnection(first: 5) {
          totalCount
        }
        ...HomeCard_home
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMyPendingInvites {
  me {
    id
    pendingHomeInvites {
      id
      role
      ...InviteCard_invite
    }
  }
}

query GetHomeByJoinCode($joinCode: String!) {
  homeByJoinCode(joinCode: $joinCode) {
    id
    name
    isDefault
    membersConnection(first: 10) {
      totalCount
    }
    pantriesConnection(first: 20) {
      edges {
        node {
          id
          name
          isDefault
        }
      }
      totalCount
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateHome($input: CreateHomeInput!) {
  createHome(input: $input) {
    success
    message
    code
    home {
      id
      name
      isDefault
      version
      myMembership {
        id
        role
        canManageHome
        canViewPantry
        canEditPantry
        canAddItems
        canRemoveItems
        canInviteOthers
      }
      pantriesConnection(first: 10) {
        edges {
          node {
            id
            name
            isDefault
          }
        }
        totalCount
      }
      ...HomeCard_home
    }
  }
}

mutation UpdateHome($id: ID!, $input: UpdateHomeInput!) {
  updateHome(id: $id, input: $input) {
    success
    message
    code
    home {
      id
      name
      allowJoinCode
      joinCode
      version
      updatedAt
    }
  }
}

mutation DeleteHome($id: ID!) {
  deleteHome(id: $id) {
    success
    message
    code
    home {
      id
      name
    }
  }
}

mutation InviteToHome($input: InviteToHomeInput!) {
  inviteToHome(input: $input) {
    success
    message
    code
    homeInvite {
      ...InviteCard_invite
      ...HomeInviteCard_invite
    }
  }
}

mutation AcceptHomeInvite($token: String!) {
  acceptHomeInvite(token: $token) {
    success
    message
    code
    membership {
      id
      homeId
      home {
        id
        name
        isDefault
        version
        myMembership {
          id
          role
          canManageHome
          canViewPantry
          canEditPantry
          canAddItems
          canRemoveItems
          canInviteOthers
        }
        pantriesConnection(first: 10) {
          edges {
            node {
              id
              name
              isDefault
            }
          }
          totalCount
        }
        membersConnection(first: 5) {
          totalCount
        }
        ...HomeCard_home
      }
      ...HomeMemberCard_member
    }
  }
}

mutation DeclineHomeInvite($token: String!) {
  declineHomeInvite(token: $token) {
    success
    message
    code
    homeInvite {
      id
    }
  }
}

mutation UpdateMembership($id: ID!, $input: UpdateMembershipInput!) {
  updateMembership(id: $id, input: $input) {
    success
    message
    code
    membership {
      id
      ...HomeMemberCard_member
    }
  }
}

mutation RemoveMember($id: ID!) {
  removeMember(membershipId: $id) {
    success
    message
    code
    membership {
      id
    }
  }
}

mutation RevokeHomeInvite($id: ID!) {
  revokeHomeInvite(id: $id) {
    success
    message
    code
    homeInvite {
      id
    }
  }
}

mutation JoinHomeByCode($joinCode: String!) {
  joinHomeByCode(joinCode: $joinCode) {
    success
    message
    code
    membership {
      id
      homeId
      ...HomeMemberCard_member
    }
  }
}

mutation LeaveHome($homeId: ID!) {
  leaveHome(homeId: $homeId) {
    success
    message
    code
    membership {
      id
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription HomeInviteChanged($homeId: ID!) {
  homeInviteChanged(homeId: $homeId) {
    mutation
    homeId
    homeInvite {
      id
      ...InviteCard_invite
      ...HomeInviteCard_invite
    }
    userId
    timestamp
  }
}
