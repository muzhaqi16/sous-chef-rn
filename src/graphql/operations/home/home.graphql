# ============================================
# QUERIES
# ============================================

query GetHomes($first: Int, $after: String) {
  homes(first: $first, after: $after) {
    edges {
      cursor
      node {
        # Direct selections cover what `HomeManagement` + hooks read off each
        # node (id, default flag, default-pantry lookup, membership perms).
        # `home_listed` is what a listed home's card shows; each card reads its
        # own fragment of it by id.
        id
        name
        isDefault
        version
        myMembership {
          version
          id
          role
          canManageHome
          canViewPantry
          canEditPantry
          canAddItems
          canRemoveItems
          canInviteOthers
        }
        pantriesConnection(first: 10) {
          edges {
            node {
              version
              id
              name
              isDefault
            }
          }
          totalCount
          pageInfo {
            hasNextPage
            endCursor
          }
        }
        membersConnection(first: 5) {
          totalCount
        }
        ...home_listed
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Resolve an anyone-with-link code (home join code OR list share code) without
# knowing its type: the pre-join preview, served logged out too (`@optionalAuth`).
query ResolveShareLink($code: String!) {
  resolveShareLink(code: $code) {
    targetType
    homeId
    listId
    name
    alreadyMember
    memberCount
    itemCount
    link {
      universal
      scheme
    }
  }
}

