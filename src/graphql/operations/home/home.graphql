mutation CreateHome($input: CreateHomeInput!) {
  createHome(input: $input) {
    __typename
    ... on CreateHomePayload {
      home {
        id
        name
        isDefault
        version
        myMembership {
          id
          role
          canManageHome
          canViewPantry
          canEditPantry
          canAddItems
          canRemoveItems
          canInviteOthers
        }
        pantriesConnection(first: 10) {
          edges {
            node {
              id
              name
              isDefault
            }
          }
          totalCount
        }
        ...HomeCard_home
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

