# ============================================
# QUERIES
# ============================================

query GetHome($homeId: ID!) {
  home(id: $homeId) {
    ...HomeFragment
  }
}

query GetHomeBasic($homeId: ID!) {
  home(id: $homeId) {
    ...HomeWithPantriesFragment
  }
}

query GetHomes($pagination: PaginationInput) {
  homes(pagination: $pagination) {
    edges {
      cursor
      node {
        ...HomeDisplay
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMyPendingInvites {
  myPendingInvites {
    ...HomeInviteFragment
  }
}

query GetHomeByJoinCode($joinCode: String!) {
  homeByJoinCode(joinCode: $joinCode) {
    ...HomeFragment
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateHome($input: CreateHomeInput!) {
  createHome(input: $input) {
    success
    message
    code
    home {
      ...HomeFragment
    }
  }
}

mutation UpdateHome($id: ID!, $input: UpdateHomeInput!) {
  updateHome(id: $id, input: $input) {
    success
    message
    code
    home {
      ...HomeFragment
    }
  }
}

mutation DeleteHome($id: ID!) {
  deleteHome(id: $id) {
    success
    message
    code
    home {
      id
      name
    }
  }
}

mutation InviteToHome($input: InviteToHomeInput!) {
  inviteToHome(input: $input) {
    success
    message
    code
    homeInvite {
      ...HomeInviteFragment
    }
  }
}

mutation AcceptHomeInvite($token: String!) {
  acceptHomeInvite(token: $token) {
    success
    message
    code
    membership {
      id
      homeId
      userId
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
      lastActiveAt
      joinedAt
      leftAt
      createdAt
      updatedAt
    }
  }
}

mutation DeclineHomeInvite($token: String!) {
  declineHomeInvite(token: $token) {
    success
    message
    code
  }
}

mutation UpdateMembership($id: ID!, $input: UpdateMembershipInput!) {
  updateMembership(id: $id, input: $input) {
    success
    message
    code
    membership {
      id
      homeId
      userId
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
      lastActiveAt
      joinedAt
      leftAt
      createdAt
      updatedAt
    }
  }
}

mutation RemoveMember($id: ID!) {
  removeMember(membershipId: $id) {
    success
    message
    code
  }
}

mutation RevokeHomeInvite($id: ID!) {
  revokeHomeInvite(id: $id) {
    success
    message
    code
  }
}

mutation JoinHomeByCode($joinCode: String!) {
  joinHomeByCode(joinCode: $joinCode) {
    success
    message
    code
    membership {
      id
      homeId
      userId
      role
      status
      displayName
      canViewPantry
      canEditPantry
      canAddItems
      canRemoveItems
      canInviteOthers
      canManageHome
      lastActiveAt
      joinedAt
      leftAt
      createdAt
      updatedAt
    }
  }
}

mutation LeaveHome($homeId: ID!) {
  leaveHome(homeId: $homeId) {
    success
    message
    code
  }
}
