# ============================================
# QUERIES
# ============================================

query GetNotificationPreferences {
  me {
    id
    notificationPreferences {
      id
      userId
      emailEnabled
      pushEnabled
      smsEnabled
      expirationNotifications
      expirationNotificationFrequency
      expirationDaysThreshold
      lowStockAlerts
      shoppingListUpdates
      pantryChanges
      recipeRecommendations
      mealPlanReminders
      cookingReminders
      collaborationInvites
      homeInvites
      sharedListUpdates
      weeklyDigest
      monthlyReport
      quietHoursEnabled
      quietHoursStart
      quietHoursEnd
      quietHoursTimezone
    }
  }
}

query GetDietaryProfile {
  me {
    id
    dietaryProfile {
      id
      userId
      preferredCuisines
      dislikedIngredients
      favoriteIngredients
      calorieTarget
      proteinTarget
      carbsTarget
      fatTarget
      mealsPerDay
      snacksPerDay
      cookingSkillLevel
      maxPrepTimeMinutes
      maxCookTimeMinutes
      budgetPerMeal
      createdAt
      updatedAt
      restrictions {
        id
        diet
        intolerance
        healthGoal
        severity
        notes
        appliesToHomeId
        createdAt
      }
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation UpdateNotificationPreferences($input: UpdateNotificationPreferencesInput!) {
  updateNotificationPreferences(input: $input) {
    success
    message
    code
    notificationPreferences {
      id
      userId
      emailEnabled
      pushEnabled
      smsEnabled
      expirationNotifications
      expirationNotificationFrequency
      expirationDaysThreshold
      lowStockAlerts
      shoppingListUpdates
      pantryChanges
      recipeRecommendations
      mealPlanReminders
      cookingReminders
      collaborationInvites
      homeInvites
      sharedListUpdates
      weeklyDigest
      monthlyReport
      quietHoursEnabled
      quietHoursStart
      quietHoursEnd
      quietHoursTimezone
    }
  }
}

mutation UpdateDietaryProfile($input: UpdateDietaryProfileInput!) {
  updateDietaryProfile(input: $input) {
    success
    message
    code
    dietaryProfile {
      id
      userId
      preferredCuisines
      dislikedIngredients
      favoriteIngredients
      calorieTarget
      proteinTarget
      carbsTarget
      fatTarget
      mealsPerDay
      snacksPerDay
      cookingSkillLevel
      maxPrepTimeMinutes
      maxCookTimeMinutes
      budgetPerMeal
      createdAt
      updatedAt
      restrictions {
        id
        diet
        intolerance
        healthGoal
        severity
        notes
        appliesToHomeId
        createdAt
      }
    }
  }
}

mutation AddDietaryRestriction($input: AddRestrictionInput!) {
  addRestriction(input: $input) {
    success
    message
    code
    dietaryRestriction {
      id
      diet
      intolerance
      healthGoal
      severity
      notes
      appliesToHomeId
      createdAt
    }
  }
}

mutation UpdateDietaryRestriction($input: UpdateRestrictionInput!) {
  updateRestriction(input: $input) {
    success
    message
    code
    dietaryRestriction {
      id
      diet
      intolerance
      healthGoal
      severity
      notes
      appliesToHomeId
