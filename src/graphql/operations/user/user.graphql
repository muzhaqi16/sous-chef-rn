# ============================================
# QUERIES
# ============================================

query GetNotificationPreferences {
  me {
    id
    notificationPreferences {
      id
      userId
      emailEnabled
      pushEnabled
      smsEnabled
      expirationNotifications
      expirationNotificationFrequency
      expirationDaysThreshold
      lowStockAlerts
      shoppingListUpdates
      pantryChanges
      recipeRecommendations
      mealPlanReminders
      cookingReminders
      collaborationInvites
      homeInvites
      sharedListUpdates
      weeklyDigest
      monthlyReport
      quietHoursEnabled
      quietHoursStart
      quietHoursEnd
      quietHoursTimezone
    }
  }
}

query GetDietaryProfile {
  me {
    id
    dietaryProfile {
      id
      userId
      preferredCuisines
      dislikedIngredients
      favoriteIngredients
      calorieTarget
      proteinTarget
      carbsTarget
      fatTarget
      mealsPerDay
      snacksPerDay
      cookingSkillLevel
      maxPrepTimeMinutes
      maxCookTimeMinutes
      budgetPerMeal
      createdAt
      updatedAt
      restrictions {
        id
        diet
        intolerance
        healthGoal
        severity
        notes
        appliesToHomeId
        createdAt
      }
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation UpdateNotificationPreferences($input: UpdateNotificationPreferencesInput!) {
  updateNotificationPreferences(input: $input) {
    __typename
    ... on UpdateNotificationPreferencesSuccess {
      notificationPreferences {
        id
        userId
        emailEnabled
        pushEnabled
        smsEnabled
        expirationNotifications
        expirationNotificationFrequency
        expirationDaysThreshold
        lowStockAlerts
        shoppingListUpdates
        pantryChanges
        recipeRecommendations
        mealPlanReminders
        cookingReminders
        collaborationInvites
        homeInvites
        sharedListUpdates
        weeklyDigest
        monthlyReport
        quietHoursEnabled
        quietHoursStart
        quietHoursEnd
        quietHoursTimezone
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateDietaryProfile($input: UpdateDietaryProfileInput!) {
  updateDietaryProfile(input: $input) {
    __typename
    ... on UpdateDietaryProfileSuccess {
      dietaryProfile {
        id
        userId
        preferredCuisines
        dislikedIngredients
        favoriteIngredients
        calorieTarget
        proteinTarget
        carbsTarget
        fatTarget
        mealsPerDay
        snacksPerDay
        cookingSkillLevel
        maxPrepTimeMinutes
        maxCookTimeMinutes
        budgetPerMeal
        createdAt
        updatedAt
        restrictions {
          id
          diet
          intolerance
          healthGoal
          severity
          notes
          appliesToHomeId
          createdAt
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation AddDietaryRestriction($input: AddRestrictionInput!) {
  addRestriction(input: $input) {
    __typename
    ... on AddRestrictionSuccess {
      dietaryRestriction {
        id
        diet
        intolerance
        healthGoal
        severity
        notes
        appliesToHomeId
        createdAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateDietaryRestriction($input: UpdateRestrictionInput!) {
  updateRestriction(input: $input) {
    __typename
    ... on UpdateRestrictionSuccess {
      dietaryRestriction {
        id
        diet
        intolerance
        healthGoal
        severity
        notes
        appliesToHomeId
        createdAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation RemoveDietaryRestriction($input: RemoveRestrictionInput!) {
  removeRestriction(input: $input) {
    __typename
    ... on RemoveRestrictionSuccess {
      dietaryRestriction {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

