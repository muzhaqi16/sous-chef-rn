mutation ConfirmItemImageUpload($input: ConfirmItemImageUploadInput!) {
  confirmItemImageUpload(input: $input) {
    __typename
    ... on ConfirmItemImageUploadPayload {
      url
      # The item's photos as the confirm left them: the gallery and the scan
      # card show the new photo, pending ones included, without a refetch.
      item {
        id
        ...ItemReaders
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

