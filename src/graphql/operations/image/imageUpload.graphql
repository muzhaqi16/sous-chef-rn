mutation CreateImageUploadUrl($mime: String!, $purpose: ImageUploadPurpose!, $itemId: ID) {
  createImageUploadUrl(mime: $mime, purpose: $purpose, itemId: $itemId) {
    __typename
    ... on CreateImageUploadUrlSuccess {
      url
      key
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation ConfirmProfileImageUpload($key: String!) {
  confirmProfileImageUpload(key: $key) {
    __typename
    ... on ConfirmProfileImageUploadSuccess {
      url
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation ConfirmItemImageUpload($itemId: ID!, $key: String!) {
  confirmItemImageUpload(itemId: $itemId, key: $key) {
    __typename
    ... on ConfirmItemImageUploadSuccess {
      url
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

# Profile avatar/cover operations consolidated into updateProfile mutation
# Use: updateProfile(input: { avatar: $url }) to set avatar
# Use: updateProfile(input: { avatar: null }) to remove avatar
# Use: updateProfile(input: { coverImage: $url }) to set cover
# Use: updateProfile(input: { coverImage: null }) to remove cover

mutation UpdateItemImage($id: ID!, $imageUrl: String!) {
  updateItem(input: { id: $id, media: { imageUrl: $imageUrl } }) {
    __typename
    ... on UpdateItemSuccess {
      item {
        id
        imageUrl
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
