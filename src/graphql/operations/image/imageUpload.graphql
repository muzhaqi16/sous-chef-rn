mutation CreateImageUploadUrl($input: CreateImageUploadUrlInput!) {
  createImageUploadUrl(input: $input) {
    __typename
    ... on CreateImageUploadUrlPayload {
      url
      key
      # The presigned POST policy. Every entry must be appended to the
      # multipart body before the file part, or object storage rejects the
      # upload — see uploadToObjectStorage() in src/hooks/data/useImageUpload.ts.
      fields {
        name
        value
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

