mutation CreateImageUploadUrl($mime: String!, $purpose: ImageUploadPurpose!, $itemId: String) {
  createImageUploadUrl(mime: $mime, purpose: $purpose, itemId: $itemId) {
    url
    key
  }
}

mutation ConfirmProfileImageUpload($key: String!) {
  confirmProfileImageUpload(key: $key)
}

mutation ConfirmItemImageUpload($itemId: String!, $key: String!) {
  confirmItemImageUpload(itemId: $itemId, key: $key)
}

mutation UpdateProfileAvatar($avatarUrl: String!) {
  updateProfileAvatar(avatarUrl: $avatarUrl) {
    success
    message
    code
    userProfile {
      id
      avatar
    }
  }
}

mutation UpdateProfileCover($coverImageUrl: String!) {
  updateProfileCover(coverImageUrl: $coverImageUrl) {
    success
    message
    code
    userProfile {
      id
      coverImage
    }
  }
}

mutation RemoveProfileAvatar {
  removeProfileAvatar {
    success
    message
    code
    userProfile {
      id
      avatar
    }
  }
}

mutation RemoveProfileCover {
  removeProfileCover {
    success
    message
    code
    userProfile {
      id
      coverImage
    }
  }
}

mutation UpdateItemImage($id: ID!, $imageUrl: String!) {
  updateItem(id: $id, input: { imageUrl: $imageUrl }) {
    success
    message
    code
    item {
      id
      imageUrl
    }
  }
}

mutation RemoveItemImage($id: ID!) {
  updateItem(id: $id, input: { removeImage: true }) {
    success
    message
    code
    item {
      id
      imageUrl
    }
  }
}