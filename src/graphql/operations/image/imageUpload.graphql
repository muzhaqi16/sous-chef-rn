mutation CreateImageUploadUrl($mime: String!, $purpose: ImageUploadPurpose!, $itemId: String) {
  createImageUploadUrl(mime: $mime, purpose: $purpose, itemId: $itemId) {
    url
    key
  }
}

mutation ConfirmProfileImageUpload($key: String!) {
  confirmProfileImageUpload(key: $key) {
    success
    message
    code
    url
  }
}

mutation ConfirmItemImageUpload($itemId: String!, $key: String!) {
  confirmItemImageUpload(itemId: $itemId, key: $key) {
    success
    message
    code
    url
  }
}

# Profile avatar/cover operations consolidated into updateProfile mutation
# Use: updateProfile(input: { avatar: $url }) to set avatar
# Use: updateProfile(input: { avatar: null }) to remove avatar
# Use: updateProfile(input: { coverImage: $url }) to set cover
# Use: updateProfile(input: { coverImage: null }) to remove cover

mutation UpdateItemImage($id: ID!, $imageUrl: String!) {
  updateItem(id: $id, input: { media: { imageUrl: $imageUrl } }) {
    success
    message
    code
    item {
      id
      imageUrl
    }
  }
}
