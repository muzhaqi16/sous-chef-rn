  The code printed on the line: a barcode (often without its check digit) or the store's item number
  """
  code: String
  """The line's product text as printed, e.g. GV WHL MLK 1G"""
  text: String!
}

"""What a receipt line is."""
enum ReceiptLineKind {
  DEPOSIT
  DISCOUNT
  FEE
  ITEM
  OTHER
  PAYMENT
  SUBTOTAL
  TAX
  TOTAL
}

type ReceiptLineResolution {
  """The candidate to preselect; null when confidence is NONE"""
  best: ReceiptLineCandidate
  """Candidates, best first; may hold weak ones when confidence is NONE"""
  candidates: [ReceiptLineCandidate!]!
  clientId: String!
  confidence: ReceiptMatchConfidence!
}

"""How sure a receipt line's best candidate is."""
enum ReceiptMatchConfidence {
  """
  A printed code, the store's own item number, this household's alias, or an alias many households share named the item
  """
  HIGH
  """Search found candidates, but none clearly ahead: ask the user"""
  LOW
  """
  An alias a few households share, or search with one candidate clearly ahead of the rest
  """
  MEDIUM
  """Nothing close enough to propose"""
  NONE
}

"""Which step found a receipt line's candidate."""
enum ReceiptMatchMethod {
  """
  A correction this household, or enough households, made before at this chain
  """
  ALIAS
  """
  The line's printed barcode, its check digit computed when the receipt leaves it off
  """
  CODE
  """Scored text and semantic search over the line's text"""
  SEARCH
  """The store's own item number, for a known store"""
  STORE_SKU
}

"""
The merchant a receipt prints, as its parse read it (ParsedReceiptMerchant).
"""
input ReceiptMerchantInput {
  address: String
  name: String
  storeNumber: String
}

"""
A receipt queued for the server to read, for phones that cannot read one themselves.
"""
type ReceiptParse {
  completedAt: DateTime
  createdAt: DateTime!
  """
  What FAILED or UNAVAILABLE means for the user, in a sentence; null otherwise
  """
  failureReason: String
  id: ID!
  """The receipt once PARSED"""
  receipt: ParsedReceipt
  status: ReceiptParseStatus!
  """What the read flagged, at most 100; empty when nothing was flagged"""
  warnings: [ReceiptParseWarning!]!
}

"""Where a server receipt parse stands."""
enum ReceiptParseStatus {
  """The model answered, but never with valid lines"""
  FAILED
  """Read: the receipt is returned"""
  PARSED
  """Queued or running; poll again"""
  PENDING
  """
  No receipt service or worker could take it; parse on the device or enter the lines
  """
  UNAVAILABLE
}

type ReceiptParseWarning {
  code: ReceiptParseWarningCode!
  """On TOTALS_MISMATCH: what the lines add up to; null otherwise"""
  counted: Float
  """Free text for logs; read the figures from counted and printed"""
  detail: String!
  """
  On TOTALS_MISMATCH: the printed subtotal, or total less tax, they were checked against; null otherwise
  """
  printed: Float
}

"""Something a parse noticed about what it read."""
enum ReceiptParseWarningCode {
  """The pages held little readable text"""
  LOW_TEXT
  """
  The lines do not add up to the receipt by the rule on ParsedReceipt.lines: a line was likely missed or misread
  """
  TOTALS_MISMATCH
  """The model returned a line the receipt does not print; it was dropped"""
  UNGROUNDED_LINE
  """
  The printed date did not read as a calendar day; purchasedOn is null and the lines are kept
  """
  UNREADABLE_DATE
}

"""What turned the receipt's text into lines."""
enum ReceiptParser {
  """The phone's on-device model"""
  DEVICE
  """The server"""
  SERVER
}

"""The receipt a purchase was made on."""
input ReceiptRefInput {
  """
  The moment of the sale: the receipt's printed time on purchasedOn, placed
  by the device in its own time zone (noon when no time is printed). It
  dates the purchase and the stock; it must fall on purchasedOn in some time
  zone. Without it they are dated by purchasedOn alone.
  """
  purchasedAt: DateTime
  """The day on the receipt, as YYYY-MM-DD; not later than today."""
  purchasedOn: LocalDate!
  """The receipt's own number, as printed."""
  receiptNumber: String
  """
  The store the receipt is from; when the purchase also names one, they must agree.
  """
  storeId: ID
}

"""Recipe type for meal instructions and ingredients"""
type Recipe {
  """
  Mean review rating from 1 to 5, or null when the recipe has no reviews.
  """
  averageRating: Float
  """Calories (kcal) per serving, or null when unknown."""
  caloriesPerServing: Float
  """
  The recipe's course or meal type, such as MAIN_COURSE or DESSERT; MAIN_COURSE unless set.
  """
  category: RecipeCategory!
  """Cooking time in minutes, or null when not stated."""
  cookTimeMinutes: Int
  """When the recipe was created."""
  createdAt: DateTime!
  """
  The user who created the recipe. Null for a recipe imported by the system, or
  once the creator's account is permanently deleted.
  """
  createdBy: User
  """
  The recipe's cuisines, such as ITALIAN and MEDITERRANEAN; empty when none is stated.
  """
  cuisines: [Cuisine!]!
  """
  The notices the recipe's provider asks a reader to see, such as
  Spoonacular's backlink; empty for a recipe created in the app. The original
  source's own credit is source, sourceUrl and originalAuthor.
  """
  dataAttributions: [DataAttribution!]!
  """Short summary of the recipe, or null when none."""
  description: String
  """
  Diets this recipe fits, such as VEGAN or GLUTEN_FREE; empty when none are recorded.
  """
  diets: [Diet!]!
  """
  How hard the recipe is to make; MEDIUM unless the author sets another value.
  """
  difficulty: Difficulty!
  """
  The provider's data for a catalog recipe that has no canonical field here,
  read from the stored provider payload; null for a recipe created in the app
  or a catalog recipe not fetched yet.
  """
  externalDetails: ExternalRecipeDetails
  """
  The recipe's identifier in its external source, or null for a recipe created in the app.
  """
  externalId: String
  """
  The external source the recipe was imported from, or null for a recipe created in the app.
  """
  externalSource: ExternalSource
  """
  Link to the original recipe: sourceUrl when set, else the external source's own link; null when neither exists.
  """
  externalUrl: String
  """
  The recipe this one was forked from. Null for an original recipe, or when the
  original is gone or not visible to the viewer.
  """
  forkedFrom: Recipe
  """
  ID of the recipe this one was forked from, or null for an original recipe.
  """
  forkedFromId: ID
  """
  Forks of this recipe the viewer may see (published ones plus the viewer's own), newest first by default.
  """
  forksConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    """Sort order; newest first when omitted"""
    orderBy: RecipeOrderBy
  ): RecipeForkConnection!
  """
  The intolerances the recipe's source says it is free of: DAIRY and GLUTEN
  only, from a catalog recipe's provider flags; empty when none are recorded.
  Unlike intolerances, which lists what the recipe contains.
  """
  freeOf: [Intolerance!]!
  """
  Health goals this recipe suits, such as LOW_CARB or HIGH_PROTEIN; empty when none are recorded.
  """
  healthGoals: [HealthGoal!]!
  """The catalog's health score, 0 to 100; null when the source has none"""
  healthScore: Int
  """Unique identifier of the recipe."""
  id: ID!
  """URL of the recipe's image, or null when it has none."""
  imageUrl: String
  """The recipe's ingredients in display order."""
  ingredientsConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
  ): RecipeIngredientConnection!
  """
  The cooking steps as an ordered JSON array, each entry as the author or import
  source supplied it, commonly an object with step and text. May be empty for an
  imported recipe.
  """
  instructions: JSON!
  """
  Food intolerances this recipe is flagged for, as recorded by its author or
  import source. A searchRecipes intolerance filter excludes recipes flagged for
  any selected one. Empty when none are recorded.
  """
  intolerances: [Intolerance!]!
  """Whether this recipe has been soft-deleted (admin visibility)"""
  isDeleted: Boolean!
  """
  Whether the recipe was imported from an external source rather than created in the app.
  """
  isExternal: Boolean!
  """Whether status is PUBLISHED."""
  isPublished: Boolean!
  """
  Whether the viewer has saved this recipe; false for an anonymous viewer.
  """
  isSaved: Boolean!
  """
  The newest revision whatever its status, so the author can read a
  rejection's note. Null for anyone but the author and admins.
  """
  latestRevision: RecipeRevision
  """
  How much of this recipe you can already make from your pantry, 0-100.
  Null when unauthenticated.
  """
  matchPercentage: Float
  """
  The viewer's meal-plan items that use this recipe: from plans they own or
  share through an active home membership, soonest first. Empty for an
  anonymous viewer.
  """
  mealPlanItemsConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
  ): MealPlanItemConnection!
  """The recipe's title."""
  name: String!
  """The author's free-text notes, or null when none."""
  notes: String
  """
  Detailed nutrition breakdown as the author or import source supplied it, with
  no fixed shape. Null when none was supplied.
  """
  nutritionData: JSON
  """
  One serving's nutrition, typed: read from nutritionData whichever shape it
  holds, with calories from caloriesPerServing when set. Null when nothing
  is known.
  """
  nutritionPerServing: RecipeNutrition
  """
  Name of the person who originally wrote the recipe, when that is not its
  creator. A fork carries the original creator's display name. Null when not
  stated.
  """
  originalAuthor: String
  """
  The author's edit waiting for review; the recipe as served is the published
  one. Null when there is none, and for anyone but the author and admins.
  """
  pendingRevision: RecipeRevision
  """Preparation time in minutes, or null when not stated."""
  prepTimeMinutes: Int
  """
  The recipe's source; USER_CREATED when it came from no external source.
  """
  primarySource: ExternalSource!
  """
  When the recipe was first published, kept if it is later unpublished; null if never published.
  """
  publishedAt: DateTime
  """Number of 1-star reviews."""
  rating1Count: Int!
  """Number of 2-star reviews."""
  rating2Count: Int!
  """Number of 3-star reviews."""
  rating3Count: Int!
  """Number of 4-star reviews."""
  rating4Count: Int!
  """Number of 5-star reviews."""
  rating5Count: Int!
  """
  The note an admin left with the last moderation decision. A rejection
  always carries one. Null for anyone but the author and admins.
  """
  reviewNote: String
  """When an admin last approved or rejected this recipe."""
  reviewedAt: DateTime
  """Reviews of this recipe from all users, newest first by default."""
  reviewsConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    """
    Sort order; newest first when omitted. Fields apply in declaration order, not request order
    """
    orderBy: RecipeReviewOrderBy
  ): RecipeReviewConnection!
  """
  The viewer's saved entry for this recipe (folder, tags, notes, cook count), or null when not saved or anonymous.
  """
  savedDetails: SavedRecipe
  """
  Number of servings the recipe makes; 4 unless the author sets another value.
  """
  servings: Int!
  """
  Where the recipe came from in free text, for example a cookbook or a family recipe; null when not stated.
  """
  source: String
  """
  The recipe's full external source record, with source metadata and sync time; null for a recipe created in the app.
  """
  sourceMapping: RecipeSourceMapping
  """Web address of the recipe's original source, or null when not stated."""
  sourceUrl: URL
  """
  Publication state. A DRAFT is visible only to its author and admins; a
  PUBLISHED recipe is visible to everyone, including anonymous viewers. New
  recipes start as DRAFT.
  """
  status: RecipeStatus!
  """Free-form labels on the recipe; empty when none."""
  tags: [String!]!
  """The author's cooking tips as free text, or null when none."""
  tips: String
  """Number of times users have logged cooking this recipe."""
  totalCookingLogs: Int!
  """Number of reviews of this recipe."""
  totalReviews: Int!
  """Number of users who have saved this recipe."""
  totalSaves: Int!
  """
  Total time in minutes, as ready-time filters read it: the stated total, else preparation plus cooking. Null when no timing is given.
  """
  totalTimeMinutes: Int
  """When the recipe was last changed."""
  updatedAt: DateTime!
  """Revision number of the recipe, increased by each edit."""
  version: Int!
  """
  A link to a video of the recipe, entered by its author; null when none. The
  external import does not fill it.
  """
  videoUrl: URL
}

"""Sub-input for recipe attribution"""
input RecipeAttributionInput {
  originalAuthor: String
  source: String
  sourceUrl: URL
}

"""
A recipe capture: a page, a caption or cookbook photos read in the
background into the caller's private draft recipe. Deleted 7 days after
creation; the recipe it saved stays.
"""
type RecipeCapture {
  """
  SAVED by finding the page among the caller's recipes: no second recipe was made
  """
  alreadySaved: Boolean!
  completedAt: DateTime
  createdAt: DateTime!
  """What was read; null while PENDING, or when nothing was"""
  draft: RecipeCaptureDraft
  """Why FAILED or UNAVAILABLE; null otherwise"""
  failure: RecipeCaptureFailure
  """
  What FAILED or UNAVAILABLE means for the user, in a fixed sentence; null otherwise
  """
  failureReason: String
  id: ID!
  """The region the source's units were read in; null until read"""
  measurementRegion: MeasurementRegion
  """
  The draft recipe a SAVED capture created or found; null otherwise, or once deleted
  """
  recipe: Recipe
  source: RecipeCaptureSource!
  status: RecipeCaptureStatus!
  """What the read noticed; empty when nothing was"""
  warnings: [RecipeCaptureWarning!]!
}

"""
What a capture read: the content a SAVED capture's recipe was written from,
or what an INCOMPLETE capture hands the recipe editor. Each line keeps its
catalog candidates for review.
"""
type RecipeCaptureDraft {
  author: String
  cookTimeMinutes: Int
  description: String
  """The source's https image, a link the server never downloads"""
  imageUrl: String
  lines: [ParsedIngredientLine!]!
  name: String
  prepTimeMinutes: Int
  servings: Int
  """The publisher or site"""
  sourceName: String
  steps: [RecipeCaptureStep!]!
  totalTimeMinutes: Int
}

"""Why a capture ended FAILED or UNAVAILABLE, as a closed code."""
enum RecipeCaptureFailure {
  """The worker stopped waiting for the model service"""
  CALLER_GONE
  """No worker took the capture in time"""
  DEADLINE_PASSED
  """The model never answered in the asked shape"""
  INVALID_ANSWER
  """No model answered"""
  MODEL_DOWN
  """No model is configured for this read"""
  NO_MODEL
  """The text or page holds no recipe"""
  NO_RECIPE
  """No model service is configured"""
  NO_SERVICE
  """No worker consumes captures"""
  NO_WORKER
  """A photo was over the size or pixel limits, or not JPEG, PNG or WebP"""
  PHOTO_REFUSED
  """A photo could not be read from storage"""
  PHOTO_STORAGE
  """The capture could not be queued"""
  QUEUE_UNAVAILABLE
  """
  The read failed on the server on every attempt; send it again under a new capture id
  """
  READ_FAILED
  """The model service refused the request"""
  REQUEST_REFUSED
  SERVICE_ERROR
  """The model service is deployed without recipe reading"""
  SERVICE_LACKS_RECIPES
  SERVICE_REFUSED_TOKEN
  SERVICE_TIMEOUT
  SERVICE_UNREACHABLE
  """The model's answer ran out of room before it ended"""
  TRUNCATED
  """The model service answered in a shape this server does not know"""
  UNKNOWN
  """
  The page could not be fetched: refused, unreachable, too large or too slow
  """
  UNREACHABLE_URL
  """The URL answered with something other than a web page"""
  UNSUPPORTED_PAGE
}

"""What a capture was made from."""
enum RecipeCaptureSource {
  """Photos of a cookbook or printed page"""
  PHOTO
  """Text a client shared: a caption or description"""
  TEXT
  """A recipe page the server fetched"""
  URL
}

enum RecipeCaptureStatus {
  """The source could not be read into a recipe"""
  FAILED
  """
  Read, but missing a name, ingredients or steps: no recipe; open the editor with the draft
  """
  INCOMPLETE
  """Queued or running; poll again"""
  PENDING
  """
  Read, and saved as the caller's private draft recipe (or found among theirs)
  """
  SAVED
  """No worker or model service could take it now; try again later"""
  UNAVAILABLE
}

"""A captured step, numbered by its place."""
type RecipeCaptureStep {
  """The heading the step falls under on its source; null when it has none"""
  section: String
  step: Int!
  text: String!
}

type RecipeCaptureWarning {
  code: RecipeCaptureWarningCode!
  """Free text: the dropped line, or what was cut"""
  detail: String!
}

"""Something a capture noticed about what it read."""
enum RecipeCaptureWarningCode {
  """The source held more than a recipe holds; the rest was cut"""
  CONTENT_CLAMPED
  """The photos held little readable text"""
  LOW_TEXT
  """
  The model returned a line or step the source does not print; it was dropped
  """
  UNGROUNDED_LINE
}

enum RecipeCategory {
  APPETIZER
  BAKING
  BEVERAGE
  BREAKFAST
  CONDIMENT
  DESSERT
  DINNER
  LUNCH
  MAIN_COURSE
  SAUCE
  SIDE_DISH
  SNACK
}

"""
A page of Recipe results. Read "edges" for the rows and "pageInfo" to decide
whether to request another page.
"""
type RecipeConnection implements Connection {
  """The rows in this page, in the connection's sort order."""
  edges: [RecipeEdge!]!
  """Cursors and flags describing where this page sits in the full result."""
  pageInfo: PageInfo!
  """
  Total rows matching the query across all pages. Computed only when selected; null when not available.
  """
  totalCount: Int
}

"""
A recipe's content as a revision proposes it: the published recipe with the
changes applied. The fields are Recipe's, by name and type, so a client maps it
as it maps a recipe; it has no id, since it is not a Recipe.
"""
type RecipeContent {
  caloriesPerServing: Float
  category: RecipeCategory!
  cookTimeMinutes: Int
  cuisines: [Cuisine!]!
  description: String
  diets: [Diet!]!
  difficulty: Difficulty!
  healthGoals: [HealthGoal!]!
  imageUrl: String
  """
  The whole ingredient list, in order: the proposed one, or the published one when the revision leaves it alone.
  """
  ingredients: [RecipeIngredientLine!]!
  instructions: JSON!
  intolerances: [Intolerance!]!
  name: String!
  notes: String
  nutritionData: JSON
  originalAuthor: String
  prepTimeMinutes: Int
  servings: Int!
  source: String
  sourceUrl: URL
  tags: [String!]!
  tips: String
  totalTimeMinutes: Int
  videoUrl: URL
}

"""A recipe field an author edits."""
enum RecipeContentField {
  CALORIES_PER_SERVING
  CATEGORY
  COOK_TIME_MINUTES
  CUISINES
  DESCRIPTION
  DIETS
  DIFFICULTY
  HEALTH_GOALS
  IMAGE_URL
  INSTRUCTIONS
  INTOLERANCES
  NAME
  NOTES
  NUTRITION_DATA
  ORIGINAL_AUTHOR
  PREP_TIME_MINUTES
  SERVINGS
  SOURCE
  SOURCE_URL
  TAGS
  TIPS
  TOTAL_TIME_MINUTES
  VIDEO_URL
}

"""Sub-input for recipe context"""
input RecipeContextInput {
  """How the item came to be on the list."""
  addedContext: AddedContext
  """
  Meal plan this item was generated from. When set, the server flags the
  item as meal-plan-sourced (isFromMealPlan).
  """
  mealPlanId: ID
  """Specific meal plan item this ingredient came from."""
  mealPlanItemId: ID
  recipeId: ID
  recipeIngredientId: ID
}

"""
One Recipe in a paginated result, paired with the cursor that identifies its
position. Pass the cursor as "after" to resume from just past this edge.
"""
type RecipeEdge implements Edge {
  """Opaque position marker for this edge. Do not parse or construct it."""
  cursor: String!
  """The Recipe this edge wraps."""
  node: Recipe!
}

"""
One recipe field a revision changes: the live value, and the one proposed.
"""
type RecipeFieldChange {
  field: RecipeContentField!
  """The published value, as the Recipe field holds it; null when unset."""
  from: JSON
  """The proposed value; null clears the field."""
  to: JSON
}

"""
Filter criteria for recipe list queries (recipes, adminRecipes, searchRecipes).
A field marked with queries applies to those only; the others apply to all
three. The searchRecipes filters mirror the Spoonacular complexSearch parameters:
  - diets         -> recipe must match ALL selected
  - intolerances  -> exclude recipes containing ANY selected intolerance
  - category      -> meal type
  - cuisines      -> match ANY of the selected
  - maxReadyTime  -> total time, in minutes
"""
input RecipeFilters {
  """Filter by meal-type category"""
  category: RecipeCategory
  """Cuisines to match any of (searchRecipes)"""
  cuisines: [Cuisine!]
  """Dietary restrictions the recipe must match (searchRecipes)"""
  diets: [Diet!]
  """Filter by difficulty"""
  difficulty: Difficulty
  """Include soft-deleted recipes (recipes/adminRecipes)"""
  includeDeleted: Boolean
  """Intolerances to exclude (searchRecipes)"""
  intolerances: [Intolerance!]
  """Maximum total ready time in minutes (searchRecipes)"""
  maxReadyTime: Int
  """
  Filter by status. `adminRecipes` with PENDING_REVIEW is the moderation
  queue; `searchRecipes` lists published recipes only.
  """
  status: RecipeStatus
}

"""
A page of Recipe results. Read "edges" for the rows and "pageInfo" to decide
whether to request another page.
"""
type RecipeForkConnection implements Connection {
  """The rows in this page, in the connection's sort order."""
  edges: [RecipeForkEdge!]!
  """Cursors and flags describing where this page sits in the full result."""
  pageInfo: PageInfo!
  """
  Total rows matching the query across all pages. Computed only when selected; null when not available.
  """
  totalCount: Int
}

"""
One Recipe in a paginated result, paired with the cursor that identifies its
position. Pass the cursor as "after" to resume from just past this edge.
"""
type RecipeForkEdge implements Edge {
  """Opaque position marker for this edge. Do not parse or construct it."""
  cursor: String!
  """The Recipe this edge wraps."""
  node: Recipe!
}

type RecipeIngredient {
  """
  quantity auto-converted to the caller's unit system (see UnitSystem):
  metric when no system is known. A recipe source's own figure in that system
  is used while its measure still states quantity; a unit both systems use (a
  spoon, a pinch) reads as itself.
  
  Viewer-scoped: it resolves through the caller's preferredUnitSystem and, for
  SYSTEM, their device's locale, so two callers reading the same recipe get
  different answers. Null when the ingredient states no amount or names no
  unit, or when no seeded unit of the system shares its dimension.
  """
  convertedQuantity: ConvertedValue
  """
  As on Item.dietaryAlerts, judged by the ingredient's name and its linked item; an unlinked one by its name alone
  """
  dietaryAlerts(
    """The home whose members' restrictions count"""
    homeId: ID!
  ): [DietaryAlert!]!
  estimatedPrice: Float
  externalSources: [RecipeIngredientSourceMapping!]!
  id: ID!
  """
  The ingredient's image: an absolute http(s) address, or null. A catalog
  item's own image wins; a bare provider file name is served from the
  provider's image host.
  """
  image: String
  isOptional: Boolean!
  item: Item
  name: String!
  notes: String
  """The line as originally written, when the ingredient came from text."""
  originalText: String
  preparation: String
  """
  The amount, in `unit`. Null when the recipe states none ("salt, to taste"):
  such a line is never deducted, priced or converted, and a shopping list
  carries it without a quantity.
  """
  quantity: Float
  recipe: Recipe!
  section: String
  sortOrder: Int!
  """
  Curated substitutes for this ingredient's concept and those above it, all parts held first. An
  option a member is allergic or intolerant to is not offered. The caller must be an ACTIVE member.
  """
  substitutes(
    """The home whose members' restrictions count"""
    homeId: ID!
    """At most this many: default 10, at most 20"""
    limit: Int = 10
    """The pantry checked for parts; the home's default pantry when omitted"""
    pantryId: ID
  ): [IngredientSubstituteOption!]!
  unit: Unit
}

"""One ingredient line a revision adds, removes or changes."""
type RecipeIngredientChange {
  """The proposed line; null for a removed one."""
  after: RecipeIngredientLine
  """The live line; null for an added one."""
  before: RecipeIngredientLine
