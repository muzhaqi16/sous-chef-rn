  created: Boolean!
  item: Item!
  mapping: ExternalSourceMapping!
}

enum UsageFrequency {
  DAILY
  MONTHLY
  RARELY
  SEASONAL
  UNKNOWN
  WEEKLY
}

enum UsagePurpose {
  COOKING
  GENERAL
  GIFT
  MEAL_PREP
  SNACK
  TRANSFER
  WASTE
}

"""
Source that triggered pantry item usage
"""
enum UsageSource {
  COOKING_LOG
  MANUAL
  MEAL_PLAN
  RECIPE
}

"""
User account type
Cache: 5 minutes - user data changes occasionally, always private
"""
type User {
  addresses: [UserAddress!]!
  createdAt: DateTime!
  defaultHome: Home
  defaultHomeId: String
  defaultShoppingListId: String
  devices: [Device!]!
  dietaryProfile: DietaryProfile
  email: String!
  emailVerified: Boolean!
  homeOwnerships: [HomeOwnership!]!
  id: ID!
  language: String
  lastActiveAt: DateTime
  loginHistory: [LoginHistory!]!
  moderation: UserModeration
  notificationPreferences: NotificationPreferences
  onBoarded: Boolean!
  preferredCurrency: String
  profile: UserProfile
  purchases: [Purchase!]!
  role: UserRole!
  settings: UserSettings
  shoppingListOwnerships: [ShoppingListOwnership!]!
  statistics: UserStatistics
  timezone: String
  updatedAt: DateTime!
}

type UserActivityPayload {
  activityType: UserActivityType!
  description: String!
  metadata: JSON
  timestamp: DateTime!
  userId: String!
}

enum UserActivityType {
  CONTENT_CREATED
  CONTENT_DELETED
  CONTENT_UPDATED
  LOGIN
  LOGOUT
  PROFILE_UPDATE
  PURCHASE_MADE
  REVIEW_GIVEN
  SETTINGS_CHANGE
  SOCIAL_ACTION
}

"""
User address information
Cache: 10 minutes - addresses rarely change, always private
"""
type UserAddress {
  city: String!
  country: String!
  id: ID!
  isDefault: Boolean!
  label: String!
  lat: Float
  lng: Float
  postalCode: String!
  state: String!
  street: String!
}

type UserAuthPayload {
  authType: String!
  deviceInfo: JSON
  timestamp: DateTime!
  userId: String!
}

type UserModeration {
  abuseScore: Float!
  appealNotes: String
  appealStatus: AppealStatus
  appealedAt: DateTime
  automatedFlags: [AutomatedFlag!]!
  banReason: String
  bannedAt: DateTime
  createdAt: DateTime!
  createdBy: User
  createdById: String
  deletedAt: DateTime
  deletedBy: User
  deletedById: String
  id: ID!
  isBanned: Boolean!
  isSuspended: Boolean!
  lastModifiedBy: User
  lastModifiedById: String
  lastViolationAt: DateTime
  moderatorNotes: String
  restrictedUntil: DateTime
  restrictionReason: String
  restrictions: [ModerationRestriction!]!
  reviewStartedAt: DateTime
  riskScore: Float!
  spamScore: Float!
  status: ModerationStatus!
  suspendedAt: DateTime
  suspendedUntil: DateTime
  suspensionReason: String
  trustLevel: TrustLevel!
  underReview: Boolean!
  updatedAt: DateTime!
  user: User!
  userId: String!
  version: Int!
  violationCount: Int!
  warningCount: Int!
}

type UserModerationChangedPayload {
  moderatedBy: String!
  moderationStatus: String!
  moderationType: String!
  reason: String
  timestamp: DateTime!
  userId: String!
}

"""
User profile information
Cache: 10 minutes - profile data rarely changes, always private
"""
type UserProfile {
  avatar: String
  bio: String
  coverImage: String
  createdAt: DateTime!
  dateOfBirth: DateTime
  displayName: String
  firstName: String
  gender: String
  id: ID!
  lastName: String
  phone: String
  profileVisibility: ProfileVisibility!
  showEmail: Boolean!
  showPhone: Boolean!
  updatedAt: DateTime!
  userId: String!
  website: String
}

type UserProfileChangedPayload {
  mutation: String!
  previousValues: UserProfile
  profile: UserProfile!
  timestamp: DateTime!
  updatedFields: [String!]
  userId: String!
}

enum UserRole {
  ADMIN
  MODERATOR
  SUPER_ADMIN
  USER
}

"""
User settings and preferences
Cache: 10 minutes - settings rarely change, always private
"""
type UserSettings {
  alwaysShowFractions: Boolean!
  autoSync: Boolean!
  betaFeatures: [String!]!
  compactMode: Boolean!
  createdAt: DateTime!
  enabledFeatures: [String!]!
  id: ID!
  language: String!
  maxDecimalPlaces: Int!
  offlineMode: Boolean!
  personalizedAds: Boolean!
  preferredCurrency: String!
  preferredFractionSet: JSON
  preferredUnitSystem: UnitSystem!
  quantityDisplayPreference: QuantityDisplayPreference!
  shareUsageData: Boolean!
  shareWithPartners: Boolean!
  showTutorials: Boolean!
  theme: AppTheme!
  timezone: String!
  updatedAt: DateTime!
  user: User!
}

type UserSocialPayload {
  action: String!
  targetUserId: String!
  timestamp: DateTime!
  userId: String!
}

"""
User activity statistics
Cache: 3 minutes - stats update with user activity, always private
"""
type UserStatistics {
  averageRatingGiven: Float
  helpfulVotesReceived: Int!
  id: ID!
  lastCalculatedAt: DateTime!
  streakDays: Int!
  totalAmountSpent: Float!
  totalCollaborations: Int!
  totalCookingSessions: Int!
  totalItemsAdded: Int!
  totalMealPlans: Int!
  totalPurchases: Int!
  totalRecipesCreated: Int!
  totalReviewsGiven: Int!
  totalShoppingLists: Int!
  totalWasteReduced: Float!
  user: User!
  userId: String!
}

type UserStatusChangedPayload {
  isOnline: Boolean!
  lastActiveAt: DateTime
  newStatus: UserStatusType!
  previousStatus: UserStatusType
  timestamp: DateTime!
  userId: String!
}

enum UserStatusType {
  AWAY
  BUSY
  INVISIBLE
  OFFLINE
  ONLINE
}

type UserUpdatedPayload {
  mutation: String!
  node: User!
  previousValues: User
  timestamp: DateTime!
  updatedFields: [String!]
  userId: String!
}

type ValidateTokenResponse {
  email: String
  valid: Boolean!
}

type ValidationError {
  code: String!
  field: String!
  message: String!
}

type ValidationResult {
  errors: [ValidationError!]!
  isValid: Boolean!
  warnings: [ValidationWarning!]!
}

type ValidationWarning {
  field: String!
  message: String!
  suggestion: String
}

enum Visibility {
  PRIVATE
  PUBLIC
  RESTRICTED
}

enum WasteReason {
  COOKING_FAIL
  EXPIRED
  MOLD
  OTHER
  OVERSTOCK
  PEST
  SPOILED
  TASTE
}
