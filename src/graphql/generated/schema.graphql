  How many active batches the stack holds; 0 when it holds its stock outside batches
  """
  activeBatchCount: Int!
  """When the stack was added to the pantry"""
  addedAt: DateTime!
  """The user who added this stack; null when unknown"""
  addedBy: User
  """
  This stack's own brand, independent of the catalog item's brands; null when none is set
  """
  brand: Brand
  """
  The id of this stack's own brand, independent of the catalog item's brands; null when none is set
  """
  brandId: ID
  """The audit trail of changes to this stack, most recent first"""
  changeHistoryConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
