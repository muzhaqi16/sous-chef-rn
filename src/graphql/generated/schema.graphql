"""Subtype discriminator for device domain events."""
enum DeviceSubtype {
  """
  Device activity updated: a sign-in, a re-registration, last-seen, location
  or login count.
  """
  ACTIVITY
  """
  Device was deleted: by its owner, by an admin, or evicted by the device cap.
  """
  DELETED
  """A new device was registered for the user."""
  REGISTERED
  """
  Device active-status flipped (activated / deactivated) by updateDevice.
  """
  STATUS_CHANGED
  """Device trust flipped (trusted / untrusted) by updateDevice."""
  TRUST_CHANGED
  """
  Device verification changed by updateDevice: verified, or verification
  withdrawn. node.isVerified says which.
  """
  VERIFIED
}

