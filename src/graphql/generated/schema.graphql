"""
The photo a household's entry shows. In order: the household's own photo for
the entry's catalog item, when it chose one and the viewer is the household's
member; else the catalog photo the item shows everyone (Item.imageUrl); else
the viewer's own photo of the item awaiting review, newest first; else none.
A household upload's url is a signed link that expires: read it from the
entry each time, never store it.
"""
type EntryImage {
  """
  The ItemPhoto shown when it is one of the item's photos; null for a household upload.
  """
  catalogImageId: ID
  """
  The credit a catalog photo needs; null for a household upload or a pending photo.
  """
  credit: ImageCredit
  source: EntryImageSource!
  """
  The image sized for a row. A catalog photo, one the household picked, or the
  viewer's pending photo is that photo's thumbnail rendition (the photo itself
  until it has one); its original is in Item.photos under catalogImageId. A household upload is
  served as stored, at most 1600 px on its long side: it has no rendition and
  is not among Item.photos.
  """
  url: String!
}

"""Whose choice an entry's photo is."""
enum EntryImageSource {
  """The photo the catalog item shows everyone."""
  CATALOG
  """
  The household chose it: its own upload, or one of the item's photos it picked.
  """
  HOUSEHOLD
  """
  The viewer's own photo of the item, awaiting review; shown to no one else.
  """
  PENDING
}

"""
Base interface for every mutation error variant. Every concrete error
type implements this so clients can write a generic
`... on Error { code message }` fallback alongside specific variants.
"""
interface Error {
  code: ErrorCode!
  message: String!
}

"""
Machine-readable error code. Returned on every Error implementer so
clients can branch on `code` without needing to inspect `__typename`
for common cases.

This enum types the `code` field on `*Result` union members. A value here
must have an emitter — some code path able to return it as a union member's
`code` — or it is a false promise to clients branching on it.

Authentication codes are emittable: a mutation returning a union reports a
refusal as an `AuthenticationError` member. The same condition reaching a
caller through a path with no union to return into arrives as a top-level
error carrying the **same** code in `extensions`, so a client branching on
`code` reads one value per condition and only chooses where to read it from.

Two classes of failure still never reach this enum, and clients read them
from a top-level error's `extensions` instead:

- **Rate limiting** — thrown as a top-level error carrying
  `OPERATION_RATE_LIMITED` plus `retryAfter` in `extensions`. It is not
  a union member, so it cannot populate this enum.
- **Internal failures** — surface as a top-level error, masked in
  production. There is no `InternalError` union member to carry a code.

Both are typed by `TopLevelErrorCode`, which names that channel's whole
vocabulary.

This enum also types the `code` of a per-item failure inside a
partial-success payload, which reports the same value a union member would
for the same error. A per-item failure is the one place an internal failure
arrives in `data`, as `INTERNAL_SERVER_ERROR`; no union member carries it.

A value here without an emitter is a false promise; see the
`error-code-contract` spec.
"""
enum ErrorCode {
  """
  Failed-attempt lockout. Temporary and self-clearing — the caller may retry once the window elapses.
  """
  AUTH_ACCOUNT_LOCKED
  """
  Banned, suspended or deleted — a moderation decision, not a transient lockout. Clients end the session on this code. Also emitted top-level by the auth directive for the same account state.
  """
  AUTH_ACCOUNT_SUSPENDED
  AUTH_CREDENTIALS_INVALID
  """
  A device-bound re-authentication credential was refused and is permanently useless: unknown, revoked, expired, superseded by a newer credential for the same device, or presented with a device id it was not issued for. Uniform across all of those on purpose — which one applied is not disclosed. Clients clear the stored credential and fall back to the password screen. NOT emitted for a rate limit, which is recoverable and leaves the credential good.
  """
  AUTH_DEVICE_CREDENTIAL_INVALID
  """
  Credentials are valid but the email address on the account is unverified — a registration, or a re-registration of a deleted address, awaiting proof of the mailbox. Not a sign-out: the client prompts for the emailed code.
  """
  AUTH_EMAIL_NOT_VERIFIED
  """
  Refresh token rejected by rotation and unrecoverable: unverifiable, unknown, revoked, or replayed long enough after use to be treated as compromise. The session is over. Emitted by the refresh mutation; the REST /refresh route reports the same code top-level.
  """
  AUTH_REFRESH_TOKEN_INVALID
  """
  Refresh token was consumed by a recent rotation and a valid successor exists — the request lost a race, it did not end the session. Recommended handling: re-read stored credentials and retry with the current token. Clients must NOT sign the user out on this code.
  """
  AUTH_REFRESH_TOKEN_SUPERSEDED
  AUTH_TOKEN_EXPIRED
  AUTH_TOKEN_MISSING
  CONFLICT
  DEADLOCK
  EMAIL_ALREADY_EXISTS
  EMAIL_ALREADY_VERIFIED
  FORBIDDEN
  HOME_ACCESS_DENIED
  """
  The home is at its member cap (`Home.maxMembers`): a join by code, an invite acceptance or a rejoin is refused until a member leaves or the cap is raised.
  """
  HOME_MEMBER_LIMIT_REACHED
  """
  An idempotency-keyed operation was already applied (a safe replay). Clients should treat this as success, not a hard failure.
  """
  IDEMPOTENT_REPLAY
  """
  More was requested from a pantry item than it holds. The failure reports the requested and available quantities where it has them.
  """
  INSUFFICIENT_QUANTITY
  """
  An unexpected server fault behind one item of a partial-success payload. Reported only on a per-item failure, whose reason is masked in production and carries an errorId.
  """
  INTERNAL_SERVER_ERROR
  NOT_FOUND
  PANTRY_ITEM_ALREADY_EXISTS
  RESOURCE_ALREADY_EXISTS
  """
  A unit change whose route is an estimate, sent without CONVERT or RECOUNT. Show the preview's two choices and resend with one.
  """
  UNIT_CHANGE_NEEDS_RESOLUTION
  UNIT_INVALID
  """
  A cooked recipe's ingredient that states no amount, which the cook did not state either: nothing was deducted for it. Reported only as a skipped ingredient of markRecipeAsCooked, never as a failure.
  """
  UNSTATED_AMOUNT
  VALIDATION_FAILED
  VERSION_CONFLICT
}

