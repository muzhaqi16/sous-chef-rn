  Subscribe to all device events for the caller's own devices. Discriminate
  by subtype: REGISTERED, ACTIVITY, STATUS_CHANGED, TRUST_CHANGED, VERIFIED,
  DELETED.
  """
  deviceEvents: DeviceEvent!
  """
  Per-home event stream (membership changes + home-invite
  changes). Subscribe once per home and branch on subtype, then on node's
  __typename (Membership vs HomeInvite).
  """
  homeEvents(
    """The home to watch"""
    homeId: ID!
