"""
Item/Product catalog type
Cache: 30 minutes - catalog items are relatively static
"""
type Item {
  """
  Allergens recorded for this item, each noting whether the item contains or may
  contain it. Empty when none are recorded.
  """
  allergens: [AllergenInfo!]!
  """
  Other barcodes that identify this same item, such as multi-pack or regional variants; empty when none.
  """
  alternateUpcs: [String!]!
  """
  When this item was approved into the public catalog, or null if it was never approved.
  """
  approvedAt: DateTime
  """
  The admin who approved this item into the public catalog, or null if it was never approved.
  """
  approvedBy: User
  """
  What kind of quantity this item fundamentally is: VOLUME for liquids, MASS for
  solids measured by weight, COUNT for discrete items. Null when not declared.
  """
  baseDimension: BaseDimension
  """Brands linked to this item; empty when none."""
  brands: [ItemBrand!]!
  """
  Whether the CALLING user may write to this item directly with updateItem
  (true for its creator and for admins). Resolved against the same predicate
  updateItem enforces, so it stays correct if that rule changes.
  
  Route on this together with canSuggest rather than inferring from
  visibility — the write paths are mutually exclusive and each hard-fails when
  picked wrongly:
  
      item.canEdit    -> updateItem(...)
      item.canSuggest -> createItemSuggestion(...)
      neither         -> read-only, offer no edit affordance
  
  canEdit=false does NOT imply you may suggest: you can legitimately receive a
  PRIVATE item you do not own (a housemate's pantry entry, a shared list's
  item, a recipe ingredient), and those are read-only to you — createItemSuggestion
  accepts PUBLIC items only. Check canSuggest; do not assume the fallback.
  
  Viewer-scoped, so it must never inherit Item's type-level PUBLIC cache
  scope — pinned PRIVATE + no-store so a shared or CDN cache cannot serve
  one user's edit rights to another.
  
  COSTS YOU THE RESPONSE CACHE ON item(id:) — AND ONLY THERE. A response's
  policy is the most restrictive hint in it, so selecting this field drops
  maxAge to 0 for everything beside it: item(id:) without canEdit is
  max-age=1800/public, with it the whole response is no-store.
  
  This does NOT apply to the connection reads (items, searchItems,
  searchItemsSemantic). Those are no-store with or without canEdit — a root
  field has no parent for ItemConnection's inheritMaxAge to inherit from, so
  they fall back to defaultMaxAge: 0. Splitting canEdit out of a connection
  query buys nothing.
  """
  canEdit: Boolean!
  """
  Whether createItemSuggestion accepts this item as a target — true for
  active PUBLIC catalog items. Resolved against the same predicate that
  mutation enforces.
  
  Structural only: it does not account for your per-user pending-suggestion
  cap or the rate limit, both of which are transient and clear on their own.
  Unlike canEdit this is not viewer-scoped — the answer is identical for
  every caller, so it inherits Item's PUBLIC cache scope and can ride along
  in a cacheable item(id:) read. That benefit is limited to item(id:): the
  connection reads are no-store regardless, so there is no cacheable catalog
  list query for it to ride along in.
  """
  canSuggest: Boolean!
  """
  Categories this item is filed under; callers other than admins see only public categories.
  """
  categories: [ItemCategory!]!
  """
  A PACKAGE netWeight converted to the caller's preferred unit system, so two
  callers reading the same item can get different answers. Null for a serving
  or reference figure.
  """
  convertedNetWeight: ConvertedValue
  """When the item was created."""
  createdAt: DateTime!
  """
  Where this catalog entry came from: manual entry, a barcode scan, an import or an external source.
  """
  dataSource: DataSource!
  """
  Suggested amount for a quick consume, in defaultConsumeUnit, or null when not set (then use 1).
  """
  defaultConsumeIncrement: Float
  """
  Suggested unit for a quick consume (for example tbsp for olive oil), or null when not set.
  """
  defaultConsumeUnit: Unit
  """ID of defaultConsumeUnit, or null when not set."""
  defaultConsumeUnitId: ID
  """
  Density in grams per millilitre, used to convert between volume and weight; null when not recorded.
  """
  density: Float
  """Free-text description of the item, or null when none is recorded."""
  description: String
  """
  Unit that netWeight is stated in, for example oz. On an item returned by a
  barcode lookup, the unit of that barcode's figure when it has one.
  """
  displayUnit: Unit
  """
  ID of the unit the item's own netWeight is stated in, or null when unset.
  Unlike displayUnit, it ignores a matched product variation.
  """
  displayUnitId: ID
  """
  This item's records in external catalogs such as USDA or Open Food Facts, with each source's own data.
  """
  externalSources: [ExternalSourceMapping!]!
  """Health benefits recorded for this item. Empty when none are recorded."""
  healthBenefits: [HealthBenefit!]!
  """Unique identifier of the catalog item."""
  id: ID!
  """
  Number of distinct photos, NOT of image rows — size renditions are excluded.
  """
  imageCount: Int!
  """URL of the primary photo, or its thumbnail rendition when one exists."""
  imageUrl: String
  """
  At most ONE image row — the best single asset for the primary photo, or the
  best match for an explicit kind. This field cannot express a gallery; select
  "photos" for that.
  """
  images(
    """
    The rendition of the primary photo to return; the thumbnail, else the photo, when omitted
    """
    kind: ImageKind
  ): [ItemImage!]!
  """
  The item's ingredient list as supplied when it was created or edited, with no
  fixed shape. Null when none was supplied.
  """
  ingredients: JSON
  """Whether this item has been soft-deleted (admin visibility)"""
  isDeleted: Boolean!
  """
  Whether a user created this item in the app, as opposed to a catalog import.
  """
  isUserCreated: Boolean!
  """
  The product record (package size, brand, images) of the barcode a lookup
  returned this item for, whether that barcode is the item's primary, an
  alternate, or known only through the record. An add names it as
  item.variation. Null when the item was not returned by a barcode lookup, or
  the barcode has no record.
  """
  matchedVariation: ProductVariation
  """
  Sparse per-item flags and enrichment summary (dietary booleans, aggregation
  completeness, etc.).
  
  **Admin-gated projection.** Server-written moderation/audit keys
  (`rejectionReason`, `flagReason`, `mergedFrom`) are stripped for non-admin
  callers and returned only to ADMIN/SUPER_ADMIN roles; every other key is
  returned to all callers. This is a deliberate, documented projection (not the
  raw column) — the read-side counterpart to `ItemMetadataInput` narrowing the
  write surface to four dietary booleans.
  
  Pinned `maxAge: 0, scope: PRIVATE`: the projection is viewer-dependent, so the
  type's `maxAge: 1800, scope: PUBLIC` MUST NOT cache an admin response and
  replay its moderation keys to a non-admin (cf. `convertedNetWeight`/`canEdit`).
  """
  metadata: JSON
  """The item's display name."""
  name: String!
  """
  Whether the item is waiting for admin review. Set when a user submits a new
  item or an item is flagged; cleared when it is approved or rejected.
  """
  needsApproval: Boolean!
  """
  Net quantity stated for the item, in displayUnit; netWeightKind says what it
  measures. On an item returned by a barcode lookup it is that barcode's own
  figure: its product record's, else the item's own for its primary barcode,
  else null. An add naming the record stores the same figure. Null when unknown.
  """
  netWeight: Float
  """
  What netWeight measures: PACKAGE (one retail unit's net quantity), SERVING
  (one labelled serving) or REFERENCE (a 100 g nutrition basis). Only a PACKAGE
  figure becomes a pantry stack's package size. Null when unknown.
  """
  netWeightKind: NetWeightKind
  """
  Structured nutrition for this item — one row per item, values in canonical
  units (kcal for energy, g for macros, mg for sodium/cholesterol/potassium,
  mcg for vitamin D).
  
  Null for an item that has never been aggregated; a few items still carry
  `nutritions` without it.
  """
  nutritionFacts: NutritionFacts
  """
  Nutrition as aggregated from this item's sources, in the legacy Json mirror.
  
  Prefer `nutritionFacts`, which is the same data in structured form. This
  field stays authoritative for now and carries any key the structured form
  has no field for.
  """
  nutritions: JSON
  """Number of PENDING community edit suggestions for this item."""
  pendingSuggestionCount: Int!
  """
  Every distinct photo of this item, each carrying its own size renditions.
  
  Ordered deterministically: the primary photo first, then featured ones, then
  by perspective (front, back, left, right, top, nutrition_label,
  ingredient_list, then any unrecognised value), then oldest first, with id as
  the final tiebreak.
  
  Contains only APPROVED photos, plus the viewer's own still-PENDING
  submissions (admins see every photo regardless of status) — so a submission
  awaiting review is visible to the person who sent it and to nobody else.
  
  PRIVATE cache scope precisely because of that viewer-dependence: Item is
  otherwise a PUBLIC, 30-minute-cacheable type, and caching one submitter's
  pending photo into a shared entry would leak it to everyone. Select
  "imageUrl"/"imageCount" instead where a publicly cacheable projection is
  what you want — those stay approved-only for every viewer.
  """
  photos: [ItemPhoto!]!
  """
  Times this item has been added to pantries and shopping lists by all users; catalog lists rank by it.
  """
  popularity: Int!
  """
  Preferred unit for counting this item in a pantry, for example bottle for olive
  oil. Adding the item to a pantry without naming a unit picks this one, unless
  the pantry previously tracked the item in another unit. Null when not
  configured.
  """
  preferredTrackingUnit: Unit
  """ID of preferredTrackingUnit, or null when not configured."""
  preferredTrackingUnitId: ID
  """Price observations recorded for this item, newest first by default."""
  priceHistoryConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    """Sort order; newest first when omitted"""
    orderBy: ItemPriceHistoryOrderBy
  ): ItemPriceHistoryConnection!
  """The item's main UPC barcode, or null when it has none."""
  primaryUpc: String
  """
  Size of one labelled serving in servingSizeUnit (for example 240 for 240 mL), or null when unknown.
  """
  servingSize: Float
  """
  Unit of servingSize as labelled, a free-text symbol such as mL, g or oz; null when unknown.
  """
  servingSizeUnit: String
  """Number of servings in one package, or null when unknown."""
  servingsPerPackage: Int
  """
  Shelf life in days while unopened, or null when unknown; sets a new pantry stack's default expiry date.
  """
  shelfLifeDays: Int
  """
  Shelf life in days once opened, or null when unknown. Opening a batch brings
  its expiry date forward to at most today plus this many days, unless the
  expiry was set by hand.
  """
  shelfLifeOpenedDays: Int
  """
  Whether this item appears in the curated onboarding list; only admins change it.
  """
  showInOnboarding: Boolean!
  """
  Lifecycle state of the catalog entry. Barcode lookups and curated lists return
  only ACTIVE items; a deleted or rejected item is ARCHIVED.
  """
  status: ItemStatus!
  """
  How this item is normally stored; a new pantry stack of it starts in this state.
  """
  storageState: StorageState!
  """This item's SKUs at individual stores, oldest first by default."""
  storeSkusConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    """Sort order; oldest first when omitted"""
    orderBy: ItemStoreSkuOrderBy
  ): ItemStoreSkuConnection!
  """Free-form labels attached to the item; empty when none."""
  tags: [String!]!
  """
  The unit an add of this item naming no unit is counted in: the unit the
  given pantry holds it in, or last held it in, else the item's preferred
  tracking unit, retail unit, default unit or declared count unit, else piece.
  Without a pantry, from the item alone. Requires view access to the pantry.
  """
  trackingUnit(pantry: ID): Unit!
  """The item's general kind, such as FOOD, DRINK or HOUSEHOLD."""
  type: ItemType!
  """
  Item-specific conversions between units (for example 1 cup = 120 g), newest first by default.
  """
  unitConversionsConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    """Sort order; newest first when omitted"""
    orderBy: ItemUnitConversionOrderBy
