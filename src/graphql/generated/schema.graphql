  """
  Free storage in bytes, as a decimal string, when last reported; null when not reported
  """
  freeDiskStorage: String
  """Host names the device reports; empty when not reported"""
  hostNames: [String!]!
  """The server's id for this device registration"""
  id: ID!
  """
  Whether the device is in use. False once it is deactivated or removed,
