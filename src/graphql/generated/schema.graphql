  browserName: String
  """Browser version, as reported at registration; null when not reported"""
  browserVersion: String
  """
  The app's build number on this device, as reported; null when not reported
  """
  buildNumber: String
  """
  The app's bundle identifier on this device, as reported; null when not reported
  """
  bundleId: String
  """Mobile carrier name, as reported; null when not reported"""
  carrier: String
  """When the device was first registered to this account"""
  createdAt: DateTime!
  """
  The identifier the app minted for this install: the same value it registers
  with and sends as X-Device-Id. Unique within an account, not across accounts.
  """
  deviceId: String!
  """
  A display name for the device: the one the client gave, else one generated from its type and OS; null when none is recorded
  """
  deviceName: String
  """
  The device's form factor, as the client registered it or as seen at sign-in; UNKNOWN when neither said
  """
  deviceType: DeviceType!
  """
  Free storage in bytes, as a decimal string, when last reported; null when not reported
  """
  freeDiskStorage: String
  """Host names the device reports; empty when not reported"""
  hostNames: [String!]!
  """The server's id for this device registration"""
  id: ID!
  """
  Whether the device is in use. False once it is deactivated or removed,
