  DELETED
  ITEMS_BATCH_CLEARED
  ITEM_ADDED
  ITEM_COMPLETED
  ITEM_REMOVED
  ITEM_UNCOMPLETED
  ITEM_UPDATED
  STATUS_CHANGED
  UPDATED
}

interface Node {
  id: ID!
}

