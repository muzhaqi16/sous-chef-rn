  displayUnit: Unit
  """The soonest expiry date among the active batches."""
  earliestBatchExpiresOn: LocalDate
  """Whether expiry reminders are sent for this stack; true by default"""
  expirationAlert: Boolean!
  """
  The expiry date, with no time and no timezone. An item is not expired on this date: it expires today. It is expired from the next day on, judged on the viewer's calendar.
  """
  expiresOn: LocalDate
  """displayAmount's quantity in its unit, read in both unit systems."""
  held: Measure!
  """
  The exact amount held in the tracking unit: each batch by its own package size, a
  partly used package as its fraction (1.25 jars). quantity counts a partly used
  package as one; low stock is decided on this.
