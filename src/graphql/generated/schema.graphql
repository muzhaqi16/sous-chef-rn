  servingUnit: String
  """Milligrams."""
  sodium: Float
  """Grams. Named `carbohydrates` in the Json mirror."""
  totalCarbs: Float
  """Grams."""
  totalFat: Float
  """Grams."""
  totalSugars: Float
  """Grams."""
  transFat: Float
  """Micrograms."""
