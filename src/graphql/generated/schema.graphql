    currency: CurrencyCode
    """One barcode of the item; all of them when omitted"""
    gtin: String
    homeId: ID!
    """How far back usual counts: default 180 days, at most 365"""
    windowDays: Int
  ): HouseholdPriceSummary!
  """Unique identifier of the catalog item."""
  id: ID!
  """
  Number of distinct photos, NOT of image rows — size renditions are excluded.
