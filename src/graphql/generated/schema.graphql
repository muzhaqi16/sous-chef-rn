  ID of the unit the item's own netWeight is stated in, or null when unset.
  Unlike displayUnit, it ignores a matched product variation.
  """
  displayUnitId: ID
  """
  This item's records in external catalogs such as USDA or Open Food Facts, with each source's own data, oldest first. isPrimary marks the authoritative one.
  """
  externalSourcesConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
