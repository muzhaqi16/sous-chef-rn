"""
Input for adjusting pantry item quantity to match physical count.
Creates an ADJUSTMENT usage record for audit trail.
"""
input AdjustPantryItemQuantityInput {
  """
  The container weighed with what it holds, in the stack's net-weight unit: the
  recount records grossWeight − tareWeight as the remaining net weight. Refused
  with a ValidationError when the stack records no tare, when it weighs less
  than the tare, or together with remainingNetWeight.
  """
  grossWeight: Float
  """The unit grossWeight is stated in, as remainingNetWeightUnitId."""
  grossWeightUnitId: ID
  id: ID!
  idempotencyKey: ID
  """The actual quantity from physical count"""
  newQuantity: Float!
  """
  The unit newQuantity is stated in, when not the stack's: converted exactly
  within one kind (2.5 lb onto a gram stack; dozens onto pieces). Another kind
  is refused on this field. The recount's ledger row keeps it as stated.
  """
  newQuantityUnitId: ID
  """Why the adjustment was made (required for audit trail)"""
  reason: String!
  """
  The remaining net weight a full recount found (dual-tracked items only). On a stack
  holding batches it is spread over the batches that record a weight, in proportion to
  what each holds: a lower weight lowers the stack's value at cost, a higher weight does
  not raise it, and no consumption is recorded. Refused with a ValidationError on this
  field when no held batch records a weight.
  """
  remainingNetWeight: Float
  """
  The unit remainingNetWeight is stated in, when not the stack's net-weight
  unit: one of the same kind, never the tracking unit; refused on this field otherwise.
  """
  remainingNetWeightUnitId: ID
  """
  Optimistic concurrency control. REQUIRED: the caller is updating a row it
  already holds, so it has the version — and an update that silently skipped
  the check when the field was omitted is one that reports success while
  overwriting somebody else's concurrent edit.
  """
  version: Int!
}

type AdjustPantryItemQuantityPayload {
  pantry: Pantry
  pantryItem: PantryItem!
  storageLocation: StorageLocation
}

"""
Result of AdjustPantryItemQuantity. Select on AdjustPantryItemQuantityPayload for the
success case; every other member is a business error carrying a message.
Always include a __typename so the variant can be discriminated.
"""
union AdjustPantryItemQuantityResult = AdjustPantryItemQuantityPayload | ConflictError | ForbiddenError | NotFoundError | UnitEligibilityError | ValidationError

