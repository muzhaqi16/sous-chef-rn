}

"""
What every subscription event carries, whatever its domain. Each event adds
its own subtype enum and node.
"""
interface DomainEvent {
  """The user who caused the change; null for a background job"""
  actorUserId: ID
  """Whether the change created, updated or deleted"""
  mutation: MutationType!
  """When the change happened"""
  timestamp: DateTime!
}

"""
The pantry already holds this catalog item. `createPantryItem` without
`forceAdd` returns it when an active stack holds the item in any unit, naming
each one. `updatePantryItem` and `restorePantryItem` return it when the write
would open a second stack of the item in one unit. The client can route the
user to restock the existing stack, or resend with `forceAdd`. The `code` is
`PANTRY_ITEM_ALREADY_EXISTS`.
"""
type DuplicatePantryItemError implements Error {
  code: ErrorCode!
  """
  Active pantry items already stocking this catalog item — offer a one-tap restock.
  """
  existingPantryItemIds: [ID!]!
  message: String!
  """Suggested client action, e.g. `RESTOCK_EXISTING`."""
  suggestion: String
}

interface Edge {
  cursor: String!
}

