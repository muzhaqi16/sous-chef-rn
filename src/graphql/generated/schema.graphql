schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"""
Mark an OBJECT-TYPE field whose value only an admin may read.

Unlike `@adminSurface` (which widens where a root operation is reachable),
this NARROWS who may read a value, and it has real build-time behavior:
`removeAdminFields` strips every `@adminOnly` field from `publicSchema`, so a
client on the public port cannot even name it. `adminSchema` keeps it.

Removal is defense in depth, not the gate — the same argument the root-field
split makes: a regression in the resolver check cannot be exploited from the
public endpoint because the field is not there. The gate itself is an
`isAdmin(context)` guard in the field resolver, which throws
`AuthorizationError` for a non-admin caller reaching the field on the admin
port. Marking a field WITHOUT that guard leaves it readable there; the pair is
covered by test, not by the type system.

Because the value is either the real one or an error — never a placeholder
null — an `@adminOnly` field keeps the nullability its column has. Do not
loosen `T!` to `T` to make room for a soft-null; that publishes a permanently
null field to every caller and lies about the data.

Example:
  type LoginHistory {
    isAutomated: Boolean! @adminOnly
  }
"""
directive @adminOnly on FIELD_DEFINITION

"""
Mark a root Query/Mutation field as intentionally reachable on the ADMIN
schema (`:4100`, private network) even though it is not `@requireSystemRole`.

This is a BUILD-TIME SPLIT MARKER ONLY — it has no runtime behavior. No
directive transformer reads it; the sole consumer is `keepOnlyAdminRootFields`
in `splitSchema.ts`, which keeps a field on `adminSchema` when it is
`@requireSystemRole` OR `@adminSurface`. The public schema is unaffected
(`removeAdminFields` keys on `@requireSystemRole` for root fields), so a
`@adminSurface` field stays on the public API too.

ROOT FIELDS ONLY, and it WIDENS reach rather than restricting it. For the
opposite axis — an object-type field whose VALUE only admins may read — use
`@adminOnly`. Applying `@adminSurface` to an object field does nothing:
`keepOnlyAdminRootFields` never visits those.

It is NOT an authorization posture and never substitutes for one: a field
tagged `@adminSurface` MUST still carry `@auth`/`@optionalAuth`/`@public`/
`@requireAccess`/`@requireMembershipRole`/`@ownerOnly`, and the default-deny
audit (`assertRootFieldsHaveAuthPosture`) rejects a field whose only directive
is `@adminSurface`. Its only effect is to include an already-authorized,
already-existing operation in the admin view.

Why it exists: the admin panel runs against the admin port only and needs a
set of non-privileged operations (entity reads, reference-data CRUD, the auth
path) that the `@requireSystemRole`-driven split would otherwise leave on the
public API alone. Tagging is explicit and greppable so the admin surface is
auditable field-by-field.

Example:
  type Query {
    item(id: ID!): Item @auth @adminSurface
  }
"""
directive @adminSurface on FIELD_DEFINITION

"""
Require user authentication for this field or type.

When applied to a FIELD_DEFINITION, the auth check runs for that single
field. When applied to an OBJECT, the auth check is wrapped around every
field of that type — useful for types where every field is sensitive
(admin-only payloads, user-private records).

Returns UNAUTHENTICATED error if user is not logged in.

Example (field):
  type Query {
    myProfile: User @auth
  }

Example (type):
  type AdminStats @auth {
    totalUsers: Int!
    revenue: Float!
  }
"""
directive @auth on FIELD_DEFINITION | OBJECT

"""
Cache control directive for GraphQL fields and types

Examples:
- @cacheControl(maxAge: 3600) - Cache for 1 hour
- @cacheControl(maxAge: 0) - Don't cache (real-time data)
- @cacheControl(maxAge: 300, scope: PUBLIC) - Public cache for 5 minutes
"""
directive @cacheControl(
  """Whether to inherit max age from parent type"""
  inheritMaxAge: Boolean
  """Maximum age in seconds for cache TTL"""
  maxAge: Int
  """Scope of the cache (PUBLIC or PRIVATE)"""
  scope: CacheControlScope
) on FIELD_DEFINITION | INTERFACE | OBJECT | UNION

"""
Mark a mutation that a client never queues offline, so it needs no
`idempotencyKey` on its input.

The offline-replay coverage rule requires a key on the cumulative-write verbs
(restock, waste, adjust, consume, record, increment, convert, open), because a
queued write replayed after a flaky connection must not apply twice. Two kinds
of operation carry one of those verbs without carrying that risk:

- **Server-recorded events** — the server writes them in response to something
  that already happened, so no client queue holds a copy to replay.
- **Set-to-absolute corrections** — replaying writes the same value, so the
  operation is idempotent by construction rather than by a key.

Neither is visible in the SDL: a set-to-absolute input
(`netWeight: Float!`) and a cumulative one (`quantity: Float!`) have the same
shape. The distinction is semantic, so it is DECLARED here rather than derived
— beside the operation it describes, where a reviewer reading the mutation
sees it, and with a mandatory reason.

It is NOT an authorization posture and grants nothing. Its only effect is to
tell the operation-conventions check that this mutation's missing
`idempotencyKey` is intentional.

Example:
  type Mutation {
    adjustPantryItemWeight(input: AdjustPantryItemWeightInput!): AdjustPantryItemWeightResult!
      @auth
      @offlineReplayExempt(reason: "set-to-absolute weight correction")
  }
"""
directive @offlineReplayExempt(
  """
  Why this mutation is not offline-queued. Required — an unexplained exemption is the drift this directive exists to prevent.
  """
  reason: String!
) on FIELD_DEFINITION

"""
Mark a field as supporting OPTIONAL authentication.

- If the caller provides a valid JWT, the resolver sees a populated
  context.user (just like with @auth).
- If the caller provides NO token, the resolver runs anyway with
  context.user undefined — the field is treated as public.
- If the caller provides an INVALID/expired token, the auth pipeline
  swallows the error instead of throwing UNAUTHENTICATED. The resolver
  sees context.user undefined and serves public data.

Use this on read-only queries that personalize their result for
logged-in callers but should still be reachable anonymously, e.g.
recipe browsing where authenticated users also see their private
recipes.

Do NOT use this on mutations — there is no public-side analogue.

Example:
  type Query {
    recipe(id: ID!): Recipe @optionalAuth
  }
"""
directive @optionalAuth on FIELD_DEFINITION

"""
Require that the current user is the owner of the parent resource
Returns null for the field if user is not the owner (soft denial)
This is useful for sensitive fields that should only be visible to the owner

The owner check uses:
1. parent.userId (if exists) - compared to context.userId
2. parent.authorId (if exists) - for author-owned resources like recipes
3. parent.ownerId (if exists) - for explicitly owned resources

Example:
type User {
  email: String! @auth
  settings: UserSettings @ownerOnly
  notificationsConnection: NotificationConnection! @ownerOnly
}

type Recipe {
  privateNotes: String @ownerOnly
}
"""
directive @ownerOnly on FIELD_DEFINITION

"""
Mark a Query/Mutation field as INTENTIONALLY PUBLIC — reachable without
authentication. Use this only for the auth-bootstrap surface (login,
register, password reset, etc.) where there is no token yet.

Why this exists: schema startup performs a default-deny audit and refuses
to boot if any root-level field is missing one of @auth, @optionalAuth,
@requireMembershipRole, @requireAccess, @requireSystemRole, @ownerOnly, or @public.
Marking a field @public is the explicit way to say "yes, this is meant to
be unauthenticated" — so a forgotten directive on a new mutation is a
loud failure instead of a silent security hole.

Example:
  type Mutation {
    login(input: LoginInput!): AuthPayload! @public
    register(input: RegisterInput!): AuthPayload! @public
  }
"""
directive @public on FIELD_DEFINITION

"""
Require specific access level to a resource
Returns FORBIDDEN error if user doesn't have required access level

The resource ID is extracted from:
1. parent.id (for field resolvers)
2. args.id (for query/mutation arguments)

Access level mapping:
- OWNER role → OWNER, WRITE, READ access
- ADMIN/MEMBER roles → WRITE, READ access
- GUEST role → READ access

Example:
type ShoppingList {
  items: [Item!]! @requireAccess(resource: "ShoppingList", level: READ)
  collaborators: [Collaborator!]! @requireAccess(resource: "ShoppingList", level: OWNER)
}

type Mutation {
  deleteShoppingList(id: ID!): Boolean
    @requireAccess(resource: "ShoppingList", level: OWNER)
}
"""
directive @requireAccess(
  """Required access level"""
  level: AccessLevel!
  """Resource type (e.g., ShoppingList, Pantry, Home)"""
  resource: String!
) on FIELD_DEFINITION

"""
Require specific home membership role.
Returns FORBIDDEN error if user doesn't have required role.

Note: Uses existing MembershipRole enum (OWNER, ADMIN, MEMBER, GUEST).
Distinct from @requireSystemRole, which gates on the global UserRole
enum, and from the requireUserRole resolver helper.

Example:
type Mutation {
  deleteHome(id: ID!): Boolean @requireMembershipRole(role: OWNER)
}
"""
directive @requireMembershipRole(
  """Required membership role in the home"""
  role: MembershipRole!
) on FIELD_DEFINITION

"""
Require specific system-level user role.
Returns FORBIDDEN error if user doesn't have the required role.
Role hierarchy: SUPER_ADMIN > ADMIN > MODERATOR > USER
"""
directive @requireSystemRole(
  """Required system role from UserRole enum"""
  role: UserRole!
) on FIELD_DEFINITION

"""
Require that the caller's email address is verified.

Applies to the outward-facing writes — the ones that expose the caller's data
to another party, or admit another party into the caller's scope. An
unverified caller is refused with a top-level error carrying
`AUTH_EMAIL_NOT_VERIFIED` (HTTP 403), which a client shows as a
"verify your email" prompt rather than a generic permission error.

NOT AN AUTH POSTURE. It restricts a caller who is already authenticated and
says nothing about whether the field requires authentication at all, so it
never satisfies the default-deny audit on its own — a field carrying it MUST
also carry `@auth` / `@requireAccess` / `@requireMembershipRole` /
`@requireSystemRole`. Schema build fails otherwise.

ARGUMENT-CONDITIONAL FORM. Several mutations here serve BOTH directions of a
share: `shareShoppingList(input: {isPublic: false})` is how a list is
un-published, and `updateHome(input: {allowJoinCode: false})` is how a join
link is turned off. Gating those outright would strand an unverified account
with a share it cannot revoke. `whenInputTrue` names a Boolean field on the
operation's `input` argument; the gate engages ONLY when that field is
literally true. An omitted field, an explicit false, and an explicit null all
pass through.

The named field is checked when the schema is built — it must exist on the
input type and be a Boolean — because a typo would otherwise disable the gate
silently while every test of the ungated direction still passed.

Example (unconditional):
  type Mutation {
    inviteToHome(input: InviteToHomeInput!): InviteToHomeResult!
      @auth
      @requireVerifiedEmail
  }

Example (conditional — publishing is gated, un-publishing is not):
  type Mutation {
    shareShoppingList(input: ShareShoppingListInput!): ShareShoppingListResult!
      @auth
      @requireAccess(resource: "ShoppingList", level: OWNER)
      @requireVerifiedEmail(whenInputTrue: "isPublic")
  }
"""
directive @requireVerifiedEmail(
  """
  Name of a Boolean field on the operation's `input` argument. When given,
  the gate applies only if that field is literally true.
  """
  whenInputTrue: String
) on FIELD_DEFINITION

