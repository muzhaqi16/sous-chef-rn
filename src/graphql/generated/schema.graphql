  and a minQuantity set, falling to or below the minimum notifies the home.
  """
  lowStockAlert: Boolean!
  """
  The low-stock threshold in the tracking unit: the stack is low at or below it. Null when no minimum is set.
  """
  minQuantity: Float
  """
