  FREQUENTLY_ADDED
  """Item is below minimum stock threshold - needs restocking"""
  LOW_STOCK
  """Globally popular pantry item"""
  POPULAR
  """Item was recently removed from this pantry"""
  RECENTLY_DELETED
}

