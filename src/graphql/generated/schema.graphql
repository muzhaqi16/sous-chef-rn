  CONTAINER
  """
  A continuous or universal amount (gram, ounce, cup, tablespoon, milliliter,
  piece, item, dozen). Converts by unit factor within its dimension.
  """
  MEASUREMENT
  """
  A discrete part of one item (slice, clove, head, bulb, stalk, sprig, leaf,
  bunch, serving, stick, handful). Converts only through the item's own facts
  or the stack's portion definition.
