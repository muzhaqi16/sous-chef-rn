    """
    limit: Int = 10
    """The viewer's calendar date, which expiringSoon counts from."""
    today: LocalDate!
  ): PantrySuggestions!
  tags: [String!]!
  temperature: String
  updatedAt: DateTime!
  usageAnalytics(filters: AnalyticsFilters): UsageAnalytics!
