  actorUserId: ID
  """
  Mutation kind for this event. UPDATED for ACCOUNT_UPDATED / PROFILE_CHANGED
  and the moderation subtypes (BANNED / UNBANNED / SUSPENDED / UNSUSPENDED /
  WARNED); CREATED for ADDED_TO_*; DELETED for REMOVED_FROM_*.
