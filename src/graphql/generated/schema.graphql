"""
Describes the type of mutation that triggered a real-time subscription event
"""
enum MutationType {
  """A new collaborator was added to a shared resource"""
  COLLABORATOR_ADDED
  """A collaborator was removed from a shared resource"""
  COLLABORATOR_REMOVED
  """A resource was marked as completed"""
  COMPLETED
  """A new resource was created"""
  CREATED
  """A resource was deleted or soft-deleted"""
  DELETED
  """Multiple items were cleared from a list in a single batch operation"""
  ITEMS_BATCH_CLEARED
  """A new item was added to a list or collection"""
  ITEM_ADDED
  """An item was marked as completed or purchased"""
  ITEM_COMPLETED
  """An item was removed from a list or collection"""
  ITEM_REMOVED
  """A previously completed item was reverted to an active state"""
  ITEM_UNCOMPLETED
  """An existing item within a list was modified"""
  ITEM_UPDATED
  """Resources were folded into one: the event's node is the survivor"""
  MERGED
  """The status of a resource changed"""
  STATUS_CHANGED
  """An existing resource was modified"""
  UPDATED
}

"""
Limited moderation view for users checking their own status.
Excludes internal scoring and moderator notes.
"""
type MyModerationStatus {
  appealNotes: String
  appealStatus: AppealStatus
  appealedAt: DateTime
  banReason: String
  """Why the ban is in force; null when not banned."""
  banReasonCode: ModerationReasonCode
  """The moderation record's id; the user's own id while no record exists"""
  id: ID!
  isBanned: Boolean!
  isSuspended: Boolean!
  restrictedUntil: DateTime
  restrictionReason: String
  """Why restrictions are in force; null when none are."""
  restrictionReasonCode: ModerationReasonCode
  restrictions: [ModerationRestriction!]!
  status: ModerationStatus!
  suspendedUntil: DateTime
  suspensionReason: String
  """Why the suspension is in force; null when not suspended."""
  suspensionReasonCode: ModerationReasonCode
  trustLevel: TrustLevel!
  underReview: Boolean!
}

"""
A report as its reporter sees it: what was reported and where it stands. It
never carries the moderator, the resolution or any action taken.
"""
type MyUserReport {
  contentId: ID
  contentType: ModerationContentType
  createdAt: DateTime!
  description: String
  id: ID!
  reportedUserId: ID!
  status: ReportStatus!
  type: ReportType!
}

"""
A page of MyUserReport results. Read "edges" for the rows and "pageInfo" to decide
whether to request another page.
"""
type MyUserReportConnection implements Connection {
  """The rows in this page, in the connection's sort order."""
  edges: [MyUserReportEdge!]!
  """Cursors and flags describing where this page sits in the full result."""
  pageInfo: PageInfo!
  """
  Total rows matching the query across all pages. Computed only when selected; null when not available.
  """
  totalCount: Int
}

"""
One MyUserReport in a paginated result, paired with the cursor that identifies its
position. Pass the cursor as "after" to resume from just past this edge.
"""
type MyUserReportEdge implements Edge {
  """Opaque position marker for this edge. Do not parse or construct it."""
  cursor: String!
  """The MyUserReport this edge wraps."""
  node: MyUserReport!
}

"""Reusable sub-input for net weight with unit"""
input NetWeightInput {
  netWeight: Float
  netWeightUnitId: ID
}

"""
What an item's netWeight measures. Only PACKAGE seeds a pantry row or bridges
a count to a measure; SERVING and REFERENCE (a 100 g nutrition basis) stay
visible without being mistaken for a bottle. Absent means unknown.
"""
enum NetWeightKind {
  PACKAGE
  REFERENCE
  SERVING
}

"""Reusable sub-input for network and location info"""
input NetworkLocationInput {
  ipAddress: String
  ipCity: String
  ipCountry: String
  ipRegion: String
  isProxy: Boolean
  isTor: Boolean
  isVpn: Boolean
  """
  The device's BCP 47 locale (en-US, en-US-u-ms-metric). Its measurement
  keyword or region decides the unit system of a user whose
  preferredUnitSystem is SYSTEM. Send null rather than guess: an omitted
  value keeps the one recorded.
  """
  language: String
  timezone: String
}

"""
A referenced resource does not exist (or is not visible to the caller).
"""
type NotFoundError implements Error {
  code: ErrorCode!
  message: String!
  """Logical resource type, e.g. `MealPlan`."""
  resource: String
  """Identifier the caller supplied, when applicable."""
  resourceId: ID
}

"""Notification type for user alerts and messages"""
type Notification {
  """Deep link or CTA destination for this notification."""
  actionUrl: String
  """
  The bulk send this notification went out in, when its sender named one.
  Filter on it with NotificationFilters.batchId.
  """
  batchId: String
