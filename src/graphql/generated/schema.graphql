  forQuantity: Float!
  forUnit: Unit!
  id: ID!
  note: String
  parts: [IngredientSubstitutePart!]!
  """Curated order among one concept's substitutes, lowest first"""
  position: Int!
  role: SubstituteRole
  updatedAt: DateTime!
  version: Int!
}

"""A substitute as one recipe ingredient is offered it."""
type IngredientSubstituteOption {
  """
  The home's PREFERENCE and GOAL alerts the parts raise; an allergy or intolerance drops the option
  """
  alerts: [DietaryAlert!]!
  parts: [SubstitutePartAmount!]!
