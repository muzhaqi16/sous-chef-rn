  needed: Float!
  needsToBuy: Boolean!
  """
  What the given shopping list's unbought line for the item already covers, in the ingredient's unit; 0 without a list
  """
  onShoppingList: Float!
  """
  Stacks of this ingredient whose amount could not be expressed in the
  ingredient's unit (a head of garlic with no clove anchor, say). They are
  excluded from the available total rather than counted as one each.
  """
  unconvertibleItems: [PantryItem!]!
  unit: Unit!
}

"""
One Pantry in a paginated result, paired with the cursor that identifies its
position. Pass the cursor as "after" to resume from just past this edge.
"""
type PantryEdge implements Edge {
  """Opaque position marker for this edge. Do not parse or construct it."""
  cursor: String!
  """The Pantry this edge wraps."""
  node: Pantry!
}

"""
Real-time notification for pantry domain mutations.
Clients subscribe once per pantry; the subtype field routes payload interpretation.
"""
type PantryEvent implements DomainEvent {
  """
  The user who caused the change — never the user it happened TO. Null when
  the change was system-initiated (a background job) or the acting user is
  unknown. For suppressing the echo of your own write, prefer
  originatorClientId: this field cannot tell your two devices apart.
  """
  actorUserId: ID
  mutation: MutationType!
  node: PantryEventNode!
  """
  Device/client that triggered the change (for echo suppression). Compare it
  against your own device id: a match means this event is the echo of your
  own write. Null when no device caused the change (a background job) or the
  request sent no device id.
  """
  originatorClientId: ID
  pantryId: ID!
  parents: PantryEventParents!
  subtype: PantrySubtype!
  timestamp: DateTime!
}

"""
The entity a pantry event refers to. Branch on __typename to learn which
part of the pantry changed.
"""
union PantryEventNode = ExpirationNotification | Pantry | PantryItem | PantryItemUsage

"""Parent resource IDs for cache updates without refetch."""
type PantryEventParents {
  homeId: ID!
}

"""
Filters for querying pantries. The home a page covers is the query's own
homeId argument — required on pantries, optional on adminPantries.
"""
input PantryFilters {
  """Filter by default status"""
  isDefault: Boolean
  """Search by name, description, or location"""
  search: String
}

"""Real-time collaborative type - never cache"""
type PantryItem {
  """
  How the stack was first acquired: PURCHASED unless stated, SHOPPING_LIST when moved in from a shopping list
  """
  acquisitionMethod: AcquisitionMethod!
  """
  How many active batches the stack holds; 0 when it holds its stock outside batches
  """
  activeBatchCount: Int!
  """When the stack was added to the pantry"""
  addedAt: DateTime!
  """The user who added this stack; null when unknown"""
  addedBy: User
  """
  This stack's own brand, independent of the catalog item's brands; null when none is set
  """
  brand: Brand
  """
  The id of this stack's own brand, independent of the catalog item's brands; null when none is set
  """
  brandId: ID
  """The audit trail of changes to this stack, most recent first"""
  changeHistoryConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
  ): PantryItemChangeConnection!
  """
  The stack's physical condition; GOOD unless set. A daily check marks it EXPIRED
  once expiresOn has passed everywhere, which can lag the viewer's own date, so
  decide expiry from expiresOn. Writing off expired stock sets SPOILED.
  """
  condition: ItemCondition!
  """
  The currency totalCost and costPerUnit are denominated in. Null when they
  are, and null with them when the costed batches disagree about currency —
  a sum across currencies is not a value, so none is reported.
  """
  costCurrency: Currency
  """
  Value of the REMAINING stock, per unit of quantity — derived from the
  item's active batches alongside quantity itself.
  
  A DISPLAY RATE over totalCost, which is the authoritative figure. It is
  rounded to cents, so multiplying it back by quantity does not reproduce
  totalCost; render totalCost for value rather than recomputing it.
  
  Null, not zero, when no remaining batch carries a known cost: an unpriced
  pantry has no average, and reporting one as $0.00 is worse than reporting
  nothing. For what a particular acquisition cost, read its batch.
  """
  costPerUnit: Float
  """When the stack was created"""
  createdAt: DateTime!
  """Density for this stack in g/mL; the catalog's applies when null."""
  densityOverride: Float
  """
  What the stack holds as it is shown: in displayUnit when that is a whole number
  or an exact common fraction of it (1 doz, ½ doz, 1¼ doz), otherwise in the unit
  it is counted in (11 pc). A count multiple is never shown as a decimal.
  """
  displayAmount: DisplayAmount!
  """
  The unit this stack is shown in when it is counted in another: a dozen, for a
  stack counted in pieces. Null when it is shown in the unit it is counted in.
  """
  displayUnit: Unit
  """The soonest expiry date among the active batches."""
  earliestBatchExpiresOn: LocalDate
  """Whether expiry reminders are sent for this stack; true by default"""
  expirationAlert: Boolean!
  """
  The expiry date, with no time and no timezone. An item is not expired on this date: it expires today. It is expired from the next day on, judged on the viewer's calendar.
  """
  expiresOn: LocalDate
  """
  The exact amount held in the tracking unit: each batch by its own package size, a
  partly used package as its fraction (1.25 jars). quantity counts a partly used
  package as one; low stock is decided on this.
  """
  heldQuantity: Float!
  """The stack's id: one item, in one unit, in one pantry"""
