  """
  Machine-readable status code (e.g., SUCCESS, VALIDATION_ERROR, NOT_FOUND)
  """
  code: String!
  """Human-readable message describing the result"""
  message: String!
  """Whether the mutation operation succeeded"""
  success: Boolean!
}

