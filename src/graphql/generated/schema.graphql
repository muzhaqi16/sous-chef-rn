"""
Input validation failure. Either a top-level rule was violated or a
specific field failed validation (carried in `field`).
"""
type ValidationError implements Error {
  code: ErrorCode!
  """
  Dotted path to the first offending field, when the error is field-specific.
  """
  field: String
  """
  Every rule the input failed, one entry per message; never empty. A rule on
  the whole input has the path _root.
  """
  issues: [ValidationIssue!]!
  message: String!
}

"""One failed validation rule."""
type ValidationIssue {
  message: String!
  """Dotted path to the input field; _root for a rule on the whole input"""
  path: String!
}

