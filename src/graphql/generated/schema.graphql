  name: String
  symbol: String
}

"""
What a unit is. The role ranks a unit in the consume and restock pickers; it
never decides whether a stack accepts it, which is whether it converts.
"""
enum UnitRole {
  """
  Packaging (tub, can, jar, bottle, bag, box, package, carton, tube, case,
  pack). Converts only through the item's own facts — a package hierarchy row
  such as "1 case = 12 cans", a conversion row — or the stack's net weight.
  """
  CONTAINER
  """
  A continuous or universal amount (gram, ounce, cup, tablespoon, milliliter,
  piece, item, dozen). Converts by unit factor within its dimension.
  """
  MEASUREMENT
  """
  A discrete part of one item (slice, clove, head, bulb, stalk, sprig, leaf,
  bunch, serving, stick, handful). Converts only through the item's own facts
  or the stack's portion definition.
  """
  PORTION
}

"""
Why a picker ranks a unit where it does. Every unit a picker returns is
accepted by the matching write, whatever its source.
"""
enum UnitSource {
  """Converts into the stack, with no curation for this operation"""
  AUTO
  """
  Curated for this operation: an ItemUnit usage context or retail flag, Item.defaultConsumeUnit, the stack's own portion or consume unit, or Item.suggestedConsumeUnit
  """
  CURATED
  """The stack's tracking unit"""
  TRACKING_UNIT
}

"""
How a user reads weights and volumes. IMPERIAL is US customary. A teaspoon,
tablespoon, pinch or dash belongs to both; a count, container or portion to
neither.
"""
enum UnitSystem {
  """US customary: oz, lb, cup, fl oz, pt, qt, gal"""
  IMPERIAL
  """Metric: g, kg, mL, L"""
  METRIC
  """
  The region of the requesting device's registered locale
  (NetworkLocationInput.language): the US, Liberia and Myanmar read IMPERIAL,
  every other region METRIC. With no region known, the unit pickers offer both
  systems and conversions read metric.
  """
  SYSTEM
}

enum UnitType {
  AREA
  COUNT
  LENGTH
  TIME
  VOLUME
  WEIGHT
}

enum UnitUsageContext {
  BULK
