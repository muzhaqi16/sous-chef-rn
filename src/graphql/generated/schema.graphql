input SyncPantryItemInput {
  brand: BrandRefInput
  clientId: ID!
  expirationAlert: Boolean
  """
  The expiry date as YYYY-MM-DD, with no time and no timezone. Null clears it
  where the field may be cleared.
  """
  expiresOn: LocalDate
  """
  When the pantry already holds this item in the resolved unit, add the quantity to that
  stack and return it instead of refusing with DuplicatePantryItemError. A pantry holds one
  active stack per item per unit. The added stock is measured by this input's own net weight
  and records its linked purchase. Stack-level fields (brand, storage, tags, thresholds and
  the item name) are not applied to the held stack.
  """
  forceAdd: Boolean
  isComposted: Boolean
  isRecycled: Boolean
  """
  The catalog item the stack holds; required when the sync creates it, ignored when it updates
  """
  item: PantryItemSourceInput
  lastUsedAt: DateTime
  """
  Opt-in for low-stock notifications on this stack (default false): with it on
  and a minQuantity set, falling to or below the minimum notifies the home.
  """
  lowStockAlert: Boolean
  netWeight: NetWeightInput
  pantryId: ID!
  purchase: PurchaseInfoInput
  quantity: Float
  storage: StorageDetailsInput
  tags: [String!]
  thresholds: InventoryThresholdsInput
  """
  The viewer's calendar date. With no expiresOn, the expiry is this date plus the
  item's shelf life; without it no expiry is set. Send the date the user acted, not the
  replay date. Applies to a create only; an update never derives an expiry.
  """
  today: LocalDate
  unit: UnitRefInput
  """
  The label shown for the unit, e.g. "cans" on a stack counted in piece. When
  omitted: the name the unit reference used, else the item's name for the unit,
  else the unit's symbol.
  """
  unitLabel: String
  version: Int
  wasteReason: WasteReason
}

type SyncPantryItemPayload {
  clientId: ID!
  conflict: SyncConflictInfo
  """
  True when this sync CONVERGED on a pre-existing row (the client id matched,
  so it was an update/replay rather than a fresh create). The canonical,
  API-wide replay flag.
  """
  converged: Boolean!
  item: PantryItem
  operation: SyncOperation!
  serverId: ID
}

"""
Result of SyncPantryItem. Select on SyncPantryItemPayload for the
success case; every other member is a business error carrying a message.
Always include a __typename so the variant can be discriminated.
"""
union SyncPantryItemResult = ConflictError | ForbiddenError | NotFoundError | SyncPantryItemPayload | ValidationError

