  """
  sharedListUpdates: Boolean!
  """
  Whether shopping-list update notifications are created, such as a shared
  list being completed. Off by default.
  """
  shoppingListUpdates: Boolean!
  """
  Saved preference for SMS notifications; off by default. The server sends
  no SMS.
  """
  smsEnabled: Boolean!
  """When the preferences last changed"""
  updatedAt: DateTime!
  """The user these preferences belong to"""
  user: User!
  """ID of the user these preferences belong to"""
  userId: ID!
  """
  Saved preference for a weekly digest; off by default. The server does not
