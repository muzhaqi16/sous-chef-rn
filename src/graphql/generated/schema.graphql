"""
Represents a dietary preference or restriction that influences recipe and meal recommendations
"""
enum Diet {
  """
  Excludes all foods containing gluten proteins found in wheat, barley, and rye
  """
  GLUTEN_FREE
  """High-fat, very low-carbohydrate diet that promotes ketosis"""
  KETO
  """Excludes meat, fish, and eggs but allows dairy products"""
  LACTO_VEGETARIAN
  """Limits fermentable carbohydrates that can trigger digestive issues"""
  LOW_FODMAP
  """Excludes meat, fish, and dairy but allows eggs"""
  OVO_VEGETARIAN
  """
  Focuses on whole foods that mimic pre-agricultural diets, excluding grains, legumes, and dairy
  """
  PALEO
  """Excludes meat but allows fish, dairy, and eggs"""
  PESCETARIAN
  """
  Similar to paleo but allows some dairy products, especially raw and fermented
  """
  PRIMAL
  """Excludes all animal products including dairy, eggs, and honey"""
  VEGAN
  """Excludes meat and fish but allows dairy and eggs"""
  VEGETARIAN
  """
  Strict 30-day elimination diet that removes sugar, alcohol, grains, legumes, soy, and dairy
  """
  WHOLE30
}

"""
A member restriction a subject may break, with the strongest evidence. No alert means only no evidence, never safe.
"""
type DietaryAlert {
  """
  The evidence's own name: an allergen, an item, an analysis tag or a department
  """
  matched: String!
  """
  The member's membership of the home; its displayName is the name to show
  """
  membership: Membership!
  restriction: SharedDietaryRestriction!
  source: DietaryAlertSource!
  state: DietaryAlertState!
}

"""
What kind of evidence raised a dietary alert; the client writes the copy per kind.
"""
enum DietaryAlertSource {
  """
  An allergen the product declares, or one found in an ingredient's name; matched is its name
  """
  ALLERGEN
  """
  The subject is at or below an avoided catalog item; matched is that item's name
  """
  AVOIDED_ITEM
  """
  The store department the subject sits in, such as MEAT_SEAFOOD; only ever MAY_CONTAIN
  """
  DEPARTMENT
  """
  An Open Food Facts ingredients analysis, such as non-vegan; matched is the tag without its language prefix
  """
  INGREDIENTS_ANALYSIS
}

"""
How strongly the evidence says a subject holds what a restriction avoids.
"""
enum DietaryAlertState {
  CONTAINS
  MAY_CONTAIN
}

"""
What a user eats and plans for: restrictions, tastes, daily nutrition goals
and cooking limits. One per account. A meal plan linked to it measures its
nutrition against these goals.
"""
type DietaryProfile {
  """The budget for one meal, in the user's preferred currency."""
  budgetPerMeal: Float
  """
  Daily calorie goal in kcal. A meal plan linked to this profile measures its daily average against it; null or 0 when no goal is set.
  """
  calorieTarget: Int
  """
  Daily carbohydrate goal in grams, measured as calorieTarget is; null or 0 when no goal is set
  """
  carbsTarget: Int
  """How much cooking experience the user claims; null when not stated"""
  cookingSkillLevel: CookingSkillLevel
  """When the profile was created"""
  createdAt: DateTime!
  """
  Ingredients the user dislikes, as free text; empty when none. Nothing screens against it: avoided items are restrictions
  """
  dislikedIngredients: [String!]!
  """
  Daily fat goal in grams, measured as calorieTarget is; null or 0 when no goal is set
  """
  fatTarget: Int
  """Ingredients the user favours, as free text; empty when none"""
  favoriteIngredients: [String!]!
  """The profile's unique identifier"""
  id: ID!
  """
  The longest cooking time the user wants, in minutes; 60 by default, null once cleared
  """
  maxCookTimeMinutes: Int
  """
  The longest preparation time the user wants, in minutes; 45 by default, null once cleared
  """
  maxPrepTimeMinutes: Int
  """Meals a day the user plans for; 3 by default"""
  mealsPerDay: Int!
  """Cuisines the user prefers; empty when none"""
  preferredCuisines: [Cuisine!]!
  """
  Daily protein goal in grams, measured as calorieTarget is; null or 0 when no goal is set
  """
  proteinTarget: Int
  """
  The religious diet the user follows; null when none is set. Private to the user, never shared with a home
  """
  religiousDiet: ReligiousDiet
  """
  The diets, intolerances and health goals the user follows, at most 100; empty when none
  """
  restrictions: [DietaryRestriction!]!
  """Snacks a day the user plans for; 1 by default"""
  snacksPerDay: Int!
  """When the profile was last written"""
  updatedAt: DateTime!
  user: User!
  """The account the profile belongs to"""
  userId: ID!
}

