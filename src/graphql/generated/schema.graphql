"""Category type for organizing items"""
type Category {
  """Active child categories the caller can see, by sort order, then name"""
  children(
    """At most this many: default 50, at most 50 (a larger value gives 50)"""
    limit: Int = 50
  ): [Category!]!
  """Display color in hex; null when none"""
  color: String
  """When the category was created"""
  createdAt: DateTime!
  """
  The user who created the category; null when none is recorded or the account is gone
  """
  createdBy: User
  """Free text about the category; null when none"""
  description: String
  """Icon name or URL; null when none"""
  icon: String
  """The category's unique identifier"""
  id: ID!
  """
  Whether the category is in use; an inactive one is left out of children
  """
  isActive: Boolean!
  """Whether the category came with the system rather than from a user"""
  isSystem: Boolean!
  """
  How many items are filed under the category. Kept by every write that files or unfiles an item and reconciled weekly, so it can lag a concurrent write.
  """
  itemCount: Int!
  """Display name; no two live categories share one"""
  name: String!
  """
  The category this one sits under; null for a top-level category, and null when the caller may not see the parent
  """
  parent: Category
  """URL slug; no two live categories share one"""
  slug: String!
  """Position among its siblings, lowest first; 0 when none is set"""
  sortOrder: Int!
  """
  The store department set on the category itself; null when it takes its nearest ancestor's, or none
  """
  storeDepartment: StoreDepartment
  """What the category classifies"""
  type: CategoryType!
  """When the category was last written"""
  updatedAt: DateTime!
  """
  How many different users have filed an item under the category, kept and reconciled as itemCount is
  """
  usageCount: Int!
  """
  The category's version, which advances when the category is edited; its counters do not move it
  """
  version: Int!
  """
  Who can see the category: anything but PUBLIC is visible to admins only
  """
  visibility: Visibility!
}

"""
A page of Category results. Read "edges" for the rows and "pageInfo" to decide
whether to request another page.
"""
type CategoryConnection implements Connection {
  """The rows in this page, in the connection's sort order."""
  edges: [CategoryEdge!]!
  """Cursors and flags describing where this page sits in the full result."""
  pageInfo: PageInfo!
  """
