  """
  quietHoursStart: String
  """
  IANA time zone the quiet hours, the daily expiry delivery times and the
  weekly digest day are read in, such as America/New_York. UTC by default,
  and read as UTC when null.
  """
  quietHoursTimezone: TimeZone
  """
  Whether notifications about a recipe being saved are created; off by
  default. The server creates no such notifications, so it has no effect.
  """
  recipeRecommendations: Boolean!
  """
  Saved preference for updates to shared lists; off by default. The server
