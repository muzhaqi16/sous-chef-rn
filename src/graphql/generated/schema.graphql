"""
Pantry/storage location for a home. Responses that include it are not
cached, since its items change often.
"""
type Pantry {
  createdAt: DateTime!
  description: String
  home: Home!
  homeId: ID!
  id: ID!
  isDefault: Boolean!
  """Paginated list of items in this pantry"""
  itemsConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    filters: PantryItemFilters
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    orderBy: PantryItemOrderBy
  ): PantryItemConnection!
  ledgerAnalytics(filters: AnalyticsFilters, granularity: PeriodGranularity, itemId: ID): LedgerAnalytics!
  location: String
  metadata: JSON
  name: String!
  """
  Every stack removed from this pantry, most recently removed first. Each can
  be put back with restorePantryItem, which refuses when the pantry already
  holds that item in that unit. Bounded field: limit defaults to 10 and is
  clamped server-side to a maximum of 50.
  """
  recentlyDeletedItems(limit: Int = 10): [PantryItem!]!
  """
  Counts for this pantry. today is the viewer's calendar date, which the
  expiring and expired counts are judged on.
  """
  stats(today: LocalDate!): PantryStats!
  storageLocationsConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    orderBy: StorageLocationOrderBy
  ): StorageLocationConnection!
  """Items worth adding to this pantry, from the chosen sources"""
  suggestions(
    expirationDays: Int = 7
    """At most this many: default 10, at most 50 (a larger value gives 50)"""
    limit: Int = 10
    sources: [PantrySuggestionSource!]
    """The viewer's calendar date, which EXPIRING_SOON counts from."""
    today: LocalDate!
  ): [PantryItemSuggestion!]!
  tags: [String!]!
  temperature: String
  updatedAt: DateTime!
  usageAnalytics(filters: AnalyticsFilters): UsageAnalytics!
  """
  Usage statistics for this pantry.
  Available for all users but primarily used by admin views.
  """
  usageStats: PantryUsageStats
  version: Int!
  wasteAnalytics(filters: AnalyticsFilters): WasteAnalytics!
}

"""
A page of Pantry results. Read "edges" for the rows and "pageInfo" to decide
whether to request another page.
"""
type PantryConnection implements Connection {
  """The rows in this page, in the connection's sort order."""
  edges: [PantryEdge!]!
  """Cursors and flags describing where this page sits in the full result."""
  pageInfo: PageInfo!
  """
  Total rows matching the query across all pages. Computed only when selected; null when not available.
  """
  totalCount: Int
}

"""Deficit calculation for recipe ingredients"""
