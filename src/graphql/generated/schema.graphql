"""
User account type
Cache: 5 minutes - user data changes occasionally, always private
"""
type User {
  """
  The user's saved addresses, newest first by default. Empty unless the
  caller is this user or an admin.
  """
  addressesConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    """Sort order; newest first when omitted"""
    orderBy: UserAddressOrderBy
  ): UserAddressConnection!
  """Whether this user can access developer tools and internal dashboards"""
  canAccessDevTools: Boolean!
  """
  Personal shopping lists (lists not in a home) on which the user is an
  active collaborator, newest first by default. Empty for anyone but the user
  themselves, admins included.
  """
  collaboratedShoppingListsConnection(
    """Resume after this cursor: a previous page's endCursor"""
    after: String
    """Resume before this cursor: a previous page's startCursor"""
    before: String
    """Page size, reading forward: default 20, at most 100"""
    first: Int
    """Page size, reading backward: default 20, at most 100"""
    last: Int
    """Sort order; newest first when omitted"""
    orderBy: ShoppingListOrderBy
  ): ShoppingListConnection!
  """
  The user's cooking log entries, most recently cooked first by default.
  Empty unless the caller is this user or an admin.
