  What one tracking unit holds when the catalog defines it as a package of the
  item: a case of 12 cans, with the catalog's net weight per can when it records
  one. Null when the tracking unit is not such a package.
  """
  packageBreakdown: PackageBreakdown
  """
  netWeight in netWeightUnit, read in both unit systems. Its declared figure
