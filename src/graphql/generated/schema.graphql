"""Input for ingredient usage when marking recipe as cooked"""
input IngredientUsageInput {
  actualQuantity: Float!
  actualUnitId: ID!
  """
  A pantry stack to draw on first for this ingredient: one of the
  ingredient's own item or an item under its concept, else a ValidationError.
  The rest of the stacks under the concept follow: opened first, then the
  soonest expiry. With exactStacks it is required, must be in the pantry
  deducted from, and is the only stack the entry draws on. An ingredient
  with no catalog item has no stack to prefer, so naming one is a
  ValidationError; with exactStacks the entry's stack is drawn as stated.
  """
  pantryItemId: ID
  recipeIngredientId: ID!
  """
  A substitute RecipeIngredient.substitutes offered; the entry draws one part from pantryItemId, required.
  The ingredient may have one entry per part, all naming it; its own stacks are then not drawn.
  """
  substituteId: ID
}

"""
A catalog item described inline, for a stack whose item may not exist yet
"""
input InlineItemInput {
  brand: String
  """
  The category of the item created inline. A name that matches nothing
  creates a CUSTOM category and links it, the same way a new brand name is
  handled; an id or slug must name a category the caller can see.
  """
  category: CategoryRefInput
  description: String
  displayUnitId: ID
  """
  Client-minted CUID2 for the item, so a client can name it before the
  server answers. A created item takes this id. One that matched an existing
  item by barcode or name is remembered under it, so a later write naming it
  acts on that item, and `item(id)` reads it, for anyone who may see the
  item. Sent again, it answers the same item without matching anew. An id
  an item the caller cannot see holds is refused with a ConflictError.
  """
  id: ID
  """
  The name an item created inline takes, cleaned as createItem's and at most
  128 characters. Blank or absent, the server names the item.
  """
  name: String
  netWeight: Float
  netWeights: [ItemNetWeightInput!]
  units: [ItemUnitInput!]
