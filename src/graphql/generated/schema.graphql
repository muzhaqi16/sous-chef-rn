  store: Store
  """
  The store this stack was bought at when it was added; a later restock's store is on its batch. Null when none was given.
  """
  storeId: ID
  """Free-form labels on this stack; empty when none"""
  tags: [String!]!
  """tareWeight in netWeightUnit, read in both unit systems; null with it."""
  tare: Measure
  """
  The empty container's weight, in netWeightUnit: a recount by grossWeight records gross − tare. Null when none is recorded.
  """
  tareWeight: Float
