"""
Where a list is cheapest, from recorded prices. Each candidate prices the
list's comparable lines (unpurchased, a catalog item, a unit that converts
without an assumption) at its own median, a branch filling a gap from its
chain, then from any store. Prices are counted as itemPriceComparison counts
them; no household's prices are revealed.
