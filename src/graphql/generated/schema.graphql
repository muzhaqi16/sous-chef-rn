  declared figure is the stack's barcode record's label where it states this
  size. Null with netWeight.
  """
  packageSize: Measure
  pantryItemId: ID!
  """This batch's own portions per tracking unit (an 18-egg pack is 18)."""
  portionsPerTrackingUnit: Float
  """
  The purchase this acquisition was recorded under; null when none is. Its
  purchaseDate is when the stock was bought, a receipt's day for a receipt,
  where createdAt is when the batch was recorded.
  """
  purchase: Purchase
  """
  The purchase this acquisition was recorded under, where one exists. A
  restock's purchase belongs here rather than on the item, whose purchaseId
  names only the acquisition that first stocked it.
  """
  purchaseId: ID
  quantity: Float!
  """
  remainingNetWeight in the stack's net-weight unit, read in both unit systems; null with it.
