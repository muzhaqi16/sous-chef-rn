  HOUSEHOLD_ITEM_PHOTO
  ITEM_IMAGE
  PROFILE_AVATAR
  PROFILE_COVER
  """
  A receipt photo for createReceiptParse: at most 4 MB and 4000 px on its longest edge, never served, deleted once parsed
  """
  RECEIPT_PHOTO
  """
  A cookbook page photo for createRecipeCapture: at most 4 MB and 4000 px on its longest edge, never served, deleted once read
  """
  RECIPE_PHOTO
}

"""A catalog item a parsed line may name, and how well it matches."""
type IngredientCandidate {
  item: Item!
  """0 to 1, from the name and its meaning; comparable within one line"""
  score: Float!
}

"""How sure a parsed ingredient line's best catalog candidate is."""
enum IngredientMatchConfidence {
  """
  Named exactly, or clearly ahead of every other candidate: a capture links it
  """
  CONFIDENT
  """Nothing in the catalog is close enough to propose"""
  NONE
  """Candidates exist, none clearly ahead: offered for review, never linked"""
  UNSURE
}

"""A curated swap for a concept in a recipe, managed by admins."""
