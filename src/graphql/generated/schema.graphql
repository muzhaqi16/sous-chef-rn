  updateCookingLog(id: ID!, input: UpdateCookingLogInput!): CookingLogPayload!
  updateCurrency(id: ID!, input: UpdateCurrencyInput!): CurrencyPayload!
  """
  Update a device. Consolidated mutation that handles all device updates including:
  - Status changes (trust, verify, activate/deactivate)
  - Location updates
  - Push token management
  - Hardware info updates
  - Battery info updates
  - Peripheral updates
  - Soft delete
  """
  updateDevice(id: ID!, input: UpdateDeviceInput!): DevicePayload!
  updateDietaryProfile(input: UpdateDietaryProfileInput!): DietaryProfilePayload!
  updateExternalSource(id: ID!, input: UpdateExternalSourceInput!): ExternalSourceMappingPayload!
  updateFavoriteRecipe(input: UpdateFavoriteRecipeInput!, recipeId: ID!): SavedRecipePayload!
  updateHome(id: ID!, input: UpdateHomeInput!): HomePayload!
  """
  Update an item. Consolidated mutation that handles:
  - Basic fields (name, description, type, etc.)
  - Categories (set, add, remove)
  - Brands (set, add, remove)
  - Units (set, add, remove, default)
  - Tags (set, add, remove)
  - Nutrition facts, allergens, ingredients
  - Images
  - Metadata
  - Price updates
  """
  updateItem(id: ID!, input: UpdateItemInput!): ItemPayload!
  """
  Update a login history record. Handles:
  - Session updates (loggedOutAt, sessionDuration, lastActivityAt)
  - Administrative actions (marking as reviewed, flagging as risky)
  - General field updates
  """
  updateLoginHistory(id: ID!, input: UpdateLoginHistoryInput!): LoginHistoryPayload!
  updateMealPlan(id: ID!, input: UpdateMealPlanInput!): MealPlanPayload!
  updateMealPlanItem(id: ID!, input: UpdateMealPlanItemInput!): MealPlanItemPayload!
  """Update an existing meal template"""
  updateMealTemplate(id: ID!, input: UpdateMealTemplateInput!): MealTemplatePayload!
  updateMembership(id: ID!, input: UpdateMembershipInput!): MembershipPayload!
  """
  Update moderation state for a user.
  Consolidates: updateModerationStatus, updateTrustLevel, updateRiskScore,
  banUser, unbanUser, suspendUser, unsuspendUser, putUnderReview, completeReview.
  """
  updateModeration(input: UpdateModerationInput!, userId: ID!): UserModerationPayload!
  updateNotification(id: ID!, input: UpdateNotificationInput!): NotificationPayload!
  updateNotificationPreferences(input: UpdateNotificationPreferencesInput!): NotificationPreferencesPayload!
  updatePantry(id: ID!, input: UpdatePantryInput!): PantryPayload!
  updatePantryItem(id: ID!, input: UpdatePantryItemInput!): PantryItemPayload!
  updatePantryItemLocation(id: ID!, storageLocationId: String!, version: Int): PantryItemPayload!
  """Update pantry item quantity (supports fractions)"""
  updatePantryItemQuantity(pantryItemId: ID!, quantity: String!, unitId: ID, version: Int): PantryItemPayload!
  """
  Update user profile. Handles all profile fields including avatar and cover image.
  Set avatarUrl/coverImageUrl to null to remove them.
  """
  updateProfile(input: UpdateUserProfileInput!): UserProfilePayload!
  updatePurchase(id: ID!, input: UpdatePurchaseInput!): PurchasePayload!
  updateRecipe(id: ID!, input: UpdateRecipeInput!): RecipePayload!
  updateRecipeIngredients(ingredients: [RecipeIngredientInput!]!, recipeId: ID!): RecipePayload!
  updateRecipeReview(id: ID!, input: UpdateRecipeReviewInput!): RecipeReviewPayload!
  updateRestriction(input: UpdateRestrictionInput!): DietaryRestrictionPayload!
  updateSettings(input: UpdateUserSettingsInput!): UserSettingsPayload!
  updateShoppingList(id: ID!, input: UpdateShoppingListInput!): ShoppingListPayload!
  updateShoppingListItem(id: ID!, input: UpdateShoppingListItemInput!): ShoppingListItemPayload!
  """Update shopping list item quantity (supports fractions)"""
  updateShoppingListItemQuantity(itemId: ID!, quantity: String!, unitId: ID, version: Int): ShoppingListItemPayload!
  """
  Update an existing storage location
  Validates parent-child relationships and prevents circular references
  Requires user to have edit permissions in the home
  """
  updateStorageLocation(id: ID!, input: UpdateStorageLocationInput!): StorageLocationPayload!
  updateStore(id: ID!, input: UpdateStoreInput!): StorePayload!
  updateStoreInfo(email: String, hoursJSON: JSON, lat: Float, lng: Float, phone: String, storeId: ID!, website: String): StoreInfo!
  """Update a template item"""
  updateTemplateItem(id: ID!, input: UpdateTemplateItemInput!): MealTemplateItemPayload!
  updateUnit(id: ID!, input: UpdateUnitInput!): UnitPayload!
  updateUser(id: ID!, input: UpdateUserInput!): UserPayload!
  updateUserAddress(id: ID!, input: UpdateUserAddressInput!): UserAddressPayload!
  upsertExternalRecipe(input: CreateRecipeInput!): UpsertExternalRecipeResult!
  upsertItemByExternalSource(externalId: String!, externalType: String, itemData: CreateItemInput!, source: ExternalSource!, sourceData: JSON): UpsertItemResult!
  """Add or update item-specific unit conversion"""
