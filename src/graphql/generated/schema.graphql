  """
  Subscribe to one store's changes. A store's name and place are not
  secret, so anyone signed in may watch one that exists; an unknown
  storeId is refused.
  """
  storeEvents(
    """The store to watch"""
    storeId: ID!
  ): StoreEvent!
  """
  Per-user event stream (account update, profile change,
  home/shopping-list membership and moderation lifecycle transitions, and a
