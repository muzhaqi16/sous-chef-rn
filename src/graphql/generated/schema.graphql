"""
One movement of stock on a pantry stack, as its ledger records it: stock
arriving (RESTOCK) or leaving through a use, waste, transfer, gift or downward
correction (ADJUSTMENT). A row outlives its stack, still naming it through
itemId, itemName and unitName. A use undone with deletePantryItemUsage is left
out of every history and total.
"""
type PantryItemUsage {
  """
  Who or what made this correction, on every row that corrects the stack's
  quantity in either direction (a RESTOCK row included). Null on every other row.
  """
  adjustmentKind: AdjustmentKind
  """
  Why the stack's quantity was corrected: the reason a person gave, or fixed text for a correction the system made. Branch on adjustmentKind, not this. Null on rows that are not corrections, and on a correction recorded without a reason.
  """
  adjustmentReason: String
  """
  How the amount entered became the stack's own unit, step by step (¼ cup of
  flour → grams through its density). Null when nothing was converted.
  """
  conversion: UsageConversion
  """
  The cooking log this use was recorded under; null when there is none or the caller does not own it
  """
  cookingLog: CookingLog
  """
  The id of the cooking log this use was recorded under (a confirmed recipe consumption, or one the client named); null otherwise
  """
  cookingLogId: ID
  """
  On a purchase (a RESTOCK row with no adjustmentKind), the price paid per one usageUnit, in currency; never an estimate. Null when the price is unknown (0 is a known price) and on every other row.
  """
  costPerUnit: Float
  """
  What this row's cost figures are in; null on a row that carries no cost.
  """
  currency: Currency
  """
  How that currency was decided — observed from a purchase or list, or assumed.
  """
  currencyProvenance: CurrencyProvenance
  """Unique identifier of this ledger row"""
  id: ID!
  """
  On a WASTE row recorded with createPantryItemUsage, whether the waste was composted (false unless stated); null on every other row
  """
  isComposted: Boolean
  """
  On a WASTE row recorded with createPantryItemUsage, whether the waste was recycled (false unless stated); null on every other row
  """
  isRecycled: Boolean
  """
  The id of the catalog item the stack held, kept after the stack is deleted; a catalog merge points it at the surviving item
  """
  itemId: ID
  """
  The stack's name when the row was recorded, kept after the stack is deleted
  """
  itemName: String
  """
  The planned meal this use cooked; null when there is none or the caller cannot view its meal plan
  """
  mealPlanItem: MealPlanItem
  """
  The id of the planned meal this use cooked: the meal whose completion deducted it, or the one the client named; null otherwise, and once that meal is deleted
  """
  mealPlanItemId: ID
  """Free text recorded with the row; null when none"""
  notes: String
  """
  The pantry this row was recorded in; null when the row names none or the caller cannot view that pantry
  """
  pantry: Pantry
  """
  The id of the pantry this row was recorded in; null when the row names none
  """
  pantryId: ID
  """
  The stack this row moved stock on, removed stacks included; null once it is permanently deleted, or when the caller cannot view the pantry it is in
  """
  pantryItem: PantryItem
  """
  The id of the stack this row moved stock on; null once that stack is permanently deleted. After stacks are merged it names the surviving stack.
  """
  pantryItemId: ID
  """
  Why the stock moved. RESTOCK adds stock (a purchase, or an upward correction when adjustmentKind is set); ADJUSTMENT is a downward correction; every other purpose takes stock out.
  """
  purpose: UsagePurpose!
  """
  How much stock moved, in usageUnit, before any conversion to the stack's tracking unit (see conversion). Greater than zero (a STACK_REMOVED row may record 0); purpose says which way it moved.
  """
  quantityUsed: Float!
  """
  The recipe this use cooked; null when there is none or the caller may not see it
  """
  recipe: Recipe
  """The id of the recipe this use cooked; null when none"""
  recipeId: ID
  """
  A recount's count as the person stated it, in their unit (2.5 lb on a gram
  stack). Null for every other row, and for a recount that named no unit.
  """
  statedAmount: Measure
  """
  On a purchase, the store it was bought at; null when none was given and on every other row
  """
  store: Store
  """
  On a purchase, the id of the store it was bought at; null when none was given and on every other row
  """
  storeId: ID
  """
  On a purchase, the total paid, in currency. Null when it is unknown (0 is a known price) and on every other row.
  """
  totalCost: Float
  """
  The name of the stack's tracking unit when the row was recorded; quantityUsed is in usageUnit, which can differ
  """
  unitName: String
  """
  What recorded the row: RECIPE_AUTO for a deduction made automatically when a recipe was cooked, WASTE for any waste, MANUAL for everything else. RECIPE_MANUAL and TRANSFER are never written.
  """
  usageSource: UsageSource!
  """
  The unit quantityUsed is in: the unit the amount was entered in, else the stack's tracking unit. Null when the row records none.
  """
  usageUnit: Unit
  """The id of the unit quantityUsed is in; null when the row records none"""
  usageUnitId: ID
  """
  When the stock moved: when the row was recorded, or the time a restock states
  """
  usedAt: DateTime!
  """
  Who recorded the movement; null once that account is deleted, or when no one was recorded
  """
  usedBy: User
  """
  Why the stock was wasted, on a WASTE row; null when none was given and on every other row
  """
  wasteReason: WasteReason
}

