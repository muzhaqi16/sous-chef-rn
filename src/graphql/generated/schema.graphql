  """
  Whether notifications about a recipe being cooked are created; off by
  default. The server creates no such notifications, so it has no effect.
  """
  cookingReminders: Boolean!
  """When the preferences were created"""
  createdAt: DateTime!
  """
  Whether notification email reaches the user: expiry reminders and
  shopping-list invites. Off by default.
  """
  emailEnabled: Boolean!
  """
  How many days ahead of expiry reminders start; 3 by default. With 3, the
  user gets reminders for today, tomorrow and 3 days out, but none 7 days
  out. It does not apply to WEEKLY_DIGEST.
  """
  expirationDaysThreshold: Int!
  """
  When expiry reminders arrive: REAL_TIME as soon as quiet hours allow,
  DAILY_MORNING at 09:00 and DAILY_EVENING at 18:00 on the user's clock,
  WEEKLY_DIGEST as one weekly notification naming every item expiring within
  7 days, NEVER not at all. DAILY_MORNING by default. A same-day reminder
  waits only for quiet hours.
  """
  expirationNotificationFrequency: ExpirationFrequency!
  """
  Whether expiry reminders for the user's pantry items are created. Off by
  default; when off, none is created.
  """
  expirationNotifications: Boolean!
  """
  Whether home-invite notifications are created; on by default. The invite
  email is sent either way.
  """
  homeInvites: Boolean!
  """The preferences' unique identifier"""
  id: ID!
  """
  Whether low-stock notifications are created. Off by default; when off,
  none is created, in the feed or as a push.
  """
  lowStockAlerts: Boolean!
  """
  Saved preference for meal-plan reminders; off by default. The server does
  not act on it.
  """
  mealPlanReminders: Boolean!
  """
  Saved preference for a monthly report; off by default. The server does not
  act on it.
  """
  monthlyReport: Boolean!
  """
  Whether notifications about pantry items being added, changed or removed
  are created; off by default. The server creates no such notifications, so
  it has no effect.
  """
  pantryChanges: Boolean!
  """
  Whether notifications are pushed to the user's devices. Off by default; no
  push is sent while it is false, though the in-app feed still fills.
  """
  pushEnabled: Boolean!
  """
  Whether quiet hours are on; off by default. While the window is open a
  push is held and delivered when it closes, several held notifications
  arriving as one push; the in-app feed and unread count still update.
  """
  quietHoursEnabled: Boolean!
  """
  End of the quiet-hours window as HH:mm, 00:00 to 23:59. 08:00 by default,
  and read as 08:00 when null. A window may run past midnight.
  """
  quietHoursEnd: String
  """
  Start of the quiet-hours window as HH:mm, 00:00 to 23:59, on the
