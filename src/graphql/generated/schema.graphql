}

type ExpirationNotification {
  actionAt: DateTime
  actionTaken: ExpirationAction
  batchId: String
  createdAt: DateTime!
  daysUntilExpiry: Int!
  """The expiry date this reminder is about."""
  expiresOn: LocalDate!
  """
  The feed notification that announced this reminder; null when none was created for it. Reading either marks both
  """
  genericNotification: Notification
  """
  The id of the feed notification that announced this reminder; null when none was created for it
  """
  genericNotificationId: ID
  id: ID!
  isBatched: Boolean!
