  so two callers reading the same item can get different answers. Null for a
  serving or reference figure.
  """
  convertedNetWeight: ConvertedValue @deprecated(reason: "Use packageSize, which reads in both unit systems.")
  """When the item was created."""
  createdAt: DateTime!
  """
  The notices this item's catalog data carries, one per external catalog its
  records come from: Open Food Facts (ODbL), USDA FoodData Central and
  Spoonacular. A client shows them wherever it shows the item's facts.
  """
  dataAttributions: [DataAttribution!]!
  """
  Where this catalog entry came from: manual entry, a barcode scan, an import or an external source.
  """
  dataSource: DataSource!
  """
  Suggested amount for a quick consume, in defaultConsumeUnit, or null when not set (then use 1).
  """
  defaultConsumeIncrement: Float
  """
  Suggested unit for a quick consume (for example tbsp for olive oil), or null when not set.
  """
  defaultConsumeUnit: Unit
  """ID of defaultConsumeUnit, or null when not set."""
  defaultConsumeUnitId: ID
  """
  Density in grams per millilitre, used to convert between volume and weight; null when not recorded.
  """
  density: Float
  """Free-text description of the item, or null when none is recorded."""
  description: String
  """
  One alert per restriction it may break, among ACTIVE members sharing with the home and the
  caller's own: by severity, then CONTAINS first, then member order. Unknown evidence raises
  nothing and a health goal never alerts. The caller must be an ACTIVE member of the home.
  """
  dietaryAlerts(
    """The home whose members' restrictions count"""
    homeId: ID!
  ): [DietaryAlert!]!
  """
  Other live products under this item's concept raising no alert and holding allergen or ingredient
  data, most popular first; empty for an unplaced product. The 300 most popular products are
  judged, so one ranked below them is not offered. Not a claim of safety.
  """
