  an unrecognised one was silently dropped. The set is closed and knowable:
  it is exactly the fields the unit contract declares.
  """
  field: NutritionField!
  """
  The unit as the label states it (`g`, `mg`, `mcg`, `µg`, `kcal`, `kJ`).
