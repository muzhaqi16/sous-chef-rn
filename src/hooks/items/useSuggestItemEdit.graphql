# Community edit suggestion for a PUBLIC catalog item. The live item is NOT
# changed — an admin reviews the diff and either approves it or spins it into a
# variation. `changes` is the partial diff from buildSuggestibleItemChanges();
# the server rejects `{}` with ValidationError, so the hook blocks a no-op
# submit before it reaches the wire (the 10/hour budget is too tight to burn).
#
# `media` is never present in `changes`: on approve, updateItem silently ignores
# media.imageUrl and REPLACES every ItemImage row from media.images. Photos go
# live immediately via uploadItemImage instead (any authed user, no review).
#
# The 10-per-3600s rate limit is deliberately NOT handled as a union member — it
# arrives as a TOP-LEVEL GraphQL error with extensions.code OPERATION_RATE_LIMITED
# plus extensions.retryAfter. See the isRateLimitError(result.error) branch in
# useSuggestItemEdit.ts. ForbiddenError is in the union but suggestItemEdit never
# returns it; it falls through to the generic branch.
mutation SuggestItemEdit($input: SuggestItemEditInput!) {
  suggestItemEdit(input: $input) {
    __typename
    ... on SuggestItemEditPayload {
      suggestion {
        id
        status
        # Echoed so the hook can detect the server's idempotent collapse of a
        # duplicate pending suggestion (same item + user + byte-identical
        # `changes`): it returns the EXISTING suggestion and silently discards
        # the new note. A note that differs from what we sent means collapsed.
        note
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}

# Direct write. Used only when resolveItemEditRoute() returns 'direct' (admin, or
# a non-PUBLIC item — suggestItemEdit ValidationErrors on those regardless of
# ownership). UpdateItemInput is a superset of SuggestibleItemChangesInput plus
# { id, editReason }, so the SAME diff object spreads straight into it and there
# is no separate update mapper.
mutation UpdateItem($input: UpdateItemInput!) {
  updateItem(input: $input) {
    __typename
    ... on UpdateItemPayload {
      item {
        id
        ...useItemForEdit_item
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}
