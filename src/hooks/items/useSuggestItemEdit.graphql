# Community edit suggestion for a PUBLIC catalog item. The live item is NOT
# changed — an admin reviews the diff and either approves it or spins it into a
# variation. `changes` is the partial diff from buildSuggestibleItemChanges();
# the server rejects `{}` with ValidationError, so the hook blocks a no-op
# submit before it reaches the wire (the 10/hour budget is too tight to burn).
#
# `media` is never present in `changes`: media.images is a set-replace that drops
# every row it omits. Photos go live immediately via uploadItemImage instead
# (any authed user, additive, no review), which is what this flow wants.
#
# The 10-per-3600s rate limit is deliberately NOT handled as a union member — it
# arrives as a TOP-LEVEL GraphQL error with extensions.code OPERATION_RATE_LIMITED
# (the per-operation budget, not the global RATE_LIMIT_EXCEEDED one) plus
# extensions.retryAfter in seconds. See the isRateLimitError(result.error) branch
# in useSuggestItemEdit.ts, and docs/api/errors.md, which uses this very
# operation as its example.
#
# ForbiddenError is in the union but createItemSuggestion never returns it; it
# falls through to the generic branch.
mutation CreateItemSuggestion($input: CreateItemSuggestionInput!) {
  createItemSuggestion(input: $input) {
    __typename
    ... on CreateItemSuggestionPayload {
      suggestion {
        id
        status
        # Echoed so the hook can detect the server's idempotent collapse of a
        # duplicate pending suggestion (same item + user + byte-identical
        # `changes`): it returns the EXISTING suggestion and silently discards
        # the new note. A note that differs from what we sent means collapsed.
        note
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}

# Direct write. Used only when the item's viewer-scoped `canEdit` is true (its
# creator, or an admin); updateItem is ownership-gated and ForbiddenErrors
# otherwise. UpdateItemInput is a superset of SuggestibleItemChangesInput plus
# { id, editReason }, so the SAME diff object spreads straight into it and there
# is no separate update mapper.
mutation UpdateItem($input: UpdateItemInput!) {
  updateItem(input: $input) {
    __typename
    ... on UpdateItemPayload {
      item {
        id
        ...useItemForEdit_item
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}
