# Canonical "editable snapshot" of a catalog item, loaded when the barcode flow
# opens its edit sheet.
#
# Spread by:
#   - GetItemForEdit (useItemForEdit)      — loads the pre-edit original
#   - UpdateItem     (useSuggestItemEdit)  — write-through on the direct-edit path
#
# This is the ONLY source of the `original` side of the suggest-edit diff.
# ScannedItem is a lossy projection of the barcode query: diffing against it
# would report fields the user never touched as changes.
#
# Invariant: every field AddItemForm can edit in an edit mode is selected here,
# and every field here is prefilled into the form via
# buildInitialDataFromSnapshot(). Break either half and the diff invents changes
# or misses real ones.
fragment useItemForEdit_item on Item {
  id
  name
  description
  type
  storageState
  tags
  primaryUpc
  shelfLifeDays
  shelfLifeOpenedDays
  netWeight
  baseDimension
  imageUrl
  # The two write paths, which are mutually exclusive and each hard-fail when
  # picked wrongly:
  #
  #     canEdit    -> updateItem            (direct write)
  #     canSuggest -> createItemSuggestion  (proposed for review)
  #     neither    -> read-only
  #
  # Both are needed: canEdit=false does NOT imply "suggest". A PRIVATE item you
  # do not own — a housemate's pantry entry, a shared list's item, a recipe
  # ingredient — reaches this sheet with both false, and createItemSuggestion
  # takes PUBLIC items only. Neither can be inferred from visibility.
  #
  # canEdit is viewer-scoped (creator + admins). canSuggest is not — it is
  # structural (active PUBLIC catalog item) and identical for every caller, so
  # it does not account for the 5-pending cap or the 10/hour budget; both are
  # transient and surface as a ConflictError / rate-limit error on submit.
  canEdit
  canSuggest
  displayUnit {
    id
    name
    symbol
  }
  brands {
    brand {
      id
      name
    }
  }
}

query GetItemForEdit($id: ID!) {
  item(id: $id) {
    id
    ...useItemForEdit_item
  }
}
