fragment usePantrySubscriptions_expirationNotification on ExpirationNotification {
  id
  daysUntilExpiry
  actionTaken
  genericNotificationId
  pantryItem {
    id
    item {
      id
      name
      imageUrl
    }
  }
}

# Narrow fragment for the PantryChanges subscription's `pantryItem` payload.
# Mirrors the fields the server pushes for an ItemAdded / ItemUpdated /
# ItemRemoved event. The subscription handler reads `item.id` to add/remove
# the connection edge and writes the entire payload back to the entity via
# writeFragment, so the fragment must match the subscription's selection.
fragment usePantrySubscriptions_pantryItem on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  version
  updatedAt
  storageState
  expiresAt
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  activeBatchCount
  earliestBatchExpiration
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
  unit {
    id
    name
    symbol
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
    }
  }
}
