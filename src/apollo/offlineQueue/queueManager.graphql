# Narrow fragments for the offline-queue Sync mutations.
# The queue manager executes these mutations and relies on Apollo's
# automatic normalization to update the cached entity. The handler
# itself does not read fields off the response, but we include the
# display-cell fields so a freshly-synced entity is fully hydrated
# for any subsequent reader (list cells, item detail, etc.).
fragment queueManager_syncItem on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
}

# Narrow fragment for SyncMoveShoppingListItem — only sortOrder + version
# change. Mirrors the shape of useItemReordering_moveResult.
fragment queueManager_syncMoveItem on ShoppingListItem {
  id
  version
  sortOrder
  purchaseInfo {
    isPurchased
  }
}
