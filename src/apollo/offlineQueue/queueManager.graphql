# Narrow fragments for the offline-queue Sync mutations.
# The queue manager executes these mutations and relies on Apollo's
# automatic normalization to update the cached entity. The handler
# itself does not read fields off the response, but we include the
# display-cell fields so a freshly-synced entity is fully hydrated
# for any subsequent reader (list cells, item detail, etc.).
fragment queueManager_syncItem on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  # A replayed purchase (an offline checkbox tap or a recorded qty/price, both
  # of which reach the server as `purchaseTracking`) records the purchase and
  # moves these two the same way an online write does. Selected in full so the
  # replay's response leaves the entity in the state the server is in — and,
  # per the ShoppingListItemPurchaseInfo note in apollo/cache.ts, so this write
  # cannot strip the amounts off an item the detail screen is reading.
  purchaseInfo {
    isPurchased
    purchasedQuantity
    purchasedPrice
    purchaseDate
    purchasedBy {
      id
      profile {
        id
        displayName
        avatar
      }
    }
  }
  purchaseHistory {
    previouslyPurchased
    purchaseCount
    lastPurchaseDate
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
}

# Narrow fragment for SyncMoveShoppingListItem — only sortOrder + version
# change. Mirrors the shape of useItemReordering_moveResult.
fragment queueManager_syncMoveItem on ShoppingListItem {
  id
  version
  sortOrder
  purchaseInfo {
    isPurchased
  }
}
