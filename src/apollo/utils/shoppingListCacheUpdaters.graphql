# Detail-only materialization for a local-first shopping-list create.
#
# `buildOptimisticShoppingList` writes the shape the lists OVERVIEW selects
# (`GetShoppingListsLite`). The detail screen (`GetShoppingListDetails`) reads
# 22 further fields, so an offline-created list was overview-complete and
# detail-incomplete: it appeared in the list and then dead-ended when opened,
# because Apollo serves no partial data and went to the network for an id the
# server did not have yet. Exactly the defect that shipped on pantry items.
#
# FLAT (no nested fragment spreads) so `cache.writeFragment` sees the unmasked
# shape — a spread here would write masked refs and the read would still come
# back incomplete.
#
# Consumers: src/apollo/utils/shoppingListCacheUpdaters.ts
# (`addOptimisticShoppingList`).
fragment shoppingListCacheUpdaters_listDetail on ShoppingList {
  id
  status
  isCompleted
  completedShopDate
  isRecurring
  recurringPattern
  recurringInterval
  nextRecurringDate
  isTemplate
  templateName
  basedOnTemplate {
    id
    name
  }
  reminderEnabled
  reminderDate
  budgetAmount
  totalCost
  estimatedTotal
  currency
  priceTracking
  canMoveToPantry
  shareCode
  isPublic
  shareLink {
    universal
  }
  # Field arguments are part of the cache key, so `first: 20` must match what
  # `GetShoppingListDetails` reads or this seeds a different field.
  collaboratorsConnection(first: 20) {
    edges {
      cursor
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
