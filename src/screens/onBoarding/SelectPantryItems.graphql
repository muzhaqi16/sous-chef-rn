# Narrow fragment for SelectPantryItems' catalog-id mapping.
# Reads `id`, `itemId`, and `item.id` to build a Set of catalog IDs that
# are already in the user's pantry so the onboarding picker can mark them
# as selected.
fragment SelectPantryItems_pantryItem on PantryItem {
  id
  itemId
  item {
    id
  }
}
