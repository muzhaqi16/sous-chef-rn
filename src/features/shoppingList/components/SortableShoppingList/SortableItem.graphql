fragment SortableItem_item on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  category
  unitName
  unit {
    id
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  # quantity read in each unit system: the row shows a weight or volume in the
  # user's while it is still the figure quantity holds.
  amount {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  purchaseInfo {
    isPurchased
    # Set once this line's purchase reached the pantry. Read to render a
    # purchased row as already stocked — it is the same state the bulk move
    # filters its working set on, so a stamped line is one that move will not
    # act on again. Cleared when the line re-enters an unpurchased state.
    movedToPantryAt
  }
  # Per one of the line's unit, from recorded prices: the line's store, else
  # the list's, then that store's chain, then any store. Null with none.
  suggestedPrice {
    amount
    substitute
    currency {
      id
      code
      decimalPlaces
    }
  }
  # The photo this entry shows: the household's choice, the catalog's, else the viewer's pending one.
  image {
    url
    source
    catalogImageId
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
}
