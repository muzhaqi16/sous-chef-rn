# ============================================
# QUERIES
# ============================================

query MyShoppingListInvites {
  me {
    id
    pendingCollaborationInvites {
      id
      token
      shoppingListId
      collaboratorId
      email
      role
      status
      canEdit
      canAddItems
      canRemoveItems
      canMarkPurchased
      canInviteOthers
      invitedAt
      expiresAt
      shoppingList {
        id
        name
        description
      }
      collaborator {
        id
        email
        profile { id displayName avatar }
      }
      invitedBy {
        id
        email
        profile { id displayName avatar }
      }
    }
  }
}


# ============================================
# MUTATIONS
# ============================================

mutation AcceptShoppingListInvite($token: String!) {
  acceptShoppingListInvite(token: $token) {
    __typename
    ... on AcceptShoppingListInviteSuccess {
      collaborator {
        ...ShoppingListCollaboratorFragment
        canEdit
        canInviteOthers
        invitedAt
        shoppingList {
          id
          name
          description
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeclineShoppingListInvite($token: String!) {
  declineShoppingListInvite(token: $token) {
    __typename
    ... on DeclineShoppingListInviteSuccess {
      collaborator {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription CollaborationChanges($listId: ID!) {
  collaborationChanged(listId: $listId) {
    mutation
    collaborator {
      ...useShoppingListSubscriptions_collaborator
      canEdit
      invitedAt
      lastViewedAt
    }
    listId
    timestamp
    userId
  }
}
