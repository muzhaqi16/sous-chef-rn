# ============================================
# QUERIES
# ============================================

# The pending-invites QUERY lives in the notifications feature
# (InvitationAcceptanceModal.graphql) — the invitation modal is its only
# consumer. Keeping a second copy here caused codegen "operation name not
# unique" failures the moment the copies diverged.

# ============================================
# MUTATIONS
# ============================================

mutation AcceptShoppingListInvite($input: AcceptShoppingListInviteInput!) {
  acceptShoppingListInvite(input: $input) {
    __typename
    ... on AcceptShoppingListInvitePayload {
      collaborator {
        id
        ...ShoppingListCollaboratorFragment
        canEdit
        canInviteOthers
        invitedAt
        shoppingList {
          id
          name
          description
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeclineShoppingListInvite($input: DeclineShoppingListInviteInput!) {
  declineShoppingListInvite(input: $input) {
    __typename
    ... on DeclineShoppingListInvitePayload {
      collaborator {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

# NOTE: The former `CollaborationChanges($listId)` subscription has been folded
# into `myShoppingListsEvents` (see shoppingList.graphql) as the
# COLLABORATION_CHANGED subtype — one user-scoped stream now carries collaborator
# lifecycle alongside item/list/status events, keeping the per-user concurrent-
# subscription count low (the server caps it cluster-wide).
