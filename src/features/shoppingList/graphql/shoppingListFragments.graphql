fragment ShoppingListItemCore on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
}

# Flat leaf fragment consumed by row/list components, cache reads, mutation
# optimistic responses, and subscription writeFragment calls. Fields duplicate
# ShoppingListItemCore on purpose so consumers get all the data they need from
# a single `useFragment` call without nested unmasking.
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images { url kind }
  }
}

# Flat leaf fragment consumed by AddEditItem and ItemDetail screens. Includes
# every field they read so a single `useFragment` resolves the entire view.
fragment ShoppingListItemFragment on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    name
    description
    imageUrl
    netWeight
    nutritions
    images { url kind }
    displayUnit {
      id
      name
      symbol
    }
    categories {
      id
      isPrimary
      confidence
      source
      assignedAt
      category {
        id
        name
      }
    }
  }
  priceEstimate {
    estimated
    lastKnown
  }
  source {
    isAutoAdded
    autoAddReason
    isFromMealPlan
  }
  priority
  createdAt
  addedBy {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
  purchasesConnection(first: 10) {
    edges {
      node {
        id
        purchaseDate
        quantity
        unitPrice
        unitSymbol
      }
    }
    totalCount
  }
}

fragment ShoppingListOwnershipFragment on ShoppingListOwnership {
  id
  userId
  user {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}

fragment ShoppingListCollaboratorFragment on ShoppingListCollaborator {
  id
  email
  role
  status
  collaboratorId
  canAddItems
  canRemoveItems
  canEditItems
  canMarkPurchased
  invitedAt
  collaborator {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}
