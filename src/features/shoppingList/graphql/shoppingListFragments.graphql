# Structural shape passed between shopping-list modal hooks
# (`useMoveToPantry`, `useQuantityEditModal`, `useClearShoppingListItems`,
# `ShoppingListModalsContext`, etc.). Not spread by any operation — only
# used as a TypeScript type at the boundary where masked fragment refs are
# materialized and handed between hooks. Per-hook splits would each
# duplicate this identical shape; this is the one acknowledged exception
# to strict per-consumer ownership.
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images { url kind }
  }
}

# Canonical shape for a ShoppingListOwnership in the cache.
# Spread by: shoppingList.graphql (GetShoppingListDetails, CreateShoppingList,
#   UpdateShoppingList), useRecipeDetail.graphql (GetShoppingListsLite)
# Read via cache.readFragment by: useShoppingListDetails.ts,
#   ShoppingListMainContent.tsx
# Kept shared — all 6 consumers need the identical write-back shape.
fragment ShoppingListOwnershipFragment on ShoppingListOwnership {
  id
  userId
  user {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}

# Canonical shape for a ShoppingListCollaborator in the cache.
# Spread by: shoppingList.graphql (GetShoppingListDetails, AddCollaborator),
#   collaboration.graphql (CollaborationChanges subscription)
# Read via cache.readFragment by: useShoppingListDetails.ts, ShareList.tsx,
#   ShoppingListMainContent.tsx
# Kept shared — all 6 consumers need the identical write-back shape.
fragment ShoppingListCollaboratorFragment on ShoppingListCollaborator {
  id
  email
  role
  status
  collaboratorId
  canAddItems
  canRemoveItems
  canEditItems
  canMarkPurchased
  invitedAt
  collaborator {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}
