# Structural shape passed between shopping-list modal hooks
# (`useMoveToPantry`, `useQuantityEditModal`, `useClearShoppingListItems`,
# `ShoppingListModalsContext`, etc.). Not spread by any operation — only
# used as a TypeScript type at the boundary where masked fragment refs are
# materialized and handed between hooks. Per-hook splits would each
# duplicate this identical shape; this is the one acknowledged exception
# to strict per-consumer ownership.
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  id
  # The row's parent list. Not shown anywhere — it is what the offline queue
  # reads back to build a replay: the toggle / quantity / plain-update inputs
  # carry only the row id, so `SyncShoppingListItemFieldsInput.shoppingListId`
  # can only come from the cached row. A writer that omits it makes those
  # replays fail permanently and the change is undone on reconnect.
  shoppingList {
    id
  }
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
    # The row renders a stocked line differently, and a field the write omits
    # is a field the cache does not hold — so the writers carry it too.
    movedToPantryAt
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
}

# Canonical shape for a ShoppingListOwnership in the cache.
# Spread by: shoppingList.graphql (GetShoppingListDetails, CreateShoppingList,
#   UpdateShoppingList), useRecipeDetail.graphql (GetShoppingListsLite)
# Read via cache.readFragment by: useShoppingListDetails.ts,
#   ShoppingListMainContent.tsx
# Kept shared — all 6 consumers need the identical write-back shape.
fragment ShoppingListOwnershipFragment on ShoppingListOwnership {
  id
  userId
  user {
    id
    email
    displayName
    profile {
      id
      displayName
      avatar
    }
  }
}

# Canonical shape for a ShoppingListCollaborator in the cache.
# Spread by: shoppingList.graphql (GetShoppingListDetails, AddCollaborator),
#   collaboration.graphql (CollaborationChanges subscription)
# Read via cache.readFragment by: useShoppingListDetails.ts, ShareList.tsx,
#   ShoppingListMainContent.tsx
# Kept shared — all 6 consumers need the identical write-back shape.
fragment ShoppingListCollaboratorFragment on ShoppingListCollaborator {
  id
  email
  role
  status
  collaboratorId
  canAddItems
  canRemoveItems
  canEditItems
  canMarkPurchased
  invitedAt
  collaborator {
    id
    email
    # Gated by the SHARING relationship, not by profileVisibility, so a
    # collaborator on this list reads it even with a private profile — which
    # `profile` below does not survive.
    displayName
    profile {
      id
      displayName
      avatar
    }
  }
}

# The whole purchase record on a shopping-list item.
# Spread by: shoppingList.graphql (UpdateShoppingListItem,
#   ToggleShoppingListItemPurchased), queueManager.graphql
#   (queueManager_syncItem), useShoppingListSubscriptions.graphql
#   (useShoppingListSubscriptions_item)
# Read via the cache by: ItemDetail.tsx (which selects these fields inline
#   rather than spreading this, because a named spread would mask them from
#   its direct field reads under `dataMasking`)
#
# Shared because the five fields are ONE FACT, not five. The
# `ShoppingListItemPurchaseInfo` merge in `apollo/cache.ts` clears whatever a
# write omits whenever `isPurchased` changes — so a writer that selects the
# flag alone does not merely fail to update the amounts, it erases them. Every
# request that can change the purchased state therefore has to carry the whole
# record, and one definition is what makes that impossible to get wrong.
# `__tests__/graphql/purchaseInfoCompleteness.test.ts` enforces it for any
# selection that does not spread this.
fragment ShoppingListItemPurchaseInfoFragment on ShoppingListItemPurchaseInfo {
  isPurchased
  # When this line's purchase reached the pantry. Part of the purchase record
  # rather than beside it: the server clears it on the same transition the
  # cache merge clears the rest on — the line re-entering an unpurchased state.
  movedToPantryAt
  purchasedQuantity
  purchasedPrice
  purchaseDate
  purchasedBy {
    id
    profile {
      id
      displayName
      avatar
    }
  }
}

# The item shape returned by every copy of `AddItemsToShoppingList`.
#
# Spread by: shoppingList.graphql (AddItemToShoppingList),
# SearchResults.graphql (BarcodeAddItemToShoppingList),
# FilteredPantryItems.graphql (AddItemToShoppingListFromFilteredPantry),
# PantryItemDetail.graphql (AddItemToShoppingListFromPantryItem).
#
# The Feature API Boundary Convention stops those features importing the
# shopping-list feature's operations, so each kept a hand-maintained copy of
# this selection — and they drifted. The two pantry copies had lost the parent
# list's counters, which matters because `reconcileShoppingItemCreateUpdate`
# passes `bumpTotalItems: false` on the deliberate assumption that the response
# carries them; without them a list's counts go stale after an add. All four
# copies are registered in SHOPPING_LIST_SYNC_BUILDERS and replay through the
# same Sync fragment, so they were already one operation to the queue while
# being four to a maintainer. Now they are one selection.
#
# Scoped to the ITEM rather than the whole payload on purpose: `results` stays
# unmasked so `buildAddItemsReconcileUpdate` and `useAddShoppingItem` keep
# reading it directly, and only the item fields ride behind the spread.
#
# `<feature>Fragments.generated.ts` is public surface per the boundary
# convention, so spreading this across features is allowed.
# Guarded by __tests__/graphql/localFirstCopyDrift.test.ts.
fragment AddedShoppingListItemFields on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
    # The row renders a stocked line differently, and a field the write omits
    # is a field the cache does not hold — so the writers carry it too.
    movedToPantryAt
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
  shoppingList {
    id
    totalItems
    completedItems
    remainingItems
    completionRate
  }
}

# The shape a list is COPIED from, read out of the cache by `listFromTemplate`
# and `nextRecurringList` so a copy runs with the API unreachable.
# Spread by: shoppingList.graphql (GetShoppingListTemplates)
# Read via cache.readFragment by: useShoppingListTemplate.ts,
#   useRecurringShoppingList.ts
# Kept shared — both derived writes copy the identical shape.
#
# The two line connections are the SAME cache entries the items screen fills
# (`filters` is the only keyArg), so a list the user has opened is already a
# usable source. Both purchase states are read because the server's copy takes
# every line and the fresh list starts them all unpurchased.
# `first` is a variable on purpose: a literal multiplies the operation's
# armor cost by its value, which no ceiling here has room for. The line fields
# are inlined rather than spread for the same kind of reason: a named spread
# costs a depth level, and this shape is already at depth 10 of 12.
#
# The lines are held to the subset of ShoppingListItemDisplayFragment every
# writer of the entity guarantees, so a source list holding a line created
# offline still reads complete. `priority` and the price estimates the server's
# own copy carries are absent for that reason: no writer produces them.
fragment CopyableShoppingListFragment on ShoppingList {
  id
  name
  description
  budgetAmount
  tags
  homeId
  unpurchasedLines: itemsConnection(
    filters: { isPurchased: false }
    first: $copyableItemLimit
  ) {
    edges {
      node {
        id
        itemName
        quantity
        quantityInput
        category
        notes
        unitName
        sortOrder
        item {
          id
        }
        unit {
          id
        }
      }
    }
  }
  purchasedLines: itemsConnection(
    filters: { isPurchased: true }
    first: $copyableItemLimit
  ) {
    edges {
      node {
        id
        itemName
        quantity
        quantityInput
        category
        notes
        unitName
        sortOrder
        item {
          id
        }
        unit {
          id
        }
      }
    }
  }
}
