# Structural shape passed between shopping-list modal hooks
# (`useMoveToPantry`, `useQuantityEditModal`, `useClearShoppingListItems`,
# `ShoppingListModalsContext`, etc.). Not spread by any operation — only
# used as a TypeScript type at the boundary where masked fragment refs are
# materialized and handed between hooks. Per-hook splits would each
# duplicate this identical shape; this is the one acknowledged exception
# to strict per-consumer ownership.
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images { url kind }
  }
}

# Canonical shape for a ShoppingListOwnership in the cache.
# Spread by: shoppingList.graphql (GetShoppingListDetails, CreateShoppingList,
#   UpdateShoppingList), useRecipeDetail.graphql (GetShoppingListsLite)
# Read via cache.readFragment by: useShoppingListDetails.ts,
#   ShoppingListMainContent.tsx
# Kept shared — all 6 consumers need the identical write-back shape.
fragment ShoppingListOwnershipFragment on ShoppingListOwnership {
  id
  userId
  user {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}

# Canonical shape for a ShoppingListCollaborator in the cache.
# Spread by: shoppingList.graphql (GetShoppingListDetails, AddCollaborator),
#   collaboration.graphql (CollaborationChanges subscription)
# Read via cache.readFragment by: useShoppingListDetails.ts, ShareList.tsx,
#   ShoppingListMainContent.tsx
# Kept shared — all 6 consumers need the identical write-back shape.
fragment ShoppingListCollaboratorFragment on ShoppingListCollaborator {
  id
  email
  role
  status
  collaboratorId
  canAddItems
  canRemoveItems
  canEditItems
  canMarkPurchased
  invitedAt
  collaborator {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}

# The whole purchase record on a shopping-list item.
# Spread by: shoppingList.graphql (UpdateShoppingListItem,
#   ToggleShoppingListItemPurchased), queueManager.graphql
#   (queueManager_syncItem), useShoppingListSubscriptions.graphql
#   (useShoppingListSubscriptions_item)
# Read via the cache by: ItemDetail.tsx (which selects these fields inline
#   rather than spreading this, because a named spread would mask them from
#   its direct field reads under `dataMasking`)
#
# Shared because the five fields are ONE FACT, not five. The
# `ShoppingListItemPurchaseInfo` merge in `apollo/cache.ts` clears whatever a
# write omits whenever `isPurchased` changes — so a writer that selects the
# flag alone does not merely fail to update the amounts, it erases them. Every
# request that can change the purchased state therefore has to carry the whole
# record, and one definition is what makes that impossible to get wrong.
# `__tests__/graphql/purchaseInfoCompleteness.test.ts` enforces it for any
# selection that does not spread this.
fragment ShoppingListItemPurchaseInfoFragment on ShoppingListItemPurchaseInfo {
  isPurchased
  purchasedQuantity
  purchasedPrice
  purchaseDate
  purchasedBy {
    id
    profile {
      id
      displayName
      avatar
    }
  }
}
