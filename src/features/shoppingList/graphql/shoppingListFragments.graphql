fragment ShoppingListItemCore on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
}

# Adds list-row display data (sortOrder + item thumbnail) on top of Core.
# Consumed by row/list components, cache reads, mutation optimistic responses,
# and subscription writeFragment calls.
fragment ShoppingListItemDisplayFragment on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images { url kind }
  }
}

# Adds full screen-level data (item description/nutrition, price, source,
# addedBy, purchase history) on top of Display. Consumed by AddEditItem and
# ItemDetail screens.
fragment ShoppingListItemFragment on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images { url kind }
    name
    description
    netWeight
    nutritions
    displayUnit {
      id
      name
      symbol
    }
    categories {
      id
      isPrimary
      confidence
      source
      assignedAt
      category {
        id
        name
      }
    }
  }
  priceEstimate {
    estimated
    lastKnown
  }
  source {
    isAutoAdded
    autoAddReason
    isFromMealPlan
  }
  priority
  createdAt
  addedBy {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
  purchasesConnection(first: 10) {
    edges {
      node {
        id
        purchaseDate
        quantity
        unitPrice
        unitSymbol
      }
    }
    totalCount
  }
}

fragment ShoppingListOwnershipFragment on ShoppingListOwnership {
  id
  userId
  user {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}

fragment ShoppingListCollaboratorFragment on ShoppingListCollaborator {
  id
  email
  role
  status
  collaboratorId
  canAddItems
  canRemoveItems
  canEditItems
  canMarkPurchased
  invitedAt
  collaborator {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}
