mutation CreateShoppingList($input: CreateShoppingListInput!) {
  createShoppingList(input: $input) {
    __typename
    ... on CreateShoppingListPayload {
      shoppingList {
        id
        name
        isDefault
        totalItems
        completedItems
        createdAt
        updatedAt
        homeId
        home {
          id
          name
        }
        ownerships {
          ...ShoppingListOwnershipFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
