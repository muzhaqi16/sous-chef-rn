      shoppingList {
        id
        name
        isDefault
        totalItems
        completedItems
        createdAt
        updatedAt
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          ...ShoppingListOwnershipFragment
        }
      }
    }
    ... on Error {
      code
      message
