# Offline-safe "clear list": sends the concrete ids captured at tap time, so a
# replayed offline clear deletes only those and never touches items other members
# added/purchased after the request was built (unlike the `deleteShoppingListItems`
# filter mutation, whose purchased filter is re-evaluated at drain time).
mutation RemoveItemsFromShoppingList(
  $input: RemoveItemsFromShoppingListInput!
) {
  removeItemsFromShoppingList(input: $input) {
    __typename
    ... on RemoveItemsFromShoppingListPayload {
      summary {
        total
        succeeded
        failed
        skipped
        executionTime
      }
      shoppingListItems {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation AddItemsToShoppingList($input: AddItemsToShoppingListInput!) {
  addItemsToShoppingList(input: $input) {
