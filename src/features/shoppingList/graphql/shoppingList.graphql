mutation ClearShoppingListItems($shoppingListId: ID!, $purchased: Boolean!) {
  clearShoppingListItems(shoppingListId: $shoppingListId, purchased: $purchased) {
    summary {
      total
      successful
      failed
      skipped
      executionTime
    }
    clearedItemIds
  }
}

mutation AddItemsToShoppingList(
  $shoppingListId: ID!
  $items: [BatchAddShoppingListItemInput!]!
) {
  addItemsToShoppingList(shoppingListId: $shoppingListId, items: $items) {
    results {
      index
      clientId
      success
      item {
        id
        ...useRecipeShoppingList_addedItem
      }
      quantityIncremented
      error
    }
    successCount
    failedCount
    incrementedCount
  }
}

