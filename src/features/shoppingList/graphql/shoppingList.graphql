}

mutation JoinShoppingListByShareCode($shareCode: String!) {
  joinShoppingListByShareCode(shareCode: $shareCode) {
    success
    message
    code
    shoppingList {
      id
      name
    }
  }
}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncShoppingListItem(
  $clientId: ID!
  $input: SyncShoppingListItemInput!
) {
  syncShoppingListItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      ...queueManager_syncItem
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

mutation SyncDeleteShoppingListItem($clientId: ID!, $version: Int) {
  syncDeleteShoppingListItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

mutation SyncMoveShoppingListItem(
  $clientId: ID!
  $afterId: ID
  $beforeId: ID
  $version: Int
) {
  syncMoveShoppingListItem(
    clientId: $clientId
    afterId: $afterId
    beforeId: $beforeId
    version: $version
  ) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      ...queueManager_syncMoveItem
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription ShoppingListChanges($listId: ID!) {
  shoppingListChanged(listId: $listId) {
    changeType
    item {
      id
      sortOrder
      purchaseInfo {
        isPurchased
      }
      ...useShoppingListSubscriptions_item
    }
    shoppingList {
      id
      name
      totalItems
      completedItems
    }
    clearedItemIds
    clearedCount
    mutation
    updatedFields
    listId
    timestamp
    userId
  }
}

subscription MyShoppingListsChanges {
  myShoppingListsChanged {
    changeType
    shoppingList {
      id
      name
      totalItems
      completedItems
    }
    mutation
    updatedFields
    listId
    timestamp
    userId
  }
}
