# ============================================
# QUERIES
# ============================================

# Lightweight query for shopping list details WITHOUT items
# Use this for ShoppingListMain, ListSettings, ShareList
# Items are fetched separately via GetShoppingListItemsFiltered
query GetShoppingListDetails($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    isDefault
    totalItems
    completedItems
    homeId
    shareCode
    isPublic
    home {
      id
      name
      myMembership {
        id
        role
        canAddItems
        canRemoveItems
        canEditPantry
      }
    }
    ownerships {
      id
      ...ShoppingListOwnershipFragment
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          id
          ...ShoppingListCollaboratorFragment
          invitedAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

# Lightweight query for list selector - metadata only, no items/collaborators
# Use this for dashboard/list views.
query GetShoppingListsLite($homeId: ID, $first: Int, $after: String) {
  shoppingLists(filters: { homeId: $homeId }, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        isDefault
        totalItems
        completedItems
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile { id displayName avatar }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Paginated items query for a single tab (unpurchased OR purchased)
# Called twice in the hook — once per tab — so each has its own independent
# cursor and cache entry (Apollo keyArgs: ['filters'] handles separation)
#
# The `node` selects scalar meta fields inline (id, itemName, category,
# sortOrder, version, purchaseInfo, item, etc.) so the hook layer can read
# them directly without a `cache.readFragment` materialize round-trip.
# The masked `...SortableItem_item` ref flows to the row component, which
# calls `useFragment` to get a per-entity cache subscription.
query GetShoppingListItemsFiltered(
  $id: ID!
  $first: Int!
  $after: String
  $isPurchased: Boolean!
) {
  shoppingList(id: $id) {
    id
    itemsConnection(
      first: $first
      after: $after
      filters: { isPurchased: $isPurchased }
      orderBy: { sortOrder: ASC }
    ) {
      totalCount
      edges {
        cursor
        node {
          id
          itemName
          quantity
          quantityInput
          displayFormat
          purchaseInfo {
            isPurchased
          }
          version
          updatedAt
          category
          notes
          unitName
          unit {
            id
            name
            symbol
          }
          sortOrder
          item {
            id
            imageUrl
            images {
              url
              kind
            }
          }
          ...SortableItem_item
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query GetShoppingListItem($id: ID!) {
  shoppingListItem(id: $id) {
    ...ItemDetail_shoppingListItem
    ...useShoppingListItemForm_item
  }
}

# Suggestions are now a field on ShoppingList type
query GetShoppingListSuggestions($id: ID!, $limit: Int = 15) {
  shoppingList(id: $id) {
    id
    suggestions(limit: $limit) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      shoppingListItemId
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateShoppingList($input: CreateShoppingListInput!) {
  createShoppingList(input: $input) {
    success
    message
    code
    shoppingList {
      id
      name
      isDefault
      totalItems
      completedItems
      createdAt
      updatedAt
      homeId
      home {
        id
        name
      }
      ownerships {
        ...ShoppingListOwnershipFragment
      }
    }
  }
}

mutation UpdateShoppingList($id: ID!, $input: UpdateShoppingListInput!) {
  updateShoppingList(id: $id, input: $input) {
    success
    message
    code
    shoppingList {
      id
      name
      isDefault
      totalItems
      completedItems
      createdAt
      updatedAt
      ownerships {
        ...ShoppingListOwnershipFragment
      }
    }
  }
}

