subscription ShoppingListItemChanged($listId: ID!) {
  shoppingListItemChanged(listId: $listId) {
    mutation
    item {
      id
      sortOrder
      purchaseInfo {
        isPurchased
      }
      ...useShoppingListSubscriptions_item
    }
    updatedFields
    listId
    timestamp
    userId
    originatorClientId
  }
}

