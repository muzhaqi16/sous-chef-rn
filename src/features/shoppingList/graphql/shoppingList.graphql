      item {
        id
        itemName
      }
      conflict {
        clientVersion
        serverVersion
        message
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation SyncMoveShoppingListItem($input: SyncMoveShoppingListItemInput!) {
  syncMoveShoppingListItem(input: $input) {
    __typename
    ... on SyncShoppingListItemPayload {
      clientId
      serverId
      operation
      converged
      item {
        id
        ...queueManager_syncMoveItem
      }
      conflict {
        clientVersion
        serverVersion
        message
        serverItem {
          id
          version
          sortOrder
        }
      }
    }
    ... on Error {
      code
      message
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

# NOTE: The server caps concurrent subscriptions per client (per-user,
# cluster-wide). All shopping-list domain events arrive on this single
# user-scoped stream, discriminated by `subtype` (mirrors pantryEvents):
# ITEMS_CHANGED, LIST_UPDATED, STATUS_CHANGED, ITEMS_BATCH_CLEARED, and
# COLLABORATION_CHANGED (folded in from the former per-list collaborationChanged
# subscription). The per-list shoppingListEvents(listId) variant is
# intentionally NOT used — one stream covers every list the user can access,
# and useShoppingListSubscriptions filters by the active list where needed.
#
# Thin event: the envelope plus the identity of what changed. Subscription
# documents are validated against depth 5 / cost 500 rather than the HTTP
# limits, because the server re-executes the document on every published event
# for the life of the connection. An inline fragment counts as a depth level
# (graphql-armor counts unflattened), so `node { ... on X { id } }` is already
# depth 4 and a fragment spread inside a branch cannot fit.
#
# `updatedFields` drives the skip (an event that changed nothing on screen costs
# nothing) and `clearedItemIds` still carries a batch clear on its own. When the
# handler does need values it reads them back through `ShoppingListItemForEvent`
# / `ShoppingListSummaryForEvent`, which get the generous HTTP limits.
# See `__tests__/graphql/documentLimits.test.ts` for the enforced bound.
subscription MyShoppingListsEvents {
  myShoppingListsEvents {
    subtype
    mutation
    listId
    # The device that made the change — the server echoes back the
    # `x-device-id` the mutation carried. Suppressing on this rather than on
    # `actorUserId` is what lets the same user's second device keep updating.
    originatorClientId
    actorUserId
    timestamp
    updatedFields
    clearedItemIds
    node {
      __typename
      ... on ShoppingListItem {
        id
      }
      ... on ShoppingList {
        id
      }
      ... on ShoppingListCollaborator {
        id
      }
    }
  }
}
