# ============================================
# QUERIES
# ============================================

# Lightweight query for shopping list details WITHOUT items
# Use this for ShoppingListMain, ListSettings, ShareList
# Items are fetched separately via GetShoppingListItemsFiltered
query GetShoppingListDetails($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    isDefault
    totalItems
    completedItems
    homeId
    canMoveToPantry
    shareCode
    isPublic
    # Server-built anyone-with-link share URL. Non-null only when isPublic and a
    # shareCode is set — the share UI gates on the same condition.
    shareLink {
      universal
    }
    home {
      id
      name
      myMembership {
        id
        role
        canAddItems
        canRemoveItems
        canEditPantry
      }
    }
    ownerships {
      id
      ...ShoppingListOwnershipFragment
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          id
          role
          status
          canAddItems
          canRemoveItems
          canEditItems
          canMarkPurchased
          ...ShoppingListCollaboratorFragment
          invitedAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

# Lightweight query for list selector - metadata only, no items/collaborators
# Use this for dashboard/list views.
query GetShoppingListsLite($homeId: ID, $first: Int, $after: String) {
  shoppingLists(filters: { homeId: $homeId }, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        isDefault
        totalItems
        completedItems
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile { id displayName avatar }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Paginated items query for a single tab (unpurchased OR purchased)
# Called twice in the hook — once per tab — so each has its own independent
# cursor and cache entry (Apollo keyArgs: ['filters'] handles separation)
#
# The `node` selects scalar meta fields inline (id, itemName, category,
# sortOrder, version, purchaseInfo, item, etc.) so the hook layer can read
# them directly without a `cache.readFragment` materialize round-trip.
# The masked `...SortableItem_item` ref flows to the row component, which
# calls `useFragment` to get a per-entity cache subscription.
query GetShoppingListItemsFiltered(
  $id: ID!
  $first: Int!
  $after: String
  $isPurchased: Boolean!
) {
  shoppingList(id: $id) {
    id
    itemsConnection(
      first: $first
      after: $after
      filters: { isPurchased: $isPurchased }
      orderBy: { sortOrder: ASC }
    ) {
      totalCount
      edges {
        cursor
        node {
          id
          itemName
          quantity
          quantityInput
          displayFormat
          purchaseInfo {
            isPurchased
          }
          version
          updatedAt
          category
          notes
          unitName
          unit {
            id
            name
            symbol
          }
          sortOrder
          item {
            id
            imageUrl
            images {
              url
              kind
            }
          }
          ...SortableItem_item
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query GetShoppingListItem($id: ID!) {
  shoppingListItem(id: $id) {
    # Select id at the top level (outside the fragments) so that under
    # dataMasking the returned shoppingListItem ref still carries its key field.
    # useFragment / cache.identify needs it to locate the entity; without it the
    # masked ref is just { __typename } and identification throws.
    id
    ...ItemDetail_shoppingListItem
    ...useShoppingListItemForm_item
  }
}

# Suggestions are a field on ShoppingList type. Each source is fetched via its
# own aliased call with a dedicated `limit` so one source (e.g. a recently-deleted
# list polluted with stale items) can't starve the others — POPULAR always gets
# its own quota. The UI shows a small preview of each and drills into the full
# per-source list on demand, so a generous per-source limit is fetched up front.
#
# Fields are inlined per alias rather than shared via a named fragment: data
# masking is enabled globally, so a `...Fragment` spread would hide these fields
# from the hook's direct reads (the rows render plain props, not useFragment).
query GetShoppingListSuggestions($id: ID!, $limit: Int = 20) {
  shoppingList(id: $id) {
    id
    recentlyDeleted: suggestions(limit: $limit, sources: [RECENTLY_DELETED]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      shoppingListItemId
    }
    frequentlyAdded: suggestions(limit: $limit, sources: [FREQUENTLY_ADDED]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      shoppingListItemId
    }
    popular: suggestions(limit: $limit, sources: [POPULAR]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      shoppingListItemId
    }
  }
}

