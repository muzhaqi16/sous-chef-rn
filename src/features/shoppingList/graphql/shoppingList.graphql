mutation SyncShoppingListItem($input: SyncShoppingListItemFullInput!) {
  syncShoppingListItem(input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      ...queueManager_syncItem
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
        sortOrder
      }
    }
  }
}

