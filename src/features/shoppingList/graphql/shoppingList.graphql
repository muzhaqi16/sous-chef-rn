# ============================================
# QUERIES
# ============================================

# Lightweight query for shopping list details WITHOUT items
# Use this for ShoppingListMain, ListSettings, ShareList
# Items are fetched separately via GetShoppingListItemsFiltered
query GetShoppingListDetails($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    # The ListSettings mutation hooks (complete/recurring/budget/reminder/
    # template) snapshot the list via readFragment before their optimistic
    # writes, and every snapshot fragment includes version + updatedAt — they
    # must be cached by this query or readFragment returns null and the
    # optimistic write silently skips.
    version
    updatedAt
    isDefault
    status
    isCompleted
    completedShopDate
    isRecurring
    recurringPattern
    recurringInterval
    nextRecurringDate
    isTemplate
    templateName
    # Read by `listFromTemplate` / `nextRecurringList` when this list is copied.
    description
    tags
    basedOnTemplate {
      id
      name
    }
    reminderEnabled
    reminderDate
    budgetAmount
    totalCost
    estimatedTotal
    currency
    priceTracking
    totalItems
    completedItems
    homeId
    canMoveToPantry
    shareCode
    isPublic
    # Server-built anyone-with-link share URL. Non-null only when isPublic and a
    # shareCode is set — the share UI gates on the same condition.
    shareLink {
      universal
    }
    home {
      id
      name
      myMembership {
        id
        role
        canAddItems
        canRemoveItems
        canEditPantry
      }
    }
    ownerships {
      id
      ...ShoppingListOwnershipFragment
    }
    collaboratorsConnection(first: 20) {
      edges {
        cursor
        node {
          id
          ...ShoppingListCollaboratorFragment
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

# Lightweight query for list selector - metadata only, no items/collaborators
# Use this for dashboard/list views.
query GetShoppingListsLite($homeId: ID, $first: Int, $after: String) {
  shoppingLists(homeId: $homeId, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        isDefault
        totalItems
        completedItems
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            displayName
            profile {
              id
              displayName
              avatar
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Lists the user saved as templates, for the "start from template" picker on
# the create screen. `shoppingLists` is cached per `filters`, so this variant is
# separate from the overview connection the list selector reads.
query GetShoppingListTemplates(
  $first: Int
  $after: String
  $copyableItemLimit: Int
) {
  shoppingLists(filters: { isTemplate: true }, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        templateName
        totalItems
        # Caches each template's lines with the picker that offers it, so
        # starting a list from one works offline.
        ...CopyableShoppingListFragment
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Paginated items query for a single tab (unpurchased OR purchased)
# Called twice in the hook — once per tab — so each has its own independent
# cursor and cache entry (Apollo keyArgs: ['filters'] handles separation)
#
# The `node` selects scalar meta fields inline (id, itemName, category,
# sortOrder, version, purchaseInfo, item, etc.) so the hook layer can read
# them directly without a `cache.readFragment` materialize round-trip.
# The masked `...SortableItem_item` ref flows to the row component, which
# calls `useFragment` to get a per-entity cache subscription.
query GetShoppingListItemsFiltered(
  $id: ID!
  $first: Int!
  $after: String
  $isPurchased: Boolean!
) {
  shoppingList(id: $id) {
    id
    itemsConnection(
      first: $first
      after: $after
      filters: { isPurchased: $isPurchased }
      orderBy: { sortOrder: ASC }
    ) {
      totalCount
      edges {
        cursor
        node {
          id
          # Parent list — see ShoppingListItemDisplayFragment for why every
          # writer of this entity has to carry it.
          shoppingList {
            id
          }
          itemName
          quantity
          quantityInput
          displayFormat
          purchaseInfo {
            isPurchased
            # Read by the row to show a line already stocked in the pantry.
            movedToPantryAt
          }
          version
          updatedAt
          category
          notes
          unitName
          unit {
            id
            name
            symbol
            # COUNT tells a receipt's printed count (2 @) apart from an amount.
            type
          }
          # The line's package size, else its item's: what one counted pack is
          # in a weighed line's unit (receipt moves, useApplyReceipt).
          netWeight
          netWeightUnit {
            id
          }
          sortOrder
          item {
            id
            imageUrl
            images {
              id
              url
              kind
            }
            netWeight
            netWeightKind
            displayUnit {
              id
            }
          }
          ...SortableItem_item
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query GetShoppingListItem($id: ID!) {
  shoppingListItem(id: $id) {
    # Select id at the top level (outside the fragments) so that under
    # dataMasking the returned shoppingListItem ref still carries its key field.
    # useFragment / cache.identify needs it to locate the entity; without it the
    # masked ref is just { __typename } and identification throws.
    id
    ...ItemDetail_shoppingListItem
    ...useShoppingListItemForm_item
  }
}

# Paginated purchase history for a single item. The PurchaseHistory screen
# fetches this on demand so ItemDetail only needs the lightweight
# purchaseHistory summary (count / last date), not the full purchase list.
query GetItemPurchaseHistory($itemId: ID!, $first: Int, $after: String) {
  shoppingListItem(id: $itemId) {
    id
    purchasesConnection(first: $first, after: $after) {
      edges {
        node {
          id
          purchaseDate
          quantity
          unitPrice
          totalPrice
          # The ISO code, not just the symbol: Intl needs the code to place the
          # symbol where the locale places it (`4,50 €`, not `€4.50`).
          currency {
            id
            code
          }
          unitSymbol
          # Who recorded the purchase. `email` is nullable by design (the API
          # gates it to self-or-admin), which the row's
          # displayName -> email -> "Someone" fallback already covers.
          user {
            id
            email
            displayName
            profile {
              id
              displayName
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

# One call returns every section: the server places an item only in the first
# section that offers it, which separate per-section calls cannot do. `limit`
# is per section, generous enough to back the drill-down. Rows select only what
# the sheet reads; `SuggestionItem.imageUrl` is always null, so `item` is not
# selected.
#
# Fields are inlined per section rather than shared via a named fragment: data
# masking is enabled globally, so a `...Fragment` spread would hide these fields
# from the hook's direct reads (the rows render plain props, not useFragment).
query GetShoppingListSuggestions($id: ID!, $limit: Int = 20) {
  shoppingList(id: $id) {
    id
    suggestions(limit: $limit) {
      recentlyDeleted {
        id
        itemId
        name
        category
        imageUrl
        defaultUnitId
      }
      frequentlyAdded {
        id
        itemId
        name
        category
        imageUrl
        defaultUnitId
      }
      popular {
        id
        itemId
        name
        category
        imageUrl
        defaultUnitId
      }
    }
  }
}

