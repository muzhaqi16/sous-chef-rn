mutation UpdateShoppingListItem($input: UpdateShoppingListItemInput!) {
  updateShoppingListItem(input: $input) {
    __typename
    ... on UpdateShoppingListItemPayload {
      shoppingListItem {
        id
        ...UpdateShoppingListItem_item
        # Marking an item purchased records a purchase server-side, so this
        # summary moves with the write. Selected here (not in the fragment,
        # which mirrors the optimistic shape) so ItemDetail's count and last
        # date are right straight from the response, with no refetch.
        purchaseHistory {
          previouslyPurchased
          purchaseCount
          lastPurchaseDate
        }
        purchaseInfo {
          ...ShoppingListItemPurchaseInfoFragment
        }
        # Brand and package size are editable from AddEditItem now that the
        # update input accepts them. Selected here so the saved values land in
        # the cache for ItemDetail and the form without a refetch; kept out of
        # the hook fragment, which mirrors the optimistic shape.
        brand {
          id
          name
        }
        netWeight
        netWeightUnit {
          id
          name
          symbol
        }
      }
      shoppingList {
        id
        totalItems
        completedItems
        remainingItems
        completionRate
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

