# Screen-level fragment for the ShoppingListItemDetail screen. Selects the
# fields the screen reads directly — purchase history, display metadata,
# the estimated price / preferred store the user enters in the form,
# nutrition/image data from the catalog item, audit fields (addedBy,
# createdAt, updatedAt), and the auto-add/meal-plan source flags.
fragment ItemDetail_shoppingListItem on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  unitName
  category
  notes
  priority
  createdAt
  updatedAt
  priceEstimate {
    estimated
  }
  storeInfo {
    preferredStore {
      id
      name
    }
  }
  purchaseInfo {
    isPurchased
    purchasedQuantity
    purchasedPrice
    purchaseDate
    purchasedBy {
      id
      profile {
        id
        displayName
        avatar
      }
    }
  }
  source {
    isAutoAdded
    autoAddReason
    isFromMealPlan
  }
  addedBy {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
  lastEditedBy {
    id
    profile {
      id
      displayName
      avatar
    }
  }
  item {
    id
    imageUrl
    images { url kind }
    nutritions
    displayUnit {
      id
      name
      symbol
    }
  }
  purchaseHistory {
    previouslyPurchased
    purchaseCount
    lastPurchaseDate
  }
}
