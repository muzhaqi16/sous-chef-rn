# Screen-level fragment for the ShoppingListItemDetail screen. Selects the
# fields the screen reads directly — purchase history, display metadata,
# the estimated price / preferred store the user enters in the form,
# nutrition/image data from the catalog item, audit fields (addedBy,
# createdAt, updatedAt), and the auto-add/meal-plan source flags.
fragment ItemDetail_shoppingListItem on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  unitName
  category
  notes
  priority
  createdAt
  updatedAt
  priceEstimate {
    estimated
  }
  storeInfo {
    preferredStore {
      id
      name
    }
  }
  brand {
    id
    name
  }
  netWeight
  netWeightUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  # Selected inline rather than spreading ShoppingListItemPurchaseInfoFragment:
  # this is the READER, and under `dataMasking` a named spread hides these
  # fields from ItemDetail.tsx's direct reads. Kept in step with that fragment
  # by __tests__/graphql/purchaseInfoCompleteness.test.ts.
  purchaseInfo {
    isPurchased
    movedToPantryAt
    purchasedQuantity
    purchasedPrice
    purchaseDate
    purchasedBy {
      id
      # The name for a row naming them: it follows the shared list, not the
      # profile's visibility, and falls back to their first name.
      displayName
      profile {
        id
        displayName
        avatar
      }
    }
  }
  source {
    addedContext
    isFromMealPlan
  }
  addedBy {
    id
    email
    displayName
    profile {
      id
      displayName
      avatar
    }
  }
  lastEditedBy {
    id
    displayName
    profile {
      id
      displayName
      avatar
    }
  }
  # The photo this entry shows: the household's choice, the catalog's, else the viewer's pending one.
  # `catalogImageId` names the item photo it is, so the hero can lead with it.
  image {
    url
    source
    catalogImageId
  }
  item {
    id
    # With canSuggest, gates the photo viewer's "set as main photo" action
    # (`writesItemDirectly`: never on a public item). Viewer-scoped, but it
    # costs this query nothing: the cache-policy warning in the schema applies to
    # the root `item(id:)` read, and a shopping list item's response is already
    # PRIVATE/no-store for its ownership data.
    canEdit
    canSuggest
    imageUrl
    images {
      id
      url
      kind
    }
    photos {
      id
      ...ItemPhotoCarousel_itemPhoto
    }
    # The item's own nutrition, else its concept's, marked as typical. Every
    # column, though the summary reads fewer: the pantry detail's offline stub
    # reads a `NutritionFacts` cached with fewer as missing and writes `null`.
    shownNutrition {
      facts {
        id
        calories
        totalFat
        saturatedFat
        transFat
        cholesterol
        sodium
        totalCarbs
        dietaryFiber
        totalSugars
        addedSugars
        protein
        vitaminD
        calcium
        iron
        potassium
        servingSize
        servingUnit
      }
      typicalOf {
        id
        name
      }
    }
    displayUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  purchaseHistory {
    previouslyPurchased
    purchaseCount
    lastPurchaseDate
  }
}
