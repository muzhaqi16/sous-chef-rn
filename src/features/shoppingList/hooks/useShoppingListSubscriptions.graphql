# Narrow fragments for useShoppingListSubscriptions's cache writes.
# The `ShoppingListChanges` subscription pushes the full item shape on
# Updated/Completed/Uncompleted events; the hook materializes via cache.readFragment
# and writes back via cache.writeFragment to trigger a single notification.
# Both fragments must mirror exactly what the subscription server pushes.
fragment useShoppingListSubscriptions_item on ShoppingListItem {
  amount {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
  id
  # The parent back-reference the list query selects on every node. Without it
  # the written row reads incomplete and the whole list blanks, which no
  # refetch repairs while the screen stays mounted.
  shoppingList {
    id
  }
  itemName
  quantity
  quantityInput
  displayFormat
  # This fragment is how another user's change reaches this device, so it
  # carries the whole purchase record. Worth recording that it can: this is a
  # read-back QUERY over HTTP — the subscription itself carries only the
  # envelope plus an id — so the depth-5 subscription budget does not apply,
  # which it would at `purchaseInfo > purchasedBy > profile > displayName`.
  purchaseInfo {
    ...ShoppingListItemPurchaseInfoFragment
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
    type
  }
  sortOrder
  # The row reads it; a write that leaves it out blanks the row.
  suggestedPrice {
    amount
    substitute
    currency {
      id
      code
      decimalPlaces
    }
  }
  # Store mode totals it before suggestedPrice.
  priceEstimate {
    estimated
  }
  # Store mode groups by it; a write that leaves it out blanks the row.
  storeDepartment
  storeDepartmentOverride
  image {
    url
    source
    catalogImageId
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
    storeDepartment
  }
}

# ============================================
# EVENT READ-BACK QUERIES
# ============================================
#
# `MyShoppingListsEvents` carries only the envelope plus the changed entity's
# id — a subscription document is validated against depth 5, which no fragment
# spread fits under. These queries are how the handler gets the values, over
# HTTP where the budget is generous, and only for events that need them.

query ShoppingListItemForEvent($id: ID!) {
  shoppingListItem(id: $id) {
    id
    ...useShoppingListSubscriptions_item
  }
}

query ShoppingListSummaryForEvent($id: ID!) {
  shoppingList(id: $id) {
    id
    name
    isCompleted
    totalItems
    completedItems
    remainingItems
    completionRate
  }
}

# Existence probe. `MyShoppingListsEvents` is user-scoped, so a LIST_UPDATED
# arrives for every list the user can reach, not just the open one. A non-null
# read means the cache is holding that list and its summary is worth
# refreshing; a null one means nothing on this device is showing it, and the
# next `cache-and-network` read will fetch it fresh anyway.
fragment useShoppingListSubscriptions_listRef on ShoppingList {
  id
}
