# Narrow fragment for MoveShoppingItemToPantry's response payload.
# Creates a new PantryItem in the destination pantry's connection;
# the new entity needs full display-cell hydration so subsequent reads
# (PantryItemCard, PantryItemDetail) find the fields they expect.
fragment useMoveToPantry_pantryItem on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  version
  updatedAt
  storageState
  expiresAt
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  activeBatchCount
  earliestBatchExpiration
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
  unit {
    id
    name
    symbol
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
}
