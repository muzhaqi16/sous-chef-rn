# Narrow fragment for MoveShoppingItemToPantry's response payload.
# The returned PantryItem is either a freshly created entry OR — when the
# item already exists in the destination pantry — the existing entry,
# restocked (quantity combined, an extra batch added; item-level costPerUnit
# unchanged), matching the canonical restockPantryItem. Either way the entity
# needs full display-cell hydration so subsequent reads (PantryItemCard,
# PantryItemDetail) find the fields they expect, and the restock-mutated
# fields (quantity, activeBatchCount, earliestBatchExpiration, version) must be
# selected so Apollo normalizes them onto the existing cached entity.
fragment useMoveToPantry_pantryItem on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  # The server's computed costs, so the moved row's detail screen has them
  # without a second fetch. `totalCost` is `costPerUnit x actualQuantity`.
  costPerUnit
  totalCost
  # What totalCost and costPerUnit are denominated in. Null when they are, and
  # when the costed batches disagree about currency. Read rather than assumed:
  # a cost recorded in euros stays euros whatever the account prefers now.
  costCurrency {
    id
    code
  }
  version
  updatedAt
  storageState
  expiresAt
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  activeBatchCount
  earliestBatchExpiration
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
  unit {
    id
    name
    symbol
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
}
