# What the list's lines not yet bought will cost, as the server sums them.
fragment useListCostToGo_list on ShoppingList {
  version
  id
  costToGo {
    amount
    currency
    pricedLines
    lines
  }
}

# Store mode's own read of it: the server re-prices the list on every read, so
# no mutation and no list read carries it.
query ListCostToGo($id: ID!) {
  shoppingList(id: $id) {
    version
    id
    ...useListCostToGo_list
  }
}
