# Where the list costs less, at the household's compared usual stores. A
# change of store restates it in UpdateShoppingList, in this selection.
query ListStoreSavings($input: ShoppingListStoreSavingsInput!) {
  shoppingListStoreSavings(input: $input) {
    currency {
      id
      code
      decimalPlaces
    }
    comparableLines
    leftOutLines
    truncated
    candidates {
      store {
        id
        name
        address
      }
      chain {
        id
        name
      }
      total
      sameLines
      similarLines
      estimatedLines
      isTarget
    }
  }
}
