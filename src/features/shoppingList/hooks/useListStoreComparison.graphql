# Where the list is cheapest, from recorded prices (30 calls a minute).
query ListStoreComparison($input: ShoppingListStoreComparisonInput!) {
  shoppingListStoreComparison(input: $input) {
    scope
    currency {
      id
      code
      decimalPlaces
    }
    comparableLines
    leftOutLines
    truncated
    unpricedLines {
      id
    }
    candidates {
      scope
      store {
        id
        name
        address
      }
      chain {
        id
        name
      }
      estimatedTotal
      pricedLines
      chainFilledLines
      anyStoreFilledLines
      ranked
      isTarget
      newestObservedAt
    }
  }
}
