# Narrow fragment for useUpdateShoppingItem's optimistic-response shape.
# Must structurally match what the UpdateShoppingListItem mutation selects
# on `shoppingListItem` — keep them in sync. The hook reads every one of
# these fields from cache to spread into the optimistic response.
fragment useUpdateShoppingItem_item on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
  }
  sortOrder
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
}
