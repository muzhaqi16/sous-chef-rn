# Snapshot/write shape for useShoppingListBudget's optimistic writes: the budget
# limit / currency / price-tracking flag the screen edits plus the
# version/updatedAt pair the revert restores. Every field must be selected by the
# reading query (GetShoppingListDetails) so the snapshot reads complete —
# otherwise the optimistic write silently skips. totalCost / estimatedTotal are
# server-derived and never written optimistically.
fragment useShoppingListBudget_list on ShoppingList {
  id
  budgetAmount
  currency
  priceTracking
  version
  updatedAt
}
