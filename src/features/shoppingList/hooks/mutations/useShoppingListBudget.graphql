# Precondition read for useShoppingListBudget: `version`, which updateShoppingList
# requires (an update sent without one reports success while overwriting a
# concurrent edit). The budget/currency/price-tracking fields are the ones the
# screen edits, kept here so the read and the reading query (GetShoppingListDetails)
# select the same shape — readFragment returns null on a partial entity, and a
# null read refuses the update. Server-derived totalCost / estimatedTotal are not
# part of it; they reconcile from the mutation response.
fragment useShoppingListBudget_list on ShoppingList {
  id
  budgetAmount
  currency
  priceTracking
  version
  updatedAt
}
