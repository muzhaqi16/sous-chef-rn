# The snapshot useToggleShoppingItem reverts from, spread by
# UpdateShoppingListItem on `shoppingListItem`. Every field here is one a
# refusal has to be able to put back, so a field the flip CLEARS must be
# selected or the revert cannot restore it.
fragment useToggleShoppingItem_item on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  displayFormat
  purchaseInfo {
    isPurchased
    # The revert restores this. A flip CLEARS the stamp (the server does the
    # same on that transition), so a snapshot that does not carry it has
    # nothing to put back when the server refuses — and the row then re-offers
    # move-to-pantry for a line the bulk move will act on.
    movedToPantryAt
  }
  version
  updatedAt
  category
  notes
  unitName
  unit {
    id
    name
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
  }
  sortOrder
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
}
