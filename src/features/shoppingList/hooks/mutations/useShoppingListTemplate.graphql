# Snapshot/write shape for useShoppingListTemplate's optimistic markAsTemplate
# write: the template flags the screen sets plus the version/updatedAt pair the
# revert restores. Every field must be selected by the reading query
# (GetShoppingListDetails) so the snapshot reads complete — otherwise the
# optimistic write silently skips.
fragment useShoppingListTemplate_list on ShoppingList {
  id
  isTemplate
  templateName
  version
  updatedAt
}
