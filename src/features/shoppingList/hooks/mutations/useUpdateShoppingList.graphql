# Read shape for useUpdateShoppingList: the version its mutation must carry,
# plus the settings the screen edits. The extra fields are load-bearing as a
# guard rather than as data — readFragment yields null unless ALL of them are
# cached, which is how the hook refuses to update a row it does not hold. The
# undo is owned by the write intent, not by this read.
fragment useUpdateShoppingList_list on ShoppingList {
  id
  name
  isDefault
  status
  isCompleted
  completedShopDate
  version
  updatedAt
}
