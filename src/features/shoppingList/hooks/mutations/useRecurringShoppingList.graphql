# Snapshot/write shape for useRecurringShoppingList's optimistic writes: the
# recurrence fields the screen sets (isRecurring, pattern, interval, next date)
# plus the version/updatedAt pair the revert restores. Every field must be
# selected by the reading query (GetShoppingListDetails) so the snapshot reads
# complete — otherwise the optimistic write silently skips.
fragment useRecurringShoppingList_list on ShoppingList {
  id
  isRecurring
  recurringPattern
  recurringInterval
  nextRecurringDate
  version
  updatedAt
}
