# Narrow fragment for useQuantityEditModal's live cache subscription.
# Reads only the fields the QuantityEditItem display needs.
fragment useQuantityEditModal_item on ShoppingListItem {
  id
  itemName
  quantity
  category
  unitName
  version
  unit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  # The amount as the row reads it, which the sheet opens on.
  amount {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  image {
    url
    source
    catalogImageId
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
}

# What a quantity edit changes on the row: spread by UpdateShoppingListItem,
# the one door a quantity, unit or purchased-state change goes through.
fragment useQuantityEditModal_updateQuantityResult on ShoppingListItem {
  id
  quantity
  quantityInput
  displayFormat
  unitName
  version
  unit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
}
