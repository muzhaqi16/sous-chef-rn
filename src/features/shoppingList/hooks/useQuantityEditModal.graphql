# Narrow fragment for useQuantityEditModal's live cache subscription.
# Reads only the fields the QuantityEditItem display needs.
fragment useQuantityEditModal_item on ShoppingListItem {
  id
  itemName
  quantity
  category
  unitName
  version
  unit {
    id
    name
    symbol
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
}

# Narrow fragment for the UpdateShoppingListItemQuantity mutation response.
# The mutation can change quantity, quantityInput, displayFormat, unit,
# unitName, and version.
fragment useQuantityEditModal_updateQuantityResult on ShoppingListItem {
  id
  quantity
  quantityInput
  displayFormat
  unitName
  version
  unit {
    id
    name
    symbol
  }
}
