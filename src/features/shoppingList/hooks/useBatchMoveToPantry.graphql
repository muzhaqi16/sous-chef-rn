mutation MovePurchasedItemsToPantry($input: MovePurchasedItemsToPantryInput!) {
  movePurchasedItemsToPantry(input: $input) {
    movedCount
    movedItems {
      shoppingListItemId
      pantryItemId
      itemName
      quantity
    }
    skippedCount
    skippedItems {
      shoppingListItemId
      itemName
      reason
    }
    targetPantryId
    targetPantryName
  }
}
