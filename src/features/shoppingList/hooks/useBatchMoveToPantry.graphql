mutation MovePurchasedItemsToPantry($input: MovePurchasedItemsToPantryInput!) {
  movePurchasedItemsToPantry(input: $input) {
    __typename
    ... on MovePurchasedItemsToPantryPayload {
      shoppingList {
        id
        ...ShoppingListReaders
      }
      # One per purchased line this call attempted. A successful line is in the
      # pantry, whether this call moved it or found it there; `alreadyInPantry`
      # is not selected because the cached stamp decides whether a line needs
      # one (`markMovedLinesStocked`). Of a failure only `itemName` reaches the
      # user: `code` and `errorId` go to telemetry, and `reason` is a server
      # string never shown.
      results {
        shoppingListItemId
        success
        itemName
        failure {
          code
          errorId
        }
      }
      summary {
        total
        succeeded
        failed
        skipped
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
