mutation MovePurchasedItemsToPantry($input: MovePurchasedItemsToPantryInput!) {
  movePurchasedItemsToPantry(input: $input) {
    __typename
    ... on MovePurchasedItemsToPantryPayload {
      result {
        movedCount
        movedItems {
          shoppingListItemId
          pantryItemId
          itemName
          quantity
        }
        skippedCount
        skippedItems {
          shoppingListItemId
          itemName
          reason
        }
        targetPantryId
        targetPantryName
      }
    }
    ... on Error {
      code
      message
    }
  }
}
