# A local-first create's list: everything a query reads on one, plus its
# collaborators as a new list starts them. Field arguments are part of the
# cache key, so `first: 20` is what `GetShoppingListDetails` reads.
fragment list_row on ShoppingList {
  id
  ...ShoppingListReaders
  collaboratorsConnection(first: 20) {
    edges {
      cursor
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# One filtered `itemsConnection` variant, addressed by the same
# `filters: { isPurchased }` keyArgs the items screen queries with.
fragment list_emptyItemsVariant on ShoppingList {
  id
  itemsConnection(filters: { isPurchased: $isPurchased }) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
    }
  }
}
