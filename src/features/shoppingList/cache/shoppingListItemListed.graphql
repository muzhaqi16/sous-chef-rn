# What a listed shopping-list line shows: every field the list's row cell
# reads (`SortableItem_item`), so `GetShoppingListItemsFiltered` fetches them
# and each row reads its own fragment by id
# (`listedFragmentsCoverCells.test.ts`).
fragment shoppingListItem_listed on ShoppingListItem {
  id
  itemName
  quantity
  quantityInput
  category
  unitName
  unit {
    id
    symbol
  }
  amount {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
  purchaseInfo {
    isPurchased
    movedToPantryAt
  }
  suggestedPrice {
    amount
    substitute
    currency {
      id
      code
      decimalPlaces
    }
  }
  # The photo this entry shows: the household's choice, else the catalog's.
  image {
    url
    source
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
}
