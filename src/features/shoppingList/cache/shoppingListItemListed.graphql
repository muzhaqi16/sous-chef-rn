# What a listed shopping-list line shows: every field the list's row cell
# reads (`SortableItem_item`) and its edit form (`useShoppingListItemForm_item`),
# so `GetShoppingListItemsFiltered` fetches them and each reads its own fragment
# by id, offline too (`listedFragmentsCoverCells.test.ts`).
fragment shoppingListItem_listed on ShoppingListItem {
  version
  id
  itemName
  quantity
  quantityInput
  category
  unitName
  unit {
    id
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  amount {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  purchaseInfo {
    isPurchased
    movedToPantryAt
  }
  suggestedPrice {
    amount
    substitute
    currency {
      id
      code
      decimalPlaces
    }
  }
  # The photo this entry shows: the household's choice, the catalog's, else the viewer's pending one.
  image {
    url
    source
    catalogImageId
  }
  item {
    version
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
  # What the edit form reads as well, so a listed line opens with no read.
  notes
  priority
  netWeight
  netWeightUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  priceEstimate {
    estimated
  }
  storeInfo {
    preferredStore {
      id
      name
    }
  }
  brand {
    version
    id
    name
  }
}
