# The stacks of a receipt line's product this pantry holds: where an earlier
# purchase of it, which the line may be the receipt for, was stocked.
query HeldStacksOfItem($pantryId: ID!, $itemId: ID!) {
  pantry(id: $pantryId) {
    id
    version
    itemsConnection(filters: { itemId: $itemId }, first: 5) {
      edges {
        node {
          id
          version
        }
      }
    }
  }
}

# The purchases that stocked one of those stacks: who bought each, and when.
query EarlierPurchasesOfStack($pantryItemId: ID!) {
  pantryItemBatchesConnection(pantryItemId: $pantryItemId, first: 20) {
    edges {
      node {
        id
        version
        purchase {
          id
          version
          purchaseDate
          quantity
          unitSymbol
          purchasedBy {
            id
          }
        }
      }
    }
  }
}
