# Operations composed locally per the Feature API Boundary Convention since
# pantry/graphql and shoppingList/graphql are internal to those features.
#
# Each mutation only needs the resulting entity's `id` here — the cache updaters
# (`createAddToParentConnectionUpdater`, `addNewItemToShoppingListCache`) read
# only `{ id }` to add edges to the parent connection, and consumers don't read
# any other field off the mutation result. Keeping the selection minimal avoids
# coupling barcode to cross-domain fragments (`PantryItemDisplay`,
# `ShoppingListItemDisplayFragment`) that are internal to their features.
#
# Operation names are barcode-prefixed so they don't collide with same-mutation
# operations in pantry/recipes/shoppingList (which select richer fields needed
# by their own consumers).
fragment SearchResults_shoppingListItem on ShoppingListItem {
  id
}

fragment SearchResults_pantryItem on PantryItem {
  id
}

mutation BarcodeAddItemToShoppingList($input: CreateShoppingListItemInput!) {
  addItemToShoppingList(input: $input) {
    __typename
    ... on AddItemToShoppingListSuccess {
      shoppingListItem {
        id
        ...SearchResults_shoppingListItem
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation BarcodeCreatePantryItem($input: CreatePantryItemInput!) {
  createPantryItem(input: $input) {
    __typename
    ... on CreatePantryItemSuccess {
      pantryItem {
        id
        ...SearchResults_pantryItem
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation BarcodeRestockPantryItem($input: RestockPantryItemInput!) {
  restockPantryItem(input: $input) {
    __typename
    ... on RestockPantryItemSuccess {
      pantryItemUsage {
        id
        quantityUsed
        purpose
        costPerUnit
        totalCost
        pantryItem {
          ...SearchResults_pantryItem
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
