# Store mode's prices for a scanned product: what the household itself paid
# ("Last paid", "Your usual"), the usual per one of the unit `trackingUnit`
# names, with no pantry: the one the server prices it in when asked for none,
# and what it typically costs where. The scan's lookup carries it in store
# mode. Keyed by the item and the home, so a product read before still shows
# it offline at the shelf.
fragment useStorePriceMemory_item on Item {
  version
  id
  # Aliased: the lookup asks for the pantry's.
  usualUnit: trackingUnit {
    id
  }
  householdPriceSummary(homeId: $homeId) {
    currency {
      id
      code
      decimalPlaces
    }
    lastPaid {
      unitPrice
      unit {
        id
        name
        symbol
        localizedSymbolForms {
          one
          other
        }
      }
      normalizedPrice
      basis
      store {
        id
        name
      }
      paidAt
      onSale
    }
    usual {
      basis
      medianPrice
      unitPrice
    }
  }
  # What it typically costs by store and by chain, read for the list's store.
  priceComparison {
    currency {
      id
      code
      decimalPlaces
    }
    rows {
      basis
      scope
      medianPrice
      meetsMinimumSample
      store {
        id
      }
      chain {
        id
      }
    }
  }
}

# The store the list is shopped at and its chain, whose typical price shows.
# The scan's lookup carries it in store mode beside the item.
fragment useStorePriceMemory_list on ShoppingList {
  version
  id
  targetStore {
    id
    chain {
      id
      name
    }
  }
}

# The same for an item that came another way than the scan's lookup.
query StorePriceMemory($itemId: ID!, $homeId: ID!, $listId: ID!) {
  item(id: $itemId) {
    version
    id
    ...useStorePriceMemory_item
  }
  shoppingList(id: $listId) {
    version
    id
    ...useStorePriceMemory_list
  }
}

# The usual per one of a list line's own unit, when the price sheet counts in
# it. The summary's objects merge (`catalogTypePolicies`), so this joins what
# the lookup stored rather than replacing it.
query HouseholdUsualUnitPrice($itemId: ID!, $homeId: ID!, $unitId: ID!) {
  item(id: $itemId) {
    version
    id
    householdPriceSummary(homeId: $homeId) {
      usual {
        unitPrice(unitId: $unitId)
      }
    }
  }
}
