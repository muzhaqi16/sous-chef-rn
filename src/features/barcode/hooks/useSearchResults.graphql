# The scan lookups: a barcode first, then the same code as a store SKU, by
# `lookup`, so both read the same fields.

# A scan reports the scanned barcode's own pack: `netWeight`, `netWeightKind`,
# `displayUnit` and `variationBrand` are that barcode's, never another pack's.
# An add names `matchedVariation.id` to store exactly those facts.
# A scan asks once: the product's origin, brand-list matches and the
# household's dietary alerts come with it, read by their hooks' fragments, and
# in store mode what the household paid and the shelf price at each store.
# Without a home there are no alerts to read; `$homeId` is then never sent on.
query ItemByLookup(
  $lookup: ItemLookupInput!
  $pantry: ID
  $homeId: ID = ""
  $withHome: Boolean = false
  $withPrices: Boolean = false
  $withShelfPrices: Boolean = false
) {
  items(filters: { lookup: $lookup }, first: 1) {
    edges {
      cursor
      node {
        id
        ...useProductOrigin_item
        ...useProductBrandListings_item
        ...useProductDietaryAlerts_item @include(if: $withHome)
        ...useStorePriceMemory_item @include(if: $withPrices)
        ...useStoreShelfPrices_item @include(if: $withShelfPrices)
        # The concepts above the product, nearest first: store mode ticks the
        # list line that names the product or one of them.
        ancestors {
          id
        }
        imageUrl
        imageCredit {
          text
          license
          licenseUrl
          sourceUrl
        }
        # The card shows the photo full-width, and `imageUrl` is its thumbnail:
        # the card takes the first photo (gallery order leads with the primary)
        # at its original size, with its credit.
        photos {
          id
          url
          credit {
            text
            license
            licenseUrl
            sourceUrl
          }
        }
        name
        description
        netWeight
        primaryUpc
        type
        # Together these decide whether the card offers an edit action at all,
        # and which wording it uses (`writesItemDirectly`). canEdit is
        # viewer-scoped (the item's creator and admins); canSuggest is
        # structural (active PUBLIC catalog items). Both false means read-only —
        # a scan can surface an item you may not touch.
        canEdit
        canSuggest
        storageState
        shelfLifeDays
        shelfLifeOpenedDays
        tags
        netWeightKind
        displayUnit {
          id
          name
          symbol
          localizedSymbolForms {
            one
            other
          }
        }
        # The scanned pack's PACKAGE size, read in each unit system with the
        # label's own figure: what the card and the add's size prefill show.
        packageSize {
          value
          unitId
          metric {
            value
            unitId
            symbol
            localizedSymbol
            displayAsFraction
            type
          }
          imperial {
            value
            unitId
            symbol
            localizedSymbol
            displayAsFraction
            type
          }
        }
        # The package as the pieces its label states ("6 x 250mL"): a
        # multipack's add counts the pieces, each of that size, in their
        # container. count × each is always packageSize.
        packs {
          count
          each {
            value
            unitId
            metric {
              value
              unitId
              symbol
              localizedSymbol
              displayAsFraction
              type
            }
            imperial {
              value
              unitId
              symbol
              localizedSymbol
              displayAsFraction
              type
            }
          }
          container {
            id
            symbol
            localizedSymbolForms {
              one
              other
            }
          }
        }
        # The result's nutrition card and the full sheet it opens: the item's
        # own, else its concept's, marked as typical.
        shownNutrition {
          facts {
            id
            calories
            totalFat
            saturatedFat
            transFat
            cholesterol
            sodium
            totalCarbs
            dietaryFiber
            totalSugars
            addedSugars
            protein
            vitaminD
            calcium
            iron
            potassium
            servingSize
            servingUnit
          }
          typicalOf {
            id
            name
          }
        }
        # A count unit here is the add's package unit; a measure is not.
        trackingUnit(pantry: $pantry) {
          id
          name
          symbol
          localizedSymbolForms {
            one
            other
          }
          type
          displayAsFraction
        }
        # The container households count it in. `trackingUnit` ends in it only
        # for a sized pack, so an unsized one reads it here before a piece.
        suggestedPackageUnit {
          id
          symbol
          localizedSymbolForms {
            one
            other
          }
        }
        categories {
          id
          isPrimary
          category {
            id
            name
            type
          }
        }
        units {
          id
          isDefault
          unitId
        }
        variationBrand {
          id
          name
          # The company the brand is part of, as the catalog names it: the
          # card's owner line.
          parent {
            id
            name
          }
        }
        matchedVariation {
          id
          upc
          source
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# What the result reads of the item the scan's new-item form created: the
# lookup's own fields, less the scanned pack's, which a created item has none of.
# Read live by id, so an edit of the item reaches the card.
fragment useSearchResults_item on Item {
  id
  name
  description
  imageUrl
  canEdit
  canSuggest
  netWeight
  displayUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  packageSize {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  # The item's own nutrition, else its concept's, marked as typical.
  shownNutrition {
    facts {
      id
      calories
      totalFat
      saturatedFat
      transFat
      cholesterol
      sodium
      totalCarbs
      dietaryFiber
      totalSugars
      addedSugars
      protein
      vitaminD
      calcium
      iron
      potassium
      servingSize
      servingUnit
    }
    typicalOf {
      id
      name
    }
  }
  type
  storageState
  shelfLifeDays
  shelfLifeOpenedDays
  tags
  categories {
    id
    isPrimary
    category {
      id
      name
      type
    }
  }
  units {
    id
    isDefault
    unitId
  }
}
