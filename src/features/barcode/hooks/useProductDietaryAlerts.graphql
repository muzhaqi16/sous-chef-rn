# What a scanned product means for the household: an alert per member
# restriction it meets, strongest first, and products of the same kind that
# meet none. Its own query, keyed by the item, so a product checked before still
# shows its alerts offline.
query ProductDietaryAlerts($itemId: ID!, $homeId: ID!) {
  item(id: $itemId) {
    id
    dietaryAlerts(homeId: $homeId) {
      state
      membership {
        id
        userId
        role
        displayName
      }
      restriction {
        id
        diet
        intolerance
        healthGoal
        item {
          id
          name
        }
        severity
      }
    }
    dietaryAlternatives(homeId: $homeId, first: 5) {
      id
      name
      imageUrl
      primaryUpc
    }
  }
}
