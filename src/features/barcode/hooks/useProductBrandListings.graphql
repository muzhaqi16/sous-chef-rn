# Where a scanned product's brand sits on the user's own enabled brand lists:
# the list, the entry (its note, and the brand it names) and the product's
# brand it reached. Its own query, keyed by the item, so a product read before
# still shows it offline; the barcode lookup reads the fragment too, so a scan
# asks once. Each list's `enabled` is read from the list itself, so a list
# switched off here drops out at once.
query ProductBrandListings($itemId: ID!) {
  item(id: $itemId) {
    version
    id
    ...useProductBrandListings_item
  }
}

fragment useProductBrandListings_item on Item {
  version
  id
  listMatches {
    brandList {
      version
      id
      name
      enabled
    }
    entry {
      version
      id
      reason
      brand {
        version
        id
        name
      }
    }
    brand {
      version
      id
      name
    }
    viaParent
  }
}
