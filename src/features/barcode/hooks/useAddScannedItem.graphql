# Composed locally: shoppingList/graphql is internal to its feature.
# Barcode-prefixed so it does not collide with the richer same-mutation
# operation that feature owns; the offline queue registers it by name. The
# pantry add and restock go through the pantry's own hooks.

mutation BarcodeAddItemToShoppingList($input: AddItemsToShoppingListInput!) {
  addItemsToShoppingList(input: $input) {
    __typename
    ... on AddItemsToShoppingListPayload {
      shoppingList {
        id
        ...ShoppingListReaders
      }
      results {
        index
        clientId
        success
        failure {
          code
          reason
          errorId
        }
        packageSizeCleared
        item {
          id
          ...ShoppingListItemReaders
          ...AddedShoppingListItemFields
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
