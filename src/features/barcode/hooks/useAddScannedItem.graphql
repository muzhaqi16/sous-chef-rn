# Composed locally: pantry/graphql and shoppingList/graphql are internal to
# their features. Each result selects only the ids the cache updaters read.
# Barcode-prefixed so they do not collide with the richer same-mutation
# operations those features own; the offline queue registers them by name.

mutation BarcodeAddItemToShoppingList($input: AddItemsToShoppingListInput!) {
  addItemsToShoppingList(input: $input) {
    __typename
    ... on AddItemsToShoppingListPayload {
      shoppingList {
        id
        ...ShoppingListReaders
      }
      results {
        index
        clientId
        success
        failure {
          code
          reason
          errorId
        }
        packageSizeCleared
        item {
          id
          ...ShoppingListItemReaders
          ...AddedShoppingListItemFields
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation BarcodeCreatePantryItem(
  $input: CreatePantryItemInput!
  $today: LocalDate!
) {
  createPantryItem(input: $input) {
    __typename
    ... on CreatePantryItemPayload {
      storageLocation {
        id
        ...StorageLocationReaders
      }
      pantryItem {
        id
        ...PantryItemReaders
        ...SearchResults_pantryItem
      }
      pantry {
        id
        ...PantryReaders
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
    ... on UnitEligibilityError {
      field
      validUnits
      denial
    }
    ... on DuplicatePantryItemError {
      existingPantryItemIds
    }
  }
}

mutation BarcodeRestockPantryItem(
  $input: RestockPantryItemInput!
  $today: LocalDate!
) {
  restockPantryItem(input: $input) {
    __typename
    ... on RestockPantryItemPayload {
      storageLocation {
        id
        ...StorageLocationReaders
      }
      pantry {
        id
        ...PantryReaders
      }
      pantryItemUsage {
        id
        ...PantryItemUsageReaders
        costPerUnit
        totalCost
        pantryItem {
          id
          version
          quantity
          heldQuantity
          displayAmount {
            quantity
            unit {
              id
              symbol
            }
          }
          isLowStock
          ...SearchResults_pantryItem
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
    ... on UnitEligibilityError {
      field
      validUnits
      denial
    }
  }
}

# The duplicate's count, bumped locally so an offline restock shows at once.
fragment useAddScannedItem_restockQuantity on PantryItem {
  id
  quantity
}
