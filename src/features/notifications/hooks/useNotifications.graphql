# A live event's row, read back over HTTP: `NotificationEvents` carries only
# the id, because a subscription is refused past depth 4 and the row's typed
# `data` sits deeper. The feed's own fragment, so the row it adds is complete.
query NotificationForEvent($id: ID!) {
  notification(id: $id) {
    id
    ...useNotificationsOnLaunch_notification
  }
}
