fragment useNotificationsOnLaunch_notification on Notification {
  id
  type
  priority
  # `title`/`message` reach the screen ONLY for an authored row — an admin's
  # announcement, which is content a person wrote. Everything else renders
  # `getNotificationCopy` from `type` + `payload`, because the server builds
  # these two from a template, in English, in every locale.
  isAuthoredContent
  title
  message
  payload
  category
  sentAt
  expiresAt
  sourceId
  sourceType
  # The stack as the server resolves it NOW (a merge is followed); null when
  # the notification is about none, or its batch is gone.
  pantryItemId
  actionUrl
  readAt
  status
}
