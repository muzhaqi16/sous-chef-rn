# ============================================
# MUTATIONS
# ============================================

mutation MarkNotificationAsRead($input: MarkNotificationAsReadInput!) {
  markNotificationAsRead(input: $input) {
    __typename
    ... on MarkNotificationAsReadPayload {
      notification {
        id
        status
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

# No `notification { id }`: written back, it would restore the evicted row as a
# stub, and a queued replay writes its result to the cache.
mutation DeleteNotification($input: DeleteNotificationInput!) {
  deleteNotification(input: $input) {
    __typename
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
