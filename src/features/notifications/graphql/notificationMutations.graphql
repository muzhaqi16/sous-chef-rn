# ============================================
# MUTATIONS
# ============================================

mutation MarkNotificationAsRead($id: ID!) {
  markNotificationAsRead(id: $id) {
    __typename
    ... on MarkNotificationAsReadSuccess {
      notification {
        id
        status
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation MarkNotificationUnread($id: ID!) {
  markNotificationUnread(id: $id) {
    __typename
    ... on MarkNotificationUnreadSuccess {
      notification {
        id
        status
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation DeleteNotification($id: ID!) {
  deleteNotification(id: $id) {
    __typename
    ... on DeleteNotificationSuccess {
      notification {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}
