# ============================================
# EXPIRATION NOTIFICATION MUTATIONS
# ============================================

mutation MarkExpirationAction($input: MarkExpirationActionInput!) {
  markExpirationAction(input: $input) {
    __typename
    ... on MarkExpirationActionPayload {
      expirationNotification {
        id
        ...ExpirationNotificationReaders
        status
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation MarkExpirationNotificationAsRead(
  $input: MarkExpirationNotificationAsReadInput!
) {
  markExpirationNotificationAsRead(input: $input) {
    __typename
    ... on MarkExpirationNotificationAsReadPayload {
      expirationNotification {
        id
        ...ExpirationNotificationReaders
        status
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
