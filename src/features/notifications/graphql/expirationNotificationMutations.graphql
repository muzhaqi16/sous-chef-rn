# ============================================
# EXPIRATION NOTIFICATION MUTATIONS
# ============================================

mutation MarkExpirationAction($input: MarkActionInput!) {
  markExpirationAction(input: $input) {
    __typename
    ... on MarkExpirationActionSuccess {
      expirationNotification {
        id
        status
        actionTaken
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DismissExpirationNotification($input: DismissNotificationInput!) {
  dismissExpirationNotification(input: $input) {
    __typename
    ... on DismissExpirationNotificationSuccess {
      expirationNotification {
        id
        status
        actionTaken
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation MarkExpirationNotificationAsRead($notificationId: ID!) {
  markExpirationNotificationAsRead(notificationId: $notificationId) {
    __typename
    ... on MarkExpirationNotificationAsReadSuccess {
      expirationNotification {
        id
        status
        actionTaken
      }
    }
    ... on Error {
      code
      message
    }
  }
}
