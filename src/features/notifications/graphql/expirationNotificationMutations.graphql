# ============================================
# EXPIRATION NOTIFICATION MUTATIONS
# ============================================

mutation MarkExpirationAction(
  $input: MarkExpirationActionInput!
  $today: LocalDate!
) {
  markExpirationAction(input: $input) {
    __typename
    ... on MarkExpirationActionPayload {
      expirationNotification {
        id
        ...ExpirationNotificationReaders
        status
      }
      pantry {
        id
        ...PantryReaders
      }
      storageLocation {
        id
        ...StorageLocationReaders
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
