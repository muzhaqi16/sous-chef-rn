# ============================================
# BULK NOTIFICATION MUTATIONS
# ============================================

mutation MarkAllNotificationsAsRead {
  markAllNotificationsAsRead {
    __typename
    ... on MarkAllNotificationsAsReadPayload {
      count
    }
    ... on Error {
      code
      message
    }
  }
}

# Bulk delete by id — used by "Clear read" to remove only the already-read
# notifications (pass their ids), preserving unread ones.
mutation DeleteMultipleNotifications($input: DeleteMultipleNotificationsInput!) {
  deleteMultipleNotifications(input: $input) {
    __typename
    ... on DeleteMultipleNotificationsPayload {
      count
      notifications {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}
