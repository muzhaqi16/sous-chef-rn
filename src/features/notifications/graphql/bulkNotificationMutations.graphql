# ============================================
# BULK NOTIFICATION MUTATIONS
# ============================================

# Each payload states the badge after the write, as in notificationMutations.

mutation MarkAllNotificationsAsRead {
  markAllNotificationsAsRead {
    __typename
    ... on MarkAllNotificationsAsReadPayload {
      summary {
        total
      }
      notificationSummary {
        id
        ...NotificationSummaryReaders
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

# Bulk delete by id — used by "Clear read" to remove only the already-read
# notifications (pass their ids), preserving unread ones. No `notifications
# { id }`: written back, they would restore the evicted rows as stubs.
mutation DeleteMultipleNotifications(
  $input: DeleteMultipleNotificationsInput!
) {
  deleteMultipleNotifications(input: $input) {
    __typename
    ... on DeleteMultipleNotificationsPayload {
      summary {
        total
      }
      notificationSummary {
        id
        ...NotificationSummaryReaders
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
