# ============================================
# SUBSCRIPTIONS
# ============================================

# Consolidated notification stream. One subscription carries every event kind,
# discriminated by `subtype`: CREATED / UPDATED plus the dedicated status
# transitions READ / DISMISSED and the aggregate BULK_READ / BULK_CLEARED /
# BULK_EXPIRED (which arrive with a null `node` and only `affectedCount`).
# Keeps the per-user concurrent-subscription count low (the server caps it
# cluster-wide). No self-echo filtering: notifications originate from the
# system rather than a user action, so the handler routes purely on `subtype`
# and never needs an originator id.
subscription NotificationEvents {
  notificationEvents {
    subtype
    mutation
    timestamp
    affectedCount
    node {
      id
      ...useNotifications_notification
    }
  }
}

# ============================================
# QUERIES
# ============================================

# The badge alone: the server-event re-read, and what the badge readers watch.
query NotificationSummary {
  notificationSummary {
    id
    unreadCount
    hasUrgent
  }
}

query GetUnreadNotifications {
  # Server-authoritative badge: it stays correct when more are unread than the
  # page below loads, and after a cache clear (a list recompute under-counts
  # both).
  notificationSummary {
    id
    unreadCount
    hasUrgent
  }
  me {
    id
    notificationsConnection(
      filters: { unreadOnly: true }
      first: 50
      orderBy: SENT_AT_DESC
    ) {
      edges {
        node {
          id
          ...useNotificationsOnLaunch_notification
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Paginated notification history for the feed. Unlike GetUnreadNotifications
# this does NOT filter to unread, so read notifications are fetched too and the
# feed survives a cache clear. `filter` moves category/type/priority selection
# server-side; `after` + endCursor drive load-more.
query GetNotifications(
  $filter: NotificationFilters
  $first: Int = 30
  $after: String
) {
  # Server-authoritative badge, re-read with the history: it stays correct when
  # more are unread than this page holds, as in GetUnreadNotifications.
  notificationSummary {
    id
    unreadCount
    hasUrgent
  }
  me {
    id
    notificationsConnection(
      filters: $filter
      first: $first
      after: $after
      orderBy: SENT_AT_DESC
    ) {
      edges {
        node {
          id
          ...useNotificationsOnLaunch_notification
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}
