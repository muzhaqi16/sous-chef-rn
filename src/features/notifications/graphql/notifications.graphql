# ============================================
# SUBSCRIPTIONS
# ============================================

# Consolidated notification stream. One subscription carries both created and
# updated events, discriminated by `subtype` (CREATED / UPDATED). Keeps the
# per-user concurrent-subscription count low (the server caps it cluster-wide).
# No self-echo filtering: notifications originate from the system rather than a
# user action, so the handler routes purely on `subtype` and never needs an
# originator id.
subscription NotificationEvents {
  notificationEvents {
    subtype
    mutation
    timestamp
    node {
      id
      ...useNotifications_notification
    }
  }
}

# ============================================
# QUERIES
# ============================================

query GetUnreadNotifications {
  me {
    id
    # Server-authoritative counts — the badge seeds from these so it stays
    # correct even when there are more unread than the page below loads, or
    # after a cache clear (the local list-recompute alone under-counts both).
    unreadNotificationCount
    hasUrgentNotifications
    notificationsConnection(
      filters: { unreadOnly: true }
      first: 50
      orderBy: SENT_AT_DESC
    ) {
      edges {
        node {
          id
          ...useNotificationsOnLaunch_notification
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Paginated notification history for the feed. Unlike GetUnreadNotifications
# this does NOT filter to unread, so read notifications are fetched too and the
# feed survives a cache clear. `filter` moves category/type/priority selection
# server-side; `after` + endCursor drive load-more.
query GetNotifications(
  $filter: NotificationFilters
  $first: Int = 30
  $after: String
) {
  me {
    id
    # Server-authoritative counts — re-seed the badge after the history loads so
    # it stays correct even when more are unread than this page holds (the local
    # list-recompute alone under-counts), mirroring GetUnreadNotifications.
    unreadNotificationCount
    hasUrgentNotifications
    notificationsConnection(
      filters: $filter
      first: $first
      after: $after
      orderBy: SENT_AT_DESC
    ) {
      edges {
        node {
          id
          ...useNotificationsOnLaunch_notification
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}
