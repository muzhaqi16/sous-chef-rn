# ============================================
# SUBSCRIPTIONS
# ============================================

subscription NotificationCreated {
  notificationCreated {
    notification {
      id
      ...useNotifications_notification
    }
    mutation
    timestamp
  }
}

subscription NotificationUpdated {
  notificationUpdated {
    notification {
      id
      ...useNotifications_notification
    }
    mutation
    timestamp
  }
}

# ============================================
# QUERIES
# ============================================

query GetUnreadNotifications {
  me {
    id
    notificationsConnection(
      filter: { unreadOnly: true }
      first: 50
      orderBy: SENT_AT_DESC
    ) {
      edges {
        node {
          id
          ...useNotificationsOnLaunch_notification
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
