# ============================================
# SUBSCRIPTIONS
# ============================================

# Consolidated notification stream. One subscription carries both created and
# updated events, discriminated by `subtype` (CREATED / UPDATED). Keeps the
# per-user concurrent-subscription count low (the server caps it cluster-wide).
# No self-echo filtering: notifications originate from the system rather than a
# user action, so the handler routes purely on `subtype` and never needs an
# originator id.
subscription NotificationEvents {
  notificationEvents {
    subtype
    mutation
    timestamp
    node {
      id
      ...useNotifications_notification
    }
  }
}

# ============================================
# QUERIES
# ============================================

query GetUnreadNotifications {
  me {
    id
    notificationsConnection(
      filter: { unreadOnly: true }
      first: 50
      orderBy: SENT_AT_DESC
    ) {
      edges {
        node {
          id
          ...useNotificationsOnLaunch_notification
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
