# Local copies of shoppingList collaboration operations per the Feature API
# Boundary Convention. The shoppingList feature's graphql/ folder is internal.

# Local colocated fragment per the Feature API Boundary Convention.
# Selects only what the cache-update path (createAddToQueryFieldUpdater) needs
# (`id`) plus the collaborator/shopping-list fields the normalized cache should
# carry after a successful accept. Avoids reaching into shoppingList's internal
# ShoppingListCollaboratorFragment.
fragment InvitationAcceptanceModal_collaborator on ShoppingListCollaborator {
  id
  email
  role
  status
  collaboratorId
  canEdit
  canAddItems
  canRemoveItems
  canEditItems
  canMarkPurchased
  canInviteOthers
  invitedAt
  shoppingList {
    id
    name
    description
  }
  collaborator {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
}

mutation InvitationAcceptanceModalAcceptShoppingListInvite(
  $input: AcceptShoppingListInviteInput!
) {
  acceptShoppingListInvite(input: $input) {
    __typename
    ... on AcceptShoppingListInvitePayload {
      collaborator {
        id
        ...InvitationAcceptanceModal_collaborator
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation InvitationAcceptanceModalDeclineShoppingListInvite(
  $input: DeclineShoppingListInviteInput!
) {
  declineShoppingListInvite(input: $input) {
    __typename
    ... on DeclineShoppingListInvitePayload {
      collaborator {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
