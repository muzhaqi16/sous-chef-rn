# Local copies of shoppingList collaboration operations per the Feature API
# Boundary Convention. The shoppingList feature's graphql/ folder is internal.
query MyShoppingListInvites {
  me {
    id
    pendingCollaborationInvites {
      id
      token
      shoppingListId
      collaboratorId
      email
      role
      status
      canEdit
      canAddItems
      canRemoveItems
      canMarkPurchased
      canInviteOthers
      invitedAt
      expiresAt
      shoppingList {
        id
        name
        description
      }
      collaborator {
        id
        email
        profile {
          id
          displayName
          avatar
        }
      }
      invitedBy {
        id
        email
        profile {
          id
          displayName
        }
      }
    }
  }
}

mutation AcceptShoppingListInvite($token: String!) {
  acceptShoppingListInvite(token: $token) {
    success
    message
    code
    collaborator {
      ...ShoppingListCollaboratorFragment
      canEdit
      canInviteOthers
      invitedAt
      shoppingList {
        id
        name
        description
      }
    }
  }
}

mutation DeclineShoppingListInvite($token: String!) {
  declineShoppingListInvite(token: $token) {
    success
    message
    code
    collaborator {
      id
    }
  }
}
