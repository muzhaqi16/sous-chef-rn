# `first` is a variable: a literal page size multiplies the server's cost limit.
query MyReviewSubmissions($first: Int!, $after: String) {
  myReviewSubmissions(first: $first, after: $after) {
    edges {
      node {
        id
        ...MyReportRow_submission
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
