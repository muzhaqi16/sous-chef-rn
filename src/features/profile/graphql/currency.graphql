# Every currency, retired ones included, since a cost recorded in one still
# shows. Money is shown at its currency's `decimalPlaces`, the precision the
# server stores it in (`useAccountCurrencySync` mirrors them). The picker offers
# only the active ones: a retired currency is one nobody may choose any more.
query GetCurrencies {
  currencies {
    id
    code
    name
    symbol
    decimalPlaces
    isActive
  }
}
