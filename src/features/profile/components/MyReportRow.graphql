fragment MyReportRow_submission on ReviewSubmission {
  __typename
  id
  sentAt
  status
  senderNote
  reviewNote
  ... on UserReportSubmission {
    report {
      id
      type
      contentType
    }
    reportedUser {
      id
      displayName
    }
    recipe {
      id
      name
    }
  }
  ... on ItemReportSubmission {
    item {
      id
      name
    }
    photo {
      id
      url
      variants {
        id
        kind
        url
      }
    }
  }
  ... on ItemSuggestionSubmission {
    item {
      id
      name
    }
  }
  ... on ItemPhotoSubmission {
    item {
      id
      name
    }
    photo {
      id
      url
      variants {
        id
        kind
        url
      }
    }
  }
}
