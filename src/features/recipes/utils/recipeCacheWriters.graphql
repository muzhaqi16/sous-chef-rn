# A local-first create's recipe: everything a query reads on one, its
# ingredients, and the reviews a new recipe starts without.
fragment recipeCacheWriters_row on Recipe {
  id
  ...RecipeReaders
  # No arguments: the cache holds one list per recipe whatever arguments read
  # it, and a create writes all of it.
  ingredientsConnection {
    edges {
      node {
        id
        ...RecipeIngredientReaders
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  reviewsConnection {
    totalCount
    edges {
      node {
        id
      }
    }
  }
}
