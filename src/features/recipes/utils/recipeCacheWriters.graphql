# A local-first create's recipe: everything a query reads on one, its
# ingredients, and the reviews a new recipe starts without.
fragment recipeCacheWriters_row on Recipe {
  id
  ...RecipeReaders
  ingredientsConnection {
    edges {
      node {
        id
        ...RecipeIngredientReaders
      }
    }
  }
  reviewsConnection {
    totalCount
    edges {
      node {
        id
      }
    }
  }
}
