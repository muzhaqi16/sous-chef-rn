mutation ToggleReviewHelpful($input: ToggleReviewHelpfulInput!) {
  toggleReviewHelpful(input: $input) {
    __typename
    ... on ToggleReviewHelpfulPayload {
      reviewHelpful {
        id
        user { id }
      }
      # NOT selecting the payload's `recipeReview`, deliberately. The hook's
      # `update` callback applies a relative ±1 to `helpful`, and `update` runs
      # AFTER Apollo normalizes the response — so a server-authoritative count
      # in the response would get incremented a second time on top of itself.
      # The count stays client-derived until the next GetRecipeReviews read.
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
