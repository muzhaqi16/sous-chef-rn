# ============================================
# RECIPE REVIEW MUTATIONS
# ============================================

mutation CreateRecipeReview($input: CreateRecipeReviewInput!) {
  createRecipeReview(input: $input) {
    __typename
    ... on CreateRecipeReviewSuccess {
      recipeReview {
        ...RecipeReviewFragment
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateRecipeReview($input: UpdateRecipeReviewInput!) {
  updateRecipeReview(input: $input) {
    __typename
    ... on UpdateRecipeReviewSuccess {
      recipeReview {
        ...RecipeReviewFragment
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteRecipeReview($id: ID!) {
  deleteRecipeReview(id: $id) {
    __typename
    ... on DeleteRecipeReviewSuccess {
      recipeReview {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation ToggleReviewHelpful($input: ToggleReviewHelpfulInput!) {
  toggleReviewHelpful(input: $input) {
    __typename
    ... on ToggleReviewHelpfulSuccess {
      reviewHelpful {
        id
        user { id }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
