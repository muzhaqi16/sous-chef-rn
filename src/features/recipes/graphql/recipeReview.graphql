# ============================================
# RECIPE REVIEW MUTATIONS
# ============================================

mutation CreateRecipeReview($input: CreateRecipeReviewInput!) {
  createRecipeReview(input: $input) {
    __typename
    ... on CreateRecipeReviewPayload {
      recipeReview {
        ...RecipeReviewFragment
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateRecipeReview($input: UpdateRecipeReviewInput!) {
  updateRecipeReview(input: $input) {
    __typename
    ... on UpdateRecipeReviewPayload {
      recipeReview {
        ...RecipeReviewFragment
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteRecipeReview($input: DeleteRecipeReviewInput!) {
  deleteRecipeReview(input: $input) {
    __typename
    ... on DeleteRecipeReviewPayload {
      recipeReview {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}

mutation ToggleReviewHelpful($input: ToggleReviewHelpfulInput!) {
  toggleReviewHelpful(input: $input) {
    __typename
    ... on ToggleReviewHelpfulPayload {
      reviewHelpful {
        id
        user { id }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
