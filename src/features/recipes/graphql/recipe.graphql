mutation CreateShoppingListItemsFromRecipe(
  $input: CreateShoppingListItemsFromRecipeInput!
) {
  createShoppingListItemsFromRecipe(input: $input) {
    __typename
    ... on CreateShoppingListItemsFromRecipePayload {
      result {
        addedItems {
          id
          itemName
          quantity
          unit {
            id
            name
            symbol
          }
          storeInfo {
            aisle
          }
          purchaseInfo {
            isPurchased
          }
        }
        updatedItems {
          id
          itemName
          quantity
          unit {
            id
            name
            symbol
          }
          purchaseInfo {
            isPurchased
          }
        }
        skippedItems {
          id
          name
          quantity
        }
        totalAdded
        totalUpdated
        totalSkipped
      }
    }
    ... on Error {
      code
      message
    }
  }
}

