mutation CreateShoppingListItemsFromRecipe(
  $input: CreateShoppingListItemsFromRecipeInput!
) {
  createShoppingListItemsFromRecipe(input: $input) {
    __typename
    ... on CreateShoppingListItemsFromRecipePayload {
      # These lines are written straight into the list's connection, so the
      # response has to satisfy the query that displays them. Hand-listing a
      # subset left the created entity missing eleven of the fifteen fields
      # `GetShoppingListItemsFiltered` selects, which makes the whole list read
      # incomplete rather than one value blank.
      addedItems {
        # `id` directly as well as through the spread: masking hides the
        # fragment's fields from the parent, key field included.
        id
        ...AddedShoppingListItemFields
        storeInfo {
          aisle
        }
      }
      # Same shape as addedItems: an updated line is normalized into the same
      # entity the list reads, and a narrower selection would blank the fields
      # it omits rather than leave them alone.
      updatedItems {
        id
        ...AddedShoppingListItemFields
      }
      skippedItems {
        id
        name
        quantity
      }
      totalAdded
      totalUpdated
      totalSkipped
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

