query MatchRecipeIngredientsToPantry(
  $pantryId: ID!
  $recipeId: ID!
  $servings: Int
) {
  matchRecipeIngredientsToPantry(
    pantryId: $pantryId
    recipeId: $recipeId
    servings: $servings
  ) {
    ingredient {
      id
      ...RecipeIngredientFragment
    }
    isAvailable
    matchConfidence
    availableQuantity
    suggestedQuantity
    shortfall
    suggestedUnit {
      id
      name
      symbol
    }
    matchedPantryItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
  }
}

