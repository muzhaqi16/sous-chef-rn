query MatchRecipeIngredientsToPantry(
  $pantryId: ID!
  $recipeId: ID!
  $servings: Int
) {
  matchRecipeIngredientsToPantry(
    pantryId: $pantryId
    recipeId: $recipeId
    servings: $servings
  ) {
    ingredient {
      id
      ...RecipeIngredientFragment
    }
    isAvailable
    matchConfidence
    availableQuantity
    suggestedQuantity
    shortfall
    suggestedUnit {
      id
      name
      symbol
    }
    matchedPantryItem {
      id
      itemName
      unit {
        id
        name
        symbol
      }
      displayAmount {
        quantity
        unit {
          id
          symbol
        }
      }
    }
  }
}

mutation ConfirmRecipeConsumption($input: ConfirmRecipeConsumptionInput!) {
  confirmRecipeConsumption(input: $input) {
    __typename
    ... on ConfirmRecipeConsumptionPayload {
      # Replay signal: false = a partial crash already finished the leftover
      # items; true = idempotent replay of a completed confirmation.
      converged
      totalConsumed
      totalFailed
      cookingLog {
        id
        servingsMade
        notes
        cookedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation MarkRecipeAsCooked($input: MarkRecipeAsCookedInput!) {
  markRecipeAsCooked(input: $input) {
    __typename
    ... on MarkRecipeAsCookedPayload {
      recipe {
        id
        ...RecipeReaders
      }
      # Replay signal: true = the client-minted cooking-log id already existed
      # (idempotent replay), false = a fresh log row was created.
      converged
      # Ingredients the server could NOT deduct. Without this the toast reports
      # unqualified success.
      #
      # `reason` is deliberately NOT selected: it is a server string, we never
      # display it, and the schema's own guidance is to branch on `code`. The
      # code says WHY — UNIT_INVALID for an ingredient no conversion reaches —
      # so the toast can name the cause rather than only the count.
      skippedIngredients {
        itemName
        code
      }
      cookingLog {
        id
        servingsMade
        notes
        cookedAt
        recipe {
          id
          name
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
