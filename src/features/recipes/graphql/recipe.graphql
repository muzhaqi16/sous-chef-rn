# ============================================
# QUERIES
# ============================================

query SearchRecipes(
  $query: String!
  $first: Int
  $after: String
  $diets: [Diet!]
  $intolerances: [Intolerance!]
  $maxReadyTime: Int
) {
  searchRecipes(
    query: $query
    first: $first
    after: $after
    filters: {
      diets: $diets
      intolerances: $intolerances
      maxReadyTime: $maxReadyTime
    }
  ) {
    edges {
      node {
        # Inline, not a fragment: useRecipeScreen's combined search reads
        # these off the result, where a spread's fields are masked.
        id
        name
        description
        imageUrl
        servings
        prepTimeMinutes
        cookTimeMinutes
        totalTimeMinutes
        difficulty
        category
        cuisines
        status
        isExternal
        externalSource
        externalId
        primarySource
        caloriesPerServing
        createdAt
        updatedAt
        isSaved
        savedDetails {
          id
          folder
          tags
          notes
          personalRating
          cookedCount
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query MyRecipes($cursor: String, $first: Int = 25) {
  recipes(after: $cursor, first: $first) {
    edges {
      node {
        id
        # Selected at the parent so the screen can filter the connection
        # without materializing each masked node. Already fetched inside
        # MyRecipeCard_recipe — this only keeps it visible after masking,
        # so it costs nothing on the wire.
        name
        description
        ...MyRecipeCard_recipe
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    id
    ...useRecipeData_recipe
    ...RecipeForm_recipe
  }
}

query GetRecipeReviews($id: ID!) {
  recipe(id: $id) {
    id
    reviewsConnection {
      edges {
        node {
          id
          ...RecipeReviewFragment
        }
      }
      totalCount
    }
  }
}

query MySavedRecipes($first: Int, $after: String) {
  me {
    id
    savedRecipesConnection(first: $first, after: $after) {
      edges {
        node {
          id
          recipeId
          folder
          tags
          createdAt
          updatedAt
          recipe {
            id
            # Selected at the parent so consumers can filter the connection
            # without materializing each masked node. Already fetched inside
            # SavedRecipeCard_savedRecipe — this only keeps it visible after
            # masking, so it costs nothing on the wire.
            name
            description
          }
          ...SavedRecipeCard_savedRecipe
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query SavedRecipeFolders {
  savedRecipeFolders
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    __typename
    ... on CreateRecipePayload {
      recipe {
        id
        ...RecipeReaders
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

# Names a catalog recipe by provider id; the API fetches its content itself.
# The recipe selects everything GetRecipe reads, so the detail screen answers
# from the cache the moment this settles.
mutation OpenCatalogRecipe($input: UpsertExternalRecipeInput!) {
  upsertExternalRecipe(input: $input) {
    __typename
    ... on UpsertExternalRecipePayload {
      recipe {
        id
        ...RecipeReaders
        ...useRecipeData_recipe
        ...RecipeForm_recipe
      }
      created
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

