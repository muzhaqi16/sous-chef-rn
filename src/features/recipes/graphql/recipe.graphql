# ============================================
# QUERIES
# ============================================

query SearchRecipes($query: String!, $first: Int, $after: String) {
  searchRecipes(query: $query, first: $first, after: $after) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query SuggestedRecipes($first: Int, $after: String) {
  recipeSuggestions(first: $first, after: $after) {
    edges {
      node {
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query MyRecipes(
  $cursor: String
  $first: Int = 25
  $category: RecipeCategory
  $difficulty: Difficulty
) {
  recipes(
    after: $cursor
    first: $first
    category: $category
    difficulty: $difficulty
  ) {
    edges {
      node {
        id
        category
        difficulty
        ...MyRecipeCard_recipe
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    ...useRecipeData_recipe
    ...RecipeForm_recipe
  }
}

query GetRecipeReviews($id: ID!) {
  recipe(id: $id) {
    id
    reviews {
      edges {
        node {
          id
          ...RecipeReviewFragment
        }
      }
      totalCount
    }
  }
}

query MySavedRecipes($folder: String, $first: Int, $after: String) {
  me {
    id
    savedRecipesConnection(folder: $folder, first: $first, after: $after) {
      edges {
        node {
          id
          folder
          tags
          createdAt
          updatedAt
          recipe {
            id
          }
          ...SavedRecipeCard_savedRecipe
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query SavedRecipeFolders {
  savedRecipeFolders
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    __typename
    ... on CreateRecipeSuccess {
      recipe {
        ...BasicRecipeFragment
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpsertExternalRecipe($input: CreateRecipeInput!) {
  upsertExternalRecipe(input: $input) {
    recipe {
      id
      name
      imageUrl
      externalSource
      externalId
      servings
      prepTimeMinutes
      cookTimeMinutes
      totalTimeMinutes
    }
    created
  }
}

mutation UpdateRecipe($input: UpdateRecipeInput!) {
  updateRecipe(input: $input) {
    __typename
    ... on UpdateRecipeSuccess {
      recipe {
        ...useRecipeData_recipe
        ...RecipeForm_recipe
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateRecipeIngredients($recipeId: ID!, $ingredients: [RecipeIngredientInput!]!) {
  updateRecipeIngredients(recipeId: $recipeId, ingredients: $ingredients) {
    __typename
    ... on UpdateRecipeIngredientsSuccess {
      recipe {
        id
        ingredients {
          ...RecipeIngredientFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteRecipe($id: ID!) {
  deleteRecipe(id: $id) {
    __typename
    ... on DeleteRecipeSuccess {
      success
    }
    ... on Error {
      code
      message
    }
  }
}

mutation FavoriteRecipe($input: FavoriteRecipeInput!) {
  favoriteRecipe(input: $input) {
    __typename
    ... on FavoriteRecipeSuccess {
      savedRecipe {
        id
        recipeId
        userId
        folder
        tags
        notes
        personalRating
        cookedCount
        lastCookedAt
        createdAt
        updatedAt
        recipe {
          ...BasicRecipeFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UnfavoriteRecipe($recipeId: ID!) {
  unfavoriteRecipe(recipeId: $recipeId) {
    __typename
    ... on UnfavoriteRecipeSuccess {
      savedRecipe {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation DeleteRecipeFolder($input: DeleteRecipeFolderInput!) {
  deleteRecipeFolder(input: $input) {
    __typename
    ... on DeleteRecipeFolderSuccess {
      success
    }
    ... on Error {
      code
      message
    }
  }
}

mutation UpdateFavoriteRecipe($recipeId: ID!, $input: UpdateFavoriteRecipeInput!) {
  updateFavoriteRecipe(recipeId: $recipeId, input: $input) {
    __typename
    ... on UpdateFavoriteRecipeSuccess {
      savedRecipe {
        id
        recipeId
        userId
        folder
        tags
        notes
        personalRating
        cookedCount
        createdAt
        updatedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation CreateShoppingListItemsFromRecipe(
  $input: CreateShoppingListItemsFromRecipeInput!
) {
  createShoppingListItemsFromRecipe(input: $input) {
    addedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      storeInfo {
        aisle
      }
      purchaseInfo {
        isPurchased
      }
    }
    updatedItems {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
      purchaseInfo {
        isPurchased
      }
    }
    skippedItems {
      id
      name
      quantity
    }
    totalAdded
    totalUpdated
    totalSkipped
  }
}

mutation CreateShoppingListItemFromRecipeIngredient(
  $recipeIngredientId: ID!
  $shoppingListId: ID!
  $quantityOverride: Float
) {
  createShoppingListItemFromRecipeIngredient(
    recipeIngredientId: $recipeIngredientId
    shoppingListId: $shoppingListId
    quantityOverride: $quantityOverride
  ) {
    shoppingListItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
    previousQuantity
    quantityAdded
    wasUpdated
    unitConversionApplied
  }
}

query MatchRecipeIngredientsToPantry(
  $pantryId: ID!
  $recipeId: ID!
  $servings: Int
) {
  matchRecipeIngredientsToPantry(
    pantryId: $pantryId
    recipeId: $recipeId
    servings: $servings
  ) {
    ingredient {
      id
      ...RecipeIngredientFragment
    }
    isAvailable
    matchConfidence
    availableQuantity
    suggestedQuantity
    shortfall
    suggestedUnit {
      id
      name
      symbol
    }
    matchedPantryItem {
      id
      itemName
      quantity
      unit {
        id
        name
        symbol
      }
    }
  }
}

mutation ConfirmRecipeConsumption(
  $input: ConfirmRecipeConsumptionInput!
) {
  confirmRecipeConsumption(input: $input) {
    success
    totalConsumed
    totalFailed
    cookingLog {
      id
      servingsMade
      notes
      cookedAt
    }
  }
}

mutation MarkRecipeAsCooked(
  $input: MarkRecipeAsCookedInput!
) {
  markRecipeAsCooked(input: $input) {
    __typename
    ... on MarkRecipeAsCookedSuccess {
      cookingLog {
        id
        servingsMade
        notes
        cookedAt
        recipe {
          id
          name
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

