# ============================================
# QUERIES
# ============================================

query SearchRecipes(
  $query: String!
  $first: Int
  $after: String
  $diets: [Diet!]
  $intolerances: [Intolerance!]
  $maxReadyTime: Int
) {
  searchRecipes(
    query: $query
    first: $first
    after: $after
    filters: {
      diets: $diets
      intolerances: $intolerances
      maxReadyTime: $maxReadyTime
    }
  ) {
    edges {
      node {
        # Inline fields read imperatively by useRecipeScreen's combined
        # search (operation results are masked; fragment fields are not
        # readable at query time) — same pattern as MyRecipes.
        id
        name
        imageUrl
        servings
        totalTimeMinutes
        externalSource
        externalId
        isSaved
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query MyRecipes(
  $cursor: String
  $first: Int = 25
  $category: RecipeCategory
  $difficulty: Difficulty
) {
  recipes(
    after: $cursor
    first: $first
    filters: { category: $category, difficulty: $difficulty }
  ) {
    edges {
      node {
        id
        category
        difficulty
        # Selected at the parent so the screen can filter the connection
        # without materializing each masked node. Already fetched inside
        # MyRecipeCard_recipe — this only keeps it visible after masking,
        # so it costs nothing on the wire.
        name
        description
        savedDetails {
          id
          folder
        }
        ...MyRecipeCard_recipe
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    id
    ...useRecipeData_recipe
    ...RecipeForm_recipe
  }
}

query GetRecipeReviews($id: ID!) {
  recipe(id: $id) {
    id
    reviews {
      edges {
        node {
          id
          # Reactivity signals: helpful/updatedAt also live in
          # ...RecipeReviewFragment, but selecting them inline keeps them in the
          # (unmasked) query result so useQuery re-emits when a review is edited
          # or its helpful count changes. Otherwise the list sorted in
          # useRecipeReviews.ts stays stale until the next refetch.
          helpful
          updatedAt
          ...RecipeReviewFragment
        }
      }
      totalCount
    }
  }
}

query MySavedRecipes($folder: String, $first: Int, $after: String) {
  me {
    id
    savedRecipesConnection(folder: $folder, first: $first, after: $after) {
      edges {
        node {
          id
          folder
          tags
          createdAt
          updatedAt
          recipe {
            id
            # Selected at the parent so consumers can filter the connection
            # without materializing each masked node. Already fetched inside
            # SavedRecipeCard_savedRecipe — this only keeps it visible after
            # masking, so it costs nothing on the wire.
            name
            description
          }
          ...SavedRecipeCard_savedRecipe
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query SavedRecipeFolders {
  savedRecipeFolders
}

