mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    __typename
    ... on CreateRecipePayload {
      recipe {
        id
        ...BasicRecipeFragment
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

