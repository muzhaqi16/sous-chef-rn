# ============================================
# QUERIES
# ============================================

query SearchRecipes(
  $query: String!
  $first: Int
  $after: String
  $diets: [Diet!]
  $intolerances: [Intolerance!]
  $maxReadyTime: Int
) {
  searchRecipes(
    query: $query
    first: $first
    after: $after
    diets: $diets
    intolerances: $intolerances
    maxReadyTime: $maxReadyTime
  ) {
    edges {
      node {
        # Inline fields read imperatively by useRecipeScreen's combined
        # search (operation results are masked; fragment fields are not
        # readable at query time) — same pattern as MyRecipes.
        id
        name
        imageUrl
        servings
        totalTimeMinutes
        externalSource
        externalId
        isSaved
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query SuggestedRecipes($first: Int, $after: String) {
  recipeSuggestions(first: $first, after: $after) {
    edges {
      node {
        id
        ...BasicRecipeFragment
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query MyRecipes(
  $cursor: String
  $first: Int = 25
  $category: RecipeCategory
  $difficulty: Difficulty
) {
  recipes(
    after: $cursor
    first: $first
    category: $category
    difficulty: $difficulty
  ) {
    edges {
      node {
        id
        category
        difficulty
        savedDetails {
          id
          folder
        }
        ...MyRecipeCard_recipe
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    id
    ...useRecipeData_recipe
    ...RecipeForm_recipe
  }
}

query GetRecipeReviews($id: ID!) {
  recipe(id: $id) {
    id
    reviews {
      edges {
        node {
          id
          # Reactivity signals: helpful/updatedAt also live in
          # ...RecipeReviewFragment, but selecting them inline keeps them in the
          # (unmasked) query result so useQuery re-emits when a review is edited
          # or its helpful count changes. Otherwise the list sorted in
          # useRecipeReviews.ts stays stale until the next refetch.
          helpful
          updatedAt
          ...RecipeReviewFragment
        }
      }
      totalCount
    }
  }
}

query MySavedRecipes($folder: String, $first: Int, $after: String) {
  me {
    id
    savedRecipesConnection(folder: $folder, first: $first, after: $after) {
      edges {
        node {
          id
          folder
          tags
          createdAt
          updatedAt
          recipe {
            id
          }
          ...SavedRecipeCard_savedRecipe
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query SavedRecipeFolders {
  savedRecipeFolders
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateRecipe($input: CreateRecipeInput!) {
  createRecipe(input: $input) {
    __typename
    ... on CreateRecipePayload {
      recipe {
        id
        ...BasicRecipeFragment
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpsertExternalRecipe($input: CreateRecipeInput!) {
  upsertExternalRecipe(input: $input) {
    __typename
