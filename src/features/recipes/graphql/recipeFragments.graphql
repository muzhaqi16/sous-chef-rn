# Domain-level shape for recipe ingredients. Spread directly by
# UpdateRecipeIngredients and MatchRecipeIngredientsToPantry, and pulled
# transitively by GetRecipe via useRecipeData_recipe — all populate the cache
# with this shape, and useRecipeIngredientMatching materializes it for matching
# logic. Stays shared because the operation-populated shape IS the consumer
# shape; splitting per-hook would duplicate the selection set.
fragment RecipeIngredientFragment on RecipeIngredient {
  id
  name
  quantity
  estimatedPrice
  item {
    id
    name
    imageUrl
  }
  unit {
    id
    name
    symbol
  }
  image
  isOptional
  notes
  preparation
  sortOrder
  section
}

# Domain-level shape for recipe reviews. Spread by GetRecipeReviews,
# CreateRecipeReview, and UpdateRecipeReview — all three populate the cache
# with this shape, and useRecipeReviews materializes the canonical shape for
# sort/filter and helpful-vote checks. Stays shared.
fragment RecipeReviewFragment on RecipeReview {
  id
  rating
  comment
  helpful
  verified
  createdAt
  updatedAt
  user {
    id
    email
    profile {
      id
      displayName
      avatar
    }
  }
  helpfulVotes {
    id
    user { id }
  }
}

# Shared hydration shape for "basic recipe" reads. Spread by SearchRecipes,
# CreateRecipe, ForkRecipe, and AddRecipeToFavorites — four operations that
# all hydrate the cache with the same shallow recipe shape. Per-operation
# narrowing would duplicate this selection 4× with no clarity gain. Hooks
# that need narrower reads (useRecipeFavoriteState, etc.) have co-located
# fragments next to their hook file.
fragment BasicRecipeFragment on Recipe {
  id
  name
  description
  imageUrl
  servings
  prepTimeMinutes
  cookTimeMinutes
  totalTimeMinutes
  difficulty
  category
  cuisine
  status
  isExternal
  externalSource
  externalId
  primarySource
  caloriesPerServing
  createdAt
  updatedAt
  savedDetails {
    id
    folder
    tags
    notes
    personalRating
    cookedCount
  }
}
