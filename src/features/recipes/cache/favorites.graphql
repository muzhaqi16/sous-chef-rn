# A local-first save's row: everything a query reads on one, so the saved-list
# edge it links reads complete offline.
fragment favorites_row on SavedRecipe {
  id
  ...SavedRecipeReaders
}

# The heart. Written whole: `cache.modify` cannot introduce `savedDetails` on a
# Recipe cached without it.
fragment favorites_savedDetails on Recipe {
  id
  savedDetails {
    id
  }
}
