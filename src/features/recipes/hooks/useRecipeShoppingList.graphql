# Response shape for the AddItemsToShoppingList mutation.
#
# Spreads the shared created-line shape rather than listing fields: these
# entities are written straight into the list's connection, so anything the
# list query selects and this omits makes the whole list read incomplete.
# Keeping one definition is what stops the two drifting apart again.
fragment useRecipeShoppingList_addedItem on ShoppingListItem {
  ...AddedShoppingListItemFields
}

