# Ranked on the server from one home's pantries (every pantry the user may view
# when `homeId` is omitted) and the dietary profile: one page, with no cursor.
query RecipeSuggestions(
  $first: Int!
  $today: LocalDate!
  $homeId: ID
  $excludeDietaryConflicts: Boolean
) {
  recipeSuggestions(
    first: $first
    today: $today
    homeId: $homeId
    excludeDietaryConflicts: $excludeDietaryConflicts
  ) {
    edges {
      coverage
      # Pantry basics left out of both: what is held, and what is left to buy.
      missingIngredientCount
      usedIngredients {
        id
        name
        item {
          version
          id
          name
        }
      }
      # What is left to buy, pantry basics aside: the lines an almost-ready
      # recipe's "Add N to list" sends.
      missingIngredients {
        id
        name
        quantity
        isOptional
        unit {
          id
          name
          symbol
        }
        item {
          version
          id
          name
        }
      }
      # The stacks expiring within three days of `today` that it would use.
      expiringStacks {
        version
        id
        itemName
      }
      node {
        version
        id
        name
        imageUrl
        servings
        totalTimeMinutes
      }
    }
  }
}
