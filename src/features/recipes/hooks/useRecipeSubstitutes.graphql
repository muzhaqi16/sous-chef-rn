# What can stand in for a recipe's ingredients, for the household: curated
# swaps, those whose parts the pantry holds first, none a member is allergic or
# intolerant to, each part with the stack a cook draws it from. The recipe page
# reads it while a row is flagged; the cook review reads it fresh, in the same
# shape, so the two share one cached answer.
#
# It shares the cached `ingredientsConnection` with GetRecipe, whose first page
# a write replaces: the connection's own fields (`pageInfo`, `totalCount`) are
# selected as GetRecipe selects them, or each write leaves the recipe's read
# incomplete and the page falls to "not found".
query RecipeSubstitutes(
  $recipeId: ID!
  $homeId: ID!
  $pantryId: ID
  $ingredientsFirst: Int!
) {
  recipe(id: $recipeId) {
    id
    servings
    ingredientsConnection(first: $ingredientsFirst) {
      edges {
        node {
          id
          substitutes(homeId: $homeId, pantryId: $pantryId, limit: 5) {
            substitute {
              id
              note
              forQuantity
              forUnit {
                id
                symbol
              }
            }
            scaled
            parts {
              quantity
              unit {
                id
                symbol
              }
              inPantry
              item {
                id
                name
              }
              pantryItem {
                id
                itemName
                unit {
                  id
                  name
                  symbol
                }
                displayAmount {
                  quantity
                  unit {
                    id
                    symbol
                  }
                }
              }
            }
            alerts {
              state
              membership {
                id
                userId
                role
                displayName
              }
              restriction {
                id
                diet
                intolerance
                healthGoal
                item {
                  id
                  name
                }
                severity
              }
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}
