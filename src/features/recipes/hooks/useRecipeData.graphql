# Screen-level fragment for the recipe-detail flow, read live through
# `useFragment` so the screen + `RecipeDetail` consumers read display fields
# directly. `GetRecipe` also spreads the form fragment, so the same query
# populates the edit screen's cache.
fragment useRecipeData_recipe on Recipe {
  id
  name
  description
  imageUrl
  servings
  totalTimeMinutes
  caloriesPerServing
  nutritionData
  status
  isPublished
  publishedAt
  reviewNote
  # The author's edit to a PUBLISHED recipe, held for review while the recipe
  # stays live; both are null for anyone but the author.
  pendingRevision {
    id
  }
  latestRevision {
    id
    status
    reviewNote
  }
  forkedFromId
  forkedFrom {
    id
    name
  }
  originalAuthor
  tips
  videoUrl
  tags
  source
  sourceUrl
  instructions
  isExternal
  # A catalog recipe's copy against its provider: PENDING and NOT_FOUND carry
  # only the name and image.
  sourceMapping {
    id
    syncStatus
  }
  externalDetails {
    __typename
    ... on SpoonacularRecipeDetails {
      healthScore
      vegetarian
      vegan
      glutenFree
      dairyFree
    }
  }
  # Display/badge fields for the detail screen
  savedDetails {
    id
    folder
    tags
    notes
    personalRating
    cookedCount
  }
  averageRating
  totalReviews
  rating1Count
  rating2Count
  rating3Count
  rating4Count
  rating5Count
  createdBy {
    id
    email
    displayName
  }
  ingredientsConnection {
    edges {
      node {
        id
        name
        quantity
        estimatedPrice
        item {
          id
          name
          imageUrl
        }
        unit {
          id
          name
          symbol
        }
        # Viewer-scoped: the server converts to the reader's preferred system.
        # Null when the ingredient names no unit, or no seeded unit of that
        # system shares its dimension — the stored pair above is the fallback.
        convertedQuantity {
          value
          unit {
            id
            symbol
          }
        }
        image
        isOptional
        notes
        preparation
        sortOrder
        section
      }
    }
  }
}
