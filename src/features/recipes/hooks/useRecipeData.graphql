# Screen-level fragment for the recipe-detail flow. Materialized via
# `cache.readFragment` so the screen + `RecipeDetail` consumers can read
# display fields directly. Composes the form fragment so the same query
# also populates the edit screen's cache.
fragment useRecipeData_recipe on Recipe {
  id
  name
  description
  imageUrl
  servings
  totalTimeMinutes
  caloriesPerServing
  nutritionData
  status
  isPublished
  publishedAt
  forkedFromId
  forkedFrom {
    id
    name
  }
  originalAuthor
  tips
  videoUrl
  tags
  source
  sourceUrl
  instructions
  # Display/badge fields for the detail screen
  savedDetails {
    id
    folder
    tags
    notes
    personalRating
    cookedCount
  }
  averageRating
  totalReviews
  rating1Count
  rating2Count
  rating3Count
  rating4Count
  rating5Count
  createdBy {
    id
    email
    displayName
  }
  ingredientsConnection {
    edges {
      node {
        id
        name
        quantity
        estimatedPrice
        item {
          id
          name
          imageUrl
        }
        unit {
          id
          name
          symbol
        }
        # Viewer-scoped: the server converts to the reader's preferred system.
        # Null when the ingredient names no unit, or no seeded unit of that
        # system shares its dimension — the stored pair above is the fallback.
        convertedQuantity {
          value
          unit {
            id
            symbol
          }
        }
        image
        isOptional
        notes
        preparation
        sortOrder
        section
      }
    }
  }
}
