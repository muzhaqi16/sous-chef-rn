# Local copies of shoppingList operations per the Feature API Boundary Convention.
# The shoppingList feature's graphql/ folder is internal.
# A single ingredient is added via this same batch mutation with a one-element
# `items` array — there is no separate single-add operation.
mutation AddItemsToShoppingListFromRecipe($input: AddItemsToShoppingListInput!) {
  addItemsToShoppingList(input: $input) {
    __typename
    ... on AddItemsToShoppingListPayload {
      results {
        index
        clientId
        success
        item {
          id
          ...useRecipeShoppingList_addedItem
        }
        quantityIncremented
        error
      }
      summary {
        succeeded
        failed
        skipped
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

# Locally-named copy per the Feature API Boundary Convention — the
# shoppingList feature's graphql/ folder is internal. The NAME must be
# unique across the document set: three copies shared `GetShoppingListsLite`,
# which codegen now emits only once (breaking the other importers) and which
# the persisted-query manifest keys by, so it held one entry for three
# definitions.
query GetShoppingListsLiteForRecipe($homeId: ID, $first: Int, $after: String) {
  shoppingLists(filters: { homeId: $homeId }, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        isDefault
        totalItems
        completedItems
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile { id displayName avatar }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Locally-named copy — see the note above.
mutation CreateShoppingListForRecipe($input: CreateShoppingListInput!) {
  createShoppingList(input: $input) {
    __typename
    ... on CreateShoppingListPayload {
      shoppingList {
        id
        name
        isDefault
        totalItems
        completedItems
        createdAt
        updatedAt
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          ...ShoppingListOwnershipFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
