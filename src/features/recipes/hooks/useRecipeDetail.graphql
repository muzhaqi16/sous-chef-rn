# Local copies of shoppingList operations per the Feature API Boundary Convention.
# The shoppingList feature's graphql/ folder is internal.
mutation AddItemToShoppingListFromRecipe($input: CreateShoppingListItemInput!) {
  addItemToShoppingList(input: $input) {
    __typename
    ... on AddItemToShoppingListSuccess {
      shoppingListItem {
        id
        itemName
        quantity
        quantityInput
        displayFormat
        purchaseInfo {
          isPurchased
        }
        version
        updatedAt
        category
        notes
        unitName
        unit {
          id
          name
          symbol
        }
        sortOrder
        item {
          id
          imageUrl
          images { url kind }
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation AddItemsToShoppingList(
  $shoppingListId: ID!
  $items: [BatchAddShoppingListItemInput!]!
) {
  addItemsToShoppingList(shoppingListId: $shoppingListId, items: $items) {
    results {
      index
      clientId
      success
      item {
        id
        ...useRecipeShoppingList_addedItem
      }
      quantityIncremented
      error
    }
    successCount
    failedCount
    incrementedCount
  }
}

query GetShoppingListsLite($homeId: ID, $first: Int, $after: String) {
  shoppingLists(filters: { homeId: $homeId }, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        isDefault
        totalItems
        completedItems
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile { id displayName avatar }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

mutation CreateShoppingList($input: CreateShoppingListInput!) {
  createShoppingList(input: $input) {
    __typename
    ... on CreateShoppingListSuccess {
      shoppingList {
        id
        name
        isDefault
        totalItems
        completedItems
        createdAt
        updatedAt
        homeId
        home {
          id
          name
        }
        ownerships {
          ...ShoppingListOwnershipFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
