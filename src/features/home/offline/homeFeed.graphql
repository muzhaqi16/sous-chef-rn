    }
  }
}

# What a pull leaves out: the home's computed values and the people its rows
# name, read after a page that added or removed one of them, and after a full read.
query HomeFeedSummary($id: ID!) {
  home(id: $id) {
    id
    version
    ...HomeReaders
    membersConnection(first: 20) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          version
          ...MembershipReaders
        }
      }
    }
    invitesConnection(first: 20) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          version
          ...HomeInviteReaders
        }
      }
    }
  }
  storageLocations(homeId: $id) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        id
        version
        ...StorageLocationReaders
      }
    }
  }
}
