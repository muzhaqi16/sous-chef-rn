# A home's rows as the feed answers them: the stored columns its readers read,
# as the server answers computed values on a full read alone and keeps people
# out of every scope. `status` differs in type across the rows, so it is
# aliased; the cache stores a field by its name.
query HomeFeedChanges($input: SyncChangesInput!) {
  syncChanges(input: $input) {
    scope {
      id
    }
    status
    cursor
    hasMore
    changed {
      __typename
      ... on Home {
        id
        version
        name
        description
        currency
        timezone
        allowJoinCode
        joinCode
        isPublic
        maxMembers
        updatedAt
      }
      ... on Membership {
        id
        version
        userId
        role
        membershipStatus: status
        displayName
        canViewPantry
        canEditPantry
        canAddItems
        canRemoveItems
        canInviteOthers
        canManageHome
        sharesDietaryNeeds
      }
      ... on HomeInvite {
        id
        version
        email
        recipientName
        role
        inviteStatus: status
        expiresAt
        message
      }
      ... on StorageLocation {
        id
        version
        name
        type
        icon
        color
        temperature
        description
        isClimateControlled
        capacity
        capacityUnit
        sortOrder
        isDefault
        parentLocation {
          id
          version
        }
      }
    }
    removed {
      entityType
      id
    }
    applied {
      operationId
      entityType
      entityId
      version
    }
  }
}

query HomeFeedSnapshot($input: SyncSnapshotInput!) {
  syncSnapshot(input: $input) {
    status
    cursor
    endCursor
    hasMore
    rows {
      __typename
      ... on Home {
        id
        version
        name
        description
        currency
        timezone
        allowJoinCode
        joinCode
        isPublic
        maxMembers
        updatedAt
      }
      ... on Membership {
        id
        version
        userId
        role
        membershipStatus: status
        displayName
        canViewPantry
        canEditPantry
        canAddItems
        canRemoveItems
        canInviteOthers
        canManageHome
        sharesDietaryNeeds
      }
      ... on HomeInvite {
        id
        version
        email
        recipientName
        role
        inviteStatus: status
        expiresAt
        message
      }
      ... on StorageLocation {
        id
        version
        name
        type
        icon
        color
        temperature
        description
        isClimateControlled
        capacity
        capacityUnit
        sortOrder
        isDefault
        parentLocation {
