# A local-first create's home: everything a query reads on one, plus its
# connections as a new home starts them. Each connection takes a `first`
# because the readers do: an argument-less selection is a different store
# field, which the reads would miss.
fragment home_row on Home {
  id
  ...HomeReaders
  membersConnection(first: 20) {
    edges {
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  invitesConnection(first: 20) {
    edges {
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  pantriesConnection(first: 20) {
    edges {
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# A home the homes list gains from a server write: what a query reads on one,
# with the connections a row of the list reads and the pantries a selection
# picks from. Join and accept bring a home this device has never read, so the
# response is their only source.
fragment home_listed on Home {
  id
  ...HomeReaders
  membersConnection(first: 5) {
    edges {
      node {
        id
        ...MembershipReaders
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  invitesConnection(first: 5) {
    edges {
      node {
        id
        ...HomeInviteReaders
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  pantriesConnection(first: 10) {
    edges {
      node {
        id
        name
        isDefault
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# The creator's membership, written before the home that points at it.
fragment home_membershipRow on Membership {
  id
  ...MembershipReaders
}
