# A local-first create's home: everything a query reads on one, plus its
# connections as a new home starts them. Each connection takes a `first`
# because the readers do: an argument-less selection is a different store
# field, which the reads would miss.
fragment home_row on Home {
  id
  ...HomeReaders
  membersConnection(first: 20) {
    edges {
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  invitesConnection(first: 20) {
    edges {
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  pantriesConnection(first: 20) {
    edges {
      node {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# The creator's membership, written before the home that points at it.
fragment home_membershipRow on Membership {
  id
  ...MembershipReaders
}
