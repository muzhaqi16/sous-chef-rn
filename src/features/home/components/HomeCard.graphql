fragment HomeCard_home on Home {
  id
  name
  membersConnection(first: 5) {
    edges {
      node {
        id
        role
        userId
        displayName
        user {
          id
          email
          # Every reader of this User record selects it — `HomeMemberCard_member`
          # among them — and one missing field makes the whole read incomplete.
          displayName
        }
      }
    }
    totalCount
  }
  invitesConnection(first: 5) {
    edges {
      node {
        id
        email
        recipientName
        status
      }
    }
    totalCount
  }
  pantriesConnection(first: 10) {
    totalCount
  }
}
