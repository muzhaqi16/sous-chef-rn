# The photo a household's entries for one catalog item show. Each write answers
# with every live entry of the household for the item, so the rows and the
# detail settle from the response with no refetch.

mutation UpdateHomeItemPhoto(
  $input: UpdateHomeItemPhotoInput!
  $today: LocalDate!
) {
  updateHomeItemPhoto(input: $input) {
    __typename
    ... on HomeItemPhotoPayload {
      homeId
      item {
        id
        ...ItemReaders
      }
      pantryItems {
        id
        ...PantryItemReaders
        pantry {
          id
          ...PantryReaders
        }
        storageLocation {
          id
          ...StorageLocationReaders
        }
      }
      shoppingListItems {
        id
        ...ShoppingListItemReaders
        shoppingList {
          id
          ...ShoppingListReaders
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteHomeItemPhoto(
  $input: DeleteHomeItemPhotoInput!
  $today: LocalDate!
) {
  deleteHomeItemPhoto(input: $input) {
    __typename
    ... on HomeItemPhotoPayload {
      homeId
      item {
        id
        ...ItemReaders
      }
      pantryItems {
        id
        ...PantryItemReaders
        pantry {
          id
          ...PantryReaders
        }
        storageLocation {
          id
          ...StorageLocationReaders
        }
      }
      shoppingListItems {
        id
        ...ShoppingListItemReaders
        shoppingList {
          id
          ...ShoppingListReaders
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
