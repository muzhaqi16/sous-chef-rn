# An item's shelf price at each store that collected one, cheapest current
# first, and another product of its kind at each of the household's stores: a
# list line's detail reads it here, and store mode's scan lookup
# (`ItemByLookup`) carries it so a scan asks once. Each `first` is a literal so
# both read one cache entry.
fragment useStoreShelfPrices_item on Item {
  id
  storePricesConnection(first: 10) {
    edges {
      node {
        store {
          id
          name
        }
        price
        regularPrice
        onPromotion
        typicalPrice
        lowestPrice
        coveredDays
        normalizedPrice
        normalizedBasis
        isCurrent
        confirmedAt
        aisle
        unit {
          id
          symbol
          localizedSymbolForms {
            one
            other
          }
        }
        currency {
          id
          code
          decimalPlaces
        }
      }
    }
  }
  similarStorePrices(first: 10) {
    store {
      id
      name
    }
    product {
      id
      name
    }
    price
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    packageNetWeight
    packageNetWeightUnit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    normalizedPrice
    basis
    currency {
      id
      code
      decimalPlaces
    }
  }
}

# The store the list is shopped at, read from what the list screen stored:
# asking for it could cost a scan a request of its own.
fragment useStoreShelfPrices_list on ShoppingList {
  id
  targetStore {
    id
  }
}

# The same for an item no scan lookup brought.
query StoreShelfPrices($itemId: ID!) {
  item(id: $itemId) {
    id
    ...useStoreShelfPrices_item
  }
}
