# What a local edit needs of a brand it names, so a row stays complete.
fragment localRefs_brand on Brand {
  version
  id
  name
}

# What a row reads of a unit a local edit names.
fragment localRefs_unit on Unit {
  id
  name
  symbol
  type
  localizedSymbolForms {
    one
    other
  }
}

# What a row reads of a storage location a local edit names.
fragment localRefs_storageLocation on StorageLocation {
  version
  id
  name
  type
}
