# ============================================
# QUERIES
# ============================================

query GetStorageLocations($homeId: ID!) {
  storageLocations(homeId: $homeId) {
    edges {
      node {
        id
        name
        type
        icon
        color
        temperature
        description
        isClimateControlled
        capacity
        capacityUnit
        sortOrder
        isDefault
        currentItemCount
        parentLocation {
          id
          name
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateStorageLocation($input: CreateStorageLocationInput!) {
  createStorageLocation(input: $input) {
    __typename
    ... on CreateStorageLocationPayload {
      storageLocation {
        id
        ...StorageLocationReaders
        homeId
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateStorageLocation($input: UpdateStorageLocationInput!) {
  updateStorageLocation(input: $input) {
    __typename
    ... on UpdateStorageLocationPayload {
      storageLocation {
        id
        ...StorageLocationReaders
        parentLocationId
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteStorageLocation($input: DeleteStorageLocationInput!) {
  deleteStorageLocation(input: $input) {
    __typename
    ... on DeleteStorageLocationPayload {
      storageLocation {
        id
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation MarkStorageLocationAsDefault(
  $input: MarkStorageLocationAsDefaultInput!
) {
  markStorageLocationAsDefault(input: $input) {
    __typename
    ... on MarkStorageLocationAsDefaultPayload {
      storageLocation {
