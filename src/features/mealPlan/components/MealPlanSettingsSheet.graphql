# Component fragment for the MealPlanSettingsSheet. Reads the metadata
# displayed in the sheet header + nutrition + generated-lists section.
fragment MealPlanSettingsSheet_mealPlan on MealPlan {
  id
  name
  description
  startDate
  endDate
  budgetAmount
  actualCost
  dietaryProfile {
    id
  }
  home {
    id
    name
  }
  createdBy {
    id
    profile {
      id
      displayName
    }
  }
  generatedShoppingLists {
    id
    name
  }
  nutritionSummary {
    totalCalories
    avgDailyCalories
    avgDailyProtein
    avgDailyCarbs
    avgDailyFat
    totalMeals
    mealsWithNutrition
    coveragePercentage
  }
  nutritionGoalProgress {
    overallScore
    caloriesProgress { target current percentage status }
    proteinProgress { target current percentage status }
    carbsProgress { target current percentage status }
    fatProgress { target current percentage status }
  }
}
