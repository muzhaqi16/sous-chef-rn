# Component fragment for the MealPlanSettingsSheet. Reads the metadata
# displayed in the sheet header + nutrition + generated-lists section.
fragment MealPlanSettingsSheet_mealPlan on MealPlan {
  version
  id
  name
  description
  startDate
  endDate
  budgetAmount
  actualCost
  dietaryProfile {
    id
  }
  home {
    version
    id
    name
  }
  createdBy {
    id
    displayName
    profile {
      id
      displayName
    }
  }
  # The server's default page: only the lists the viewer may view.
  generatedShoppingListsConnection {
    edges {
      node {
        version
        id
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
  # The whole summary every writer stores (`nestedValueSelections.test.ts`).
  nutritionSummary {
    totalCalories
    totalProtein
    totalCarbs
    totalFat
    avgDailyCalories
    avgDailyProtein
    avgDailyCarbs
    avgDailyFat
    totalMeals
    mealsWithNutrition
    coveragePercentage
    mealTypeBreakdown {
      mealCount
      mealType
      totalCalories
      totalCarbs
      totalFat
      totalProtein
    }
  }
  nutritionGoalProgress {
    overallScore
    caloriesProgress {
      target
      current
      percentage
      status
    }
    proteinProgress {
      target
      current
      percentage
      status
    }
    carbsProgress {
      target
      current
      percentage
      status
    }
    fatProgress {
      target
      current
      percentage
      status
    }
  }
}
