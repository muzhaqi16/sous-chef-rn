# Completion state and recipe presence — `toggleCompleted` reads this from the
# cache to branch on the row's current state, and the page-level operations
# select it so the row is always readable.
fragment MealPlanItemActions_item on MealPlanItem {
  id
  isCompleted
  completedAt
  servings
  notes
  recipe {
    id
    name
    servings
  }
}
