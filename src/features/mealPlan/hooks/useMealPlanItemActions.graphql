fragment MealPlanItemActions_item on MealPlanItem {
  id
  isCompleted
  completedAt
  servings
  notes
  recipe {
    id
    name
    servings
  }
}

# Compound fragment for `toggleCompleted` — must satisfy the full
# `UpdateMealPlanItem` mutation `mealPlanItem` selection set so the
# optimistic response can spread the item without a type cast. Page-level
# `MealPlanFull` already selects all four fragments on `mealPlanItems`,
# so callers (e.g. MealPlanMain) hold the matching shape.
fragment MealPlanItemActions_optimisticFullItem on MealPlanItem {
  ...MealPlanItemCard_item
  ...DailyMeals_item
  ...MealPlanMain_item
  ...MealPlanItemActions_item
}

# Recipe display fields an optimistic meal needs — the union of the `recipe`
# selections across the item display fragments above, resolved from the
# cache's canonical Recipe entity for a local-first create.
fragment MealPlanItemActions_recipeRef on Recipe {
  id
  name
  imageUrl
  totalTimeMinutes
  servings
}
