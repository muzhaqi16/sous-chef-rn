# Cache reads for materializing an optimistic MealPlan (local-first create):
# the creator's display identity and the linked home's display fields, both
# resolved from cache so the overview card renders complete while offline.
fragment useMealPlanActions_creator on User {
  id
  profile {
    id
    displayName
    avatar
  }
}

fragment useMealPlanActions_home on Home {
  id
  name
  myMembership {
    id
    role
  }
}

# Detail-only fields written alongside MealPlanDisplay so an offline-created
# plan satisfies the complete-gated MealPlanMain_mealPlan read (useMealPlan).
# Flat (no nested fragment spreads) so it can be written via cache.writeFragment
# without a masked/unmasked mismatch. Items start empty; real nutrition + items
# arrive from the server response / queued replay.
fragment useMealPlanActions_detailStub on MealPlan {
  id
  mealPlanItems {
    id
  }
  nutritionSummary {
    totalCalories
    totalProtein
    totalCarbs
    totalFat
    avgDailyCalories
    avgDailyProtein
    avgDailyCarbs
    avgDailyFat
    totalMeals
    mealsWithNutrition
    coveragePercentage
    mealTypeBreakdown {
      mealType
      totalCalories
      totalProtein
      totalCarbs
      totalFat
      mealCount
    }
  }
  nutritionGoalProgress {
    overallScore
    caloriesProgress {
      target
      current
      percentage
      status
    }
    proteinProgress {
      target
      current
      percentage
      status
    }
    carbsProgress {
      target
      current
      percentage
      status
    }
    fatProgress {
      target
      current
      percentage
      status
    }
  }
}
