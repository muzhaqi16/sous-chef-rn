# The ingredient lines a shopping list is derived from, read out of the cache
# after `GetMealPlan` has run so the derive works with the API unreachable.
#
# Spread by GetMealPlan ONLY. `item { id }` under an ingredient is the deepest
# path in the app: it puts GetMealPlan AT the server's HTTP depth limit, so one
# more level here is refused. `documentLimits.test.ts` pins depth and cost.
fragment useGenerateShoppingList_mealPlan on MealPlan {
  id
  # The derived list takes its default name from the plan and inherits its home,
  # which is what the server's fan-out does.
  name
  homeId
  mealPlanItemsConnection(first: $mealsFirst, after: $mealsAfter) {
    # A derived write reads every meal: it does not run on a first page alone.
    pageInfo {
      hasNextPage
    }
    totalCount
    edges {
      node {
        id
        servings
        recipe {
          id
          servings
          ingredientsConnection {
            edges {
              node {
                id
                name
                quantity
                isOptional
                # The id alone: the derive keys its aggregate on it and sends it
                # back as `unit.unitId`. A name or symbol here would be a fourth
                # copy of a shape nothing on this path renders.
                unit {
                  id
                }
                item {
                  id
                  name
                }
              }
            }
          }
        }
      }
    }
  }
}

# The derived lines, added in one batch. Mirrors the pantry screen's add so both
# reconcile through `buildAddItemsReconcileUpdate`, which pairs a result back to
# the client-minted id by its index into `input.items`.
mutation AddDerivedItemsToShoppingList($input: AddItemsToShoppingListInput!) {
  addItemsToShoppingList(input: $input) {
    __typename
    ... on AddItemsToShoppingListPayload {
      shoppingList {
        id
        ...ShoppingListReaders
      }
      results {
        index
        clientId
        success
        failure {
          code
          reason
          errorId
        }
        item {
          id
          ...ShoppingListItemReaders
          ...AddedShoppingListItemFields
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

# Records the plan a derived list came from. The fan-out stamps this inside its
# own transaction, which a client assembling the list offline never runs, so the
# link is a separate queued write keyed by the list's own id.
mutation LinkDerivedListToMealPlan($input: LinkShoppingListToMealPlanInput!) {
  linkShoppingListToMealPlan(input: $input) {
    __typename
    ... on LinkShoppingListToMealPlanPayload {
      shoppingList {
        id
        ...ShoppingListReaders
        generatedFromMealPlan
        mealPlan {
          id
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
