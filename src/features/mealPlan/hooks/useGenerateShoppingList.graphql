# Lightweight reference to the shopping lists query — used only for refetchQueries.
# Composed locally per the Feature API Boundary Convention since the shoppingList
# feature's graphql/ folder is internal.
query GetShoppingListsLite($homeId: ID, $first: Int, $after: String) {
  shoppingLists(filters: { homeId: $homeId }, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        name
        isDefault
        totalItems
        completedItems
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile {
              id
              displayName
              avatar
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
