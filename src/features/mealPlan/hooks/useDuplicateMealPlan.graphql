# What a duplicate copies, read out of the cache so it works offline. The plan
# fields are the ones the server carries over; the item fields are what
# `CreateMealPlanItemInput` needs to recreate a meal.
#
# Spread by GetMealPlan only, beside the screen's own fragment.
fragment useDuplicateMealPlan_mealPlan on MealPlan {
  version
  id
  description
  planType
  servings
  budgetAmount
  homeId
  startDate
  endDate
  mealPlanItemsConnection(first: $mealsFirst, after: $mealsAfter) {
    # A derived write reads every meal: it does not run on a first page alone.
    pageInfo {
      hasNextPage
    }
    totalCount
    edges {
      node {
        version
        id
        date
        mealType
        servings
        notes
        customMealName
        recipe {
          version
          id
        }
      }
    }
  }
}
