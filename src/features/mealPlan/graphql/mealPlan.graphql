# ============================================
# QUERIES
# ============================================

query GetMealPlans(
  $first: Int
  $after: String
  $filters: MealPlanFilters
  $orderBy: MealPlanOrderBy
) {
  mealPlans(first: $first, after: $after, filters: $filters, orderBy: $orderBy) {
    edges {
      node {
        id
        name
        startDate
        endDate
        ...MealPlanDisplay
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMealPlan($id: ID!) {
  mealPlan(id: $id) {
    id
    ...MealPlanMain_mealPlan
    ...MealPlanSettingsSheet_mealPlan
  }
}

# Event read-back. `MealPlanEvents` carries only the envelope plus the changed
# entity's id — a subscription document is validated against depth 5, which no
# fragment spread fits under. A plan that has just joined the overview needs the
# canonical list-card shape, and this is where it comes from: an ordinary HTTP
# query with the ordinary HTTP budget.
query MealPlanForEvent($id: ID!) {
  mealPlan(id: $id) {
    id
    ...MealPlanDisplay
  }
}

