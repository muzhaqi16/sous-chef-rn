# ============================================
# QUERIES
# ============================================

query GetMealPlans(
  $first: Int
  $after: String
  $filters: MealPlanFilters
  $orderBy: MealPlanOrderBy
) {
  mealPlans(first: $first, after: $after, filters: $filters, orderBy: $orderBy) {
    edges {
      node {
        id
        name
        startDate
        endDate
        ...MealPlanDisplay
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMealPlan($id: ID!) {
  mealPlan(id: $id) {
    id
    ...MealPlanMain_mealPlan
    ...MealPlanSettingsSheet_mealPlan
  }
}

