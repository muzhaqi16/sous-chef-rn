# ============================================
# SUBSCRIPTIONS
# ============================================

# Consolidated meal-plan domain stream for one home. One subscription carries
# plan, plan-item, template and template-item changes, discriminated by
# `subtype`. Keeps the per-user concurrent-subscription count low (the server
# caps it cluster-wide).
#
# Home-scoped by nature: a personal plan (`homeId: null`) has nobody to share
# with, so it emits no events and needs none — the only device that can change
# it is this one.
#
# Thin event: the envelope plus the identity of what changed, nothing more.
# Subscription documents are validated against depth 5 / cost 500 rather than
# the HTTP limits, because the server re-executes the document on every
# published event for the life of the connection. An inline fragment counts as
# a depth level (graphql-armor counts unflattened), so `node { ... on X { id } }`
# is already depth 4 — a fragment spread inside a branch cannot fit.
#
# `updatedFields` is what lets the handler skip work rather than pay for it: an
# event whose changed fields are all off-screen needs no read at all. When one
# is needed, `MealPlanForEvent` / `GetMealPlan` / `GetMealTemplate` fetch the
# entity over HTTP, where the budget is generous.
# See `__tests__/graphql/subscriptionLimits.test.ts` for the enforced bound.
subscription MealPlanEvents($homeId: ID!) {
  mealPlanEvents(homeId: $homeId) {
    subtype
    mutation
    homeId
    mealPlanId
    templateId
    updatedFields
    actorUserId
    timestamp
    node {
      __typename
      ... on MealPlan {
        id
      }
      ... on MealPlanItem {
        id
      }
      ... on MealTemplate {
        id
      }
      ... on MealTemplateItem {
        id
      }
    }
  }
}
