mutation CreateMealPlan($input: CreateMealPlanInput!) {
  createMealPlan(input: $input) {
    __typename
    ... on CreateMealPlanPayload {
      mealPlan {
        id
        ...MealPlanDisplay
        dietaryProfile {
          id
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

