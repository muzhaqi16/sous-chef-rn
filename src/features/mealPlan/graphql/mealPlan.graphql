# ============================================
# QUERIES
# ============================================

query GetMealPlans(
  $first: Int
  $after: String
  $filters: MealPlanFilters
  $orderBy: MealPlanOrderBy
) {
  mealPlans(first: $first, after: $after, filters: $filters, orderBy: $orderBy) {
    edges {
      node {
        id
        ...MealPlanDisplay      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMealPlan($id: ID!) {
  mealPlan(id: $id) {
    id
    ...MealPlanMain_mealPlan
    ...MealPlanSettingsSheet_mealPlan
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateMealPlan($input: CreateMealPlanInput!) {
  createMealPlan(input: $input) {
    __typename
    ... on CreateMealPlanSuccess {
      mealPlan {
        ...MealPlanDisplay
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateMealPlan($input: UpdateMealPlanInput!) {
  updateMealPlan(input: $input) {
    __typename
    ... on UpdateMealPlanSuccess {
      mealPlan {
        ...MealPlanDisplay
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteMealPlan($id: ID!) {
  deleteMealPlan(id: $id) {
    __typename
    ... on DeleteMealPlanSuccess {
      mealPlan {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation CreateMealPlanItem($input: CreateMealPlanItemInput!) {
  createMealPlanItem(input: $input) {
    __typename
    ... on CreateMealPlanItemSuccess {
      mealPlanItem {
        ...MealPlanItemCard_item
        ...EditCustomMealSheet_item
        ...DailyMeals_item
        ...MealPlanMain_item
        ...MealPlanItemActions_item
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation UpdateMealPlanItem($input: UpdateMealPlanItemInput!) {
  updateMealPlanItem(input: $input) {
    __typename
    ... on UpdateMealPlanItemSuccess {
      mealPlanItem {
        ...MealPlanItemCard_item
        ...EditCustomMealSheet_item
        ...DailyMeals_item
        ...MealPlanMain_item
        ...MealPlanItemActions_item
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation DeleteMealPlanItem($id: ID!) {
  deleteMealPlanItem(id: $id) {
    __typename
    ... on DeleteMealPlanItemSuccess {
      mealPlanItem {
        id
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation DuplicateMealPlan($input: DuplicateMealPlanInput!) {
  duplicateMealPlan(input: $input) {
    __typename
    ... on DuplicateMealPlanSuccess {
      mealPlan {
        ...MealPlanDisplay
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation GenerateShoppingListFromMealPlan($input: GenerateShoppingListFromMealPlanInput!) {
  generateShoppingListFromMealPlan(input: $input) {
    __typename
    ... on GenerateShoppingListFromMealPlanSuccess {
      shoppingList {
        id
        name
        isDefault
        totalItems
        completedItems
        homeId
        home {
          id
          name
        }
        ownerships {
          id
          userId
          user {
            id
            email
            profile { id displayName avatar }
          }
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
