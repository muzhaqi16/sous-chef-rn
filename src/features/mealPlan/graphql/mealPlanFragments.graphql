fragment MealPlanDisplay on MealPlan {
  id
  name
  description
  planType
  startDate
  endDate
  servings
  totalCalories
  totalProtein
  totalCarbs
  totalFat
  actualCost
  budgetAmount
  homeId
  home {
    id
    name
    myMembership {
      id
      role
    }
  }
  createdBy {
    id
    profile {
      id
      displayName
    }
  }
  version
  createdAt
  updatedAt
}

fragment MealPlanFull on MealPlan {
  ...MealPlanDisplay
  dietaryProfile {
    id
    calorieTarget
    proteinTarget
    carbsTarget
    fatTarget
  }
  mealPlanItems {
    ...MealPlanItemCard_item
    ...EditCustomMealSheet_item
    ...DailyMeals_item
    ...MealPlanMain_item
    ...MealPlanItemActions_item
  }
  generatedShoppingLists {
    id
    name
  }
  nutritionSummary {
    totalCalories
    totalProtein
    totalCarbs
    totalFat
    avgDailyCalories
    avgDailyProtein
    avgDailyCarbs
    avgDailyFat
    totalMeals
    mealsWithNutrition
    coveragePercentage
    mealTypeBreakdown {
      mealType
      totalCalories
      totalProtein
      totalCarbs
      totalFat
      mealCount
    }
  }
  nutritionGoalProgress {
    overallScore
    caloriesProgress {
      target
      current
      percentage
      status
    }
    proteinProgress {
      target
      current
      percentage
      status
    }
    carbsProgress {
      target
      current
      percentage
      status
    }
    fatProgress {
      target
      current
      percentage
      status
    }
  }
}

fragment MealTemplateDisplay on MealTemplate {
  id
  name
  description
  category
  durationDays
  defaultServings
  tags
  usageCount
  lastUsedAt
  homeId
  home {
    id
    name
    myMembership {
      id
      role
    }
  }
  user {
    id
  }
  createdAt
  updatedAt
}

fragment MealTemplateItemFragment on MealTemplateItem {
  id
  dayOffset
  mealType
  customMealName
  servings
  notes
  recipe {
    id
    name
    imageUrl
    servings
    totalTimeMinutes
  }
}
