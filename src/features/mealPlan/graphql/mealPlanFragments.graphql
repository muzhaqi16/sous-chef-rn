# Canonical shape for a MealPlan list-card.
# Spread by: mealPlan.graphql (GetMealPlans, CreateMealPlan, UpdateMealPlan,
#   DuplicateMealPlan — 4 operations)
# Read via cache.readFragment by: useMealPlans.ts
# Kept shared — all 5 consumers need the identical list-card shape.
fragment MealPlanDisplay on MealPlan {
  id
  name
  description
  planType
  startDate
  endDate
  servings
  totalCalories
  totalProtein
  totalCarbs
  totalFat
  actualCost
  budgetAmount
  homeId
  home {
    id
    name
    myMembership {
      id
      role
    }
  }
  # Direct owner — drives OWNER permission gating (see mealPlanPermissions).
  user {
    id
  }
  # Original creator — display-only (avatar/name), not used for gating.
  createdBy {
    id
    profile {
      id
      displayName
      avatar
    }
  }
  version
  createdAt
  updatedAt
}

# Canonical shape for a MealTemplate.
# Spread by: mealTemplate.graphql (GetMealTemplates, GetMealTemplate,
#   DuplicateTemplate, CreateTemplateFromMealPlan)
# Read via cache.readFragment by: TemplateCard.tsx
# Kept shared — all 5 consumers need the identical template shape.
fragment MealTemplateDisplay on MealTemplate {
  id
  name
  description
  category
  durationDays
  defaultServings
  tags
  usageCount
  lastUsedAt
  homeId
  home {
    id
    name
    myMembership {
      id
      role
    }
  }
  user {
    id
  }
  createdAt
  updatedAt
}

# Canonical shape for a MealTemplateItem.
# Spread by: mealTemplate.graphql (GetMealTemplate, DuplicateTemplate,
#   CreateTemplateFromMealPlan)
# Read via cache.readFragment by: useMealTemplate.ts
# Kept shared — all 4 consumers need the identical item shape.
fragment MealTemplateItemFragment on MealTemplateItem {
  id
  dayOffset
  mealType
  customMealName
  servings
  notes
  recipe {
    id
    name
    imageUrl
    servings
    totalTimeMinutes
  }
}
