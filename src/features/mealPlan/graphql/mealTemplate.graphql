# ============================================
# QUERIES
# ============================================

query GetMealTemplates(
  $filters: MealTemplateFilters
  $first: Int
  $after: String
  $orderBy: MealTemplateOrderBy
) {
  mealTemplates(
    filters: $filters
    first: $first
    after: $after
    orderBy: $orderBy
  ) {
    edges {
      node {
        id
        ...MealTemplateDisplay      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMealTemplate($id: ID!) {
  mealTemplate(id: $id) {
    id
    ...MealTemplateDisplay    items {
      id
      ...MealTemplateItemFragment    }
  }
}

# All-inline detail for the template builder/editor form (no masked fragments,
# so every field is read directly). Item mutations write these same
# MealTemplate.items / MealTemplateItem fields, so the form stays in sync.
# updatedAt is selected because useMealTemplateEditor's snapshot fragment
# includes it — without it cached here, readFragment returns null and the
# editor's optimistic update/revert silently skips.
query GetMealTemplateForEdit($id: ID!) {
  mealTemplate(id: $id) {
    id
    name
    description
    category
    defaultServings
    tags
    updatedAt
    items {
      id
      dayOffset
      mealType
      customMealName
      servings
      notes
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation DeleteMealTemplate($input: DeleteMealTemplateInput!) {
  deleteMealTemplate(input: $input) {
    __typename
    ... on DeleteMealTemplatePayload {
      mealTemplate {
        id
        name
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}

mutation DuplicateTemplate($input: DuplicateTemplateInput!) {
  duplicateTemplate(input: $input) {
    __typename
    ... on DuplicateTemplatePayload {
      mealTemplate {
        id
        ...MealTemplateDisplay
        items {
          id
          ...MealTemplateItemFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

