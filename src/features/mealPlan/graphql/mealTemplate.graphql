# ============================================
# QUERIES
# ============================================

query GetMealTemplates(
  $filters: MealTemplateFilters
  $first: Int
  $after: String
  $orderBy: MealTemplateOrderBy
) {
  mealTemplates(
    filters: $filters
    first: $first
    after: $after
    orderBy: $orderBy
  ) {
    edges {
      node {
        ...MealTemplateDisplay      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMealTemplate($id: ID!) {
  mealTemplate(id: $id) {
    ...MealTemplateDisplay    items {
      id
      ...MealTemplateItemFragment    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation DeleteMealTemplate($input: DeleteMealTemplateInput!) {
  deleteMealTemplate(input: $input) {
    __typename
    ... on DeleteMealTemplatePayload {
      mealTemplate {
        id
        name
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
  }
}

mutation DuplicateTemplate($input: DuplicateTemplateInput!) {
  duplicateTemplate(input: $input) {
    __typename
    ... on DuplicateTemplatePayload {
      mealTemplate {
        ...MealTemplateDisplay
        items {
          ...MealTemplateItemFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation CreateMealPlanFromTemplate($input: CreateMealPlanFromTemplateInput!) {
  createMealPlanFromTemplate(input: $input) {
    __typename
    ... on CreateMealPlanPayload {
      mealPlan {
        ...MealPlanMain_mealPlan
        ...MealPlanSettingsSheet_mealPlan
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

mutation CreateTemplateFromMealPlan($input: CreateTemplateFromMealPlanInput!) {
  createTemplateFromMealPlan(input: $input) {
    __typename
    ... on CreateTemplateFromMealPlanPayload {
      mealTemplate {
        ...MealTemplateDisplay
        items {
          ...MealTemplateItemFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
