# ============================================
# QUERIES
# ============================================

query GetMealTemplates(
  $filters: MealTemplateFilters
  $first: Int
  $after: String
  $orderBy: MealTemplateOrderBy
) {
  mealTemplates(
    filters: $filters
    first: $first
    after: $after
    orderBy: $orderBy
  ) {
    edges {
      node {
        ...MealTemplateDisplay      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query GetMealTemplate($id: ID!) {
  mealTemplate(id: $id) {
    ...MealTemplateDisplay    items {
      id
      ...MealTemplateItemFragment    }
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation DeleteMealTemplate($id: ID!) {
  deleteMealTemplate(id: $id) {
    __typename
    ... on DeleteMealTemplateSuccess {
      mealTemplate {
        id
        name
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation DuplicateTemplate($id: ID!, $newName: String!) {
  duplicateTemplate(id: $id, newName: $newName) {
    __typename
    ... on DuplicateTemplateSuccess {
      mealTemplate {
        ...MealTemplateDisplay
        items {
          ...MealTemplateItemFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation CreateMealPlanFromTemplate($input: CreateMealPlanFromTemplateInput!) {
  createMealPlanFromTemplate(input: $input) {
    __typename
    ... on CreateMealPlanSuccess {
      mealPlan {
        ...MealPlanMain_mealPlan
        ...MealPlanSettingsSheet_mealPlan
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

mutation CreateTemplateFromMealPlan($input: CreateTemplateFromMealPlanInput!) {
  createTemplateFromMealPlan(input: $input) {
    __typename
    ... on CreateTemplateFromMealPlanSuccess {
      mealTemplate {
        ...MealTemplateDisplay
        items {
          ...MealTemplateItemFragment
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}
