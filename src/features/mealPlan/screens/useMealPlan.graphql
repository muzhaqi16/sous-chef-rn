# The plan screen's read. It also spreads the core actions' fragments, so
# generating a list or duplicating the plan reads it from the cache.
query GetMealPlan(
  $id: ID!
  $mealsFirst: Int!
  $mealsAfter: String
  $ingredientsFirst: Int!
) {
  mealPlan(id: $id) {
    id
    ...MealPlanMain_mealPlan
    ...MealPlanSettingsSheet_mealPlan
    ...useGenerateShoppingList_mealPlan
    ...useDuplicateMealPlan_mealPlan
  }
}

# The plan covering today with what the plan screens read, in one request, so
# a screen showing it waits for no second round trip after the list (API-18).
query CurrentMealPlan(
  $today: LocalDate!
  $mealsFirst: Int!
  $mealsAfter: String
  $ingredientsFirst: Int!
) {
  currentMealPlan(today: $today) {
    id
    ...MealPlanDisplay
    ...MealPlanMain_mealPlan
    ...MealPlanSettingsSheet_mealPlan
    ...useGenerateShoppingList_mealPlan
    ...useDuplicateMealPlan_mealPlan
  }
}
