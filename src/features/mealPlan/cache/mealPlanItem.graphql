# Recipe display fields an optimistic meal needs — the union of the `recipe`
# selections across the item display fragments, resolved from the cache's
# canonical Recipe entity for a local-first create.
#
# Consumers: src/features/mealPlan/cache/mealPlanItem.ts
# (`writeOptimisticMealPlanItem`).
fragment mealPlanItem_recipeRef on Recipe {
  id
  name
  imageUrl
  totalTimeMinutes
  servings
}
