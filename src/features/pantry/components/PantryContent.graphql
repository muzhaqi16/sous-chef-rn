# Narrow fragment for PantryContent's image-preload pass.
# Reads only the fields `resolveImageUrl` needs to pick an image variant.
fragment PantryContent_pantryItem on PantryItem {
  id
  # The household's photo, which leads the row: the one worth warming.
  image {
    url
    source
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
}
