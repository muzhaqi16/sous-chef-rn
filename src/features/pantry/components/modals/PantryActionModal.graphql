# Ensures the modal's full read shape is in the cache regardless of how the
# item arrived (list query, create mutation, subscription push). `cache-first`
# returns instantly when the cache already satisfies the fragment and only
# hits the network when a field is missing — so it self-heals partial entries
# without a redundant fetch on every open.
query GetPantryActionItem($id: ID!) {
  pantryItem(id: $id) {
    id
    ...PantryActionModal_pantryItem
  }
}

fragment PantryActionModal_pantryItem on PantryItem {
  id
  itemId
  itemName
  quantity
  displayAmount {
    quantity
    unit {
      id
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
  }
  activeBatchCount
  netWeight
  remainingNetWeight
  portionUnitId
  portionUnit {
    id
    name
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
  }
  remainingPortions
  lastUsedAt
  unit {
    id
    name
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
    type
    displayAsFraction
  }
  displayUnit {
    id
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
    type
    hasStandardCountFactor
    baseUnitId
    conversionFactor
    commonFractions
  }
  netWeightUnit {
    id
    name
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
  }
  # The unit the household uses the stack in: a use opens on it.
  consumeUnit {
    id
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
  }
}
