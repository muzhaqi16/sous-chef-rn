fragment CorrectPackageSizeModal_pantryItem on PantryItem {
  id
  itemName
  # A count in this unit corrects a batch, which records why.
  portionUnitId
  netWeightUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  # The server refuses a package size stated in the tracking unit.
  unit {
    id
  }
}

fragment CorrectPackageSizeModal_batch on PantryItemBatch {
  id
  batchNumber
  netWeight
  remainingNetWeight
  packageSize {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  remaining {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
}
