fragment AdjustQuantityModal_pantryItem on PantryItem {
  id
  itemName
  quantity
  lastUsedAt
  remainingNetWeight
  unit {
    id
    symbol
    displayAsFraction
  }
  netWeightUnit {
    id
    name
    symbol
  }
  # The count and the weight left as the row reads them, in the user's system.
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  held {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
  remaining {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
}
