# The stack a batch belongs to: a batch's amount reads as the stack's does,
# in the dozen it is shown in when that is whole or a common fraction of one,
# and its package size in the unit every batch's size is recorded in.
fragment BatchListItem_pantryItem on PantryItem {
  version
  id
  unit {
    id
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  displayUnit {
    id
    symbol
    localizedSymbolForms {
      one
      other
    }
    type
    hasStandardCountFactor
    baseUnitId
    conversionFactor
    commonFractions
  }
  netWeightUnit {
    id
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
}
