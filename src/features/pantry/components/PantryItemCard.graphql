fragment PantryItemCard_pantryItem on PantryItem {
  id
  itemName
  quantity
  expiresAt
  storageState
  lastUsedAt
  netWeight
  remainingNetWeight
  portionUnitId
  portionUnit {
    id
    name
    symbol
  }
  remainingPortions
  activeBatchCount
  updatedAt
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
  unit {
    id
    symbol
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
    }
  }
}
