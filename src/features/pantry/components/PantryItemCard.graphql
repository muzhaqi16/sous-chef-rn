fragment PantryItemCard_pantryItem on PantryItem {
  id
  itemName
  quantity
  heldQuantity
  isLowStock
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  # displayAmount read in each unit system: the row shows it while it is
  # still the figure displayAmount holds.
  held {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
  expiresOn
  storageState
  lastUsedAt
  netWeight
  remainingNetWeight
  portionUnitId
  portionUnit {
    id
    name
    symbol
  }
  remainingPortions
  activeBatchCount
  updatedAt
  # The photo this entry shows: the household's choice, the catalog's, else the viewer's pending one.
  image {
    url
    source
    catalogImageId
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
  unit {
    id
    symbol
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
    }
  }
}
