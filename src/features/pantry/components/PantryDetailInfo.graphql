# Component fragment for PantryDetailInfo's info-row rendering. Apollo Client
# 4.x data-masking pattern: the component declares its own narrow fragment,
# its prop type is the corresponding `*_pantryItem` shape, and useFragment
# scopes cache subscriptions to just this fragment's fields.
fragment PantryDetailInfo_pantryItem on PantryItem {
  version
  id
  condition
  quantity
  heldQuantity
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  lastUsedAt
  acquisitionMethod
  costPerUnit
  totalCost
  # What totalCost and costPerUnit are denominated in. Null when they are, and
  # when the costed batches disagree about currency. Read rather than assumed:
  # a cost recorded in euros stays euros whatever the account prefers now.
  costCurrency {
    id
    code
  }
  minQuantity
  restockQuantity
  storageNotes
  createdAt
  tags
  unit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  storageLocation {
    id
    name
  }
  store {
    id
    name
  }
  brand {
    version
    id
    name
  }
  purchase {
    version
    id
    purchaseDate
    # Both: the Purchased row shows the total, Cost/Unit already shows the split.
    unitPrice
    totalPrice
    # What this purchase was paid in — not necessarily what the stack is in.
    currency {
      id
      code
    }
  }
}
