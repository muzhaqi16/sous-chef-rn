# Narrow Home fragment for the form's "default pantry" lookup. Read off the
# cache via `apolloClient.cache.readFragment` (the cache is populated by
# `GetHome`/`HomeDetailScreen_home`) so the masked `home` ref resolves to the
# pantry ids the form needs.
fragment PantryItemForm_home on Home {
  id
  pantriesConnection(first: 20) {
    edges {
      node {
        id
        isDefault
      }
    }
  }
}

# Component fragment for the edit-mode PantryItemForm. The form reads these
# fields off the cache via `apolloClient.cache.readFragment` to populate
# initial values and to detect "dirty" changes. Mutation calls pass only the
# `itemId` — `useUpdatePantryItem` reads its own narrow fragment from cache.
fragment PantryItemForm_pantryItem on PantryItem {
  id
  pantryId
  itemName
  quantity
  minQuantity
  restockQuantity
  storageState
  condition
  storageNotes
  expiresOn
  netWeight
  lastUsedAt
  activeBatchCount
  tags
  unit {
    id
    name
    symbol
    type
  }
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  # Only the server sets it, so a stack created offline has none. Its factor
  # restates an amount edited in dozens as the pieces the stack counts in.
  displayUnit {
    id
    name
    symbol
    type
    conversionFactor
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
  brand {
    id
    name
  }
  item {
    id
    categories {
      id
      isPrimary
      category {
        id
        name
      }
    }
  }
}
