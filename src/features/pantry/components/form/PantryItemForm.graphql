# Component fragment for the edit-mode PantryItemForm. `usePantryItemFormData`
# reads these fields live via `useFragment` to populate initial values and to
# detect "dirty" changes. Mutation calls pass only the
# `itemId` — `useUpdatePantryItem` reads its own narrow fragment from cache.
fragment PantryItemForm_pantryItem on PantryItem {
  id
  pantryId
  itemName
  quantity
  minQuantity
  restockQuantity
  storageState
  condition
  storageNotes
  expiresOn
  netWeight
  lastUsedAt
  activeBatchCount
  tags
  unit {
    id
    name
    symbol
    type
  }
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  # Only the server sets it, so a stack created offline has none. Its factor
  # restates an amount edited in dozens as the pieces the stack counts in.
  displayUnit {
    id
    name
    symbol
    type
    conversionFactor
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
  brand {
    id
    name
  }
  item {
    id
    categories {
      id
      isPrimary
      category {
        id
        name
      }
    }
  }
}
