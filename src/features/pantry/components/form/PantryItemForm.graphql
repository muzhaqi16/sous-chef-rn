# Component fragment for the edit-mode PantryItemForm. `usePantryItemFormData`
# reads these fields live via `useFragment` to populate initial values and to
# detect "dirty" changes. Mutation calls pass only the
# `itemId` — `useUpdatePantryItem` reads its own narrow fragment from cache.
fragment PantryItemForm_pantryItem on PantryItem {
  id
  pantryId
  itemName
  quantity
  minQuantity
  restockQuantity
  storageState
  condition
  storageNotes
  expiresOn
  netWeight
  lastUsedAt
  activeBatchCount
  tags
  unit {
    id
    name
    symbol
    localizedSymbol
    type
  }
  displayAmount {
    quantity
    unit {
      id
      symbol
      localizedSymbol
    }
  }
  # Only the server sets it, so a stack created offline has none. Its factor
  # restates an amount edited in dozens as the pieces the stack counts in.
  displayUnit {
    id
    name
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
    type
    conversionFactor
  }
  netWeightUnit {
    id
    name
    symbol
    localizedSymbol
  }
  # The unit the household uses the stack in; a use opens on it.
  consumeUnit {
    id
    name
    symbol
    localizedSymbol
  }
  # netWeight as the detail shows it, which the size field opens on.
  packageSize {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  storageLocation {
    id
    name
    type
  }
  brand {
    id
    name
  }
  item {
    id
    categories {
      id
      isPrimary
      category {
        id
        name
      }
    }
  }
}
