# Screen-level materialization fragment for the PantryItemDetail screen.
# Composed of fields the detail screen, PantryDetailInfo, BatchSection,
# PantryUsageHistory, PantryItemForm, and the update mutation hooks all read.
# Apollo Client 4.x recommends colocating fragments with their primary
# consumer rather than maintaining central "god" fragments.
fragment PantryItemDetail_pantryItem on PantryItem {
  ...PantryDetailInfo_pantryItem
  ...PantryItemForm_pantryItem
  ...BatchListItem_pantryItem
  id
  pantryId
  itemId
  itemName
  quantity
  heldQuantity
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  # displayAmount read in each unit system, as the row reads it.
  held {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  version
  updatedAt
  storageState
  expiresOn
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  # Both read in each unit system; the label's own figure where it states it.
  packageSize {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  remaining {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  portionUnitId
  portionUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  remainingPortions
  activeBatchCount
  earliestBatchExpiresOn
  # The photo this entry shows: the household's choice, the catalog's, else the viewer's pending one.
  # `catalogImageId` names the item photo it is, so the hero can lead with it.
  image {
    url
    source
    catalogImageId
  }
  item {
    version
    id
    # With canSuggest, gates the photo viewer's "set as main photo" action
    # (`writesItemDirectly`: never on a public item). Viewer-scoped, but it
    # costs this query nothing: the cache-policy warning in the schema applies to
    # the root `item(id:)` read, and a pantry item's response is already
    # PRIVATE/no-store for its membership data.
    canEdit
    canSuggest
    imageUrl
    images {
      id
      url
      kind
    }
    photos {
      id
      ...ItemPhotoCarousel_itemPhoto
    }
    name
    shelfLifeDays
    shelfLifeOpenedDays
    # The item's own nutrition, else its concept's, marked as typical.
    shownNutrition {
      facts {
        id
        calories
        totalFat
        saturatedFat
        transFat
        cholesterol
        sodium
        totalCarbs
        dietaryFiber
        totalSugars
        addedSugars
        protein
        vitaminD
        calcium
        iron
        potassium
        servingSize
        servingUnit
      }
      typicalOf {
        version
        id
        name
      }
    }
    categories {
      id
      isPrimary
      category {
        version
        id
        name
      }
    }
  }
  unit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
    type
    displayAsFraction
  }
  netWeightUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  storageLocation {
    id
    name
    type
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalNetWeight
    # Both weights read in the user's unit system.
    perUnit {
      value
      unitId
      metric {
        value
        unitId
        symbol
        localizedSymbol
        displayAsFraction
        type
      }
      imperial {
        value
        unitId
        symbol
        localizedSymbol
        displayAsFraction
        type
      }
    }
    total {
      value
      unitId
      metric {
        value
        unitId
        symbol
        localizedSymbol
        displayAsFraction
        type
      }
      imperial {
        value
        unitId
        symbol
        localizedSymbol
        displayAsFraction
        type
      }
    }
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  brand {
    version
    id
    name
  }
  tags
  storageNotes
  createdAt
  restockQuantity
  store {
    id
    name
  }
  condition
  acquisitionMethod
  costPerUnit
  totalCost
  # What totalCost and costPerUnit are denominated in. Null when they are, and
  # when the costed batches disagree about currency. Read rather than assumed:
  # a cost recorded in euros stays euros whatever the account prefers now.
  costCurrency {
    id
    code
  }
  purchase {
    version
    id
    purchaseDate
    totalPrice
    quantity
  }
  # A few for the summary panel; `totalCount` is the real figure it reports,
  # since usage records are append-only and the fetched slice is not the total.
  # Shares one cache field with GetPantryItemUsageHistory: same `orderBy` key,
  # and `pageInfo` on BOTH so neither write strips the cursor the other needs.
  # `first` is a window size, not a filter, so it is not part of the key.
  usageRecordsConnection(first: 5, orderBy: { usedAt: DESC }) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        quantityUsed
        usageUnit {
          id
          name
          symbol
          localizedSymbolForms {
            one
            other
          }
        }
        usedAt
        purpose
        adjustmentReason
        adjustmentKind
        # A purchase's price: null on every other row, and when unknown.
        totalCost
        currency {
          id
          code
        }
      }
    }
  }
}
