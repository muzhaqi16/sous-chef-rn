# Local copy of AddItemToShoppingList per the Feature API Boundary Convention.
# The shoppingList feature's graphql/ folder is internal.
mutation AddItemToShoppingListFromFilteredPantry($input: AddItemsToShoppingListInput!) {
  addItemsToShoppingList(input: $input) {
    __typename
    ... on AddItemsToShoppingListPayload {
      result {
        results {
          index
          clientId
          success
          quantityIncremented
          error
          item {
            id
            itemName
            quantity
            quantityInput
            displayFormat
            purchaseInfo {
              isPurchased
            }
            version
            updatedAt
            category
            notes
            unitName
            unit {
              id
              name
              symbol
            }
            sortOrder
            item {
              id
              imageUrl
              images { url kind }
            }
          }
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
