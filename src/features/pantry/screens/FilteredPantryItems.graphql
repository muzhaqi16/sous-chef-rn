# Local copy of AddItemToShoppingList per the Feature API Boundary Convention.
# The shoppingList feature's graphql/ folder is internal.
mutation AddItemToShoppingListFromFilteredPantry($input: AddItemsToShoppingListInput!) {
  addItemsToShoppingList(input: $input) {
    __typename
    ... on AddItemsToShoppingListPayload {
      results {
        index
        clientId
        success
        quantityIncremented
        error
        item {
          id
          ...AddedShoppingListItemFields
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
