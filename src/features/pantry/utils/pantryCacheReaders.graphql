# Read with the arguments UNDEFINED on purpose: the field is keyed on them, so
# client mode stores `itemsConnection:{}`. Server mode keys on the live filter
# and sort, which no fragment can name.
fragment findCachedPantryItemDuplicate_pantry on Pantry {
  id
  itemsConnection(filters: $itemsFilter, orderBy: $itemsOrderBy) {
    edges {
      node {
        id
        itemName
        quantity
        item {
          id
        }
        unit {
          id
        }
      }
    }
  }
}

# The unit a stack is counted in: a count with no unit goes to a counted stack
# as a count, and anywhere else as packages (readStackUnit).
fragment readStackUnit_pantryItem on PantryItem {
  id
  unit {
    id
    type
  }
}

# A held stack's amount as its row reads it, for an add that joins it to say
# what it joins (readHeldStack, formatHeldAmount).
fragment readHeldStack_pantryItem on PantryItem {
  id
  unit {
    id
    type
    displayAsFraction
  }
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  held {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
}
