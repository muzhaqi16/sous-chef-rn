# Local copy of AddItemToShoppingList per the Feature API Boundary Convention.
# The shoppingList feature's graphql/ folder is internal.
mutation AddItemToShoppingListFromPantryItem(
  $input: AddItemsToShoppingListInput!
) {
  addItemsToShoppingList(input: $input) {
    __typename
    ... on AddItemsToShoppingListPayload {
      shoppingList {
        id
        ...ShoppingListReaders
      }
      results {
        index
        clientId
        success
        failure {
          code
          disposition
          reason
          errorId
        }
        packageSizeCleared
        item {
          id
          ...ShoppingListItemReaders
          ...AddedShoppingListItemFields
        }
      }
    }
    ... on Error {
      code
      disposition
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
