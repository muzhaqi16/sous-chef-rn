# The pantry's dated stock that expires first, for the notification ask to
# name. `expiringSoon` with a wide horizon keeps undated stock out of the page.
query SoonestDatedItem($pantryId: ID!) {
  pantry(id: $pantryId) {
    version
    id
    itemsConnection(
      first: 1
      orderBy: { expiresOn: ASC }
      filters: { expiringSoon: true, expirationDays: 3650 }
    ) {
      edges {
        node {
          version
          id
          expiresOn
          item {
            version
            id
            name
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
