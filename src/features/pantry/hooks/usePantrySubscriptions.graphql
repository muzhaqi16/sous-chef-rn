fragment usePantrySubscriptions_expirationNotification on ExpirationNotification {
  id
  daysUntilExpiry
  actionTaken
  genericNotificationId
  pantryItem {
    id
    item {
      id
      name
      imageUrl
    }
  }
}

# Narrow fragment for the PantryChanges subscription's `pantryItem` payload.
# Mirrors the fields the server pushes for an ItemAdded / ItemUpdated /
# ItemRemoved event. The subscription handler reads `item.id` to add/remove
# the connection edge and writes the entire payload back to the entity via
# writeFragment, so the fragment must match the subscription's selection.
fragment usePantrySubscriptions_pantryItem on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  version
  updatedAt
  storageState
  expiresAt
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  portionUnitId
  portionUnit {
    id
    name
    symbol
  }
  remainingPortions
  activeBatchCount
  earliestBatchExpiration
  item {
    id
    imageUrl
    images {
      url
      kind
    }
  }
  unit {
    id
    name
    symbol
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
    }
  }
}

# ============================================
# EVENT READ-BACK QUERIES
# ============================================
#
# `PantryEvents` carries only the envelope plus the changed entity's id — a
# subscription document is validated against depth 5, which no fragment spread
# fits under. These queries are how the handler gets the values: ordinary HTTP
# queries, with the ordinary HTTP budget, fired only for the events that need
# one (never for a self-echo, never for a delete).

query PantryItemForEvent($id: ID!) {
  pantryItem(id: $id) {
    id
    ...usePantrySubscriptions_pantryItem
  }
}

query ExpirationNotificationForEvent($id: ID!) {
  expirationNotification(id: $id) {
    id
    ...usePantrySubscriptions_expirationNotification
  }
}

# Header + stats only. `Pantry.stats` has a `mergeObjects` field policy, so
# writing this narrow shape over a cached `stats` that also holds
# `storageStateCounts` / `storageLocationCounts` (selected by `GetPantry`)
# merges rather than truncates.
query PantrySummaryForEvent($id: ID!) {
  pantry(id: $id) {
    id
    name
    description
    isDefault
    version
    stats {
      totalItems
      expiringCount
      expiredCount
      lowStockCount
    }
  }
}
