fragment usePantrySubscriptions_expirationNotification on ExpirationNotification {
  id
  expiresOn
  actionTaken
  genericNotificationId
  pantryItem {
    id
    item {
      id
      name
      imageUrl
    }
  }
}

# Narrow fragment for the PantryChanges subscription's `pantryItem` payload.
# Mirrors the fields the server pushes for an ItemAdded / ItemUpdated /
# ItemRemoved event. The subscription handler reads `item.id` to add/remove
# the connection edge and writes the entire payload back to the entity via
# writeFragment, so the fragment must match the subscription's selection.
fragment usePantrySubscriptions_pantryItem on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  heldQuantity
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  version
  createdAt
  updatedAt
  storageState
  expiresOn
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  portionUnitId
  portionUnit {
    id
    name
    symbol
  }
  remainingPortions
  activeBatchCount
  earliestBatchExpiresOn
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
  unit {
    id
    name
    symbol
    type
    displayAsFraction
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
    }
  }
}

# ============================================
# EVENT READ-BACK QUERIES
# ============================================
#
# `PantryEvents` carries only the envelope plus the changed entity's id — a
# subscription document is validated against depth 5, which no fragment spread
# fits under. These queries are how the handler gets the values: ordinary HTTP
# queries, with the ordinary HTTP budget, fired only for the events that need
# one (never for a self-echo, never for a delete).

query PantryItemForEvent($id: ID!) {
  pantryItem(id: $id) {
    id
    ...usePantrySubscriptions_pantryItem
  }
}

query ExpirationNotificationForEvent($id: ID!) {
  expirationNotification(id: $id) {
    id
    ...usePantrySubscriptions_expirationNotification
  }
}

# Header + every count the pantry screen shows — the location tabs read the
# storage counts, so a remote add or delete has to re-read them too.
# `Pantry.stats` has a `mergeObjects` field policy, so this merges over the
# `stats` GetPantry selects rather than truncating it.
query PantrySummaryForEvent($id: ID!, $today: LocalDate!) {
  pantry(id: $id) {
    id
    name
    description
    isDefault
    version
    # Unkeyed in the cache: without the viewer's day, UTC counts overwrite
    # the ones GetPantry read.
    stats(today: $today) {
      totalItems
      expiringCount
      expiredCount
      lowStockCount
      storageStateCounts {
        refrigerated
        frozen
        ambient
        none
      }
      storageLocationCounts {
        storageLocationId
        name
        type
        itemCount
      }
    }
  }
}
