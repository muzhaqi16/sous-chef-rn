# What a unit change would do, without writing. `message` is not selected: the
# refusal is shown from its `code` and `field`.
query PreviewPantryItemUnitChange($input: PreviewPantryItemUnitChangeInput!) {
  previewPantryItemUnitChange(input: $input) {
    version
    method
    exact
    quantityIgnored
    fromUnit {
      id
      symbol
      displayAsFraction
    }
    toUnit {
      id
      symbol
      displayAsFraction
    }
    quantityBefore
    heldQuantityBefore
    quantityAfter
    heldQuantityAfter
    batches {
      batchId
      quantityBefore
      quantityAfter
    }
    minQuantityAfter
    restockQuantityAfter
    dropsNetWeight
    dropsPortions
    dropsThresholds
    conflictingPantryItemId
    # What the stack will read as: "1 doz" for 12 pc shown in dozens. The
    # confirmation shows this, so no dozen is computed on the device.
    displayAmountAfter {
      quantity
      text
    }
    refusal {
      code
      field
    }
  }
}

# Every stack field the change re-denominates. The batches and the usage
# summary, each restated in the new unit, come with it.
fragment usePantryUnitChange_pantryItem on PantryItem {
  id
  version
  updatedAt
  quantity
  heldQuantity
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  unit {
    id
    name
    symbol
    type
    displayAsFraction
  }
  netWeight
  remainingNetWeight
  netWeightUnit {
    id
    name
    symbol
  }
  minQuantity
  restockQuantity
  isLowStock
  activeBatchCount
  remainingPortions
  lastUsedAt
  totalCost
  purchase {
    id
    purchaseDate
    totalPrice
    quantity
  }
}

mutation ChangePantryItemUnit(
  $input: ChangePantryItemUnitInput!
  $today: LocalDate!
  $batchesFirst: Int = 100
) {
  changePantryItemUnit(input: $input) {
    __typename
    ... on ChangePantryItemUnitPayload {
      storageLocation {
        id
        ...StorageLocationReaders
      }
      pantryItem {
        id
        ...PantryItemReaders
        ...usePantryUnitChange_pantryItem
        ...restatedStack_usage
      }
      pantry {
        id
        ...PantryReaders
      }
      # GetPantryItemBatches' page, at its size.
      batchesConnection(first: $batchesFirst) {
        ...writeRestatedBatches_page
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}
