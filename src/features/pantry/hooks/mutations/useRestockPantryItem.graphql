# Narrow fragment for the RestockPantryItem mutation response's nested
# pantryItem. Restocking can change quantity, netWeight, remainingNetWeight,
# version, expiresOn, activeBatchCount, and breakdown shapes.
fragment useRestockPantryItem_pantryItem on PantryItem {
  id
  version
  updatedAt
  quantity
  heldQuantity
  stockBreakdown {
    fullPackages
  }
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  amountLeft {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  isLowStock
  netWeight
  remainingNetWeight
  remainingPortions
  portionUnitId
  portionsPerTrackingUnit
  portionUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
    type
    displayAsFraction
  }
  expiresOn
  activeBatchCount
  earliestBatchExpiresOn
  netWeightUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
}
