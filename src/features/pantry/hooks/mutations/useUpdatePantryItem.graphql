# Narrow fragment for useUpdatePantryItem's optimistic-response shape.
# Mirrors what the UpdatePantryItem mutation selects on `pantryItem` — keep
# them in sync. The hook reads every one of these fields from cache to spread
# into the optimistic response (via enhanceWithVersion).
fragment useUpdatePantryItem_pantryItem on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  version
  updatedAt
  storageState
  condition
  expiresAt
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  activeBatchCount
  earliestBatchExpiration
  restockQuantity
  storageNotes
  tags
  item {
    id
    imageUrl
    images { url kind }
  }
  unit {
    id
    name
    symbol
    type
    isMetric
    baseUnitId
    conversionFactor
    isCommon
    displayAsFraction
    minPrecision
    autoConvertThreshold
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
    type
  }
  brand {
    id
    name
  }
  packageBreakdown {
    count
    contentUnit { id name symbol }
    perUnitNetWeight
    perUnitNetWeightUnit { id name symbol }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit { id name symbol }
    totalContentUnits
    remainingWeight
    remainingWeightUnit { id name symbol }
  }
}
