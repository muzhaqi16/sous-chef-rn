# What UpdatePantryItem answers on `pantryItem`, and what the hook reads the
# row's version from.
fragment useUpdatePantryItem_pantryItem on PantryItem {
  id
  pantryId
  itemId
  itemName
  quantity
  heldQuantity
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  version
  updatedAt
  storageState
  condition
  expiresOn
  lowStockAlert
  isLowStock
  minQuantity
  lastUsedAt
  netWeight
  remainingNetWeight
  activeBatchCount
  earliestBatchExpiresOn
  restockQuantity
  storageNotes
  tags
  item {
    version
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
  unit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
    type
    displayAsFraction
  }
  netWeightUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  storageLocation {
    id
    name
    type
  }
  brand {
    version
    id
    name
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
}
