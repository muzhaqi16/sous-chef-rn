# Narrow fragment for ConvertExpiredBatchesToWaste mutation response.
# Server returns the parent PantryItem with updated batches + counts.
fragment useConvertExpiredBatchesToWaste_pantryItem on PantryItem {
  id
  version
  quantity
  heldQuantity
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  isLowStock
  activeBatchCount
  earliestBatchExpiresOn
}
