# Narrow fragment for ConvertExpiredToWaste mutation response. A stack with no
# batches is wasted whole (condition, wasteReason, quantity); a stack held in
# batches loses only the expired ones, so its batch counts move instead.
fragment useConvertExpiredToWaste_pantryItem on PantryItem {
  id
  version
  quantity
  heldQuantity
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  isLowStock
  condition
  wasteReason
  storageState
  activeBatchCount
  earliestBatchExpiresOn
}
