# Narrow fragment for the CreatePantryItemUsage mutation response's
# nested pantryItem. Records a usage event — the parent item's quantity,
# version, lastUsedAt, remainingNetWeight, and activeBatchCount may change.
fragment useCreatePantryItemUsage_pantryItem on PantryItem {
  id
  version
  quantity
  heldQuantity
  stockBreakdown {
    fullPackages
  }
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  amountLeft {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  isLowStock
  lastUsedAt
  remainingNetWeight
  remainingPortions
  consumeUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  activeBatchCount
  earliestBatchExpiresOn
}
