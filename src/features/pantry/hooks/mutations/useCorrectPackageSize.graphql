# Refresh the stack's derived detail fields with the corrected batch, so a
# cached detail screen does not retain figures from before the correction.
fragment useCorrectPackageSize_pantryItem on PantryItem {
  id
  version
  updatedAt
  remainingNetWeight
  heldQuantity
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  isLowStock
  activeBatchCount
  remainingPortions
  lastUsedAt
  totalCost
  purchase {
    id
    purchaseDate
    totalPrice
    quantity
  }
}

# What the correction reads before firing: only what the detail screen caches.
fragment useCorrectPackageSize_stack on PantryItem {
  id
  version
  netWeightUnit {
    id
  }
}

# What the correction writes ahead of the response: the batch's own size and
# its remaining weight, scaled so the same fraction remains.
fragment useCorrectPackageSize_batch on PantryItemBatch {
  id
  netWeight
  remainingNetWeight
}
