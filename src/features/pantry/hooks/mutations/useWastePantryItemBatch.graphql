# Narrow fragment for WastePantryItemBatch mutation response.
# Server returns the parent PantryItem with updated batches + counts.
fragment useWastePantryItemBatch_pantryItem on PantryItem {
  id
  version
  quantity
  heldQuantity
  displayAmount {
    quantity
    unit {
      id
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
  }
  isLowStock
  activeBatchCount
  earliestBatchExpiresOn
}

# The pre-waste values a refused waste restores.
fragment useWastePantryItemBatch_state on PantryItemBatch {
  id
  status
  quantity
  depletedAt
}
