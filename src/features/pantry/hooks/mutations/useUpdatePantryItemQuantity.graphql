# Narrow fragment for useUpdatePantryItemQuantity's optimistic-response shape.
# Mirrors what the UpdatePantryItemQuantity mutation selects on `pantryItem`.
fragment useUpdatePantryItemQuantity_pantryItem on PantryItem {
  id
  version
  quantity
  heldQuantity
  stockBreakdown {
    fullPackages
  }
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
}

# What the write itself needs of the row, so a stack a list holds can be set
# with nothing read first.
fragment useUpdatePantryItemQuantity_row on PantryItem {
  id
  version
}
