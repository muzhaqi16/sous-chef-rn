# Narrow fragment for useUpdatePantryItemQuantity's optimistic-response shape.
# Mirrors what the UpdatePantryItemQuantity mutation selects on `pantryItem`.
fragment useUpdatePantryItemQuantity_pantryItem on PantryItem {
  id
  version
  quantity
  heldQuantity
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
}
