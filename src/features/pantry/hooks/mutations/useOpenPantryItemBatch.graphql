# Narrow fragment for OpenPantryItemBatch mutation response.
# Server returns the parent PantryItem with updated batches; the hook reads
# via Apollo auto-normalization (no manual cache writes).
fragment useOpenPantryItemBatch_pantryItem on PantryItem {
  id
  version
  activeBatchCount
  batches {
    ...PantryItemBatchFragment
  }
}
