# Narrow fragment for OpenPantryItemBatch mutation response.
# Server returns the parent PantryItem with an updated activeBatchCount. Batches
# themselves are a separate connection (Query.pantryItemBatchesConnection), so
# the hook refetches GetPantryItemBatches after opening rather than relying on
# auto-normalization of an inline list.
fragment useOpenPantryItemBatch_pantryItem on PantryItem {
  id
  version
  activeBatchCount
}
