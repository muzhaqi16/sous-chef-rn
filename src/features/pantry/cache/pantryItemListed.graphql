# What a listed pantry item shows: every field the list's cells read
# (`PantryItemCard_pantryItem`, `PantryActionModal_pantryItem`), so `GetPantry`
# fetches them and each cell reads its own fragment by id
# (`listedFragmentsCoverCells.test.ts`).
fragment pantryItem_listed on PantryItem {
  id
  itemName
  quantity
  heldQuantity
  isLowStock
  displayAmount {
    quantity
    unit {
      id
      symbol
    }
  }
  expiresOn
  storageState
  lastUsedAt
  netWeight
  remainingNetWeight
  portionUnitId
  portionUnit {
    id
    name
    symbol
  }
  remainingPortions
  activeBatchCount
  updatedAt
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
  unit {
    id
    symbol
    name
    type
    displayAsFraction
  }
  netWeightUnit {
    id
    name
    symbol
  }
  storageLocation {
    id
    name
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
    }
  }
  itemId
  displayUnit {
    id
    symbol
    type
    hasStandardCountFactor
    baseUnitId
    conversionFactor
    commonFractions
  }
}
