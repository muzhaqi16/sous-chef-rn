# What a listed pantry item shows: every field the list's cells read
# (`PantryItemCard_pantryItem`, `PantryActionModal_pantryItem`), so `GetPantry`
# fetches them and each cell reads its own fragment by id
# (`listedFragmentsCoverCells.test.ts`).
fragment pantryItem_listed on PantryItem {
  id
  itemName
  quantity
  heldQuantity
  isLowStock
  displayAmount {
    quantity
    unit {
      id
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
  }
  held {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  expiresOn
  storageState
  lastUsedAt
  netWeight
  remainingNetWeight
  portionUnitId
  portionUnit {
    id
    name
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
  }
  remainingPortions
  activeBatchCount
  updatedAt
  # The photo this entry shows: the household's choice, the catalog's, else the viewer's pending one.
  image {
    url
    source
    catalogImageId
  }
  item {
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
  unit {
    id
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
    name
    type
    displayAsFraction
  }
  netWeightUnit {
    id
    name
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
  }
  consumeUnit {
    id
  }
  storageLocation {
    id
    name
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
      localizedSymbol
      symbolOther: localizedSymbol(quantity: 2)
    }
  }
  itemId
  displayUnit {
    id
    symbol
    localizedSymbol
    symbolOther: localizedSymbol(quantity: 2)
    type
    hasStandardCountFactor
    baseUnitId
    conversionFactor
    commonFractions
  }
}
