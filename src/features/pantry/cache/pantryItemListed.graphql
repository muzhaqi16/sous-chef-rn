# What a listed pantry item shows: every field the list's cells read
# (`PantryItemCard_pantryItem`, `PantryActionModal_pantryItem`) and its edit form
# (`PantryItemForm_pantryItem`), so `GetPantry` fetches them and each reads its
# own fragment by id, offline too (`listedFragmentsCoverCells.test.ts`).
fragment pantryItem_listed on PantryItem {
  version
  id
  itemName
  quantity
  heldQuantity
  stockBreakdown {
    fullPackages
  }
  isLowStock
  displayAmount {
    quantity
    localizedSymbol
    fraction
    unit {
      id
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  amountLeft {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
  expiresOn
  storageState
  lastUsedAt
  netWeight
  remainingNetWeight
  portionUnitId
  portionsPerTrackingUnit
  portionUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
    type
    displayAsFraction
  }
  remainingPortions
  activeBatchCount
  updatedAt
  # The photo this entry shows: the household's choice, the catalog's, else the viewer's pending one.
  image {
    url
    source
    catalogImageId
  }
  item {
    version
    id
    imageUrl
    images {
      id
      url
      kind
    }
  }
  unit {
    id
    symbol
    localizedSymbolForms {
      one
      other
    }
    name
    type
    displayAsFraction
    commonFractions
  }
  netWeightUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
    type
    displayAsFraction
  }
  consumeUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
  }
  storageLocation {
    version
    id
    name
    type
  }
  packageBreakdown {
    count
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    perUnitNetWeight
    perUnitNetWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalNetWeight
  }
  quantityBreakdown {
    fullPackages
    looseContentUnits
    contentUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
    totalContentUnits
    remainingWeight
    remainingWeightUnit {
      id
      name
      symbol
      localizedSymbolForms {
        one
        other
      }
    }
  }
  itemId
  displayUnit {
    id
    name
    symbol
    localizedSymbolForms {
      one
      other
    }
    type
    hasStandardCountFactor
    baseUnitId
    conversionFactor
    displayAsFraction
    commonFractions
  }
  # What the edit form reads as well, so a listed row opens with no read.
  pantryId
  minQuantity
  restockQuantity
  condition
  storageNotes
  tags
  brand {
    version
    id
    name
  }
  packageSize {
    value
    unitId
    metric {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      localizedSymbol
      displayAsFraction
      type
    }
  }
}
