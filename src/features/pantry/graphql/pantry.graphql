mutation CreatePantryItem($input: CreatePantryItemInput!) {
  createPantryItem(input: $input) {
    __typename
    ... on CreatePantryItemPayload {
      pantryItem {
        id
        pantryId
        itemId
        itemName
        quantity
        version
        updatedAt
        storageState
        expiresAt
        lowStockAlert
        isLowStock
        minQuantity
        lastUsedAt
        netWeight
        remainingNetWeight
        activeBatchCount
        earliestBatchExpiration
        item {
          id
          imageUrl
          images { url kind }
        }
        unit {
          id
          name
          symbol
        }
        netWeightUnit {
          id
          name
          symbol
        }
        storageLocation {
          id
          name
          type
        }
        packageBreakdown {
          count
          contentUnit {
            id
            name
            symbol
          }
          perUnitNetWeight
          perUnitNetWeightUnit {
            id
            name
            symbol
          }
          totalNetWeight
        }
        quantityBreakdown {
          fullPackages
          looseContentUnits
          contentUnit {
            id
            name
            symbol
          }
          totalContentUnits
          remainingWeight
          remainingWeightUnit {
            id
            name
            symbol
          }
        }
        pantry {
          id
          stats {
            totalItems
          }
        }
      }
    }
    # The server can return the duplicate as a union member (in `data`), not just
    # as a GraphQL error — select its fields so the restock prompt can offer the
    # existing items. `code`/`message` come from the `... on Error` spread below.
    ... on DuplicatePantryItemError {
      existingPantryItemIds
      suggestion
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

