mutation CreatePantry($input: CreatePantryInput!) {
  createPantry(input: $input) {
    __typename
    ... on CreatePantryPayload {
      pantry {
        id
        homeId
        name
        description
        isDefault
        version
        createdAt
        updatedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

