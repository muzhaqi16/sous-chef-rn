# ============================================
# BATCH OPERATIONS
# ============================================

# The detail screen's read: a generous `first` because it derives from the WHOLE
# active set (cost dilution, expired batches) while showing only the first few.
# `totalCount` is what its "view all" affordance counts, so a stack past this
# page still names its real size instead of silently reading 100.
query GetPantryItemBatches($pantryItemId: ID!, $status: BatchStatus) {
  pantryItemBatchesConnection(
    pantryItemId: $pantryItemId
    status: $status
    first: 100
  ) {
    totalCount
    # Shares a cache field with GetPantryItemBatchHistory (keyArgs is
    # pantryItemId + status, and neither passes a status). Without `pageInfo`
    # here, `mergeAuthoritativeFirstPage` reads a missing `hasNextPage` as
    # "covers the whole list" and this write strips the cursor the history
    # screen's selection requires — leaving that screen's cache read incomplete.
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        ...PantryItemBatchFragment
      }
    }
  }
}

# The batch-history screen's read. Depleted and wasted batches are never pruned,
# so this is the one unbounded list in the pantry — it pages rather than taking
# a fixed slice.
query GetPantryItemBatchHistory(
  $pantryItemId: ID!
  $first: Int
  $after: String
) {
  pantryItemBatchesConnection(
    pantryItemId: $pantryItemId
    first: $first
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        ...PantryItemBatchFragment
      }
    }
  }
}

