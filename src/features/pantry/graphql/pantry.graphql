# ============================================
# QUERIES
# ============================================

query GetPantry(
  $id: ID!
  $itemsCursor: String
  $itemsFirst: Int = 50
  $itemsFilter: PantryItemFilters
  $itemsOrderBy: PantryItemOrderBy
  $storageLocationsCursor: String
  $storageLocationsFirst: Int = 20
  # The viewer's calendar date, so the expiring and expired counts split where
  # the rows do. Required: omitted, the server counts on UTC's date.
  $today: LocalDate!
) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    version
    stats(today: $today) {
      totalItems
      expiringCount
      expiredCount
      lowStockCount
      storageStateCounts {
        refrigerated
        frozen
        ambient
        # Its own bucket: `ambient` counts a DELIBERATE shelf-stable choice, so
        # an item nobody assigned would otherwise be counted nowhere.
        none
      }
      storageLocationCounts {
        storageLocationId
        name
        type
        itemCount
      }
    }
    itemsConnection(
      first: $itemsFirst
      after: $itemsCursor
      filters: $itemsFilter
      orderBy: $itemsOrderBy
    ) {
      edges {
        node {
          # Direct selections cover what the screen-level hooks + filtered
          # views read off each node — local sort comparators (itemName,
          # expiresOn, quantity, createdAt), local search (itemName),
          # location filtering (storageState, storageLocation.id), stats
          # (isLowStock), and `FilteredPantryItems`' subtitle (unit.symbol).
          # Leaf rendering lives in the masked `PantryItemCard_pantryItem`
          # spread; the Consume/Waste/Restock action modals (opened from this
          # list) read the cache via `PantryActionModal_pantryItem`, so it is
          # spread here too — otherwise those modals open with an incomplete
          # cache read and render blank.
          id
          itemName
          # The CATALOG item's id, which is what a shopping-list add sends —
          # the row's own `id` is the PantryItem and the server cannot resolve
          # it as an Item.
          itemId
          quantity
          heldQuantity
          displayAmount {
            quantity
            unit {
              id
              symbol
            }
          }
          expiresOn
          storageState
          isLowStock
          createdAt
          updatedAt
          storageLocation {
            id
          }
          unit {
            id
            symbol
          }
          ...PantryItemCard_pantryItem
          ...PantryActionModal_pantryItem
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    storageLocationsConnection(
      first: $storageLocationsFirst
      after: $storageLocationsCursor
    ) {
      edges {
        node {
          id
          name
          type
          icon
          color
          temperature
          isDefault
          currentItemCount
          parentLocation {
            id
            name
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    id
    ...PantryItemDetail_pantryItem
  }
}

# One call returns every section: the server places an item only in the first
# section that offers it, which separate per-section calls cannot do. `limit`
# is per section, generous enough to back the drill-down. Rows select only what
# the sheet reads, a section's own context included; `SuggestionItem.imageUrl`
# is always null, so `item` is not selected.
#
# Fields are inlined per section rather than shared via a named fragment: data
# masking is enabled globally, so a `...Fragment` spread would hide these fields
# from the hook's direct reads (the rows render plain props, not useFragment).
query GetPantryItemSuggestions(
  $pantryId: ID!
  $limit: Int = 20
  $today: LocalDate!
) {
  pantry(id: $pantryId) {
    id
    suggestions(limit: $limit, today: $today) {
      lowStock {
        id
        itemId
        name
        source
        category
        imageUrl
        defaultUnitId
        pantryItemId
        currentQuantity
        defaultUnit {
          id
          symbol
        }
      }
      expiringSoon {
        id
        itemId
        name
        source
        category
        imageUrl
        defaultUnitId
        pantryItemId
        daysUntilExpiry
      }
      recentlyDeleted {
        id
        itemId
        name
        source
        category
        imageUrl
        defaultUnitId
        pantryItemId
      }
      frequentlyAdded {
        id
        itemId
        name
        source
        category
        imageUrl
        defaultUnitId
        pantryItemId
      }
      popular {
        id
        itemId
        name
        source
        category
        imageUrl
        defaultUnitId
        pantryItemId
      }
    }
  }
}

# Analytics are now fields on Pantry type
query GetPantryUsageAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    usageAnalytics(filters: $filter) {
      totalUsageCount
      totalQuantityUsed
      averageUsagePerDay
      periodStart
      periodEnd
      usageByPurpose {
        purpose
        count
        totalQuantity
        percentage
      }
      usageBySource {
        source
        count
        totalQuantity
        percentage
      }
      topUsedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
      }
      usageTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryWasteAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    wasteAnalytics(filters: $filter) {
      totalWasteCount
      totalWasteQuantity
      valueByCurrency {
        currencyCode
        amount
      }
      averageWastePerDay
      wasteRate
      composted
      recycled
      periodStart
      periodEnd
      wasteByReason {
        reason
        count
        totalQuantity
        percentage
      }
      topWastedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
        valueByCurrency {
          currencyCode
          amount
        }
      }
      wasteTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryLedgerAnalytics(
  $pantryId: ID!
  $filter: AnalyticsFilters
  $granularity: PeriodGranularity
) {
  pantry(id: $pantryId) {
    id
    ledgerAnalytics(filters: $filter, granularity: $granularity) {
      granularity
      periodStart
      periodEnd
      summary {
        totalAdded
        totalConsumed
        totalWasted
        netQuantity
        additionCount
        consumptionCount
        wasteCount
        unitName
        additionsByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
        consumptionByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
      }
      periodData {
        periodStart
        periodEnd
        periodLabel
        added
        consumed
        wasted
        net
        additionCost
      }
      costAnalytics {
        totalSpent
        averageCostPerUnit
        costByStore {
          storeId
          storeName
          totalSpent
          itemCount
          averageCostPerUnit
        }
      }
      topRestockedItems {
        itemId
        itemName
        imageUrl
        totalQuantity
        unitName
        count
      }
    }
  }
}

# Per STACK, not per catalog item: the server reads the whole measurement
# profile (net weight, portion definition, density), so every unit returned is
# one createPantryItemUsage accepts for this row.
query ConsumptionUnitsForPantryItem($pantryItemId: ID!) {
  consumptionUnitsForPantryItem(pantryItemId: $pantryItemId) {
    unit {
      id
      name
      symbol
      type
      unitRole
      commonFractions
      displayAsFraction
      hasStandardCountFactor
      baseUnitId
      conversionFactor
    }
    rank
    source
    defaultIncrement
    commonFractions
    isWholeContainer
  }
}

query RestockUnitsForPantryItem($pantryItemId: ID!) {
  restockUnitsForPantryItem(pantryItemId: $pantryItemId) {
    unit {
      id
      name
      symbol
      type
      unitRole
      commonFractions
      displayAsFraction
      hasStandardCountFactor
      baseUnitId
      conversionFactor
    }
    rank
    source
    defaultIncrement
    commonFractions
    isWholeContainer
  }
}

