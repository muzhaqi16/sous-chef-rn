# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncPantryItem($clientId: ID!, $input: SyncPantryItemInput!) {
  syncPantryItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...queueManager_syncPantryItem
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
      }
    }
  }
}

mutation SyncDeletePantryItem($clientId: ID!, $version: Int) {
  syncDeletePantryItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription PantryItemChanged($pantryId: ID!) {
  pantryItemChanged(pantryId: $pantryId) {
    mutation
    item {
      id
      ...usePantrySubscriptions_pantryItem
    }
    updatedFields
    timestamp
    userId
    pantryId
  }
}

subscription PantryExpirationAlert($pantryId: ID!) {
  pantryExpirationAlert(pantryId: $pantryId) {
    item {
      id
      itemId
      itemName
      pantryId
      quantity
      unit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
        images { url kind }
      }
    }
    expiresAt
    daysUntilExpiration
    pantryId
    timestamp
    userId
  }
}

subscription ExpirationNotificationCreated($pantryId: ID!) {
  expirationNotificationCreated(pantryId: $pantryId) {
    notification {
      id
      ...usePantrySubscriptions_expirationNotification
    }
    pantryId
    timestamp
  }
}

subscription ExpirationNotificationActionTaken($pantryId: ID!) {
  expirationNotificationActionTaken(pantryId: $pantryId) {
    notification {
      id
      ...usePantrySubscriptions_expirationNotification
    }
    pantryId
    timestamp
  }
}
