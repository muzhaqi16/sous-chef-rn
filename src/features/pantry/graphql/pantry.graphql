mutation CreatePantry($input: CreatePantryInput!) {
  createPantry(input: $input) {
    __typename
    ... on CreatePantrySuccess {
      pantry {
        id
        homeId
        name
        description
        isDefault
        version
        createdAt
        updatedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

