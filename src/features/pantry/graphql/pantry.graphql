# ============================================
# QUERIES
# ============================================

query GetPantries($homeId: ID!, $first: Int, $after: String) {
  pantries(homeId: $homeId, first: $first, after: $after) {
    edges {
      node {
        id
        homeId
        name
        isDefault
        createdAt
      }
    }
  }
}

query GetPantry(
  $id: ID!
  $itemsCursor: String
  $itemsFirst: Int = 50
  $itemsFilter: PantryItemFilters
  $itemsOrderBy: PantryItemOrderBy
  $storageLocationsCursor: String
  $storageLocationsFirst: Int = 20
) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    version
    stats {
      totalItems
      expiringCount
      expiredCount
      lowStockCount
      storageStateCounts {
        refrigerated
        frozen
        ambient
      }
      storageLocationCounts {
        storageLocationId
        name
        type
        itemCount
      }
    }
    itemsConnection(first: $itemsFirst, after: $itemsCursor, filters: $itemsFilter, orderBy: $itemsOrderBy) {
      edges {
        node {
          # Direct selections cover what the screen-level hooks + filtered
          # views read off each node — local sort comparators (itemName,
          # expiresAt, quantity, createdAt), local search (itemName),
          # location filtering (storageState, storageLocation.id), stats
          # (isLowStock), and `FilteredPantryItems`' subtitle (unit.symbol).
          # Leaf rendering lives in the masked `PantryItemCard_pantryItem`
          # spread; the Consume/Waste/Restock action modals (opened from this
          # list) read the cache via `PantryActionModal_pantryItem`, so it is
          # spread here too — otherwise those modals open with an incomplete
          # cache read and render blank.
          id
          itemName
          quantity
          expiresAt
          storageState
          isLowStock
          createdAt
          updatedAt
          storageLocation {
            id
          }
          unit {
            id
            symbol
          }
          ...PantryItemCard_pantryItem
          ...PantryActionModal_pantryItem
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    storageLocationsConnection(
      first: $storageLocationsFirst
      after: $storageLocationsCursor
    ) {
      edges {
        node {
          id
          name
          type
          icon
          color
          isDefault
          currentItemCount
          parentLocation {
            id
            name
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    id
    ...PantryItemDetail_pantryItem
  }
}

# Suggestions are a field on Pantry type. Each source is fetched via its own
# aliased call with a dedicated `limit` so one source can't starve the others —
# every section (low stock, expiring, add again, favorites, popular) gets its own
# quota. The UI shows a small preview of each and drills into the full per-source
# list on demand, so a generous per-source limit is fetched up front.
#
# Fields are inlined per alias rather than shared via a named fragment: data
# masking is enabled globally, so a `...Fragment` spread would hide these fields
# from the hook's direct reads (the rows render plain props, not useFragment).
query GetPantryItemSuggestions($pantryId: ID!, $limit: Int = 20) {
  pantry(id: $pantryId) {
    id
    lowStock: suggestions(limit: $limit, sources: [LOW_STOCK]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      currentQuantity
      minQuantity
      restockQuantity
      daysUntilExpiry
      expiresAt
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      pantryItemId
    }
    expiringSoon: suggestions(limit: $limit, sources: [EXPIRING_SOON]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      currentQuantity
      minQuantity
      restockQuantity
      daysUntilExpiry
      expiresAt
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      pantryItemId
    }
    recentlyDeleted: suggestions(limit: $limit, sources: [RECENTLY_DELETED]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      currentQuantity
      minQuantity
      restockQuantity
      daysUntilExpiry
      expiresAt
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      pantryItemId
    }
    frequentlyAdded: suggestions(limit: $limit, sources: [FREQUENTLY_ADDED]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      currentQuantity
      minQuantity
      restockQuantity
      daysUntilExpiry
      expiresAt
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      pantryItemId
    }
    popular: suggestions(limit: $limit, sources: [POPULAR]) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      currentQuantity
      minQuantity
      restockQuantity
      daysUntilExpiry
      expiresAt
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      pantryItemId
    }
  }
}

# Analytics are now fields on Pantry type
query GetPantryUsageAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    usageAnalytics(filters: $filter) {
      totalUsageCount
      totalQuantityUsed
      averageUsagePerDay
      periodStart
      periodEnd
      usageByPurpose {
        purpose
        count
        totalQuantity
        percentage
      }
      usageBySource {
        source
        count
        totalQuantity
        percentage
      }
      topUsedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
      }
      usageTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryWasteAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    wasteAnalytics(filters: $filter) {
      totalWasteCount
      totalWasteQuantity
      totalWasteValue
      averageWastePerDay
      wasteRate
      composted
      recycled
      periodStart
      periodEnd
      wasteByReason {
        reason
        count
        totalQuantity
        percentage
        estimatedValue
      }
      topWastedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
        estimatedValue
      }
      wasteTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryLedgerAnalytics(
  $pantryId: ID!
  $filter: AnalyticsFilters
  $granularity: PeriodGranularity
) {
  pantry(id: $pantryId) {
    id
    ledgerAnalytics(filters: $filter, granularity: $granularity) {
      granularity
      periodStart
      periodEnd
      summary {
        totalAdded
        totalConsumed
        totalWasted
        netQuantity
        additionCount
        consumptionCount
        wasteCount
        unitName
        additionsByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
        consumptionByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
      }
      periodData {
        periodStart
        periodEnd
        periodLabel
        added
        consumed
        wasted
        net
        additionCost
      }
      costAnalytics {
        totalSpent
        averageCostPerUnit
        costByStore {
          storeId
          storeName
          totalSpent
          itemCount
          averageCostPerUnit
        }
      }
      topRestockedItems {
        itemId
        itemName
        imageUrl
        totalQuantity
        unitName
        count
      }
    }
  }
}

query ConsumptionUnitsForItem(
  $itemId: ID!
  $trackingUnitId: ID!
  $netWeightUnitId: ID
) {
  consumptionUnitsForItem(
    itemId: $itemId
    trackingUnitId: $trackingUnitId
    netWeightUnitId: $netWeightUnitId
  ) {
    unit {
      id
      name
      symbol
      type
      unitRole
      commonFractions
      displayAsFraction
    }
    rank
    source
    defaultIncrement
    commonFractions
    isWholeContainer
  }
}

query RestockUnitsForItem($pantryItemId: ID!) {
  restockUnitsForItem(pantryItemId: $pantryItemId) {
    unit {
      id
      name
      symbol
      type
      unitRole
      commonFractions
      displayAsFraction
    }
    rank
    source
    defaultIncrement
    commonFractions
    isWholeContainer
  }
}

