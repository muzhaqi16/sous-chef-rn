# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncPantryItem($input: SyncPantryItemInput!) {
  syncPantryItem(input: $input) {
    __typename
    ... on SyncPantryItemPayload {
      clientId
      serverId
      operation
      converged
      item {
        id
        ...queueManager_syncPantryItem
      }
      conflict {
        clientVersion
        serverVersion
        message
        serverItem {
          id
          version
        }
      }
    }
    ... on Error {
      code
      message
    }
  }
}

mutation SyncDeletePantryItem($input: SyncDeletePantryItemInput!) {
  syncDeletePantryItem(input: $input) {
    __typename
    ... on SyncPantryItemPayload {
      clientId
      serverId
      operation
      converged
      item {
        id
        itemName
      }
      conflict {
        clientVersion
        serverVersion
        message
      }
    }
    ... on Error {
      code
      message
    }
  }
}

# NOTE: The granular pantry deltas (adjust / restock / consume / open-batch /
# waste / convert-expired) no longer have `sync*` twins. They are made
# replay-safe by passing a client-minted `idempotencyKey` on the CANONICAL
# mutation's input — the server records the key in the same transaction as the
# delta, so a queued replay applies it at most once and returns a
# `ConflictError(code: IDEMPOTENT_REPLAY)`. See docs/api/offline-sync.md.

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription PantryEvents($pantryId: ID!) {
  pantryEvents(pantryId: $pantryId) {
    actorUserId
    mutation
    subtype
    pantryId
    timestamp
    parents {
      homeId
    }
    node {
      ... on PantryItem {
        id
        ...usePantrySubscriptions_pantryItem
      }
      ... on Pantry {
        id
        name
        description
        isDefault
        version
        stats {
          totalItems
          expiringCount
          expiredCount
          lowStockCount
        }
      }
      ... on PantryItemUsage {
        id
        quantityUsed
        purpose
        # Aliased to avoid a same-response-shape clash with
        # ExpirationNotification.pantryItem (PantryItem vs PantryItem!) now that
        # both union members live under this one `node` selection. Not read by
        # the client (UsageChanged only logs).
        usagePantryItem: pantryItem {
          id
          quantity
          isLowStock
        }
      }
      # Expiration notifications now arrive on pantryEvents via the
      # EXPIRATION_NOTIFICATION_CREATED / EXPIRATION_ACTION_TAKEN subtypes
      # (folded in from the former expirationNotificationCreated /
      # expirationNotificationActionTaken subscriptions).
      ... on ExpirationNotification {
        id
        ...usePantrySubscriptions_expirationNotification
      }
    }
  }
}
