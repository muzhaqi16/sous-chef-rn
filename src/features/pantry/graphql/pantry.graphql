# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

# NOTE: The granular pantry deltas (adjust / restock / consume / open-batch /
# waste / convert-expired) no longer have `sync*` twins. They are made
# replay-safe by passing a client-minted `idempotencyKey` on the CANONICAL
# mutation's input — the server records the key in the same transaction as the
# delta, so a queued replay applies it at most once and returns a
# `ConflictError(code: IDEMPOTENT_REPLAY)`. See docs/api/offline-sync.md.

# ============================================
# SUBSCRIPTIONS
# ============================================

# Thin event: the envelope plus the identity of what changed. Subscription
# documents are validated against depth 5 / cost 500 — a fraction of the HTTP
# query budget — because the server re-executes the document on every published
# event for the life of the connection, so a fat selection is a standing cost
# rather than a one-time one. An inline fragment counts as a depth level here
# (graphql-armor counts unflattened), so `node { ... on X { id } }` is already
# depth 4 and one nested object inside a branch is the whole budget.
#
# The handler reads the entity back through a normal query
# (`PantryItemForEvent` and friends), which gets the generous HTTP limits.
# See `__tests__/graphql/documentLimits.test.ts` for the enforced bound.
subscription PantryEvents($pantryId: ID!) {
  pantryEvents(pantryId: $pantryId) {
    # The device that made the change — the server echoes back the
    # `x-device-id` the mutation carried. Suppressing on this rather than on
    # `actorUserId` is what lets the same user's second device keep updating.
    originatorClientId
    actorUserId
    mutation
    subtype
    pantryId
    timestamp
    node {
      __typename
      ... on PantryItem {
        id
      }
      ... on Pantry {
        id
      }
      ... on PantryItemUsage {
        id
      }
      ... on ExpirationNotification {
        id
      }
    }
  }
}

# The usage-history screen's read. Usage records are append-only and never
# pruned, so this is the pantry's other unbounded list.
query GetPantryItemUsageHistory(
  $pantryItemId: ID!
  $first: Int
  $after: String
) {
  pantryItem(id: $pantryItemId) {
    id
    # Newest first, stated rather than assumed: the summary panel labels
    # `usageRecords[0]` the most recent entry, and a default order is the
    # server's to change.
    usageRecordsConnection(
      first: $first
      after: $after
      orderBy: { usedAt: DESC }
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        node {
          id
          quantityUsed
          usageUnit {
            id
            name
            symbol
          }
          usedAt
          purpose
          adjustmentReason
          adjustmentKind
        }
      }
    }
  }
}
