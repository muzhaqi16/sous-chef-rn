mutation CreatePantryItem($input: CreatePantryItemInput!) {
  createPantryItem(input: $input) {
    __typename
    ... on CreatePantryItemSuccess {
      pantryItem {
        id
        pantryId
        itemId
        itemName
        quantity
        version
        updatedAt
        storageState
        expiresAt
        lowStockAlert
        isLowStock
        minQuantity
        lastUsedAt
        netWeight
        remainingNetWeight
        activeBatchCount
        earliestBatchExpiration
        item {
          id
          imageUrl
          images { url kind }
        }
        unit {
          id
          name
          symbol
        }
        netWeightUnit {
          id
          name
          symbol
        }
        storageLocation {
          id
          name
          type
        }
        packageBreakdown {
          count
          contentUnit {
            id
            name
            symbol
          }
          perUnitNetWeight
          perUnitNetWeightUnit {
            id
            name
            symbol
          }
          totalNetWeight
        }
        quantityBreakdown {
          fullPackages
          looseContentUnits
          contentUnit {
            id
            name
            symbol
          }
          totalContentUnits
          remainingWeight
          remainingWeightUnit {
            id
            name
            symbol
          }
        }
        pantry {
          id
          stats {
            totalItems
          }
        }
      }
    }
    ... on Error {
      code
      message
    }
    ... on ValidationError {
      field
    }
  }
}

