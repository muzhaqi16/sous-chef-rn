# ============================================
# QUERIES
# ============================================

query GetPantries($homeId: ID!, $first: Int, $after: String) {
  pantries(homeId: $homeId, first: $first, after: $after) {
    edges {
      node {
        id
        homeId
        name
        isDefault
        createdAt
      }
    }
  }
}

query GetPantry(
  $id: ID!
  $itemsCursor: String
  $itemsFirst: Int = 50
  $itemsFilter: PantryItemFilters
  $itemsOrderBy: PantryItemOrderBy
  $storageLocationsCursor: String
  $storageLocationsFirst: Int = 20
) {
  pantry(id: $id) {
    id
    homeId
    name
    description
    isDefault
    version
    stats {
      totalItems
      expiringCount
      lowStockCount
      storageStateCounts {
        refrigerated
        frozen
        ambient
      }
      storageLocationCounts {
        storageLocationId
        name
        type
        itemCount
      }
    }
    itemsConnection(first: $itemsFirst, after: $itemsCursor, filters: $itemsFilter, orderBy: $itemsOrderBy) {
      edges {
        node {
          # Direct selections cover what the screen-level hooks + filtered
          # views read off each node — local sort comparators (itemName,
          # expiresAt, quantity, createdAt), local search (itemName),
          # location filtering (storageState, storageLocation.id), stats
          # (isLowStock), and `FilteredPantryItems`' subtitle (unit.symbol).
          # Leaf rendering lives in the masked `PantryItemCard_pantryItem`
          # spread.
          id
          itemName
          quantity
          expiresAt
          storageState
          isLowStock
          createdAt
          updatedAt
          storageLocation {
            id
          }
          unit {
            id
            symbol
          }
          ...PantryItemCard_pantryItem
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
    storageLocationsConnection(
      first: $storageLocationsFirst
      after: $storageLocationsCursor
    ) {
      edges {
        node {
          id
          name
          type
          icon
          color
          isDefault
          currentItemCount
          parentLocation {
            id
            name
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

query GetPantryItem($id: ID!) {
  pantryItem(id: $id) {
    ...PantryItemFragment
  }
}

# Suggestions are now a field on Pantry type
query GetPantryItemSuggestions($pantryId: ID!, $limit: Int = 10) {
  pantry(id: $pantryId) {
    id
    suggestions(limit: $limit) {
      id
      itemId
      name
      source
      imageUrl
      category
      defaultUnitId
      defaultUnit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
      }
      currentQuantity
      minQuantity
      restockQuantity
      daysUntilExpiry
      expiresAt
      lastQuantity
      lastUnitId
      frequencyCount
      popularityRank
      pantryItemId
    }
  }
}

# Analytics are now fields on Pantry type
query GetPantryUsageAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    usageAnalytics(filter: $filter) {
      totalUsageCount
      totalQuantityUsed
      averageUsagePerDay
      periodStart
      periodEnd
      usageByPurpose {
        purpose
        count
        totalQuantity
        percentage
      }
      usageBySource {
        source
        count
        totalQuantity
        percentage
      }
      topUsedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
      }
      usageTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryWasteAnalytics($pantryId: ID!, $filter: AnalyticsFilters) {
  pantry(id: $pantryId) {
    id
    wasteAnalytics(filter: $filter) {
      totalWasteCount
      totalWasteQuantity
      totalWasteValue
      averageWastePerDay
      wasteRate
      composted
      recycled
      periodStart
      periodEnd
      wasteByReason {
        reason
        count
        totalQuantity
        percentage
        estimatedValue
      }
      topWastedItems {
        itemId
        itemName
        imageUrl
        count
        totalQuantity
        unitName
        estimatedValue
      }
      wasteTrend {
        date
        value
        count
      }
    }
  }
}

query GetPantryLedgerAnalytics(
  $pantryId: ID!
  $filter: AnalyticsFilters
  $granularity: PeriodGranularity
) {
  pantry(id: $pantryId) {
    id
    ledgerAnalytics(filter: $filter, granularity: $granularity) {
      granularity
      periodStart
      periodEnd
      summary {
        totalAdded
        totalConsumed
        totalWasted
        netQuantity
        additionCount
        consumptionCount
        wasteCount
        unitName
        additionsByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
        consumptionByUnit {
          unitId
          unitName
          unitSymbol
          totalQuantity
          count
        }
      }
      periodData {
        periodStart
        periodEnd
        periodLabel
        added
        consumed
        wasted
        net
        additionCost
      }
      costAnalytics {
        totalSpent
        averageCostPerUnit
        costByStore {
          storeId
          storeName
          totalSpent
          itemCount
          averageCostPerUnit
        }
      }
      topRestockedItems {
        itemId
        itemName
        imageUrl
        totalQuantity
        unitName
        count
      }
    }
  }
}

query ConsumptionUnitsForItem(
  $itemId: ID!
  $trackingUnitId: ID!
  $netWeightUnitId: ID
) {
  consumptionUnitsForItem(
    itemId: $itemId
    trackingUnitId: $trackingUnitId
    netWeightUnitId: $netWeightUnitId
  ) {
    unit {
      id
      name
      symbol
      type
      unitRole
      commonFractions
      displayAsFraction
    }
    rank
    source
    defaultIncrement
    commonFractions
    isWholeContainer
  }
}

query RestockUnitsForItem($pantryItemId: ID!) {
  restockUnitsForItem(pantryItemId: $pantryItemId) {
    unit {
      id
      name
      symbol
      type
      unitRole
      commonFractions
      displayAsFraction
    }
    rank
    source
    defaultIncrement
    commonFractions
    isWholeContainer
  }
}

