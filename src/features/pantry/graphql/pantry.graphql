# ============================================
# BATCH OPERATIONS
# ============================================

query GetPantryItemBatches($pantryItemId: ID!, $status: BatchStatus) {
  pantryItemBatches(pantryItemId: $pantryItemId, status: $status) {
    ...PantryItemBatchFragment
  }
}

mutation OpenPantryItemBatch($input: OpenBatchInput!) {
  openPantryItemBatch(input: $input) {
    success
    message
    code
    pantryItem {
      ...PantryItemDisplay
      batches {
        # Consumed by useOpenPantryItemBatch's optimisticResponse builder,
        # which needs the unmasked shape to construct the cache write.
        ...PantryItemBatchFragment
      }
    }
  }
}

mutation WastePantryItemBatch($input: WasteBatchInput!) {
  wastePantryItemBatch(input: $input) {
    success
    message
    code
    pantryItem {
      ...PantryItemDisplay
    }
  }
}

mutation ConvertExpiredBatchesToWaste($pantryItemId: ID!) {
  convertExpiredBatchesToWaste(pantryItemId: $pantryItemId) {
    success
    message
    code
    pantryItem {
      ...PantryItemDisplay
    }
  }
}

# ============================================
# OFFLINE SYNC MUTATIONS
# ============================================

mutation SyncPantryItem($clientId: ID!, $input: SyncPantryItemInput!) {
  syncPantryItem(clientId: $clientId, input: $input) {
    clientId
    serverId
    operation
    wasCreated
    item {
      ...PantryItemDisplay
    }
    conflict {
      clientVersion
      serverVersion
      message
      serverItem {
        id
        version
      }
    }
  }
}

mutation SyncDeletePantryItem($clientId: ID!, $version: Int) {
  syncDeletePantryItem(clientId: $clientId, version: $version) {
    clientId
    serverId
    operation
    wasCreated
    item {
      id
      itemName
    }
    conflict {
      clientVersion
      serverVersion
      message
    }
  }
}

# ============================================
# SUBSCRIPTIONS
# ============================================

subscription PantryChanges($pantryId: ID!) {
  pantryChanged(pantryId: $pantryId) {
    changeType
    pantry {
      id
      homeId
      name
      description
      location
      temperature
      tags
      metadata
      version
      updatedAt
    }
    pantryItem {
      ...PantryItemDisplay
    }
    usage {
      id
      quantityUsed
      usedAt
      purpose
      notes
      pantryItem {
        id
      }
      usedBy {
        id
      }
    }
    mutation
    updatedFields
    timestamp
    userId
    pantryId
  }
}

subscription PantryAlerts($pantryId: ID!) {
  pantryAlert(pantryId: $pantryId) {
    alertType
    pantryItem {
      id
      itemId
      itemName
      pantryId
      quantity
      unit {
        id
        name
        symbol
      }
      item {
        id
        name
        imageUrl
        images { url kind }
      }
    }
    items {
      id
      itemId
      itemName
      item {
        id
        name
        imageUrl
        images { url kind }
      }
    }
    message
    pantryId
    timestamp
    userId
  }
}

subscription ExpirationNotificationChanged($pantryId: ID!) {
  expirationNotificationChanged(pantryId: $pantryId) {
    changeType
    notification {
      ...usePantrySubscriptions_expirationNotification
    }
    pantryId
    timestamp
  }
}
