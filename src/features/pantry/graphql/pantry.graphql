mutation CreatePantry($input: CreatePantryInput!, $today: LocalDate!) {
  createPantry(input: $input) {
    __typename
    ... on CreatePantryPayload {
      pantry {
        id
        ...PantryReaders
        createdAt
        updatedAt
      }
    }
    ... on Error {
      code
      message
    }
    ... on NotFoundError {
      resource
      resourceId
    }
    ... on ValidationError {
      field
    }
  }
}

