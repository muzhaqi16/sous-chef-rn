# Canonical shape for a PantryItemBatch in the cache.
# Spread by: pantry.graphql (GetPantryItemBatches), PantryItemDetail.graphql,
#   useOpenPantryItemBatch.graphql
# Read via useFragment by: BatchListItem.tsx, usePantryItemDetailData.ts,
#   usePantryBatchHistory.ts
# Kept shared — all 6 consumers need the identical write-back shape.
fragment PantryItemBatchFragment on PantryItemBatch {
  id
  batchNumber
  quantity
  status
  expiresOn
  expiresAtIsManual
  costPerUnit
  totalCost
  # What this batch's cost figures are in; null on a batch carrying no cost.
  # Read rather than assumed: a batch bought abroad keeps the currency it was
  # bought in, whatever the account's preference is set to now.
  currency {
    id
    code
  }
  store {
    id
    name
  }
  notes
  isOpened
  openedAt
  depletedAt
  # This package's own size, in the stack's net-weight unit; the stack's
  # netWeight is only the default new stock inherits.
  netWeight
  remainingNetWeight
  # netWeight read in each unit system, with the label's figure where it has one.
  packageSize {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
  # remainingNetWeight read in each unit system.
  remaining {
    value
    unitId
    metric {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
    imperial {
      value
      unitId
      symbol
      displayAsFraction
      type
    }
  }
  portionsPerTrackingUnit
  # When the stock was bought (a receipt's day for a receipt), where createdAt
  # is when the batch was recorded; null on an unpriced add.
  purchase {
    id
    purchaseDate
  }
  createdAt
  updatedAt
  wasteReason
  pantryItemId
}
