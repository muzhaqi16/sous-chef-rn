name: 'Setup dependencies + GraphQL codegen'
description: |
  Restores cached node_modules (keyed on package-lock.json) and the generated
  GraphQL files (keyed on the .graphql sources + schema + codegen config).
  Runs `npm ci` and `npm run codegen` only on cache miss.

  Caller is responsible for `actions/checkout` and `actions/setup-node` —
  this action assumes Node is already on PATH and the repo is checked out.

runs:
  using: 'composite'
  steps:
    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install npm dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Restore generated GraphQL files cache
      id: cache-codegen
      uses: actions/cache@v4
      with:
        path: |
          src/**/*.generated.ts
          !src/config/env.generated.ts
          src/graphql/generated/schemaTypes.ts
          src/graphql/generated/fragmentMatcher.json
        key: ${{ runner.os }}-codegen-${{ hashFiles('src/**/*.graphql', 'src/graphql/generated/schema.graphql', 'codegen.ts') }}

    - name: Generate GraphQL types
      if: steps.cache-codegen.outputs.cache-hit != 'true'
      shell: bash
      run: npm run codegen

    # Always (re)generate src/config/env.generated.ts. It is gitignored and
    # otherwise produced only by the `postinstall` hook, which runs solely when
    # `npm ci` runs (node_modules cache miss). On a warm node_modules cache the
    # file is never written, and it is excluded from the codegen cache above, so
    # without this step `tsc` fails with "Cannot find module './env.generated'".
    # Runs last so a stale codegen-cache restore can't clobber it. Reads
    # .env/process.env, never fails.
    - name: Generate env config
      shell: bash
      run: npm run genenv
