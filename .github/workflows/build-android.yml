name: Build Android .apk
run-name: Building ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (contains(github.ref, 'prod') && 'prod' || 'dev') }} .apk triggered by @${{ github.actor }}
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
      - 'prod-v*'
      - 'android-v*'
      - 'release-v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30

    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (contains(github.ref, 'prod') || contains(github.ref, 'release')) && 'prod' || 'dev' }}

    env:
      GRADLE_OPTS: -Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
      NODE_OPTIONS: --max-old-space-size=4096
      BUILD_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (contains(github.ref, 'prod') || contains(github.ref, 'release')) && 'prod' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Display build environment
        run: |
          echo "🔧 Building for environment: ${{ env.BUILD_ENV }}"
          echo "📦 Tag/Ref: ${{ github.ref }}"
          echo "Node version: $(node -v)"
          echo "Java version: $(java -version 2>&1 | head -n 1)"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup gradlew as executable
        run: chmod +x ./android/gradlew

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Yarn Install
        run: yarn install --frozen-lockfile --network-timeout 100000

      - name: Create environment file
        run: |
          ENV_FILE=".env.${{ env.BUILD_ENV }}"
          if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            ENV_FILE=".env.production"
          fi

          echo "📝 Creating $ENV_FILE file..."

          cat > $ENV_FILE << EOF
          API_URL=${{ vars.API_URL }}
          WEB_SOCKET_URL=${{ vars.WEB_SOCKET_URL }}
          API_KEY=${{ secrets.API_KEY }}
          NODE_ENV=${{ vars.NODE_ENV || env.BUILD_ENV }}
          EOF

          echo "✅ $ENV_FILE file created"
          cp $ENV_FILE .env

      - name: Debug Environment Variables
        run: |
          echo "🔍 Debugging environment variables..."
          echo "Environment name: ${{ env.BUILD_ENV }}"
          echo "GitHub Environment being used: dev"
          echo "API_URL from vars: '${{ vars.API_URL }}'"
          echo "API_KEY exists: ${{ secrets.API_KEY != '' }}"

          # Check what's in the .env file
          echo "Contents of .env file:"
          cat .env

          # Check if the variables are exported
          echo "Checking exported variables:"
          echo "API_URL=$API_URL"

          # Check what Node sees
          node -e "console.log('Node sees API_URL:', process.env.API_URL)"

      - name: Generate GraphQL Types
        run: |
          echo "🔧 Generating GraphQL types for ${{ env.BUILD_ENV }} environment..."

          # Load from .env file
          export $(cat .env | xargs)

          # Verify it's loaded
          echo "After loading .env, API_URL is: $API_URL"

          npm run codegen
        env:
          API_URL: ${{ vars.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Generate GraphQL Types
        run: |
          echo "🔧 Generating GraphQL types for ${{ env.BUILD_ENV }} environment..."
          export API_URL="${{ vars.API_URL }}"
          export API_KEY="${{ secrets.API_KEY }}"
          npm run codegen

          if [ -f "src/graphql/generated/index.ts" ]; then
            echo "✅ GraphQL types generated successfully"
            echo "📊 Generated files:"
            ls -la src/graphql/generated/
          else
            echo "❌ GraphQL generation failed!"
            exit 1
          fi
        env:
          API_URL: ${{ vars.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: Build application apk
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > ./android/app/releases.keystore
          cd android
          ./gradlew clean
          ./gradlew assembleRelease
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          MYAPP_UPLOAD_STORE_FILE: 'releases.keystore'
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ENVFILE: ${{ env.BUILD_ENV == 'prod' && '.env.production' || '.env.dev' }}

      - name: List the .apks compiled
        run: ls ./android/app/build/outputs/apk/release/ -hal

      - name: Rename the .apk release files
        run: |
          ENV_SUFFIX="${{ env.BUILD_ENV }}"
          TAG_NAME="${{ github.ref_name }}"

          if [ -f "./android/app/build/outputs/apk/release/app-universal-release.apk" ]; then
            mv "./android/app/build/outputs/apk/release/app-universal-release.apk" \
               "./android/app/build/outputs/apk/release/sous-chef-${ENV_SUFFIX}-${TAG_NAME}.apk"
          fi

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ env.BUILD_ENV == 'prod' && 'Production' || 'Development' }} Release ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/release/sous-chef-*.apk
          generate_release_notes: true
          prerelease: ${{ env.BUILD_ENV != 'prod' }}

      - name: Cleanup
        if: always()
        run: |
          rm -f ./android/app/releases.keystore
          rm -f .env.production .env.prod .env.dev .env
          cd android && ./gradlew --stop || true
