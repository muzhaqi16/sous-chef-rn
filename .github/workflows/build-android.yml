name: Build Android
run-name: "Building ${{ github.event_name == 'workflow_dispatch' && format('{0} ({1})', inputs.build_type, inputs.environment) || github.ref_name }} triggered by @${{ github.actor }}"
permissions:
  contents: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Installs @muzhaqi16/receipt-rules from GitHub Packages (see .npmrc).
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    # Every merge to main is a Play build for the internal track.
    branches:
      - main
    tags:
      - 'dev-v*'
      - 'stg-v*'
      - 'prod-v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - playstore
      runner_type:
        description: 'Runner to use (default uses repo variables)'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - self-hosted
          - github-hosted
          - both

# A Play build from main takes its version code from Play and uploads it, so
# those runs go one at a time and only the newest waiting one runs next. Every
# other run is a group of its own.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.build_type == 'playstore' && inputs.environment == 'prod')) && 'play-main' || github.run_id }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Holds a release to what production serves. dev and stg builds are
  # ahead of production by design, so they skip it, and a skip still builds.
  # ─────────────────────────────────────────────────────────────
  release-check:
    name: Release Check
    if: |
      (github.event_name != 'workflow_dispatch' && !startsWith(github.ref_name, 'dev-v') && !startsWith(github.ref_name, 'stg-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.environment == 'prod' || inputs.build_type == 'playstore'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Check against production
        uses: ./.github/actions/release-check

  # ─────────────────────────────────────────────────────────────
  # A Play build from main is numbered one past the highest version code Play
  # has ever accepted, so it can never collide. Read-only: the edit it opens is
  # aborted.
  # ─────────────────────────────────────────────────────────────
  version-code:
    name: Version Code from Play
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.build_type == 'playstore' && inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: play-internal
    permissions:
      contents: read
      id-token: write
    outputs:
      code: ${{ steps.code.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}

      - name: Ask Play for the next version code
        id: code
        run: |
          bundle exec fastlane android version_code out:"$RUNNER_TEMP/version-code"
          code=$(cat "$RUNNER_TEMP/version-code")
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "::error::version_code wrote '$code'"; exit 1; }
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version code: $code" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # Self-hosted runner build (Linux or macOS runner with 'android' label)
  # Toggle: set vars.ANDROID_SELF_HOSTED_ENABLED = 'true' to enable
  # ─────────────────────────────────────────────────────────────
  build-self-hosted:
    name: Build (Self-Hosted)
    needs: [release-check, version-code]
    if: |
      !cancelled() && (needs.release-check.result == 'success' || needs.release-check.result == 'skipped') &&
      (needs.version-code.result == 'success' || needs.version-code.result == 'skipped') && (
      (github.event_name != 'workflow_dispatch' && vars.ANDROID_SELF_HOSTED_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (
        inputs.runner_type == 'self-hosted' ||
        inputs.runner_type == 'both' ||
        (inputs.runner_type == 'default' && vars.ANDROID_SELF_HOSTED_ENABLED == 'true')
      )))
    runs-on: [self-hosted, android]
    timeout-minutes: 30

    environment: ${{
      github.event_name == 'workflow_dispatch' && inputs.environment ||
      startsWith(github.ref_name, 'dev-v') && 'dev' ||
      startsWith(github.ref_name, 'stg-v') && 'stg' ||
      'prod'
      }}

    env:
      GRADLE_OPTS: -Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
      NODE_OPTIONS: --max-old-space-size=4096
      BUILD_ENV: ${{
        github.event_name == 'workflow_dispatch' && inputs.environment ||
        startsWith(github.ref_name, 'dev-v') && 'dev' ||
        startsWith(github.ref_name, 'stg-v') && 'stg' ||
        'prod'
        }}
      IS_PLAYSTORE: ${{
        (github.event_name == 'workflow_dispatch' && inputs.build_type == 'playstore') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        }}
      # Set only on a Play build from main; empty, the build keeps the code in
      # android/app/build.gradle.
      VERSION_CODE: ${{ needs.version-code.outputs.code }}

    steps:
      # The API holds its schema to shipped builds by reading store tags, so a
      # bundle no tag names is held to nothing. A suffixed tag is no store
      # version, so it is refused too. A build from main is tagged when it is
      # promoted to production.
      - name: Refuse a store bundle without a store tag
        if: env.IS_PLAYSTORE == 'true' && github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/(playstore-|ios-|prod-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF is not a store tag, and the API's release check finds builds by store tag. Dispatch a Play build on main, or from a store tag."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # The runner image's own Node is older than package.json's `engines`
      # floor, and `scripts/` uses builtins that only exist from Node 22
      # (`fs.globSync`). Pin it as every other job in every workflow does.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Detect Android SDK and Java paths
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
            JAVA_DIR=$(/usr/libexec/java_home -v 17 2>/dev/null || echo "")
            if [ -n "$JAVA_DIR" ]; then
              echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"
            fi
          else
            echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
            echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          fi

      - name: Display build environment
        run: |
          echo "Building for environment: ${{ env.BUILD_ENV }}"
          echo "Play Store build: ${{ env.IS_PLAYSTORE }}"
          echo "Tag/Ref: ${{ github.ref }}"
          echo "Runner OS: $(uname -s) ($(uname -m))"
          echo "Node version: $(node -v)"
          echo "Java version: $(java -version 2>&1 | head -n 1)"
          echo "Android SDK: $ANDROID_HOME"
          echo "Java Home: $JAVA_HOME"

      - name: Setup Android local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Created android/local.properties with sdk.dir=$ANDROID_HOME"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true

      - name: Setup gradlew as executable
        run: chmod +x ./android/gradlew

      - name: Clean stale caches
        run: |
          # Clear Metro bundler cache to prevent stale module resolution
          rm -rf "$TMPDIR/metro-"* "$TMPDIR/haste-map-"* /tmp/metro-* /tmp/haste-map-*
          echo "Cleared Metro caches"

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Setup Play Store keystore
        if: env.IS_PLAYSTORE == 'true'
        run: |
          echo -n "${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}" | base64 --decode > ./android/app/upload-key.keystore
          echo "" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=upload-key.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=upload" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.PLAYSTORE_KEY_PASSWORD }}" >> android/gradle.properties

      - name: Setup regular keystore
        if: env.IS_PLAYSTORE != 'true'
        run: |
          echo -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode > ./android/app/release.keystore
          echo "" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=github" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      # FCM push config. gitignored locally; injected here from a secret. If the
      # secret is unset the build still succeeds without push (the google-services
      # Gradle plugin is applied conditionally on the file's presence).
      - name: Setup google-services.json (FCM)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo -n "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > ./android/app/google-services.json
            echo "google-services.json written for FCM build"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set — building without FCM (plugin auto-skips)"
          fi

      - name: Clean Android build
        run: |
          cd android
          ./gradlew clean
          cd ..

      - name: Generate .env file
        run: |
          ENV_FILE=".env.${{ env.BUILD_ENV }}"

          # Common variables for all environments
          echo "API_URL=${{ vars.API_URL }}" > "$ENV_FILE"
          echo "API_KEY=${{ secrets.API_KEY }}" >> "$ENV_FILE"
          echo "WEB_SOCKET_URL=${{ vars.WEB_SOCKET_URL }}" >> "$ENV_FILE"
          echo "OTLP_METRICS_ENDPOINT=${{ vars.OTLP_METRICS_ENDPOINT }}" >> "$ENV_FILE"
          echo "OTLP_LOGS_ENDPOINT=${{ vars.OTLP_LOGS_ENDPOINT }}" >> "$ENV_FILE"
          # Unset renders empty, which telemetryLink reads as full capture (1.0).
          echo "GRAPHQL_TELEMETRY_SAMPLE_RATE=${{ vars.GRAPHQL_TELEMETRY_SAMPLE_RATE }}" >> "$ENV_FILE"

          # Build identity goes in the FILE, not a step `env:` block. Metro
          # calls generateEnv() again at module scope when gradle bundles, in a
          # process that never saw a step-scoped variable — which rewrote
          # env.generated.ts with BUILD_ID undefined and GIT_SHA downgraded to
          # a short, `-dirty` sha. The file is read by every later run.
          echo "GIT_SHA=${{ github.sha }}" >> "$ENV_FILE"
          echo "BUILD_ID=${{ github.run_number }}" >> "$ENV_FILE"

          # Environment-specific variables
          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            echo "NODE_ENV=staging" >> "$ENV_FILE"
            echo "WEB_APP_URL=${{ vars.WEB_APP_URL }}" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_USERNAME=${{ secrets.OTLP_METRICS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_PASSWORD=${{ secrets.OTLP_METRICS_AUTH_PASSWORD }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_USERNAME=${{ secrets.OTLP_LOGS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_PASSWORD=${{ secrets.OTLP_LOGS_AUTH_PASSWORD }}" >> "$ENV_FILE"
          elif [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            echo "NODE_ENV=production" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_USERNAME=${{ secrets.OTLP_METRICS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_PASSWORD=${{ secrets.OTLP_METRICS_AUTH_PASSWORD }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_USERNAME=${{ secrets.OTLP_LOGS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_PASSWORD=${{ secrets.OTLP_LOGS_AUTH_PASSWORD }}" >> "$ENV_FILE"
          fi

          # Copy to .env (the env generator reads .env by default)
          cp "$ENV_FILE" .env
          echo "Generated $ENV_FILE and copied to .env"

      - name: Generate build-time config from .env
        run: node scripts/generate-env.js

      - name: Build Play Store AAB
        if: env.IS_PLAYSTORE == 'true'
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace ${VERSION_CODE:+-PversionCode=$VERSION_CODE}

      - name: Build APK
        if: env.IS_PLAYSTORE != 'true'
        run: |
          cd android
          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            ./gradlew assembleStaging --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      # uploadCrashlyticsSymbolFileRelease sends the NDK symbols Crashlytics
      # names native frames with, for the Play Store build only. It runs in the
      # build's tree, so the symbols come from the libraries just packaged; a
      # failed upload warns, never fails the build. It takes the build's version
      # code too, so gradle sees the same configuration and rebuilds nothing.
      - name: Upload native symbols to Crashlytics
        if: env.IS_PLAYSTORE == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -o pipefail
          cd android
          LOG="$RUNNER_TEMP/crashlytics-upload.log"
          for attempt in 1 2 3; do
            if ./gradlew uploadCrashlyticsSymbolFileRelease --stacktrace ${VERSION_CODE:+-PversionCode=$VERSION_CODE} 2>&1 | tee "$LOG"; then
              echo "Native symbols uploaded on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Upload attempt ${attempt} failed; retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            fi
          done
          REASON=$(grep -m1 -oE 'response: [^]]+' "$LOG" || echo "see this step's log")
          echo "::warning::Crashlytics native symbol upload failed 3 times (${REASON}); native frames in this build's crashes will show Missing BuildId"
          echo "- :warning: Crashlytics native symbols not uploaded: ${REASON}" >> "$GITHUB_STEP_SUMMARY"

      # Both run AFTER the build, not before it. `metro.config.js` calls
      # generateEnv() at module scope, so gradle's bundling step rewrites
      # env.generated.ts in a process of its own — the very overwrite these
      # guard against happens after any pre-build check would have passed.
      - name: Verify build identity survived into the bundle
        run: node scripts/check-build-provenance.mjs
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_number }}

      - name: Refuse launch-argument authentication in a shipped build
        run: node scripts/check-launch-arg-auth.mjs

      # A third-party credential inside the shipped bundle is readable by
      # anyone who obtains the app; rotating it does not change that. Runs
      # against the ARTIFACT with the same .env the build used, and fails if it
      # finds no bundle at all — a moved output must not read as clean.
      - name: Check no third-party credential is in the bundle
        run: node scripts/check-bundled-secrets.mjs android/app/build/generated/assets

      - name: List build outputs
        run: |
          if [ "${{ env.IS_PLAYSTORE }}" = "true" ]; then
            ls -hal ./android/app/build/outputs/bundle/release/ || echo "No AAB outputs found"
          elif [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            ls -hal ./android/app/build/outputs/apk/staging/ || echo "No staging APK outputs found"
          else
            ls -hal ./android/app/build/outputs/apk/release/ || echo "No release APK outputs found"
          fi

      # The upload job runs on a GitHub-hosted runner, so Play access never
      # reaches this machine; the bundle and its R8 mapping travel to it here.
      - name: Keep the bundle for the Play upload
        if: env.VERSION_CODE != ''
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-self-hosted
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify 16KB page alignment
        if: env.IS_PLAYSTORE != 'true'
        run: |
          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            APK_DIR="./android/app/build/outputs/apk/staging"
          else
            APK_DIR="./android/app/build/outputs/apk/release"
          fi

          ALIGNMENT_OK=true
          for APK in "$APK_DIR"/*.apk; do
            [ -f "$APK" ] || continue
            echo "Checking 16KB alignment: $(basename "$APK")"
            if ! $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -n1)/zipalign -c -P 16 -v 4 "$APK" > /dev/null 2>&1; then
              echo "::warning::APK $(basename "$APK") is NOT 16KB page-aligned. This may cause issues on Android 15+ devices."
              ALIGNMENT_OK=false
            else
              echo "$(basename "$APK") is properly 16KB aligned"
            fi
          done

          if [ "$ALIGNMENT_OK" = false ]; then
            echo "::warning::Some APKs failed 16KB alignment check. Review third-party native libraries."
          fi

      - name: Rename APK files
        if: env.IS_PLAYSTORE != 'true'
        run: |
          TAG_NAME="${{ github.ref_name }}"

          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            APK_DIR="./android/app/build/outputs/apk/staging"
            SUFFIX="staging"
          else
            APK_DIR="./android/app/build/outputs/apk/release"
            SUFFIX="release"
          fi

          # Rename universal APK
          if [ -f "${APK_DIR}/app-universal-${SUFFIX}.apk" ]; then
            mv "${APK_DIR}/app-universal-${SUFFIX}.apk" \
              "${APK_DIR}/sous-chef-${SUFFIX}-${TAG_NAME}-universal.apk"
          fi

          # Rename architecture-specific APKs
          for ARCH in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "${APK_DIR}/app-${ARCH}-${SUFFIX}.apk" ]; then
              mv "${APK_DIR}/app-${ARCH}-${SUFFIX}.apk" \
                "${APK_DIR}/sous-chef-${SUFFIX}-${TAG_NAME}-${ARCH}.apk"
            fi
          done

      # Release artifacts publish only from a release tag, a push to main, or a
      # manual dispatch run whose ref is a protected branch
      # (github.ref_protected). This blocks a workflow_dispatch from an
      # arbitrary unprotected branch from pushing a release build to S3. A Play
      # build from main is archived under its version code, so builds of one
      # branch never overwrite each other.
      - name: Upload Play Store AAB to S3
        if: env.IS_PLAYSTORE == 'true' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref_protected))
        run: |
          DEST="sous-chef-app-prod/android/${{ github.ref_name }}${VERSION_CODE:+/$VERSION_CODE}"
          mcli cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            "minio/$DEST/app-release.aab"
          echo "Uploaded AAB to $DEST/"

      - name: Upload APKs to S3
        if: env.IS_PLAYSTORE != 'true' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref_protected))
        run: |
          BUCKET="sous-chef-app-${{ env.BUILD_ENV }}"
          APK_DIR="android/app/build/outputs/apk/${{ env.BUILD_ENV == 'stg' && 'staging' || 'release' }}"
          for APK in "$APK_DIR"/sous-chef-*.apk; do
            [ -f "$APK" ] || continue
            FILENAME=$(basename "$APK")
            mcli cp "$APK" "minio/${BUCKET}/android/${{ github.ref_name }}/$FILENAME"
            echo "Uploaded $FILENAME to ${BUCKET}/android/${{ github.ref_name }}/"
          done

      - name: Cleanup
        if: always()
        run: |
          # Remove sensitive files
          rm -f ./android/app/release.keystore
          rm -f ./android/app/upload-key.keystore
          rm -f android/local.properties
          rm -f .env.dev .env.stg .env.prod .env.production .env.staging .env

          # Clean Gradle caches to prevent stale build issues on self-hosted runner
          rm -rf android/app/build/
          rm -rf android/.gradle/
          rm -rf ~/.gradle/caches/journal-*
          rm -rf ~/.gradle/caches/*/executionHistory/

          # Stop Gradle daemon
          cd android && ./gradlew --stop || true

  # ─────────────────────────────────────────────────────────────
  # GitHub-hosted runner build (ephemeral ubuntu-latest)
  # Toggle: set vars.ANDROID_GITHUB_HOSTED_ENABLED = 'true' to enable
  # ─────────────────────────────────────────────────────────────
  build-github-hosted:
    name: Build (GitHub-Hosted)
    needs: [release-check, version-code]
    if: |
      !cancelled() && (needs.release-check.result == 'success' || needs.release-check.result == 'skipped') &&
      (needs.version-code.result == 'success' || needs.version-code.result == 'skipped') && (
      (github.event_name != 'workflow_dispatch' && vars.ANDROID_GITHUB_HOSTED_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (
        inputs.runner_type == 'github-hosted' ||
        inputs.runner_type == 'both' ||
        (inputs.runner_type == 'default' && vars.ANDROID_GITHUB_HOSTED_ENABLED == 'true')
      )))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: ${{
      github.event_name == 'workflow_dispatch' && inputs.environment ||
      startsWith(github.ref_name, 'dev-v') && 'dev' ||
      startsWith(github.ref_name, 'stg-v') && 'stg' ||
      'prod'
      }}

    env:
      GRADLE_OPTS: -Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
      NODE_OPTIONS: --max-old-space-size=4096
      BUILD_ENV: ${{
        github.event_name == 'workflow_dispatch' && inputs.environment ||
        startsWith(github.ref_name, 'dev-v') && 'dev' ||
        startsWith(github.ref_name, 'stg-v') && 'stg' ||
        'prod'
        }}
      IS_PLAYSTORE: ${{
        (github.event_name == 'workflow_dispatch' && inputs.build_type == 'playstore') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        }}
      # Set only on a Play build from main; empty, the build keeps the code in
      # android/app/build.gradle.
      VERSION_CODE: ${{ needs.version-code.outputs.code }}

    steps:
      # The API holds its schema to shipped builds by reading store tags, so a
      # bundle no tag names is held to nothing. A suffixed tag is no store
      # version, so it is refused too. A build from main is tagged when it is
      # promoted to production.
      - name: Refuse a store bundle without a store tag
        if: env.IS_PLAYSTORE == 'true' && github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/(playstore-|ios-|prod-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF is not a store tag, and the API's release check finds builds by store tag. Dispatch a Play build on main, or from a store tag."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Created android/local.properties with ANDROID_HOME=$ANDROID_HOME"

      - name: Display build environment
        run: |
          echo "Building for environment: ${{ env.BUILD_ENV }}"
          echo "Play Store build: ${{ env.IS_PLAYSTORE }}"
          echo "Tag/Ref: ${{ github.ref }}"
          echo "Node version: $(node -v)"
          echo "Java version: $(java -version 2>&1 | head -n 1)"
          echo "Android SDK: $ANDROID_HOME"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true

      - name: Setup gradlew as executable
        run: chmod +x ./android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'android/app/proguard-rules.pro') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Setup Play Store keystore
        if: env.IS_PLAYSTORE == 'true'
        run: |
          echo -n "${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}" | base64 --decode > ./android/app/upload-key.keystore
          echo "" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=upload-key.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=upload" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.PLAYSTORE_KEY_PASSWORD }}" >> android/gradle.properties

      - name: Setup regular keystore
        if: env.IS_PLAYSTORE != 'true'
        run: |
          echo -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode > ./android/app/release.keystore
          echo "" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=github" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: Generate .env file
        run: |
          ENV_FILE=".env.${{ env.BUILD_ENV }}"

          # Common variables for all environments
          echo "API_URL=${{ vars.API_URL }}" > "$ENV_FILE"
          echo "API_KEY=${{ secrets.API_KEY }}" >> "$ENV_FILE"
          echo "WEB_SOCKET_URL=${{ vars.WEB_SOCKET_URL }}" >> "$ENV_FILE"
          echo "OTLP_METRICS_ENDPOINT=${{ vars.OTLP_METRICS_ENDPOINT }}" >> "$ENV_FILE"
          echo "OTLP_LOGS_ENDPOINT=${{ vars.OTLP_LOGS_ENDPOINT }}" >> "$ENV_FILE"
          # Unset renders empty, which telemetryLink reads as full capture (1.0).
          echo "GRAPHQL_TELEMETRY_SAMPLE_RATE=${{ vars.GRAPHQL_TELEMETRY_SAMPLE_RATE }}" >> "$ENV_FILE"

          # Build identity goes in the FILE, not a step `env:` block. Metro
          # calls generateEnv() again at module scope when gradle bundles, in a
          # process that never saw a step-scoped variable — which rewrote
          # env.generated.ts with BUILD_ID undefined and GIT_SHA downgraded to
          # a short, `-dirty` sha. The file is read by every later run.
          echo "GIT_SHA=${{ github.sha }}" >> "$ENV_FILE"
          echo "BUILD_ID=${{ github.run_number }}" >> "$ENV_FILE"

          # Environment-specific variables
          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            echo "NODE_ENV=staging" >> "$ENV_FILE"
            echo "WEB_APP_URL=${{ vars.WEB_APP_URL }}" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_USERNAME=${{ secrets.OTLP_METRICS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_PASSWORD=${{ secrets.OTLP_METRICS_AUTH_PASSWORD }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_USERNAME=${{ secrets.OTLP_LOGS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_PASSWORD=${{ secrets.OTLP_LOGS_AUTH_PASSWORD }}" >> "$ENV_FILE"
          elif [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            echo "NODE_ENV=production" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_USERNAME=${{ secrets.OTLP_METRICS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_METRICS_AUTH_PASSWORD=${{ secrets.OTLP_METRICS_AUTH_PASSWORD }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_USERNAME=${{ secrets.OTLP_LOGS_AUTH_USERNAME }}" >> "$ENV_FILE"
            echo "OTLP_LOGS_AUTH_PASSWORD=${{ secrets.OTLP_LOGS_AUTH_PASSWORD }}" >> "$ENV_FILE"
          fi

          # Copy to .env (the env generator reads .env by default)
          cp "$ENV_FILE" .env
          echo "Generated $ENV_FILE and copied to .env"

      - name: Generate build-time config from .env
        run: node scripts/generate-env.js

      - name: Build Play Store AAB
        if: env.IS_PLAYSTORE == 'true'
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace ${VERSION_CODE:+-PversionCode=$VERSION_CODE}

      - name: Build APK
        if: env.IS_PLAYSTORE != 'true'
        run: |
          cd android
          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            ./gradlew assembleStaging --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      # uploadCrashlyticsSymbolFileRelease sends the NDK symbols Crashlytics
      # names native frames with, for the Play Store build only. It runs in the
      # build's tree, so the symbols come from the libraries just packaged; a
      # failed upload warns, never fails the build. It takes the build's version
      # code too, so gradle sees the same configuration and rebuilds nothing.
      - name: Upload native symbols to Crashlytics
        if: env.IS_PLAYSTORE == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -o pipefail
          cd android
          LOG="$RUNNER_TEMP/crashlytics-upload.log"
          for attempt in 1 2 3; do
            if ./gradlew uploadCrashlyticsSymbolFileRelease --stacktrace ${VERSION_CODE:+-PversionCode=$VERSION_CODE} 2>&1 | tee "$LOG"; then
              echo "Native symbols uploaded on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Upload attempt ${attempt} failed; retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            fi
          done
          REASON=$(grep -m1 -oE 'response: [^]]+' "$LOG" || echo "see this step's log")
          echo "::warning::Crashlytics native symbol upload failed 3 times (${REASON}); native frames in this build's crashes will show Missing BuildId"
          echo "- :warning: Crashlytics native symbols not uploaded: ${REASON}" >> "$GITHUB_STEP_SUMMARY"

      # Both run AFTER the build, not before it. `metro.config.js` calls
      # generateEnv() at module scope, so gradle's bundling step rewrites
      # env.generated.ts in a process of its own — the very overwrite these
      # guard against happens after any pre-build check would have passed.
      - name: Verify build identity survived into the bundle
        run: node scripts/check-build-provenance.mjs
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_number }}

      - name: Refuse launch-argument authentication in a shipped build
        run: node scripts/check-launch-arg-auth.mjs

      # A third-party credential inside the shipped bundle is readable by
      # anyone who obtains the app; rotating it does not change that. Runs
      # against the ARTIFACT with the same .env the build used, and fails if it
      # finds no bundle at all — a moved output must not read as clean.
      - name: Check no third-party credential is in the bundle
        run: node scripts/check-bundled-secrets.mjs android/app/build/generated/assets

      - name: List build outputs
        run: |
          if [ "${{ env.IS_PLAYSTORE }}" = "true" ]; then
            ls -hal ./android/app/build/outputs/bundle/release/ || echo "No AAB outputs found"
          elif [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            ls -hal ./android/app/build/outputs/apk/staging/ || echo "No staging APK outputs found"
          else
            ls -hal ./android/app/build/outputs/apk/release/ || echo "No release APK outputs found"
          fi

      # The upload job runs on a runner of its own, which is where Play access
      # lives; the bundle and its R8 mapping travel to it here.
      - name: Keep the bundle for the Play upload
        if: env.VERSION_CODE != ''
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-github-hosted
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify 16KB page alignment
        if: env.IS_PLAYSTORE != 'true'
        run: |
          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            APK_DIR="./android/app/build/outputs/apk/staging"
          else
            APK_DIR="./android/app/build/outputs/apk/release"
          fi

          ALIGNMENT_OK=true
          for APK in "$APK_DIR"/*.apk; do
            [ -f "$APK" ] || continue
            echo "Checking 16KB alignment: $(basename "$APK")"
            if ! $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -n1)/zipalign -c -P 16 -v 4 "$APK" > /dev/null 2>&1; then
              echo "::warning::APK $(basename "$APK") is NOT 16KB page-aligned. This may cause issues on Android 15+ devices."
              ALIGNMENT_OK=false
            else
              echo "$(basename "$APK") is properly 16KB aligned"
            fi
          done

          if [ "$ALIGNMENT_OK" = false ]; then
            echo "::warning::Some APKs failed 16KB alignment check. Review third-party native libraries."
          fi

      - name: Rename APK files
        if: env.IS_PLAYSTORE != 'true'
        run: |
          TAG_NAME="${{ github.ref_name }}"

          if [ "${{ env.BUILD_ENV }}" = "stg" ]; then
            APK_DIR="./android/app/build/outputs/apk/staging"
            SUFFIX="staging"
          else
            APK_DIR="./android/app/build/outputs/apk/release"
            SUFFIX="release"
          fi

          # Rename universal APK
          if [ -f "${APK_DIR}/app-universal-${SUFFIX}.apk" ]; then
            mv "${APK_DIR}/app-universal-${SUFFIX}.apk" \
              "${APK_DIR}/sous-chef-${SUFFIX}-${TAG_NAME}-universal.apk"
          fi

          # Rename architecture-specific APKs
          for ARCH in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "${APK_DIR}/app-${ARCH}-${SUFFIX}.apk" ]; then
              mv "${APK_DIR}/app-${ARCH}-${SUFFIX}.apk" \
                "${APK_DIR}/sous-chef-${SUFFIX}-${TAG_NAME}-${ARCH}.apk"
            fi
          done

      - name: Upload Play Store AAB
        if: env.IS_PLAYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APKs
        if: env.IS_PLAYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ env.BUILD_ENV }}-${{ github.ref_name }}
          path: android/app/build/outputs/apk/${{ env.BUILD_ENV == 'stg' && 'staging' || 'release' }}/sous-chef-*.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # A Play build from main goes to the internal track, where internal testers
  # get it as an ordinary update. Production is promote-android.yml's.
  # ─────────────────────────────────────────────────────────────
  upload-internal:
    name: Upload to Play (internal)
    needs: [version-code, build-self-hosted, build-github-hosted]
    if: |
      !cancelled() && needs.version-code.result == 'success' &&
      (needs.build-self-hosted.result == 'success' || needs.build-github-hosted.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: play-internal
    permissions:
      contents: write
      id-token: write
    env:
      VERSION_CODE: ${{ needs.version-code.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          pattern: play-bundle-*
          path: ${{ runner.temp }}/play-bundles

      # Both build jobs run only when both runners are switched on; either
      # bundle passed every check, and the self-hosted one is the usual one.
      - name: Pick the bundle
        run: |
          dir="$RUNNER_TEMP/play-bundles/play-bundle-self-hosted"
          [ -d "$dir" ] || dir="$RUNNER_TEMP/play-bundles/play-bundle-github-hosted"
          echo "BUNDLE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Setup fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}

      - name: Upload to the internal track
        run: |
          bundle exec fastlane android upload_internal \
            version_code:"$VERSION_CODE" \
            aab:"$BUNDLE_DIR/bundle/release/app-release.aab" \
            mapping:"$BUNDLE_DIR/mapping/release/mapping.txt"
          echo "Internal track: version code $VERSION_CODE from ${GITHUB_SHA::9}" >> "$GITHUB_STEP_SUMMARY"

      # Promotion finds the commit a build came from by this tag. No build
      # trigger matches it and the API reads only store tags, so it starts
      # nothing. The job's token starts no workflow either.
      - name: Record the commit this build came from
        run: |
          git tag --force "play-build/$VERSION_CODE" "$GITHUB_SHA"
          git push --force origin "refs/tags/play-build/$VERSION_CODE" || {
            echo "::error::Play accepted $VERSION_CODE, but play-build/$VERSION_CODE was not pushed, and promotion needs it. Push it by hand: git tag play-build/$VERSION_CODE $GITHUB_SHA && git push origin play-build/$VERSION_CODE"
            exit 1
          }

  # ─────────────────────────────────────────────────────────────
  # Build summary
  # ─────────────────────────────────────────────────────────────
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      [
        release-check,
        version-code,
        build-self-hosted,
        build-github-hosted,
        upload-internal,
      ]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Android Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release Check | ${{ needs.release-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Code | ${{ needs.version-code.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Self-Hosted | ${{ needs.build-self-hosted.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub-Hosted | ${{ needs.build-github-hosted.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Play Internal | ${{ needs.upload-internal.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-self-hosted.result }}" = "failure" ] || \
             [ "${{ needs.build-github-hosted.result }}" = "failure" ]; then
            echo "::error::One or more build jobs failed"
            exit 1
          fi
          if [ "${{ needs.version-code.result }}" = "failure" ] || \
             [ "${{ needs.upload-internal.result }}" = "failure" ]; then
            echo "::error::The Play build did not reach the internal track"
            exit 1
          fi
