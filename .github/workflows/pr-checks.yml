name: PR Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # TypeScript type checking
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Run TypeScript check
        run: npm run typecheck

  # Linting
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Type-aware linting (@typescript-eslint/no-deprecated + the import/resolver
    # TS program) holds the full TypeScript program(s) in memory. A fresh,
    # cacheless `eslint .` over the whole repo peaks at ~3.5GB RSS, which
    # overruns Node's default old-space heap on the runner and aborts with
    # "Ineffective mark-compacts near heap limit". Match the build-android jobs.
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Run ESLint
        run: npm run lint

  # i18n key parity
  i18n-check:
    name: i18n Key Parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Run i18n check
        run: node scripts/check-i18n.mjs

  # Inline fragment audit — fails on regression to track the per-component
  # fragments + useFragment migration.
  fragment-audit:
    name: Inline Fragment Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Run inline fragment audit
        run: node scripts/audit-fragment-inlining.mjs

  # React Compiler bailout check — a bailout is silent by design (the compiler
  # skips the function and the build succeeds), and no linter can see it because
  # ESLint reads the source while the bailout is introduced downstream by
  # another Babel plugin. Compiling is the only way to know.
  compiler-bailouts:
    name: React Compiler Bailouts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for new compiler bailouts
        run: node scripts/check-compiler-bailouts.mjs

      # Same job, same reasoning, opposite failure: a bailout loses memoization
      # loudly enough to count, while a stale variant keeps the memoization and
      # renders the wrong style. Both live only in compiled output. This ran
      # pre-push but never in CI, and pre-push is bypassable — the baseline is
      # empty now, so anything it reports is a real regression rather than a
      # number to absorb.
      - name: Check for stale Unistyles variants
        run: node scripts/check-unistyles-variant-staleness.mjs

  # Stale cache field detector — a mutation that omits a field the server
  # recomputes leaves the old value in the normalized cache, which reads as
  # "wrong until I reload" and never corrects at all while offline.
  stale-cache-fields:
    name: Stale Cache Fields
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for stale cache fields
        run: node scripts/find-stale-cache-fields.mjs --check

  # The bundled-secret scanner runs in the BUILD workflows, against a real
  # artifact. This exercises the scanner itself on every PR so it cannot rot
  # into a no-op unnoticed — it plants a known value and asserts a find.
  bundled-secret-scanner:
    name: Bundled Secret Scanner (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the bundled secret scanner
        run: node scripts/check-bundled-secrets.mjs --self-test

  # The whole-tree structural gates.
  #
  # These ran ONLY in `.husky/pre-commit`, which means they ran only when hooks
  # ran: `--no-verify`, a hook-less clone, a squash landed through the web UI,
  # or any environment where `core.hooksPath` is not set skipped every one of
  # them. A ratchet that can be bypassed by a flag is a suggestion. They cost
  # well under a second together, so they run as one job rather than seven.
  #
  # `check-launch-arg-auth` runs in its BUILD-PATH mode here: the post-hoc mode
  # reads `src/config/env.generated.ts`, which a checks-only job has no reason
  # to produce, and the artifact question is the one that matters anyway.
  structural-gates:
    name: Structural Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Codegen orphans
        run: node scripts/check-codegen-orphans.mjs

      - name: Version sync across package.json, Android and iOS
        run: node scripts/check-version-sync.mjs

      - name: Startup origin position
        run: node scripts/check-startup-origin.mjs

      - name: Launch-argument auth — Android release artifact
        run: node scripts/check-launch-arg-auth.mjs --platform android --variant release

      - name: Launch-argument auth — iOS device artifact
        run: node scripts/check-launch-arg-auth.mjs --platform ios --sdk iphoneos

      - name: Layer purity
        run: node scripts/check-layer-purity.mjs

      - name: Feature shape
        run: node scripts/check-feature-shape.mjs

      - name: Dead modules
        run: node scripts/check-dead-modules.mjs

      - name: Optimistic fillers are up to date
        run: npm run check:fillers

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests

  # Render-performance comparison. RECORDS, never fails the build.
  #
  # Reassure measures React render duration and count via `React.Profiler` in
  # Jest. Narrow — it sees no native, bundle or startup cost — but it is the one
  # signal here that is commit-attributed and statistically defensible: its
  # verdict needs BOTH p < 0.02 and a >=5% effect size, so a change that is
  # merely consistent is not reported as a regression.
  #
  # The baseline is measured on THIS runner, minutes before the current one, by
  # checking out the merge base. That adjacency is the noise control; comparing
  # against a stored number from another machine would not be meaningful.
  #
  # `continue-on-error` is deliberate and is why this job is absent from
  # `pr-status`'s `needs`. Mobile render measurements are noisy, and a gate set
  # before the real variance is known produces false failures. Gate later, on
  # evidence: measure this runner's own variance across repeated runs of an
  # unchanged commit first, and set the threshold from that.
  performance:
    name: Render Performance (record-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Reassure needs the merge base to measure a baseline against.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Check runner stability
        # Measures the same code twice. Reassure's guidance: under 5% is fine,
        # "10% and more considered too high". Recorded rather than enforced, so
        # a noisy runner shows up in the log instead of failing the PR — but if
        # this climbs, the comparison below stops meaning anything.
        run: npm run perf:stability

      - name: Measure baseline (merge base) and current (PR head)
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          git switch --detach "$BASELINE_REF"
          # `npx reassure`, NOT `npm run perf:baseline`: this step runs with the
          # BASE commit's package.json checked out, so an npm script added by
          # the PR under review does not exist yet and the step dies before
          # measuring anything. The binary comes from the head's node_modules,
          # which is installed and never switched.
          npx reassure --baseline
          git switch --detach "${{ github.event.pull_request.head.sha }}"
          npx reassure

      - name: Publish comparison
        if: always()
        run: |
          # A job that produced nothing must not read like a job that found no
          # regression. `continue-on-error` is still set, so this reports the
          # difference rather than gating on it.
          # Non-empty is not enough: reassure writes a header line to the
          # output file BEFORE running anything (measure.js:41), so a run that
          # collected zero scenarios still leaves a 1-line file. A real
          # measurement adds at least one line after that header.
          measured=1
          for f in .reassure/baseline.perf .reassure/current.perf; do
            if [ ! -f "$f" ] || [ "$(wc -l < "$f")" -lt 2 ]; then
              measured=0
            fi
          done
          {
            echo "## Render performance"
            echo ""
            if [ "$measured" = "0" ]; then
              echo "> **FAILED TO MEASURE** - one or both measurement files are"
              echo "> missing or empty, so there is no comparison below. This is"
              echo "> NOT a clean result; the instrument did not run."
              echo ""
              echo '```'
              ls -la .reassure/ 2>&1 || echo "no .reassure/ directory"
              echo '```'
            elif [ -f .reassure/output.md ]; then
              cat .reassure/output.md
            else
              echo "> **FAILED TO MEASURE** - both measurement files exist but"
              echo "> reassure produced no comparison output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reassure-${{ github.event.pull_request.number }}
          path: .reassure/
          retention-days: 30

  # PR status check
  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    # Every gate that must block a merge belongs here. A job that runs but is
    # absent from this list reports its failure beside the PR instead of
    # stopping it — which defeats the reason the compiler/cache/secret checks
    # were moved into CI in the first place (pre-push is bypassable).
    # `performance` is deliberately excluded: it reports, it does not gate.
    needs:
      [
        typecheck,
        lint,
        i18n-check,
        fragment-audit,
        unit-tests,
        compiler-bailouts,
        stale-cache-fields,
        bundled-secret-scanner,
      ]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.i18n-check.result }}" != "success" ] || \
             [ "${{ needs.fragment-audit.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.compiler-bailouts.result }}" != "success" ] || \
             [ "${{ needs.stale-cache-fields.result }}" != "success" ] || \
             [ "${{ needs.bundled-secret-scanner.result }}" != "success" ]; then
            echo "❌ One or more PR checks failed"
            echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- TypeScript: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- i18n: ${{ needs.i18n-check.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Fragment Audit: ${{ needs.fragment-audit.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Compiler Bailouts: ${{ needs.compiler-bailouts.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Stale Cache Fields: ${{ needs.stale-cache-fields.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Bundled Secrets: ${{ needs.bundled-secret-scanner.result }}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All PR checks passed!"
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed successfully:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TypeScript" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ i18n" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Fragment Audit" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Compiler Bailouts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stale Cache Fields" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Bundled Secrets" >> $GITHUB_STEP_SUMMARY
