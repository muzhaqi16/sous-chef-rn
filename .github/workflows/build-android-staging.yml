name: Build Android .apk (Staging)
run-name: Building staging .apk triggered by @${{ github.actor }}
permissions:
  contents: write

on:
  push:
    tags:
      - "stg-v*"

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30

    environment: stg

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GRADLE_OPTS: -Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Display build environment
        run: |
          echo "🔧 Building for environment: staging"
          echo "📦 Tag/Ref: ${{ github.ref }}"
          echo "Node version: $(node -v)"
          echo "Java version: $(java -version 2>&1 | head -n 1)"
          echo "Android SDK: $ANDROID_HOME"

      - name: Setup Android local.properties
        run: |
          echo "sdk.dir=/opt/android-sdk" > android/local.properties
          echo "✅ Created android/local.properties"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup gradlew as executable
        run: chmod +x ./android/gradlew

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Yarn Install
        run: yarn install --frozen-lockfile --network-timeout 100000

      - name: Clean Android build
        run: |
          cd android
          ./gradlew clean
          cd ..

      - name: Generate .env file from staging environment
        run: |
          echo "API_URL=${{ vars.API_URL }}" > .env.staging
          echo "WEB_SOCKET_URL=${{ vars.WEB_SOCKET_URL }}" >> .env.staging
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env.staging
          echo "NODE_ENV=staging" >> .env.staging
          echo "WEB_APP_URL=${{ vars.WEB_APP_URL }}" >> .env.staging
          echo "" >> .env.staging
          echo "# Spoonacular API" >> .env.staging
          echo "SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}" >> .env.staging
          echo "" >> .env.staging
          echo "# Telemetry Configuration (Required for production)" >> .env.staging
          echo "PROMETHEUS_ENDPOINT=${{ vars.PROMETHEUS_ENDPOINT }}" >> .env.staging
          echo "LOKI_ENDPOINT=${{ vars.LOKI_ENDPOINT }}" >> .env.staging
          echo "# Basic Auth credentials for telemetry endpoints in production" >> .env.staging
          echo "TELEMETRY_AUTH_USERNAME=${{ secrets.TELEMETRY_AUTH_USERNAME }}" >> .env.staging
          echo "TELEMETRY_AUTH_PASSWORD=${{ secrets.TELEMETRY_AUTH_PASSWORD }}" >> .env.staging

      - name: Prepare .env for react-native-config
        run: cp .env.staging .env

      - name: Verify .env file format
        run: |
          echo "📄 Checking .env file:"
          echo "Number of lines: $(wc -l < .env)"
          echo "Non-empty, non-comment lines:"
          grep -v '^#' .env | grep -v '^$' | wc -l
          echo ""
          echo "Variables defined (keys only):"
          grep -v '^#' .env | grep -v '^$' | cut -d'=' -f1
          echo ""
          echo "Checking for malformed lines..."
          if grep -E '^\s+\w' .env; then
            echo "❌ ERROR: Found lines with leading spaces!"
            exit 1
          fi
          if grep -E '\w\s+=|=\s+\w' .env; then
            echo "⚠️ WARNING: Found spaces around '=' signs"
          fi
          echo "✅ .env file format looks valid"

      - name: Build staging apk
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > ./android/app/releases.keystore
          cd android
          ./gradlew assembleStaging
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          MYAPP_UPLOAD_STORE_FILE: "releases.keystore"
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: "github"
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: List the .apks compiled
        run: ls ./android/app/build/outputs/apk/staging/ -hal

      - name: Rename the .apk staging files
        run: |
          TAG_NAME="${{ github.ref_name }}"

          # Rename universal APK
          if [ -f "./android/app/build/outputs/apk/staging/app-universal-staging.apk" ]; then
            mv "./android/app/build/outputs/apk/staging/app-universal-staging.apk" \
              "./android/app/build/outputs/apk/staging/sous-chef-staging-${TAG_NAME}-universal.apk"
          fi

          # Rename architecture-specific APKs
          if [ -f "./android/app/build/outputs/apk/staging/app-armeabi-v7a-staging.apk" ]; then
            mv "./android/app/build/outputs/apk/staging/app-armeabi-v7a-staging.apk" \
              "./android/app/build/outputs/apk/staging/sous-chef-staging-${TAG_NAME}-armeabi-v7a.apk"
          fi

          if [ -f "./android/app/build/outputs/apk/staging/app-arm64-v8a-staging.apk" ]; then
            mv "./android/app/build/outputs/apk/staging/app-arm64-v8a-staging.apk" \
              "./android/app/build/outputs/apk/staging/sous-chef-staging-${TAG_NAME}-arm64-v8a.apk"
          fi

          if [ -f "./android/app/build/outputs/apk/staging/app-x86-staging.apk" ]; then
            mv "./android/app/build/outputs/apk/staging/app-x86-staging.apk" \
              "./android/app/build/outputs/apk/staging/sous-chef-staging-${TAG_NAME}-x86.apk"
          fi

          if [ -f "./android/app/build/outputs/apk/staging/app-x86_64-staging.apk" ]; then
            mv "./android/app/build/outputs/apk/staging/app-x86_64-staging.apk" \
              "./android/app/build/outputs/apk/staging/sous-chef-staging-${TAG_NAME}-x86_64.apk"
          fi

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Staging Release ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/staging/sous-chef-*.apk
          generate_release_notes: true
          prerelease: true

      - name: Cleanup
        if: always()
        run: |
          rm -f ./android/app/releases.keystore
          rm -f android/local.properties
          rm -f .env.staging .env
          cd android && ./gradlew --stop || true
