name: E2E Smoke Tests

# Run smoke tests on every PR for quick feedback
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  smoke-tests-ios:
    name: Smoke Tests (iOS)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Ruby gems
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Setup Detox
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Build iOS app for testing
        run: npm run test:e2e:build
        env:
          NODE_ENV: test

      - name: Run smoke tests
        run: detox test e2e/tests/smoke.e2e.ts --configuration ios.sim.debug --record-logs all
        env:
          NODE_ENV: test

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ios-artifacts
          path: |
            artifacts/
            **/*.log
          retention-days: 3

  smoke-tests-android:
    name: Smoke Tests (Android)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-smoke

      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Build Android app for testing
        run: npm run test:e2e:build:android
        env:
          NODE_ENV: test

      - name: Run smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: detox test e2e/tests/smoke.e2e.ts --configuration android.emu.debug --record-logs all

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android-artifacts
          path: |
            artifacts/
            **/*.log
          retention-days: 3
