name: "Build iOS app"

on:
  push:
    # branches:
    #   - main
    tags:
      - "v*"
      - "ios-v*"

jobs:
  build_with_signing:
    runs-on: [self-hosted, macOS]
    environment: prod
    steps:
      - name: check Xcode version
        run: /usr/bin/xcodebuild -version

      - name: checkout repository
        uses: actions/checkout@v4

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILES_BASE64: ${{ secrets.PROVISION_PROFILES_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_ARCHIVE=$RUNNER_TEMP/mobile_pp.tgz
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILES_BASE64" | base64 --decode -o $PP_ARCHIVE

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          tar xzvf $PP_ARCHIVE -C $RUNNER_TEMP
          for PROVISION in `ls $RUNNER_TEMP/*.mobileprovision`
          do
            UUID=`/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $PROVISION)`
            cp $PROVISION ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          done

          security find-identity -v -p codesigning
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Clean workspace
        run: |
          git clean -ffd -e ios/Pods -e vendor/bundle

      - name: Install dependencies and generate GraphQL types
        uses: ./.github/actions/setup-deps

      - name: Generate .env file
        run: |
          cat > .env <<EOF
          API_URL=${{ vars.API_URL }}
          API_KEY=${{ secrets.IOS_API_KEY }}
          WEB_SOCKET_URL=${{ vars.WEB_SOCKET_URL }}
          NODE_ENV=production
          OTLP_METRICS_ENDPOINT=${{ vars.OTLP_METRICS_ENDPOINT }}
          OTLP_LOGS_ENDPOINT=${{ vars.OTLP_LOGS_ENDPOINT }}
          OTLP_METRICS_AUTH_USERNAME=${{ secrets.OTLP_METRICS_AUTH_USERNAME }}
          OTLP_METRICS_AUTH_PASSWORD=${{ secrets.OTLP_METRICS_AUTH_PASSWORD }}
          OTLP_LOGS_AUTH_USERNAME=${{ secrets.OTLP_LOGS_AUTH_USERNAME }}
          OTLP_LOGS_AUTH_PASSWORD=${{ secrets.OTLP_LOGS_AUTH_PASSWORD }}
          SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}
          GIT_SHA=${{ github.sha }}
          BUILD_ID=${{ github.run_number }}
          EOF
          echo "Generated .env file"

      - name: Generate build-time config from .env
        run: node scripts/generate-env.js

      - name: Install Ruby gems
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: install Cocoapod dependencies
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Set version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#ios-}"
          VERSION="${VERSION#v}"
          echo "Setting marketing version to: $VERSION"
          echo "Setting build number to: ${{ github.run_number }}"
          cd ios
          agvtool new-marketing-version "$VERSION"
          agvtool new-version -all "${{ github.run_number }}"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-derived-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-derived-

      - name: build archive
        run: |
          cd ios
          xcodebuild -workspace SousChefRN.xcworkspace \
          -scheme "SousChefRN" \
          -sdk iphoneos \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $RUNNER_TEMP/SousChefRN.xcarchive \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="souschef-appstore-dist" \
          archive

      # A third-party credential inside the shipped bundle is readable by anyone
      # who obtains the app; rotating it does not change that. Runs against the
      # ARTIFACT with the same .env the build used, and fails if it finds no
      # bundle at all — a moved output must not read as clean.
      # Both run AFTER the archive, not before it. Metro regenerates
      # env.generated.ts while Xcode bundles, in a process that inherits
      # nothing from a step `env:` block — so the overwrite these guard against
      # happens after any pre-build check would have passed.
      - name: Verify build identity survived into the bundle
        run: node scripts/check-build-provenance.mjs
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_number }}

      - name: Refuse launch-argument authentication in a shipped build
        run: node scripts/check-launch-arg-auth.mjs

      - name: Check no third-party credential is in the bundle
        run: |
          node scripts/check-bundled-secrets.mjs \
            "$RUNNER_TEMP/SousChefRN.xcarchive/Products/Applications/SousChefRN.app/main.jsbundle"

      - name: export ipa
        run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          cat > "$EXPORT_OPTS_PATH" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>KRR7955LB8</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.souschef.app</key>
              <string>souschef-appstore-dist</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/SousChefRN.xcarchive -exportOptionsPlist "$EXPORT_OPTS_PATH" -exportPath $RUNNER_TEMP/build

      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o ~/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/build/SousChef.ipa" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
