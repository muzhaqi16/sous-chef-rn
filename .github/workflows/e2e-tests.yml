name: E2E Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch: # Allow manual triggers

jobs:
  # iOS E2E Tests
  e2e-ios:
    name: E2E Tests (iOS)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode 15.5
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Setup Detox
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Build iOS app for testing
        run: npm run test:e2e:build
        env:
          NODE_ENV: test

      - name: Run E2E tests (iOS)
        run: npm run test:e2e -- --record-logs all
        env:
          NODE_ENV: test

      - name: Upload test artifacts (screenshots, logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-artifacts
          path: |
            artifacts/
            **/*.log
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-results
          path: e2e/test-results/
          retention-days: 7

  # Android E2E Tests
  e2e-android:
    name: E2E Tests (Android)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Build Android app for testing
        run: npm run test:e2e:build:android
        env:
          NODE_ENV: test

      - name: Run E2E tests (Android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm run test:e2e:android -- --record-logs all

      - name: Upload test artifacts (screenshots, logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-artifacts
          path: |
            artifacts/
            **/*.log
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-results
          path: e2e/test-results/
          retention-days: 7

  # Summary job that requires all tests to pass
  e2e-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    needs: [e2e-ios, e2e-android]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.e2e-ios.result }}" != "success" ] || [ "${{ needs.e2e-android.result }}" != "success" ]; then
            echo "One or more E2E test jobs failed"
            exit 1
          fi
          echo "All E2E tests passed!"

      - name: Post summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Tests: ${{ needs.e2e-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android Tests: ${{ needs.e2e-android.result }}" >> $GITHUB_STEP_SUMMARY
