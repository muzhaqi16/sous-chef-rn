# An advisory published after the last pull request is invisible to the PR gate
# until someone opens one. This runs on a schedule so a vulnerability in a
# dependency already on the default branch is found within the week, and files
# exactly one tracked issue rather than a run nobody watches.
name: Dependency Audit (scheduled)

permissions:
  contents: read
  issues: write

on:
  schedule:
    # Mondays, 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: false

env:
  ISSUE_TITLE: 'Dependency audit: production vulnerabilities'

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # `npm audit` exits 1 when it finds something, which is the signal, not an
      # error — the step must continue so the issue below can be filed. An
      # audit that could not run also exits 1; the node step tells them apart.
      - name: Audit production dependencies
        id: audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit.json
          set -e
          node -e '
            const r = require("./audit.json");
            // npm writes {"error":…} to stdout and exits 1 when the audit could
            // not run (registry down, ENOLOCK). That document has no
            // `vulnerabilities`, and counting it as clean would close the issue.
            if (r.error || !r.vulnerabilities) {
              console.error("npm audit did not run: " + JSON.stringify(r.error ?? r));
              process.exit(1);
            }
            const fs = require("fs");
            const blocking = Object.values(r.vulnerabilities || {}).filter(v =>
              v.severity === "high" || v.severity === "critical",
            );
            const lines = [];
            lines.push("Weekly `npm audit --omit=dev` at severity **high** or above.");
            lines.push("");
            if (blocking.length === 0) {
              lines.push("No blocking advisories.");
            } else {
              lines.push("| Severity | Package | Range | Fix |");
              lines.push("| --- | --- | --- | --- |");
              for (const v of blocking) {
                const fix = v.fixAvailable ? "available" : "none";
                lines.push("| " + v.severity + " | `" + v.name + "` | " + v.range + " | " + fix + " |");
              }
            }
            fs.writeFileSync("issue-body.md", lines.join("\n"));
            console.log("blocking=" + blocking.length);
          ' >> "$GITHUB_OUTPUT"

      # fastlane's gems run in the release jobs that hold Play access, so they
      # meet the same bar. bundle-audit exits 1 on a finding, as npm audit does;
      # a missing report means it could not run.
      - name: Audit fastlane's gems
        id: gems
        run: |
          gem install --user-install --no-document bundler-audit -v 0.9.3
          set +e
          "$(ruby -e 'print Gem.user_dir')/bin/bundle-audit" check --update \
            --gemfile-lock fastlane/Gemfile.lock --format json --output gems.json
          set -e
          node -e '
            const r = require("./gems.json");
            if (!Array.isArray(r.results)) {
              console.error("bundle-audit did not run: " + JSON.stringify(r));
              process.exit(1);
            }
            const fs = require("fs");
            const blocking = r.results.filter(x =>
              x.type === "unpatched_gem" &&
              ["high", "critical"].includes(x.advisory && x.advisory.criticality),
            );
            const lines = ["", "Weekly `bundle-audit` of `fastlane/Gemfile.lock` at severity **high** or above.", ""];
            if (blocking.length === 0) {
              lines.push("No blocking advisories.");
            } else {
              lines.push("| Severity | Gem | Version | Advisory | Patched |");
              lines.push("| --- | --- | --- | --- | --- |");
              for (const x of blocking) {
                lines.push("| " + x.advisory.criticality + " | `" + x.gem.name + "` | " + x.gem.version + " | " +
                  x.advisory.id + " | " + (x.advisory.patched_versions || []).join(", ") + " |");
              }
            }
            fs.appendFileSync("issue-body.md", lines.join("\n") + "\n");
            console.log("blocking=" + blocking.length);
          ' >> "$GITHUB_OUTPUT"

      - name: Open or update the tracked issue
        if: steps.audit.outputs.blocking != '0' || steps.gems.outputs.blocking != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A label named on `gh issue create` that does not exist fails the
          # call, so make sure it is there first.
          gh label create security --color B60205 \
            --description "Security finding needing action" 2>/dev/null || true

          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number,title --jq \
            ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)

          {
            echo ""
            echo "---"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> issue-body.md

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" \
              --body "Re-checked on $(date -u +%Y-%m-%d): still ${{ steps.audit.outputs.blocking }} npm and ${{ steps.gems.outputs.blocking }} gem blocking advisory(ies)."
            echo "Updated issue #$existing"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md \
              --label security
            echo "Opened a new issue"
          fi

      - name: Close the tracked issue when the tree is clean
        if: steps.audit.outputs.blocking == '0' && steps.gems.outputs.blocking == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number,title --jq \
            ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "No blocking advisories as of $(date -u +%Y-%m-%d)."
            echo "Closed issue #$existing"
          else
            echo "Clean, and no issue open."
          fi

      # The run's own record, so a clean week is visible without opening an issue.
      - name: Summary
        if: always()
        run: |
          echo "## Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Blocking advisories: ${{ steps.audit.outputs.blocking }} npm, ${{ steps.gems.outputs.blocking }} gem" >> "$GITHUB_STEP_SUMMARY"
          if [ -f issue-body.md ]; then cat issue-body.md >> "$GITHUB_STEP_SUMMARY"; fi
