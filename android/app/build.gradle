apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

/**
 * Run Proguard to shrink the Java bytecode in release builds.
 */
def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// The upload key both distributed variants (release, staging) sign with.
// Resolved once so the signing configs and the task-graph check below cannot
// disagree about whether it is present.
def uploadStoreFile = System.getenv("MYAPP_UPLOAD_STORE_FILE") ?:
                      (project.hasProperty("MYAPP_UPLOAD_STORE_FILE") ? MYAPP_UPLOAD_STORE_FILE : null)
def uploadStorePassword = System.getenv("MYAPP_UPLOAD_STORE_PASSWORD") ?:
                          (project.hasProperty("MYAPP_UPLOAD_STORE_PASSWORD") ? MYAPP_UPLOAD_STORE_PASSWORD : null)
def uploadKeyAlias = System.getenv("MYAPP_UPLOAD_KEY_ALIAS") ?:
                     (project.hasProperty("MYAPP_UPLOAD_KEY_ALIAS") ? MYAPP_UPLOAD_KEY_ALIAS : null)
def uploadKeyPassword = System.getenv("MYAPP_UPLOAD_KEY_PASSWORD") ?:
                        (project.hasProperty("MYAPP_UPLOAD_KEY_PASSWORD") ? MYAPP_UPLOAD_KEY_PASSWORD : null)
def hasUploadKeystore = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "dev.souschef.app"

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfbjni.so'
        pickFirst '**/libhermesvm.so'
        pickFirst '**/libfolly_runtime.so'
        pickFirst '**/libjsi.so'
        pickFirst '**/libreactnativejni.so'
    }

    // Enable Hermes mmap for ~16% faster TTI by keeping the bundle uncompressed
    androidResources {
        noCompress += ["bundle"]
    }
    
    //  Create an APK for each CPU architecture (disabled for debug and bundle builds)
    splits {
        abi {
            reset()
            // Disable for debug builds (Detox) and bundle builds (AAB handles splits automatically)
            enable !gradle.startParameter.taskNames.any {
                it.toLowerCase().contains('debug') || it.toLowerCase().contains('bundle')
            }
            universalApk true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    
    defaultConfig {
        applicationId "dev.souschef.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 167
        versionName "4.5.1"
        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Both distributed variants sign with the upload key. Left unconfigured
        // when it is absent: the task-graph check below fails the build rather
        // than letting either fall back to the public debug key.
        staging {
            if (hasUploadKeystore) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }

        release {
            if (hasUploadKeystore) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            signingConfig signingConfigs.debug
            resValue "string", "build_config_package", "dev.souschef.app"
        }
        production {
            // Debug build with production environment variables
            initWith debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            signingConfig signingConfigs.debug
            resValue "string", "build_config_package", "dev.souschef.app"
            matchingFallbacks = ['debug']
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            // Use release signing config for production builds
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro", "${rootProject.projectDir}/../node_modules/detox/android/detox/proguard-rules-app.pro"
            resValue "string", "build_config_package", "dev.souschef.app"
        }
        staging {
            initWith release
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            signingConfig signingConfigs.staging
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            resValue "string", "build_config_package", "dev.souschef.app"
            matchingFallbacks = ['release', 'debug']
        }
        localRelease {
            initWith release
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release', 'debug']
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // AndroidX Photo Picker backport for devices running Android < 30
    implementation("androidx.activity:activity:1.9.+")

    // Detox dependencies
    androidTestImplementation('com.wix:detox:+')
    androidTestImplementation 'junit:junit:4.13.2'
}
// `release` and `staging` build in CI, which supplies the key from secrets. The
// case this guards is a secret that is renamed, rotated away or missing from a
// new environment: without it the build would fall back to the committed debug
// key and produce an artifact that looks like a release and is updatable by
// anyone holding it. `localRelease` is the deliberate exception — debug-signed
// by design — so the match is exact rather than a substring on "release".
gradle.taskGraph.whenReady { graph ->
    if (!hasUploadKeystore) {
        def distributedTask = graph.allTasks.find { task ->
            task.project == project && task.name ==~ /(assemble|bundle|install|package)(Release|Staging)/
        }
        if (distributedTask != null) {
            throw new GradleException(
                "Refusing to build ${distributedTask.name}: the upload signing key is " +
                "not configured, and falling back to the debug key would ship an " +
                "artifact anyone could update. Set MYAPP_UPLOAD_STORE_FILE, " +
                "MYAPP_UPLOAD_STORE_PASSWORD, MYAPP_UPLOAD_KEY_ALIAS and " +
                "MYAPP_UPLOAD_KEY_PASSWORD — in CI these come from repository " +
                "secrets. For a release-shaped build on your machine use " +
                "MODE=localRelease (see docs/development.md)."
            )
        }
    }
}

// FCM (push): apply the google-services plugin ONLY when google-services.json is
// present, so debug/dev builds keep working before the file is added. Drop the
// file (from the Firebase console, package dev.souschef.app) into android/app/
// then rebuild — see docs/push-setup-checklist.md.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    // A release/bundle build without FCM config would ship with push silently
    // dead — fail fast instead. Debug/dev builds still succeed without the file.
    def isReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
        taskName.toLowerCase().contains("release")
    }
    if (isReleaseBuild) {
        throw new GradleException(
            "Missing android/app/google-services.json — required for release " +
            "builds (FCM/push). Add it from the Firebase console " +
            "(package dev.souschef.app); see docs/push-setup-checklist.md."
        )
    }
}
