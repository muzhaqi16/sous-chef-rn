apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle" 

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "dev.souschef.app"
    
    //  Create an APK for each CPU architecture
    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    
    defaultConfig {
        applicationId "dev.souschef.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.3"
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        
        release {
            // Environment variables (CI/Play Store) override gradle.properties (local/GitHub CI)
            def keystoreFilePath = System.getenv("MYAPP_UPLOAD_STORE_FILE") ?: 
                                  (project.hasProperty("MYAPP_UPLOAD_STORE_FILE") ? MYAPP_UPLOAD_STORE_FILE : null)
            def keystoreStorePassword = System.getenv("MYAPP_UPLOAD_STORE_PASSWORD") ?: 
                                        (project.hasProperty("MYAPP_UPLOAD_STORE_PASSWORD") ? MYAPP_UPLOAD_STORE_PASSWORD : null)
            def keystoreKeyAlias = System.getenv("MYAPP_UPLOAD_KEY_ALIAS") ?: 
                                  (project.hasProperty("MYAPP_UPLOAD_KEY_ALIAS") ? MYAPP_UPLOAD_KEY_ALIAS : null)
            def keystoreKeyPassword = System.getenv("MYAPP_UPLOAD_KEY_PASSWORD") ?: 
                                      (project.hasProperty("MYAPP_UPLOAD_KEY_PASSWORD") ? MYAPP_UPLOAD_KEY_PASSWORD : null)
            
            if (keystoreFilePath && keystoreStorePassword && keystoreKeyAlias && keystoreKeyPassword) {
                storeFile file(keystoreFilePath)
                storePassword keystoreStorePassword
                keyAlias keystoreKeyAlias
                keyPassword keystoreKeyPassword
            } else {
                println "Warning: Release signing configuration not found."
            }
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            resValue "string", "build_config_package", "dev.souschef.app"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            resValue "string", "build_config_package", "dev.souschef.app"
        }
        staging {
            initWith debug
            signingConfig signingConfigs.debug
            resValue "string", "build_config_package", "dev.souschef.app"
            matchingFallbacks = ['debug']
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation project(':react-native-config')
}