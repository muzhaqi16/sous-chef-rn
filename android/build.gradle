buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // FCM (push): processes android/app/google-services.json at build time.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    // `com.google.guava:listenablefuture:1.0` is a stub jar holding only
    // ListenableFuture, a class full Guava ships too. Detox pulls real Guava in
    // via Espresso, so the androidTest classpath ends up with the class twice
    // and `checkDebugAndroidTestDuplicateClasses` fails — which blocks every
    // Detox build (see :react-native-vision-camera).
    //
    // Scoped to the test configurations on purpose: react-native-vision-camera
    // compiles against ListenableFuture and the stub is the ONLY thing
    // supplying it on the main classpath, so excluding it everywhere breaks
    // that module's Kotlin compile. Under androidTest, Guava is present to
    // supply the class, so dropping the stub there costs nothing.
    configurations.matching { it.name.toLowerCase().contains('androidtest') }.configureEach {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    repositories {
        google()
        mavenCentral()
        maven {
            // Detox local Maven repository
            url "$rootDir/../node_modules/detox/Detox-android"
        }
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (project.android.hasProperty('defaultConfig')) {
                    project.android.defaultConfig {
                        minSdkVersion rootProject.ext.minSdkVersion
                    }
                }

                // Add packaging options for all modules to handle duplicate native libraries
                packagingOptions {
                    pickFirst '**/libc++_shared.so'
                    pickFirst '**/libfbjni.so'
                    pickFirst '**/libhermesvm.so'
                    pickFirst '**/libfolly_runtime.so'
                    pickFirst '**/libjsi.so'
                    pickFirst '**/libreactnativejni.so'
                    pickFirst '**/libhermestooling.so'
                    pickFirst '**/libreactnativeutilsjni.so'
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
