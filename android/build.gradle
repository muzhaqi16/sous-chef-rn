buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // FCM (push): processes android/app/google-services.json at build time.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            // Detox local Maven repository
            url "$rootDir/../node_modules/detox/Detox-android"
        }
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (project.android.hasProperty('defaultConfig')) {
                    project.android.defaultConfig {
                        minSdkVersion rootProject.ext.minSdkVersion
                    }
                }

                // Add packaging options for all modules to handle duplicate native libraries
                packagingOptions {
                    pickFirst '**/libc++_shared.so'
                    pickFirst '**/libfbjni.so'
                    pickFirst '**/libhermesvm.so'
                    pickFirst '**/libfolly_runtime.so'
                    pickFirst '**/libjsi.so'
                    pickFirst '**/libreactnativejni.so'
                    pickFirst '**/libhermestooling.so'
                    pickFirst '**/libreactnativeutilsjni.so'
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
